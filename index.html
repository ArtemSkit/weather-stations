 * both station id and panel generation so an A → B → A sequence stays safe.
 * @type {{ stationId: string, generation: number, promise: Promise<void> }|null}
 */
let stationRefreshRequest = null;

/**
 * The DOM element (.station-marker div) for the currently highlighted marker.
 * Kept so it can be toggled to/from the .active CSS class.
 * @type {HTMLElement|null}
 */
let activeMarkerEl = null;

/**
 * Auto-refresh period in milliseconds.  Driven by #interval-input.
 * Clamped to 10 s – 1 h by the interval editor.
 * @type {number}
 */
let refreshInterval = 60_000;

/**
 * The Leaflet Marker for the user-placed search pin, or null if no pin exists.
 * @type {L.Marker|null}
 */
let droppedPinMarker = null;

/**
 * Monotonic search-intent counter allocated before geocoding or permission waits.
 * Every async stage compares its captured value against this counter so a slow
 * earlier search can never overwrite a newer one.
 * @type {number}
 */
let searchGeneration = 0;

/**
 * Bumped each time a search actually starts replacing the map (loadStationsAt).
 * Separate from searchGeneration on purpose: a newer search that fails before
 * reaching the map (unknown ZIP, denied location) must not throw away an older
 * search whose stations are still loading — only a newer AREA replaces an area.
 * @type {number}
 */
let areaGeneration = 0;

/** The newest search generation that has finished (succeeded or failed). */
let settledSearch = 0;

/**
 * While the area that owns the map is still loading: the status and overlay text
 * that describe that load (restored if a newer search fails meanwhile); else null.
 * @type {{ status: string, overlay: string }|null}
 */
let areaLoading = null;

/* Cached DOM references — gathered once to avoid repeated getElementById calls */
const zipInput      = document.getElementById('zip-input');
const searchBtn     = document.getElementById('search-btn');
const statusBar     = document.getElementById('status-bar');
const statusText    = document.getElementById('status-text');
const mapOverlay    = document.getElementById('map-overlay');
const overlayText   = document.getElementById('overlay-text');
const popupPanel    = document.getElementById('popup-panel');
const toast         = document.getElementById('toast');
const intervalInput = document.getElementById('interval-input');
const dragPinBtn    = document.getElementById('drag-pin');
const pinGhost      = document.getElementById('pin-ghost');
const fabLocate     = document.getElementById('fab-locate');

/* ─────────────────────────────────────────────────────────────────────────────
   3. UI HELPERS
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Update the header status badge.
 * @param {'loading'|'ok'|'error'|''} state  - CSS class applied to .status-bar
 * @param {string}                    msg    - Text shown next to the dot
 */
function setStatus(state, msg) {
  statusBar.className = 'status-bar ' + state;
  statusText.textContent = msg;
}

/**
 * Show a brief error/info toast that auto-dismisses after 3.5 s.
 * @param {string} msg
 */
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('visible');
  // A previous toast must not hide a newer message when its older timer expires.
  clearTimeout(showToast.dismissTimer);
  showToast.dismissTimer = setTimeout(() => toast.classList.remove('visible'), 3500);
}

/** "N STATIONS" for the status bar (counts what was actually plotted). */
function stationCountLabel() {
  const n = stationMarkers.length;
  return `${n} STATION${n !== 1 ? 'S' : ''}`;
}

/**
 * Whether a load that just finished for search `gen` may update the status bar
 * and overlay: it is the newest search, or the newest search has already ended.
 * Otherwise a newer search that is still geocoding owns them. Without the second
 * case, an area that finishes loading after a newer search FAILED would sit
 * under a stale "ERROR".
 * @param {number} gen
 */
function mayUpdateSearchUi(gen) {
  return gen === searchGeneration || settledSearch === searchGeneration;
}

/**
 * Report a failed search. The toast says what went wrong; the status bar keeps
 * describing what is really on the map — the previous area's stations when the
 * search failed before replacing them, otherwise ERROR.
 * @param {string} message
 */
function reportSearchError(message) {
  settledSearch = searchGeneration;   // the newest search has ended
  showToast(message);
  if (areaLoading) {
    // The area on the map is still loading: that is what the user is waiting
    // for, so keep showing that load (it finishes, or fails, on its own).
    showOverlay(areaLoading.overlay);
    setStatus('loading', areaLoading.status);
    return;
  }
  hideOverlay();
  if (stationMarkers.length) setStatus('ok', stationCountLabel());
  else setStatus('error', 'ERROR');
}

/**
 * Show the full-map loading overlay with a custom message.
 * @param {string} msg
 */
function showOverlay(msg) {
  overlayText.textContent = msg;
  mapOverlay.classList.add('visible');
}

/** Hide the full-map loading overlay. */
function hideOverlay() {
  mapOverlay.classList.remove('visible');
}

/* ─────────────────────────────────────────────────────────────────────────────
   4. REFRESH-INTERVAL EDITOR
   ─────────────────────────────────────────────────────────────────────────────
   The user can change the auto-refresh cadence by editing the number input
   in the popup footer.  The change takes effect immediately if a station
   panel is already open.
   ───────────────────────────────────────────────────────────────────────────── */
const MIN_REFRESH_SECONDS = 10;
// Browsers store timer delays as 32-bit integers: anything above ~24.8 days wraps
// around and fires almost immediately, which would poll NOAA back-to-back.
const MAX_REFRESH_SECONDS = 3600;

intervalInput.addEventListener('change', () => {
  // Number(), not parseInt(): a number field also accepts forms like "1e3" (1000),
  // which parseInt would read as 1 — and then clamp to the fastest rate. An empty
  // field must stay NaN (Number('') is 0, which would also mean "fastest").
  const raw     = intervalInput.value.trim();
  const parsed  = raw === '' ? NaN : Math.round(Number(raw));
  // A cleared or garbled field keeps the current interval rather than silently
  // switching to the fastest (most API-hungry) rate.
  const seconds = Number.isNaN(parsed) ? refreshInterval / 1000
    : Math.min(MAX_REFRESH_SECONDS, Math.max(MIN_REFRESH_SECONDS, parsed));
  intervalInput.value = seconds;   // show the value actually in use
  refreshInterval = seconds * 1000;

  // If a station is currently active, restart the timer immediately at the
  // new interval so the change takes effect without waiting for the next tick.
  if (activeStationId && refreshTimer) {
    const stationId = activeStationId;
    const generation = stationOpenGeneration;
    clearInterval(refreshTimer);
    refreshTimer = setInterval(
      () => doStationRefresh(stationId, generation),
      refreshInterval
    );
  }
});

/* ─────────────────────────────────────────────────────────────────────────────
   5. INPUT-TYPE DETECTION & COORDINATE PARSING
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Common cleanup before classifying or parsing search text: pasted minus signs
 * and dashes (Unicode minus, hyphen variants including the non-breaking one from
 * Word/Docs, en/em dash, fullwidth) become "-", and one surrounding pair of
 * brackets is dropped, so a copied "(29.42, -98.49)" or "[29.42, -98.49]" reads
 * as coordinates instead of an address search that lands in Tacoma, WA.
 *
 * @param   {string} raw
 * @returns {string}
 */
function normalizeSearchText(raw) {
  return raw.trim()
    .replace(/[‐-―−﹣－]/g, '-')
    // One pass, no backtracking (a lazy group between \s* runs was cubic-time).
    .replace(/^[([]([^()[\]]*)[)\]]$/, (_, inner) => inner.trim());
}

/**
 * Classify free-form user input so the correct geocoding path is chosen.
 *
 * Rules (evaluated in order):
 *  • Five digits (optionally plus "-NNNN", " NNNN" or "NNNN") → 'zip'
 *    (first, so "78201 1234" isn't read as two coordinates)
 *  • Two numbers split by a comma and/or spaces → 'coords' (e.g. "29.42, -98.49"
 *    or "29.42 -98.49")
 *  • Digits and punctuation only, or coordinate-style text with a decimal or a
 *    degree mark ("29.42 N, 98.49 W") → 'badzip' (a mistyped ZIP or coordinates).
 *    Grid addresses such as Utah's "200 S 300 E" stay addresses.
 *  • Anything else                           → 'address'
 *
 * @param   {string} raw  - Raw value from the search input
 * @returns {'coords'|'zip'|'badzip'|'address'}
 */
function detectInputType(raw) {
  const s = normalizeSearchText(raw);
  if (/^\d{5}([ -]?\d{4})?$/.test(s))                                 return 'zip';
  // A mistyped ZIP that starts with 0 ("00601 12") isn't a coordinate pair either.
  // Digits and punctuation only after it: "02138 Cambridge MA" is a real address.
  if (/^0\d{4}(?![\d.])[\d\s,+-]*$/.test(s))                       return 'badzip';
  // Each number: optional sign, at most 3 whole digits after any leading zeros (so
  // "78201 123", a mistyped ZIP+4, isn't taken as coordinates), optional decimals;
  // ".5" and "29." are fine.
  if (/^[+-]?(0*\d{1,3}(\.\d*)?|\.\d+)(\s*,\s*|\s+)[+-]?(0*\d{1,3}(\.\d*)?|\.\d+)$/.test(s)) return 'coords';
  // "7820", "29.42-98.49" or "29.42°N 98.49°W" is a mistyped ZIP or a coordinate
  // format we don't read, not an address: Photon matches such numbers to some
  // street far away (Tacoma, WA) and loads it silently. N/S/E/W letters only count
  // with a decimal or a degree mark, so "200 S 300 E" (a real Utah address) passes.
  // (\x27 and \x22 are the ASCII minute and second marks.)
  // A letter glued to a number ("29N 98W", "N29") is coordinate-style too; a
  // spaced one ("10 S 5 E") stays an address. Leftover brackets or another
  // separator (; : / | {} <>) mean a half-copied coordinate pair: also rejected
  // rather than geocoded.
  if (/\d/.test(s) && (/^[\d\s.,;:\/|+(){}[\]<>-]+$/.test(s) ||
      (/\d\.\d|[°′″\x27\x22]|\d[NSEW]|[NSEW]\d/i.test(s) && /^[\d\s.,+\-°\x27′\x22″NSEW]+$/i.test(s)))) return 'badzip';
  return 'address';
}

/**
 * Parse a "lat, lon" string into a numeric {lat, lon} object.
 * No validation — call after detectInputType returns 'coords'.
 *
 * @param   {string} raw
 * @returns {{ lat: number, lon: number }}
 */
function parseCoords(raw) {
  // Comma and/or spaces between the two numbers (see detectInputType).
  const parts = normalizeSearchText(raw).split(/[\s,]+/);
  return { lat: parseFloat(parts[0]), lon: parseFloat(parts[1]) };
}

/* ─────────────────────────────────────────────────────────────────────────────
   6. GEOCODING HELPERS
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Fetch and parse a JSON response with one timeout covering both headers and body.
 * Clearing the timer before response.json() finishes would let a stalled body keep
 * the UI loading forever even though the HTTP headers arrived promptly.
 *
 * @param   {string}      url
 * @param   {RequestInit} [options={}]
 * @param   {number}      [timeoutMs=15000]
 * @returns {Promise<{ response: Response, data: Object|null }>}
 * @throws  {Error} 'Request timed out…' on abort, 'Network error…' when offline,
 *                  blocked, or answered with non-JSON (original error as `cause`)
 */
async function fetchJsonWithTimeout(url, options = {}, timeoutMs = 15_000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    let data = null;
    try {
      data = await response.json();
    } catch (error) {
      // Preserve a useful HTTP status for non-JSON error pages, but an abort or a
      // malformed successful API response remains a real request failure.
      if (error.name === 'AbortError' || response.ok) throw error;
    }
    return { response, data };
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('Request timed out — please try again');
    // fetch() rejects with a TypeError when offline or blocked ("Failed to fetch",
    // "Load failed"…), and a captive portal's HTML page fails JSON parsing with a
    // SyntaxError — neither raw browser text belongs in a user-facing toast.
    if (err.name === 'TypeError' || err.name === 'SyntaxError') {
      // Keep the original for debugging; the user only sees the plain message.
      console.warn('[WX.MAP] request failed:', url, err);
      throw new Error('Network error — check your connection and try again', { cause: err });
    }
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/**
 * Accept linked API URLs only when they stay on NWS's HTTPS origin and expected
 * endpoint family. External response fields must not become arbitrary fetches.
 */
function isTrustedNwsApiUrl(rawUrl, requiredPathPrefix) {
  try {
    const url = new URL(rawUrl);
    return url.protocol === 'https:' && url.hostname === 'api.weather.gov' &&
           url.port === '' && url.username === '' && url.password === '' &&
           url.pathname.startsWith(requiredPathPrefix);
  } catch {
    return false;
  }
}

/**
 * Convert a US ZIP code to geographic coordinates using the Nominatim API
 * (OpenStreetMap's free geocoding service — no key required).
 *
 * @param   {string} zip  - 5-digit ZIP code, optionally with a "-NNNN" extension
 * @returns {Promise<{ lat: number, lon: number }>}
 * @throws  {Error} if the ZIP is not found or the request fails
 */
async function zipToCoords(zip) {
  // OSM stores US postcodes as plain 5-digit ZIPs, so a ZIP+4 ("22201-1234")
  // would find nothing — query with the 5-digit prefix only.
  const zip5 = zip.slice(0, 5);
  const url = `https://nominatim.openstreetmap.org/search`
            + `?postalcode=${encodeURIComponent(zip5)}&country=US&format=json&limit=1`;
  let res, data;
  try {
    // A shorter limit than usual, since a slow Nominatim still leaves the
    // Photon fallback its own full timeout.
    ({ response: res, data } = await fetchJsonWithTimeout(
      url, { headers: { 'Accept-Language': 'en' } }, 8000));
  } catch {
    // Unreachable or blocked (Nominatim's CDN sometimes serves a cached answer
    // without its CORS header, which the browser reports as a network failure):
    // ask Photon's postcode index instead.
    return zipToCoordsViaPhoton(zip5, zip);
  }
  if (!res.ok) return zipToCoordsViaPhoton(zip5, zip);
  if (!data.length) throw new Error(`ZIP code "${zip}" not found`);
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
}

/** Backup ZIP lookup through Photon's postcode index (US results only). */
async function zipToCoordsViaPhoton(zip5, zipAsTyped) {
  const { response: res, data } = await fetchJsonWithTimeout(
    // limit=50: a code that also exists abroad (e.g. 12345, 20500) can rank the US
    // entry ~10th; the exact-name check rejects a merely similar postcode.
    `https://photon.komoot.io/api/?q=${encodeURIComponent(zip5)}&osm_tag=place:postcode&limit=50&lang=en`);
  if (!res.ok) throw new Error('ZIP geocoding request failed');
  const match = (data?.features || []).find(f =>
    f?.properties?.countrycode === 'US' && String(f.properties.name ?? zip5) === zip5);
  const [lon, lat] = match?.geometry?.coordinates || [];
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error(`ZIP code "${zipAsTyped}" not found`);
  return { lat, lon };
}

/**
 * Convert a free-form street address to coordinates using Photon, the free,
 * key-less OpenStreetMap geocoder hosted by komoot (https://photon.komoot.io).
 * Photon copes with typos and missing punctuation ("1109 n highlnd st arlington va")
 * far better than Nominatim does.
 *
 * Photon searches the whole world, so several candidates are requested and the
 * first one inside the US is used — NOAA only covers the US, and Photon tags
 * US territories (Puerto Rico, Guam, …) with country code "US" as well. Results
 * are biased toward `near` (the map centre): without it, a common name such as
 * "Oxford Street" returns only foreign matches and no US result at all.
 *
 * @param   {string} address  - Free-form address string
 * @param   {{lat: number, lon: number}} near - Point to prefer results around
 * @returns {Promise<{ lat: number, lon: number }>}
 * @throws  {Error} if the address is not found or the request fails
 */
async function addressToCoords(address, near) {
  const url = `https://photon.komoot.io/api/`
            + `?q=${encodeURIComponent(address)}&limit=10&lang=en`
            // ~11 km is plenty to rank results, and never sends the user's exact
            // position (e.g. the map centred on a Locate Me fix) to a third party.
            + `&lat=${near.lat.toFixed(1)}&lon=${near.lon.toFixed(1)}`;
  const { response: res, data } = await fetchJsonWithTimeout(url);
  if (!res.ok) throw new Error('Address geocoding request failed');

  // Photon answers with a GeoJSON FeatureCollection; coordinates are [lon, lat].
  const match = (data?.features || []).find(f => f?.properties?.countrycode === 'US');
  const [lon, lat] = match?.geometry?.coordinates || [];
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
    throw new Error(`Address "${address}" not found`);
  }
  return { lat, lon };
}

/* ─────────────────────────────────────────────────────────────────────────────
   7. LEGACY API-KEY CLEANUP
   ─────────────────────────────────────────────────────────────────────────────
   Releases before 1.1.0 asked for a Geocodio API key and kept it in localStorage
   (and, before 1.0.5, in a cookie). Address lookup no longer needs a key, so any
   leftover copy is deleted on startup instead of being left in the browser.
   ───────────────────────────────────────────────────────────────────────────── */

try { localStorage.removeItem('wxmap_geocodio_key'); } catch (_) { /* storage blocked — nothing to clean */ }
// Reading document.cookie throws in an opaque origin (e.g. a sandboxed iframe);
// an uncaught error here would stop the whole app script from wiring up.
try {
  if (document.cookie.includes('wxmap_geocodio_key=')) {
    // Expire it on both paths old releases used: early ones wrote path=/, later
    // ones the app's own folder. A cookie is only removed by its exact path.
    const appFolder = location.pathname.replace(/[^/]*$/, '') || '/';
    new Set(['/', appFolder]).forEach(path => {
      document.cookie = `wxmap_geocodio_key=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=${path};SameSite=Strict`;
    });
  }
} catch (_) { /* cookies unavailable — nothing to clean */ }

/* ─────────────────────────────────────────────────────────────────────────────
   8. WEATHER API HELPERS
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Fetch the list of NOAA observation stations nearest to a coordinate pair.
 *   1. GET https://api.weather.gov/points/{lat},{lon} → properties.observationStations
 *   2. GET that gridpoint stations URL
 * (The old /points/{lat},{lon}/stations shortcut is a deprecated alias that NOAA
 * now only answers with a 301 redirect to the same gridpoint URL.)
 *
 * @param   {number} lat  - Latitude (4 decimal places precision)
 * @param   {number} lon  - Longitude
 * @returns {Promise<Object>} GeoJSON FeatureCollection of stations
 * @throws  {Error} on non-2xx response
 */
async function fetchStations(lat, lon) {
  const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
  // No custom User-Agent: Chrome drops it anyway, and where it is sent it is not a
  // CORS-safelisted header, so it would add a preflight request to every NWS call.
  const { response: ptRes, data: point } = await fetchJsonWithTimeout(
    `https://api.weather.gov/points/${key}`);
  // NOAA answers 404 for any point it doesn't cover (outside the US, offshore).
  if (ptRes.status === 404) throw new Error('No NOAA stations here — coverage is US only');
  if (!ptRes.ok) throw new Error(`NOAA points API returned HTTP ${ptRes.status}`);

  // The alert loader asks for this same point's state right after; hand it this
  // answer so it doesn't repeat the /points request.
  const state = pointStateCode(point?.properties);
  if (state) setBoundedCache(alertStateCache, key, state, ALERT_STATE_CACHE_LIMIT);

  // A linked URL from the response must stay on NOAA's own API before we fetch it.
  const stationsUrl = point?.properties?.observationStations;
  if (!stationsUrl || !isTrustedNwsApiUrl(stationsUrl, '/gridpoints/')) {
    throw new Error('NOAA returned no station list for this location');
  }
  const { response: res, data } = await fetchJsonWithTimeout(stationsUrl);
  if (!res.ok) throw new Error(`NOAA stations API returned HTTP ${res.status}`);
  return data;
}

/**
 * A station's exact [lon, lat] from its NWS station record (best effort: null on
 * any failure, so callers fall back to the observation's rounded point).
 *
 * @param   {string} stationId
 * @returns {Promise<number[]|null>}
 */
async function fetchStationPoint(stationId) {
  try {
    // 4 s, not 15: the deep link waits for this too, and it is only a refinement.
    const { response, data } = await fetchJsonWithTimeout(
      `https://api.weather.gov/stations/${encodeURIComponent(stationId)}`, {}, 4000);
    const c = response.ok ? data?.geometry?.coordinates : null;
    return Array.isArray(c) && Number.isFinite(c[0]) && Number.isFinite(c[1]) ? c : null;
  } catch (e) {
    return null;
  }
}

/**
 * Fetch the most recent observation from a specific NOAA station.
 * Endpoint: GET https://api.weather.gov/stations/{stationId}/observations/latest
 *
 * @param   {string} stationId  - ICAO station identifier (e.g. "KSAT")
 * @returns {Promise<Object>}   GeoJSON Feature with observation properties
 * @throws  {Error} on non-2xx response
 */
async function fetchObservations(stationId) {
  const url = `https://api.weather.gov/stations/${encodeURIComponent(stationId)}/observations/latest`;
  // No custom User-Agent: Chrome drops it anyway, and where it is sent it is not a
  // CORS-safelisted header, so it would add a preflight request to every NWS call.
  const { response: res, data } = await fetchJsonWithTimeout(url);
  // Tagged so the station panel can tell "never reports" apart from a passing outage.
  if (res.status === 404) {
    throw Object.assign(new Error(`Station "${stationId}" not found or has no recent observations`), { status: 404 });
  }
  if (!res.ok) throw new Error(`NOAA observations API returned HTTP ${res.status}`);
  return data;
}

/* Cache of real forecast PoP keyed by station id.  A forecast changes slowly, so
   re-fetching it on every live-observation tick (every ≥10 s) would be wasteful and
   could exhaust the NOAA rate budget.  Entries expire after FORECAST_TTL_MS. */
const forecastPoPCache = new Map();   // stationId → { pop: number|null, ts: number, ttl: number, end: number }
const FORECAST_TTL_MS  = 10 * 60 * 1000;  // 10 minutes
// A FAILED lookup (timeout, NWS hiccup) is retried much sooner than a real answer,
// so one slow request doesn't hide the precipitation row for ten minutes.
const FORECAST_FAILURE_TTL_MS = 2 * 60 * 1000;
const FORECAST_CACHE_LIMIT = 100;

/** Store a cache entry with insertion-order eviction to bound long-lived PWA memory. */
function setBoundedCache(cache, key, value, limit) {
  if (cache.has(key)) cache.delete(key);
  cache.set(key, value);
  while (cache.size > limit) cache.delete(cache.keys().next().value);
}

/**
 * Fetch the real probability of precipitation for the current hour at a location.
 *
 * Unlike the latest-observation endpoint (which carries no PoP), this resolves the
 * NOAA forecast grid for the coordinate and reads the gridded
 * `probabilityOfPrecipitation` produced by the local Weather Forecast Office — an
 * actual forecast product, not a heuristic.
 *
 * Two-step NOAA flow:
 *   1. GET /points/{lat},{lon}  → properties.forecastHourly (grid forecast URL)
 *   2. GET {forecastHourly}     → probabilityOfPrecipitation of the current period
 *
 * Results are cached per station for up to FORECAST_TTL_MS, never past the end of
 * the hour they describe. Failures never throw: a passing one keeps a value whose
 * hour is still running (retried after FORECAST_FAILURE_TTL_MS), otherwise null.
 *
 * @param   {number} lat        - Latitude
 * @param   {number} lon        - Longitude
 * @param   {string} stationId  - Cache key (ICAO id)
 * @returns {Promise<number|null>} PoP 0–100, or null when unavailable
 */
async function fetchForecastPoP(lat, lon, stationId) {
  // Serve a still-fresh cached value to avoid hitting NOAA on every refresh tick.
  const cached = cachedForecastPoP(stationId);
  if (cached !== undefined) return cached;

  let pop = null;
  let failed = false;
  let periodEnd = NaN;   // when the hour the value belongs to ends
  try {
    // Step 1 — turn the coordinate into a forecast grid. The /points response tells
    // us which Weather Forecast Office and grid cell this location belongs to, and
    // hands back the ready-made hourly-forecast URL for that cell.
    const { response: ptRes, data: pointData } = await fetchJsonWithTimeout(
      `https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`);
    // 404 = outside the forecast grid (e.g. an offshore station): a lasting "no
    // forecast", cached like one, not a passing failure retried every 2 minutes.
    if (ptRes.status === 404) throw Object.assign(new Error('No forecast grid here'), { lasting: true });
    if (!ptRes.ok) throw new Error(`NOAA points API returned HTTP ${ptRes.status}`);
    const hourlyUrl = pointData.properties?.forecastHourly;

    // Step 2 — fetch that hourly forecast and take the CURRENT hour: the first
    // period that hasn't ended yet. periods[0] is not enough — a forecast issued
    // a while ago still starts with an hour that is already over.
    if (hourlyUrl && isTrustedNwsApiUrl(hourlyUrl, '/gridpoints/')) {
      const { response: fcRes, data: forecastData } = await fetchJsonWithTimeout(hourlyUrl);
      if (!fcRes.ok) throw new Error(`NOAA forecast API returned HTTP ${fcRes.status}`);
      const now = Date.now();
      const period = (forecastData.properties?.periods || [])
        .find(p => Date.parse(p?.endTime) > now);
      const v = period?.probabilityOfPrecipitation?.value;
      pop = v != null ? Math.round(v) : null;
      // Don't keep showing this hour's value after the hour is over.
      periodEnd = Date.parse(period?.endTime);
    }
  } catch (e) {
    // Forecast is supplementary — swallow and fall back to "no data". Only a passing
    // failure gets the short retry; a lasting one (no grid here) the normal TTL.
    pop = null;
    failed = !e.lasting;
  }

  // A passing failure (timeout, NWS 5xx) keeps a value whose hour is still running,
  // so the row doesn't blink out; only the retry comes sooner (capped at that hour).
  const prev = forecastPoPCache.get(stationId);
  if (failed && prev && prev.pop != null && prev.end > Date.now()) {
    pop = prev.pop;
    periodEnd = prev.end;
  }
  // Cache even a null result so a missing/failed forecast isn't retried every tick.
  const ttl = failed
    ? Math.max(0, Math.min(FORECAST_FAILURE_TTL_MS, Number.isFinite(periodEnd) ? periodEnd - Date.now() : FORECAST_FAILURE_TTL_MS))
    // Number.isFinite, not `|| TTL`: an hour ending exactly now (difference 0) must
    // get a 0 TTL, not the full 10 minutes.
    : Math.max(0, Math.min(FORECAST_TTL_MS, Number.isFinite(periodEnd) ? periodEnd - Date.now() : FORECAST_TTL_MS));
  // `end`: when the value's hour is over (NaN when unknown — then pop is null anyway).
  setBoundedCache(forecastPoPCache, stationId, { pop, ts: Date.now(), ttl, end: periodEnd }, FORECAST_CACHE_LIMIT);
  return pop;
}

/**
 * The cached PoP for a station while it is still fresh.
 * @returns {number|null|undefined} the value (null = no forecast available), or
 *                                  undefined when it is missing or stale
 */
function cachedForecastPoP(stationId) {
  const cached = forecastPoPCache.get(stationId);
  return cached && Date.now() - cached.ts < cached.ttl ? cached.pop : undefined;
}

/* Point and state alert feeds use the same short TTL. This keeps nearby polygons
   current without multiplying requests during the two-minute refresh loop. */
const pointAlertsCache = new Map();       // "lat,lon" → { alerts: Feature[], ts: number }
const stateAlertsCache = new Map();       // state code → { alerts: Feature[], ts: number }
const alertStateCache  = new Map();       // "lat,lon" → two-letter state code
// Completed-value caches above enforce TTLs; these maps coalesce concurrent misses.
const pointAlertsRequests = new Map();
const stateAlertsRequests = new Map();
const alertStateRequests  = new Map();
const ALERTS_REFRESH_MS = 2 * 60 * 1000;  // how often the refresh loop runs
// Kept shorter than the refresh interval: an entry's clock starts when its fetch
// FINISHES, so with equal values every other tick would still hit the cache and
// alerts would really update only every ~4 minutes.
const ALERTS_TTL_MS = ALERTS_REFRESH_MS - 30 * 1000;
const STATE_ALERTS_STALE_MAX_MS = 30 * 60 * 1000;
const ALERTS_CACHE_LIMIT = 50;
const STATE_ALERTS_CACHE_LIMIT = 10;
const ALERT_STATE_CACHE_LIMIT = 100;

/**
 * Validate one alert Feature at the network boundary, so a malformed item cannot
 * break sorting, signatures, polygon checks, or rendering later. NWS also sends
 * "Test"/"Exercise"/"Draft" messages through the live feed; only real ("Actual")
 * alerts are shown, so nobody sees a TEST MESSAGE presented as a real warning.
 *
 * A cancelled alert also stays in the "active" feed until its original end time,
 * still named after the original event (e.g. "Flood Watch") with its area. It is
 * marked by response "AllClear" (or messageType "Cancel") and must not be shown
 * as if the hazard were still in force.
 */
function isDisplayableAlert(feature) {
  if (!feature || typeof feature !== 'object') return false;
  const p = feature.properties;
  if (!p || typeof p !== 'object') return false;
  return (p.status ?? 'Actual') === 'Actual' &&
         p.messageType !== 'Cancel' && p.response !== 'AllClear';
}

/**
 * Two-letter state (or territory) code for an NWS /points response. The county
 * zone id ("RIC007") names the state the point is actually IN; relativeLocation
 * is the nearest town, which can be across a state line (42.0,-71.4 is in Rhode
 * Island but its nearest town is in Massachusetts), so it is only a fallback.
 * @returns {string|null}
 */
function pointStateCode(pointProps) {
  for (const zoneUrl of [pointProps?.county, pointProps?.forecastZone]) {
    const code = String(zoneUrl || '').split('/').pop().slice(0, 2);
    if (/^[A-Z]{2}$/.test(code)) return code;
  }
  const state = pointProps?.relativeLocation?.properties?.state;
  return /^[A-Z]{2}$/.test(state || '') ? state : null;
}

/** True while an alert's hazard (or, lacking `ends`, the message) has not ended yet. */
function isAlertUnexpired(feature, now) {
  const endTime = Date.parse(feature.properties?.ends || feature.properties?.expires || '');
  return !Number.isFinite(endTime) || endTime > now;
}

/** Return the coordinate bounding box for any polygonal GeoJSON geometry. */
function alertGeometryBounds(geometry) {
  if (!geometry) return null;
  const bounds = { west: Infinity, south: Infinity, east: -Infinity, north: -Infinity };

  function visit(value) {
    if (!Array.isArray(value)) return;
    if (value.length >= 2 && Number.isFinite(value[0]) && Number.isFinite(value[1])) {
      bounds.west = Math.min(bounds.west, value[0]);
      bounds.south = Math.min(bounds.south, value[1]);
      bounds.east = Math.max(bounds.east, value[0]);
      bounds.north = Math.max(bounds.north, value[1]);
      return;
    }
    value.forEach(visit);
  }

  if (geometry.type === 'GeometryCollection') {
    (geometry.geometries || []).forEach(part => {
      const partBounds = alertGeometryBounds(part);
      if (!partBounds) return;
      visit([[partBounds.west, partBounds.south], [partBounds.east, partBounds.north]]);
    });
  } else {
    visit(geometry.coordinates);
  }
  return Number.isFinite(bounds.west) ? bounds : null;
}

/** Return whether a polygon's filled area actually intersects the map viewport. */
function geometryIntersectsBounds(geometry, viewport) {
  const bounds = alertGeometryBounds(geometry);
  if (!bounds || !viewport) return false;
  const boxesOverlap = bounds.east >= viewport.west && bounds.west <= viewport.east &&
                       bounds.north >= viewport.south && bounds.south <= viewport.north;
  if (!boxesOverlap) return false;
  if (geometry.type === 'GeometryCollection') {
    return (geometry.geometries || []).some(part => geometryIntersectsBounds(part, viewport));
  }

  const polygons = alertPolygons({ geometry });
  const corners = [
    [viewport.west, viewport.south], [viewport.west, viewport.north],
    [viewport.east, viewport.south], [viewport.east, viewport.north]
  ];
  const pointInViewport = point => Array.isArray(point) &&
    point[0] >= viewport.west && point[0] <= viewport.east &&
    point[1] >= viewport.south && point[1] <= viewport.north;

  // Liang-Barsky clipping detects a ring edge crossing the rectangle even when
  // neither the polygon nor viewport contains a vertex of the other.
  function segmentIntersectsViewport(start, end) {
    if (!Array.isArray(start) || !Array.isArray(end)) return false;
    const dx = end[0] - start[0], dy = end[1] - start[1];
    const p = [-dx, dx, -dy, dy];
    const q = [
      start[0] - viewport.west, viewport.east - start[0],
      start[1] - viewport.south, viewport.north - start[1]
    ];
    let minimum = 0, maximum = 1;
    for (let i = 0; i < p.length; i++) {
      if (p[i] === 0) {
        if (q[i] < 0) return false;
        continue;
      }
      const ratio = q[i] / p[i];
      if (p[i] < 0) minimum = Math.max(minimum, ratio);
      else maximum = Math.min(maximum, ratio);
      if (minimum > maximum) return false;
    }
    return true;
  }

  return polygons.some(rings => {
    if (!Array.isArray(rings) || !rings.length) return false;
    if (corners.some(corner => pointInAlertPolygon(corner[0], corner[1], rings))) return true;
    return rings.some(ring => Array.isArray(ring) && ring.some((point, index) =>
      pointInViewport(point) || segmentIntersectsViewport(point, ring[(index + 1) % ring.length])
    ));
  });
}

/**
 * Keep every point alert, then add only same-state alerts with inline polygons
 * that actually intersect the searched map view. Zone-only products are excluded;
 * resolving an entire state's zone inventory would be unnecessarily expensive.
 */
function mergeVisibleAlerts(pointAlerts, regionalAlerts, viewport) {
  const merged = new Map();
  const keyFor = feature => feature.id || feature.properties?.id ||
    `${feature.properties?.event}@${feature.properties?.expires}`;

  (pointAlerts || []).forEach(feature => merged.set(keyFor(feature), feature));
  (regionalAlerts || []).forEach(feature => {
    if (!feature.geometry || !geometryIntersectsBounds(feature.geometry, viewport)) return;
    const key = keyFor(feature);
    if (!merged.has(key)) merged.set(key, feature);
  });
  return [...merged.values()];
}

/** Calculate the map bounds produced by centering this search at zoom level 10. */
function alertViewportBounds(lat, lon) {
  const zoom = 10;
  // A map laid out while hidden reports 0×0; estimate with the window instead
  // of collapsing the area to a single point (which would find no polygons).
  const size = map.getSize();
  const halfSize = (size.x && size.y ? size : L.point(window.innerWidth, window.innerHeight)).divideBy(2);
  const center = map.project([lat, lon], zoom);
  const northWest = map.unproject(center.subtract(halfSize), zoom);
  const southEast = map.unproject(center.add(halfSize), zoom);
  return {
    west: northWest.lng, south: southEast.lat,
    east: southEast.lng, north: northWest.lat
  };
}

/**
 * Fetch the point-specific part of the active NWS alert set.
 *
 * Endpoint: GET https://api.weather.gov/alerts/active?point={lat},{lon}
 * The NWS resolves the point against every active alert's area — both the small
 * storm-based polygons (tornado, severe thunderstorm, flash-flood warnings) and
 * the larger county/zone-based products (most watches) — and returns only those
 * that contain the point. A separate cached regional feed supplements this with
 * nearby inline polygons inside the search circle's area (or, for a single-station
 * link, the view around it).
 *
 * Results are cached per rounded coordinate for ALERTS_TTL_MS. A failed or
 * timed-out fetch resolves to **null** (not an empty array) so callers can tell
 * "the feed is momentarily unreachable" apart from "there are genuinely no alerts
 * here" — and keep the current display instead of blanking active warnings on a
 * transient hiccup. Alerts are strictly supplementary, so failure never throws.
 *
 * @param   {number} lat
 * @param   {number} lon
 * @returns {Promise<Object[]|null>} alert Features (possibly empty) on success, null on failure
 */
async function fetchPointAlerts(lat, lon) {
  const key    = `${lat.toFixed(4)},${lon.toFixed(4)}`;
  const cached = pointAlertsCache.get(key);
  if (cached && Date.now() - cached.ts < ALERTS_TTL_MS) return cached.alerts;
  if (pointAlertsRequests.has(key)) return pointAlertsRequests.get(key);

  const request = (async () => {
    let alerts = null;
    try {
      const { response: res, data } = await fetchJsonWithTimeout(
        `https://api.weather.gov/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`);
      if (res.ok && Array.isArray(data?.features)) {
        alerts = data.features.filter(isDisplayableAlert);
      }
    } catch (e) {
      alerts = null;   // network/timeout — signal failure rather than "no alerts".
    }

    // Cache only a successful fetch; on failure return null so the caller keeps the
    // current display and we retry on the next refresh tick.
    if (alerts !== null) {
      setBoundedCache(pointAlertsCache, key, { alerts, ts: Date.now() }, ALERTS_CACHE_LIMIT);
    }
    return alerts;
  })();
  pointAlertsRequests.set(key, request);
  try {
    return await request;
  } finally {
    if (pointAlertsRequests.get(key) === request) pointAlertsRequests.delete(key);
  }
}

/** Resolve the two-letter state containing a coordinate through the NWS points API (see pointStateCode). */
async function fetchAlertState(lat, lon) {
  const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
  if (alertStateCache.has(key)) return alertStateCache.get(key);
  if (alertStateRequests.has(key)) return alertStateRequests.get(key);

  const request = (async () => {
    try {
      const { response: res, data } = await fetchJsonWithTimeout(
        `https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`);
      if (!res.ok) {
        // 404 = a point the NWS doesn't cover (offshore, outside the US). That
        // won't change, so remember it instead of re-asking on every refresh tick.
        if (res.status === 404) setBoundedCache(alertStateCache, key, null, ALERT_STATE_CACHE_LIMIT);
        return null;
      }
      const state = pointStateCode(data?.properties);
      if (!state) return null;
      setBoundedCache(alertStateCache, key, state, ALERT_STATE_CACHE_LIMIT);
      return state;
    } catch {
      return null;
    }
  })();
  alertStateRequests.set(key, request);
  try {
    return await request;
  } finally {
    if (alertStateRequests.get(key) === request) alertStateRequests.delete(key);
  }
}

/** Fetch and cache one state's active-alert index; stale data bridges transient failures. */
async function fetchStateAlerts(state) {
  const cached = stateAlertsCache.get(state);
  if (cached && Date.now() - cached.ts < ALERTS_TTL_MS) return cached.alerts;
  if (stateAlertsRequests.has(state)) return stateAlertsRequests.get(state);

  // A recent snapshot is safer than temporarily deleting nearby alerts, but never
  // preserve it indefinitely or retain products whose own validity has ended.
  const now = Date.now();
  const fallbackAlerts = cached && now - cached.ts <= STATE_ALERTS_STALE_MAX_MS
    ? cached.alerts.filter(feature => isAlertUnexpired(feature, now))
    : null;

  const request = (async () => {
    try {
      const { response: res, data } = await fetchJsonWithTimeout(
        `https://api.weather.gov/alerts/active?area=${encodeURIComponent(state)}`);
      if (!res.ok) {
        const retryable = res.status === 408 || res.status === 425 ||
                          res.status === 429 || res.status >= 500;
        return retryable ? fallbackAlerts : null;
      }
      if (!Array.isArray(data?.features)) return fallbackAlerts;
      const alerts = data.features.filter(isDisplayableAlert);
      setBoundedCache(stateAlertsCache, state, { alerts, ts: Date.now() }, STATE_ALERTS_CACHE_LIMIT);
      return alerts;
    } catch {
      return fallbackAlerts;
    }
  })();
  stateAlertsRequests.set(state, request);
  try {
    return await request;
  } finally {
    if (stateAlertsRequests.get(state) === request) stateAlertsRequests.delete(state);
  }
}

/**
 * Fetch alerts affecting the searched point plus inline polygons visible nearby.
 * Regional lookups are best-effort: the original point feed remains usable if the
 * state metadata or state alert index cannot be reached.
 * @param {number} lat
 * @param {number} lon
 * @param {Object} viewport - map area (alertViewportBounds) regional polygons must touch
 */
async function fetchAlerts(lat, lon, viewport) {
  const [pointAlerts, state] = await Promise.all([
    fetchPointAlerts(lat, lon),
    fetchAlertState(lat, lon)
  ]);
  if (pointAlerts === null) return null;
  if (!state) return pointAlerts;

  const regionalAlerts = await fetchStateAlerts(state);
  if (regionalAlerts === null) return pointAlerts;
  return mergeVisibleAlerts(pointAlerts, regionalAlerts, viewport);
}

/* ─────────────────────────────────────────────────────────────────────────────
   9. UNIT-CONVERSION HELPERS
   ───────────────────────────────────────────────────────────────────────────── */

/** n.toFixed(digits), but never "-0.0": tiny negatives such as -0.04 °C round to 0. */
const toFixedClean = (n, digits) => {
  const s = n.toFixed(digits);
  return Number(s) === 0 ? (0).toFixed(digits) : s;
};

/* Readings are shown in whole units, like weather.gov: most reports carry whole
   °C and whole knots, so a decimal (55.4°F, 6.9 mph) is precision they don't have. */

/** Celsius → Fahrenheit (string, whole degrees). Returns null if input is null. */
const cToF = c => c != null ? toFixedClean((c * 9/5) + 32, 0) : null;

/** km/h → mph (string, whole mph). */
const kmhToMph = k => k != null ? toFixedClean(k * 0.621371, 0) : null;

/** Metres → miles the way US stations report them: fractions (1/4, 3/4, …) below
    3 mi and whole or half miles above — one decimal would show ¼ SM (402 m) as 0.2 mi. */
const mToMi = m => {
  if (m == null) return null;
  const mi = m / 1609.344;
  return mi < 3 ? String(Number((Math.round(mi * 16) / 16).toFixed(2))) : String(Math.round(mi * 2) / 2);
};

/** Metres → feet, to the nearest 100 ft (cloud bases are reported in hundreds of
    feet; the API's metres turn OVC026 into 2592 ft unless rounded back). */
const mToFt = m => m != null ? Math.round(m * 3.28084 / 100) * 100 : null;

/** Pascals → inches of mercury (2 decimal places). */
const paToInHg = pa => pa != null ? (pa / 3386.389).toFixed(2) : null;

/**
 * Format an ISO-8601 timestamp as a locale-aware time string.
 * @param   {string|null} ts
 * @returns {string}
 */
function formatTime(ts) {
  if (!ts) return '—';
  const when = new Date(ts);
  const time = when.toLocaleTimeString('en-US', {
    hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
  });
  // A station's "latest" report can be days old. Add the date when it isn't
  // today, and say how old it is past 2 hours, so stale data doesn't look current.
  const ageHours = (Date.now() - when.getTime()) / 3_600_000;
  const day = when.toDateString() === new Date().toDateString()
    ? '' : when.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ';
  const age = ageHours >= 48 ? ` · ${Math.floor(ageHours / 24)} days old`
            : ageHours >= 2  ? ` · ${Math.floor(ageHours)} h old` : '';
  return day + time + age;
}

/**
 * Render a nullable value, or an "N/A" placeholder, for HTML insertion.
 * It does NOT escape: pass only numbers or app-made strings. Feed text must go
 * through escapeHtml() first.
 * @param   {*}      v     - Value to render (null/undefined → N/A)
 * @param   {string} unit  - Unit suffix appended when v is not null
 * @param   {string} na    - Fallback text
 * @returns {string}        HTML string
 */
function val(v, unit = '', na = 'N/A') {
  return (v == null || v === '')
    ? `<span class="na">${na}</span>`
    : `${v}${unit}`;
}

/**
 * Convert a meteorological wind direction in degrees to a compass abbreviation.
 * @param   {number} deg  - 0–360
 * @returns {string}       e.g. "NNE"
 */
function degToCompass(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

/* ─────────────────────────────────────────────────────────────────────────────
   10. WEATHER POPUP RENDERER
   ─────────────────────────────────────────────────────────────────────────────
   Populates #popup-body with a complete weather-data card built from the
   raw GeoJSON observation feature returned by fetchObservations().
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Render observation data into the station info popup panel.
 *
 * @param {Object}      data         - Full GeoJSON observation feature
 * @param {string}      stationId    - ICAO identifier (e.g. "KSAT")
 * @param {string|null} stationName  - Human-readable station name
 * @param {number|null} precipPct    - Real forecast PoP 0–100 (from fetchForecastPoP)
 */
function renderWeather(data, stationId, stationName, precipPct = null) {
  const p = data.properties;

  /* ── Temperature (dual unit display) ── */
  const tempC     = p.temperature?.value;
  const tempF     = cToF(tempC);
  // Display the actual °C value (not a °F→°C round-trip, which would re-introduce
  // rounding error from the already-rounded Fahrenheit string).
  const tempCDisp = tempC != null ? toFixedClean(tempC, 0) : null;

  /*
   * "Feels Like" — only where it means something, as weather.gov does: the NWS
   * also fills in a heat index at mild temperatures (73.3°F at 73.4°F, or even
   * BELOW the air temperature). Heat index from 80°F; wind chill at 50°F or colder
   * with wind of 3 mph or more. The cutoffs use the whole °F and mph shown, so
   * 26.6°C (shown as 80°F) still gets its heat index.
   */
  const heatC  = p.heatIndex?.value;
  const chillC = p.windChill?.value;
  const windMph = kmhToMph(p.windSpeed?.value);
  let feelsC = null, feelsLabel = 'Feels Like';
  if (heatC != null && tempF != null && Number(tempF) >= 80) {
    feelsC = heatC;  feelsLabel = 'Heat Index';
  } else if (chillC != null && tempF != null && Number(tempF) <= 50 && windMph != null && Number(windMph) >= 3) {
    feelsC = chillC; feelsLabel = 'Wind Chill';
  }
  const feelsF     = cToF(feelsC);
  const feelsCDisp = feelsC != null ? toFixedClean(feelsC, 0) : null;

  /* ── Other observations ── */
  const dewC      = p.dewpoint?.value;
  const dewF      = cToF(dewC);
  const gustMph  = kmhToMph(p.windGust?.value);
  const visMi     = mToMi(p.visibility?.value);
  // barometricPressure here is the altimeter setting — what US reports and
  // weather.gov call "Barometer". Sea-level pressure (a different quantity) only
  // comes with hourly reports, so preferring it made the value jump between
  // hourly and 5-minute reports; it is now just the fallback.
  const pressInHg = paToInHg(p.barometricPressure?.value ?? p.seaLevelPressure?.value);
  const humidity  = p.relativeHumidity?.value != null
                  ? Math.round(p.relativeHumidity.value) : null;
  // Calm (0 wind) has no meaningful direction: stations still send 0° ("from N").
  const isCalm    = p.windSpeed?.value === 0;
  const windDir   = p.windDirection?.value;
  const dirStr    = windDir != null && !isCalm ? degToCompass(windDir) : null;

  /* ── Cloud layers: show the total sky cover ──
     NWS lists layers lowest first, so the first is often just a thin lower layer
     (FEW at 1500 ft under an overcast). Show the layer with the most cover (the
     sky as a whole); on a tie, the lowest such layer. */
  const coverRank = { CLR: 0, SKC: 0, FEW: 1, SCT: 2, BKN: 3, OVC: 4, VV: 5 };
  const layer = (p.cloudLayers || []).reduce((best, l) =>
    (coverRank[l?.amount] ?? -1) > (coverRank[best?.amount] ?? -1) ? l : best, p.cloudLayers?.[0]);
  const cloudAmt = layer?.amount;
  const cloudFt  = mToFt(layer?.base?.value);
  const amtMap   = {
    CLR:'Clear', SKC:'Clear', FEW:'Few', SCT:'Scattered',
    BKN:'Broken', OVC:'Overcast', VV:'Vert. Vis.'
  };
  // No height for a clear sky: an automated CLR means "nothing below 12,000 ft",
  // and the API's placeholder base would read as "Clear @ 12500 ft".
  // VV is not a cloud layer: the sky is hidden (fog, snow) and that is how far up
  // one can see — so no "@", which would read as a cloud base.
  const isClear  = cloudAmt === 'CLR' || cloudAmt === 'SKC';
  const cloudStr = !cloudAmt ? null
    : cloudAmt === 'VV' ? 'Obscured' + (cloudFt != null ? ` · vert. vis. ${cloudFt} ft` : '')
    : (amtMap[cloudAmt] || cloudAmt) + (cloudFt != null && !isClear ? ` @ ${cloudFt} ft` : '');

  /* ── Present weather in words ("light rain", not the METAR code "-RA") ──
     Dropped when it only repeats the description shown above it. */
  // Same words as NWS ("light rain showers", "patchy fog", "unknown precipitation"),
  // and weather only seen nearby (VCSH) says "in vicinity" instead of looking like
  // it is at the station.
  const pwxWords = (p.presentWeather || [])
    .map(w => [w.intensity,
               w.modifier === 'patches' ? 'patchy' : w.modifier !== 'showers' && w.modifier,
               w.weather === 'unknown' ? 'unknown precipitation' : w.weather,
               w.modifier === 'showers' && 'showers', w.inVicinity && 'in vicinity']
      .filter(Boolean).join(' ').replace(/_/g, ' '))
    .filter(Boolean)
    .join(', ');
  // Compare letters only, ignoring "and": NWS writes "Light Rain and Fog/Mist"
  // in the description for the items rain + fog_mist here.
  const lettersOnly = s => String(s || '').toLowerCase().replace(/\band\b/g, '').replace(/[^a-z]/g, '');
  const pwx = lettersOnly(pwxWords) === lettersOnly(p.textDescription) ? '' : pwxWords;

  /* Free-text observation fields come from an external feed and are interpolated
     into innerHTML below — escape them, same policy as the alert renderer. */
  const descSafe  = escapeHtml(p.textDescription || '—');
  const cloudSafe = escapeHtml(cloudStr || '');
  const pwxSafe   = escapeHtml(pwx);

  /* ── Update popup header and footer ── */
  document.getElementById('popup-id').textContent   = stationId;
  document.getElementById('popup-name').textContent  = stationName || p.stationName || '—';
  document.getElementById('update-time').textContent = 'OBS: ' + formatTime(p.timestamp);

  /* ── Build HTML fragments for optional sections ── */

  // Temperature row: large °F with smaller °C companion
  const tempHTML = tempF != null
    ? `<div class="temp-row">
         <div class="weather-temp">${tempF}<sup>°F</sup></div>
         <div class="temp-celsius-wrap">
           <div class="temp-celsius">${tempCDisp}<sup>°C</sup></div>
         </div>
       </div>`
    : `<div class="weather-temp">—</div>`;

  // Feels-like cell (only rendered when data is available)
  const feelsHTML = feelsF != null
    ? `<div class="weather-item">
         <div class="weather-item-label">${feelsLabel}</div>
         <div class="weather-item-value">
           ${feelsF}°F <span class="feels-c">${feelsCDisp}°C</span>
         </div>
       </div>`
    : '';

  // Precipitation likelihood bar (full-width cell) — real NWS hourly forecast PoP
  const precipHTML = precipPct != null
    ? `<div class="weather-item full">
         <div class="weather-item-label">Precip Chance (this hr)</div>
         <div class="weather-item-value">${precipPct}%</div>
         <div class="precip-bar-wrap">
           <div class="precip-bar" style="width:${precipPct}%"></div>
         </div>
       </div>`
    : '';

  // Sky conditions and present weather (full-width cell)
  const cloudHTML = (cloudStr || pwx)
    ? `<div class="weather-item full">
         <div class="weather-item-label">Sky${pwx ? ' / Weather' : ''}</div>
         <div class="weather-item-value">
           ${cloudSafe}
           ${pwx ? (cloudStr ? '<br>' : '') +
             '<span style="font-size:0.75rem;color:var(--text-muted)">' + pwxSafe + '</span>'
             : ''}
         </div>
       </div>`
    : '';

  /* ── Assemble final popup body ── */
  document.getElementById('popup-body').innerHTML = `
    <div class="weather-main">
      <div class="temp-col">
        ${tempHTML}
        <div class="weather-desc">${descSafe}</div>
      </div>
    </div>
    <div class="weather-grid">
      <div class="weather-item">
        <div class="weather-item-label">Dewpoint</div>
        <div class="weather-item-value">${val(dewF, '°F')}</div>
      </div>
      <div class="weather-item">
        <div class="weather-item-label">Humidity</div>
        <div class="weather-item-value">${val(humidity, '%')}</div>
      </div>
      ${feelsHTML}
      <div class="weather-item">
        <div class="weather-item-label">Wind</div>
        <div class="weather-item-value">
          ${isCalm ? 'Calm' : windMph != null ? windMph + ' mph' : val(null)}
          ${dirStr ? '<br><span style="font-size:0.7rem;color:var(--text-muted)">from ' + dirStr + '</span>' : ''}
        </div>
      </div>
      <div class="weather-item">
        <div class="weather-item-label">Gusts</div>
        <div class="weather-item-value">${val(gustMph, ' mph')}</div>
      </div>
      <div class="weather-item">
        <div class="weather-item-label">Visibility</div>
        <div class="weather-item-value">${val(visMi, ' mi')}</div>
      </div>
      <div class="weather-item">
        <div class="weather-item-label">Pressure</div>
        <div class="weather-item-value">${val(pressInHg, ' inHg')}</div>
      </div>
      ${cloudHTML}
      ${precipHTML}
    </div>`;

  popupPanel.style.display = 'block';
}

/* ─────────────────────────────────────────────────────────────────────────────
   11. STATION REFRESH LOOP
   ─────────────────────────────────────────────────────────────────────────────
   doStationRefresh() is called both immediately (when a station is opened) and
   on a repeating interval driven by refreshInterval.  It is a no-op if
   the station id or panel generation no longer matches, preventing stale updates
   from overwriting a station that has since been changed, closed, or re-opened.
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Fetch fresh observation data for stationId and re-render the popup.
 * Guards against race conditions by checking the station's panel generation
 * before and after each asynchronous step.
 *
 * @param {string} stationId
 * @param {number} generation
 */
async function doStationRefresh(stationId, generation) {
  if (!isActiveStation(stationId, generation)) return;
  // Don't poll NOAA for a screen nobody can see (background tab, minimised app);
  // the visibilitychange handler below catches up as soon as it's visible again.
  if (document.hidden) { stationRefreshMissed = true; return; }

  // A timer can fire again before a slow observation+forecast request completes.
  // Reuse the existing request so responses cannot race or duplicate API traffic.
  if (stationRefreshRequest?.stationId === stationId &&
      stationRefreshRequest.generation === generation) {
    return stationRefreshRequest.promise;
  }

  const promise = refreshStationData(stationId, generation);
  stationRefreshRequest = { stationId, generation, promise };
  try {
    await promise;
  } finally {
    if (stationRefreshRequest?.promise === promise) stationRefreshRequest = null;
  }
}

/** True when a refresh was skipped because the page was hidden. */
let stationRefreshMissed = false;
/** The panel opening whose station has no observations at all (404) — never polled. */
let stationNoDataGeneration = 0;

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !stationRefreshMissed) return;
  stationRefreshMissed = false;
  if (activeStationId) doStationRefresh(activeStationId, stationOpenGeneration);
});

/** True only while the exact station-panel lifetime that started a request is open. */
function isActiveStation(stationId, generation) {
  return activeStationId === stationId && stationOpenGeneration === generation;
}

/** The observation the panel shows now and the rain chance shown with it. */
let shownStation = null;   // { stationId, generation, data, pop }
/** Stations with a forecast lookup in flight — one at a time per station. */
const forecastPending = new Set();

/**
 * Look up the station's rain chance in the background (best-effort, cached; never
 * throws) and re-render the NEWEST observation if the value changes what is shown.
 *
 * @param {string}   stationId
 * @param {number[]} coords     - GeoJSON [lon, lat]
 */
async function refreshStationForecast(stationId, coords) {
  if (forecastPending.has(stationId)) return;
  forecastPending.add(stationId);
  try {
    const precipPct = await fetchForecastPoP(coords[1], coords[0], stationId);
    const shown = shownStation;
    // The value belongs to the station, not to the panel opening that asked: a
    // station closed and reopened while this was loading still gets it. Re-render
    // the latest readings of the CURRENT opening (a newer observation may have
    // arrived meanwhile).
    if (activeStationId !== stationId || !shown ||
        shown.stationId !== stationId || shown.generation !== stationOpenGeneration) return;
    if (precipPct !== shown.pop) {
      shown.pop = precipPct;
      // renderWeather rewrites the footer time; keep a failed-refresh note there.
      const timeEl = document.getElementById('update-time');
      const failedNote = timeEl.textContent.endsWith(' · update failed');
      renderWeather(shown.data, stationId, activeStationName, precipPct);
      if (failedNote) timeEl.textContent += ' · update failed';
    }
  } finally {
    forecastPending.delete(stationId);
  }
}

/** Execute one observation/forecast refresh; doStationRefresh provides single-flight control. */
async function refreshStationData(stationId, generation) {
  if (!isActiveStation(stationId, generation)) return;

  const dotEl = document.getElementById('update-dot');
  dotEl.classList.add('refreshing');

  try {
    const data = await fetchObservations(stationId);
    if (!isActiveStation(stationId, generation)) return;
    dotEl.classList.remove('stale');   // fresh data again after a failed refresh

    // Show the observation right away — the separate forecast lookup can take many
    // seconds and must never hold it up. Use the last known rain chance even if it
    // is due for a refresh, so the row doesn't vanish and reappear every 10 minutes
    // — but never once its forecast hour is over ("this hr" from hours ago).
    const popEntry = forecastPoPCache.get(stationId);
    const shownPoP = popEntry && !(popEntry.end <= Date.now()) ? popEntry.pop : null;
    renderWeather(data, stationId, activeStationName, shownPoP);
    shownStation = { stationId, generation, data, pop: shownPoP };
    dotEl.classList.remove('refreshing');   // the readings are on screen

    // Then fetch the real forecast PoP for the station's own coordinates — NOT
    // awaited: this refresh (and so the next observation tick, which waits for it)
    // must not sit behind two slow forecast requests. GeoJSON geometry is [lon, lat].
    const coords = data.geometry?.coordinates;
    if (Array.isArray(coords) && Number.isFinite(coords[0]) && Number.isFinite(coords[1])) {
      refreshStationForecast(stationId, coords);
    }
  } catch (e) {
    if (isActiveStation(stationId, generation)) {
      // If the very first fetch failed we're still showing the loading skeleton —
      // swap it for an error so the panel doesn't hang forever on "Fetching…". The
      // .station-loading marker is kept, so a later successful tick still replaces
      // this; once real data has rendered (no skeleton present) a refresh error
      // leaves the good data untouched and only the footer note changes.
      const body = document.getElementById('popup-body');
      const firstLoad = !!body.querySelector('.station-loading');
      // A 404 before any data means the station has no observations to show; a 404
      // after data is just a failed refresh (the old reading stays, flagged below).
      const noData = e.status === 404 && firstLoad;
      const timeEl = document.getElementById('update-time');
      if (noData) timeEl.textContent = '—';
      else if (firstLoad) timeEl.textContent = 'Error fetching data';
      // Keep the time of the readings still on screen, so their age stays visible.
      else if (!timeEl.textContent.endsWith(' · update failed')) timeEl.textContent += ' · update failed';
      dotEl.classList.toggle('stale', !noData);
      if (noData) {
        // Listed stations with no recent observations answer 404 every time: say so
        // and stop polling instead of promising a retry that can't succeed.
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        stationNoDataGeneration = generation;
        // Nothing is polled, so don't show "LIVE · N s".
        document.getElementById('update-indicator').style.display = 'none';
        body.innerHTML =
          `<div style="text-align:center;color:var(--text-muted);font-size:0.7rem;padding:20px 0">
             ${escapeHtml(e.message)}
           </div>`;
      } else if (firstLoad) {
        body.innerHTML =
          `<div class="station-loading" style="text-align:center;color:var(--red);font-size:0.7rem;padding:20px 0">
             Couldn't load observations — retrying…
           </div>`;
      }
    }
  } finally {
    // Only the open panel's own request may stop the pulse: a leftover request for
    // a station the user already left must not keep (or end) the new one's state.
    if (isActiveStation(stationId, generation)) dotEl.classList.remove('refreshing');
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
   12. STATION PANEL OPEN / CLOSE
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Open the weather info popup for a station.
 * - Cancels any previous refresh timer.
 * - Clears the previous active marker highlight.
 * - Shows a loading skeleton while the first fetch completes.
 * - Starts the refresh timer for live updates.
 *
 * @param {string}          stationId    - ICAO identifier
 * @param {string|null}     stationName  - Human-readable name
 * @param {HTMLElement|null} markerEl    - The .station-marker div to highlight
 */
async function openStation(stationId, stationName, markerEl) {
  if (refreshTimer)    { clearInterval(refreshTimer); refreshTimer = null; }
  if (activeMarkerEl)  { activeMarkerEl.classList.remove('active'); }

  const generation = ++stationOpenGeneration;

  activeMarkerEl = markerEl;
  if (markerEl) markerEl.classList.add('active');

  activeStationId = stationId;
  activeStationName = stationName || null;
  // A request from the previous panel may still be pulsing the dot; this panel
  // starts idle and its own refresh turns the pulse on.
  document.getElementById('update-dot').classList.remove('refreshing', 'stale');
  document.getElementById('update-indicator').style.display = '';   // shown again after a no-data station
  popupPanel.style.display = 'block';
  document.getElementById('popup-id').textContent    = stationId;
  document.getElementById('popup-name').textContent  = stationName || '—';
  // Clear the previous station's observation time until this one's arrives.
  document.getElementById('update-time').textContent = '—';
  document.getElementById('popup-body').innerHTML    =
    `<div class="station-loading" style="text-align:center;color:var(--text-muted);font-size:0.7rem;padding:20px 0">
       Fetching observations…
     </div>`;

  await doStationRefresh(stationId, generation);

  // The user may have closed the panel or opened a different station (or the same
  // one again — every opening gets a new generation) while the first fetch was in
  // flight. Only the still-current opening starts the live-refresh timer, so an
  // orphaned or duplicate interval can never be created. A station with no
  // observations at all (404) is not polled.
  if (!isActiveStation(stationId, generation) || stationNoDataGeneration === generation) return;
  refreshTimer = setInterval(
    () => doStationRefresh(stationId, generation),
    refreshInterval
  );
}

const popupCloseBtn = document.getElementById('popup-close');

/**
 * Close the station panel and stop its refresh timer.
 * @param {boolean} returnFocus - keyboard use: move focus back to the marker the
 *   panel was opened from instead of dropping it at the start of the page. Not for
 *   mouse/touch: focusing the marker makes Leaflet pan the map back to it.
 */
function closeStationPanel(returnFocus) {
  const returnFocusTo = returnFocus ? activeMarkerEl?.closest('.leaflet-marker-icon') : null;
  popupPanel.style.display = 'none';
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  stationOpenGeneration++;
  activeStationId = null;
  if (activeMarkerEl) { activeMarkerEl.classList.remove('active'); activeMarkerEl = null; }
  returnFocusTo?.focus();
}

// A held Enter keeps auto-repeating, and a focused button "clicks" on every
// repeat: FIND would fire a geocoder request each time, the pin button would flip
// pin mode on and off, and a held Enter that opened the panel from a marker would
// repeat onto its close button and shut it again. One press = one click.
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.repeat && e.target.closest?.('button')) e.preventDefault();
}, true);
// Browsers also focus a button that is clicked, so :focus-visible is what tells a
// keyboard press apart from a mouse click or tap.
popupCloseBtn.addEventListener('click', e => {
  // matches(':focus-visible') throws in Safari before 15.4; there, treat the
  // press as a mouse/touch one (just close) rather than letting × do nothing.
  let fromKeyboard = false;
  try { fromKeyboard = e.currentTarget.matches(':focus-visible'); } catch { /* unsupported */ }
  closeStationPanel(fromKeyboard);
});
// Escape anywhere inside the panel closes it, like any dialog.
popupPanel.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  e.preventDefault();   // consumed: pin mode's Escape handler skips it
  closeStationPanel(true);
});

/* ─────────────────────────────────────────────────────────────────────────────
   13. MAP MARKER MANAGEMENT
   ───────────────────────────────────────────────────────────────────────────── */

/** Remove all station markers from the map and clear the tracking array. */
function clearStations() {
  stationMarkers.forEach(m => map.removeLayer(m));
  stationMarkers = [];
  stationRecords = [];   // drop the Tier-3 flagging records too
  clearSearchRadius();   // and the circle around them
}

/**
 * Create and add a single station marker to the map.
 * Returns the icon's inner div element so the caller can toggle .active.
 *
 * @param   {string} id    - ICAO identifier displayed inside the badge
 * @param   {string} name  - Full station name (used as tooltip)
 * @param   {number} lat
 * @param   {number} lng
 * @returns {HTMLElement}   The .station-marker div
 */
function makeStationMarker(id, name, lat, lng) {
  // Some stations have no name; never show the word "undefined" as a tooltip.
  const label  = name ? `${id} — ${name}` : id;
  const iconEl = document.createElement('div');
  iconEl.className   = 'station-marker';
  iconEl.textContent = id;
  iconEl.title       = label;
  iconEl.dataset.label = label;   // base text; flagStationsInAlerts adds the warning note

  const icon   = L.divIcon({ html: iconEl, className: '', iconSize: [28, 28], iconAnchor: [14, 14] });
  // (Leaflet's `alt` option only applies to <img> icons, so it isn't used here.)
  const marker = L.marker([lat, lng], { icon, title: label }).addTo(map);
  marker.on('click', () => openStation(id, name, iconEl));
  // Leaflet makes the marker focusable (role "button") but never turns Enter or
  // Space into a click, so keyboard users could reach a station but not open it.
  // Like a native button: Enter acts on keydown, Space on keyup. (Opening on the
  // Space keydown would move focus to the close button, whose own Space keyup
  // would then close the panel again.)
  const openFromKeyboard = () => {
    openStation(id, name, iconEl);
    // Move focus into the panel: its details get announced and are reachable
    // without tabbing past every other marker on the map.
    popupCloseBtn.focus();
  };
  const markerEl = marker.getElement();
  // Leaflet's box has role="button", so its spoken name would be just the badge
  // text ("KSAT"); give it the full label (flagStationsInAlerts may extend it).
  markerEl.setAttribute('aria-label', label);
  markerEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!e.repeat) openFromKeyboard();
    } else if (e.key === ' ') {
      e.preventDefault();   // no page scroll; opens on keyup
    }
  });
  markerEl.addEventListener('keyup', e => {
    if (e.key === ' ') { e.preventDefault(); openFromKeyboard(); }
  });
  stationMarkers.push(marker);
  return iconEl;
}

/**
 * Plot the stations a search found and draw the circle around them.
 *
 * NOAA returns a whole forecast area's station list — often 150–230 miles
 * across, over 1,000 in Alaska — so only the stations near the searched point
 * are shown (see selectStationsInRadius) and a circle marks that search area.
 * Replaces any previously plotted markers.
 *
 * @param {Object} geoJSON  - FeatureCollection from the NOAA stations endpoint
 * @param {number} lat      - the searched point
 * @param {number} lon
 * @returns {{west:number,south:number,east:number,north:number}|undefined} the
 *          circle's box (the map area the alert loader should look at), or
 *          undefined when no station was found (no circle is drawn then)
 */
function plotStations(geoJSON, lat, lon) {
  clearStations();
  // Skip any malformed entry (no id or no usable location): Leaflet throws on a
  // non-numeric position, which would abort plotting every station after it.
  const valid = (geoJSON.features || []).filter(f => {
    const [lng, la] = f?.geometry?.coordinates || [];   // GeoJSON order is [lng, lat]
    return f?.properties?.stationIdentifier && Number.isFinite(la) && Number.isFinite(lng);
  });
  // The room the edge needs depends on the circle's final size on screen, which
  // depends on the edge (the map zooms in whole steps): estimate from the screen,
  // then re-check with the chosen edge until the needed room stops growing.
  let clearance = searchEdgeClearance(lat);
  let pick = selectStationsInRadius(lat, lon, valid, clearance);
  for (let pass = 0; pass < 3; pass++) {
    const needed = searchEdgeClearance(lat, pick.edgeMi);
    if (needed <= clearance) break;
    clearance = needed;
    pick = selectStationsInRadius(lat, lon, valid, clearance);
  }
  const { inside, edgeMi } = pick;
  inside.forEach(({ f, lat: la, lng }) => {
    // Drawn on the same copy of the world as the circle: in the far-western
    // Aleutians (east of 180°) NOAA's stations sit just west of the date line, at
    // -176°…, which would put them a whole world away from a circle at +174°.
    const onScreenLng = lng + 360 * Math.round((lon - lng) / 360);
    const el = makeStationMarker(f.properties.stationIdentifier, f.properties.name, la, onScreenLng);
    // Remember each marker so flagStationsInAlerts() (Tier 3) can later test it
    // against the active warning polygons (NWS's own longitudes) and toggle its
    // .alerted ring.
    stationRecords.push({ el, lat: la, lng });
  });
  // An empty list (NOAA found no stations here): no "0 stations" circle.
  if (!inside.length) return undefined;
  return drawSearchRadius(lat, lon, edgeMi, inside.length);
}

/* ── Search radius ──────────────────────────────────────────────────────────── */
const SEARCH_RADIUS_MI  = 50;    // stations within this distance are shown…
const SEARCH_MIN_STATIONS = 8;   // …or the nearest 8, when fewer are that close
const SEARCH_STRETCH    = 1.25;  // to find room between stations the edge may move up to 25% further out…
const SEARCH_INWARD     = 0.7;   // …or 30% further in (never below the nearest 8)
// How the map fits the circle: the box around it (× radius), the room left above
// it for the label and at the other edges (px), and the closest zoom…
const SEARCH_FIT_BOX = 2.15, SEARCH_FIT_TOP = 96, SEARCH_FIT_EDGE = 40, SEARCH_FIT_MAX_ZOOM = 11;
// …and that room in total across and down (searchEdgeClearance sizes the circle with it).
const SEARCH_FIT_PAD_X = 2 * SEARCH_FIT_EDGE, SEARCH_FIT_PAD_Y = SEARCH_FIT_TOP + SEARCH_FIT_EDGE;
const METRES_PER_MILE   = 1609.344;
/**
 * A box covering every world copy on screen — the dimmed area the circle is cut
 * out of. Zoomed right out a wide screen shows ~2,700° of longitude, so it spans
 * 3,600° (Leaflet clips it to the screen, so the size costs nothing).
 */
const SEARCH_MASK_OUTER = [[-85, -1800], [85, -1800], [85, 1800], [-85, 1800]];

/** Great-circle distance between two points, in miles. */
function milesBetween(lat1, lon1, lat2, lon2) {
  const r = x => x * Math.PI / 180;
  const h = Math.sin(r(lat2 - lat1) / 2) ** 2 +
            Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(r(lon2 - lon1) / 2) ** 2;
  return 2 * 3958.8 * Math.asin(Math.sqrt(h));
}

/**
 * Pick the stations to show and where the circle's edge goes.
 *
 * Shows every station within SEARCH_RADIUS_MI, or the nearest SEARCH_MIN_STATIONS
 * when fewer are that close — and always EVERY station inside the edge, so the
 * label's "within N mi" stays true. Only shown stations get markers, so the edge
 * just needs room beyond the last one shown: `clearance` of the radius (a marker's
 * size measured against the circle as it will be drawn on this screen). Stations
 * left out are not drawn, so the edge may sit right next to the first of them —
 * nearly the whole gap is usable. To find such room the edge may settle anywhere
 * from SEARCH_INWARD to SEARCH_STRETCH times that distance (never below the
 * nearest 8), nearest to that distance first; where stations are too dense for any such gap, it takes the
 * widest gap available. The stretch is capped, so a dense list can never grow the
 * circle to cover everything.
 *
 * @param {number}   lat
 * @param {number}   lon
 * @param {Object[]} features  - station Features with valid coordinates
 * @param {number}   clearance - room needed past the last shown station, as a share of the radius
 * @returns {{ inside: {f:Object, lat:number, lng:number, mi:number}[], edgeMi: number }}
 */
function selectStationsInRadius(lat, lon, features, clearance) {
  const all = features.map(f => {
    const [lng, la] = f.geometry.coordinates;
    return { f, lat: la, lng, mi: milesBetween(lat, lon, la, lng) };
  }).sort((a, b) => a.mi - b.mi);
  const n = all.length;
  if (!n) return { inside: [], edgeMi: SEARCH_RADIUS_MI };

  const minCount = Math.min(SEARCH_MIN_STATIONS, n);
  const limitMi  = Math.max(SEARCH_RADIUS_MI, all[minCount - 1].mi);
  const need     = 1 / (1 - clearance);              // edge ÷ last shown station
  // Room after showing the nearest k: next station's distance ÷ the last one's.
  const room = k => (k < n ? all[k].mi / Math.max(all[k - 1].mi, 0.01) : Infinity);

  let fit = 0, widest = 0;
  for (let k = minCount; k <= n; k++) {
    const d = all[k - 1].mi;
    if (d > limitMi * SEARCH_STRETCH) break;
    if (d < limitMi * SEARCH_INWARD && k < n) continue;
    if (room(k) >= need && (!fit || Math.abs(d - limitMi) < Math.abs(all[fit - 1].mi - limitMi))) fit = k;
    if (!widest || room(k) > room(widest)) widest = k;
  }
  const kept = fit || widest || all.filter(s => s.mi <= limitMi).length;

  const lastIn = all[kept - 1].mi;
  const next   = kept < n ? all[kept].mi : Infinity;
  // Just clear of the last station shown, but short of the next one (which is not
  // shown, so the edge may touch it): with too little room that is the most room
  // this list allows.
  const edgeMi = Math.min(Math.max(lastIn, 0.5) * need, next * 0.995);
  return { inside: all.slice(0, kept), edgeMi };
}

/**
 * The room the circle's edge needs past the last shown station, as a share of the
 * radius: a marker's radius plus a small gap, against the circle's size in pixels
 * once the map has zoomed to fit it (whole zoom levels, so often smaller than the
 * screen allows). Without a size (map laid out while hidden) a typical value.
 * @param {number} lat
 * @param {number} [edgeMi] - a proposed radius; omitted: estimate from the screen alone
 */
function searchEdgeClearance(lat, edgeMi) {
  const size = map.getSize();
  if (size.x <= SEARCH_FIT_PAD_X || size.y <= SEARCH_FIT_PAD_Y) return 0.1;
  const markerPx = window.matchMedia('(pointer: coarse), (max-width: 640px)').matches ? 17 : 14;
  let radiusPx;
  if (edgeMi) {
    const r = edgeMi * METRES_PER_MILE;
    const zoom = Math.min(SEARCH_FIT_MAX_ZOOM, map.getBoundsZoom(
      L.latLng(lat, 0).toBounds(r * SEARCH_FIT_BOX), false, L.point(SEARCH_FIT_PAD_X, SEARCH_FIT_PAD_Y)));
    radiusPx = r / (40075016.686 * Math.cos(lat * Math.PI / 180) / (256 * Math.pow(2, zoom)));
  } else {
    radiusPx = Math.min(size.x - SEARCH_FIT_PAD_X, size.y - SEARCH_FIT_PAD_Y) / SEARCH_FIT_BOX;
  }
  return radiusPx > 0 ? Math.min(0.4, (markerPx + 5) / radiusPx) : 0.1;
}

// Above the alert areas (overlay pane, 400) so the dimming covers them evenly,
// below the station markers (600). Its own SVG renderer lives in this pane.
// Leaflet only redraws it when a move ends, so it covers half a screen past each
// edge (not the default 10%): the dimming doesn't stop short while dragging.
map.createPane('searchRadius').style.zIndex = 410;
const searchRadiusRenderer = L.svg({ pane: 'searchRadius', padding: 0.5 });
const searchRadiusLayer = L.layerGroup().addTo(map);
/** The circle on screen: { lat, r (metres), rim, rings[], mask, label } or null. */
let searchRadius = null;

/**
 * Draw the circle around the shown stations and fit it on screen: a crisp rim,
 * a soft glow and a slowly turning dotted ring just OUTSIDE it, and the map
 * outside the circle dimmed. Grows out from the point unless motion is reduced.
 * (plotStations has already cleared the previous circle, via clearStations.)
 * @returns {{west:number,south:number,east:number,north:number}} the circle's box
 */
function drawSearchRadius(lat, lon, miles, count) {
  const r = miles * METRES_PER_MILE;
  const ring = opts => L.circle([lat, lon], {
