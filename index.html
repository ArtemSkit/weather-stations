  if (cached && Date.now() - cached.ts < ALERTS_TTL_MS) return cached.alerts;
  if (stateAlertsRequests.has(state)) return stateAlertsRequests.get(state);

  // A recent snapshot is safer than temporarily deleting nearby alerts, but never
  // preserve it indefinitely or retain products whose own validity has ended.
  const now = Date.now();
  const fallbackAlerts = cached && now - cached.ts <= STATE_ALERTS_STALE_MAX_MS
    ? cached.alerts.filter(feature => isAlertUnexpired(feature, now))
    : null;

  const request = (async () => {
    try {
      const { response: res, data } = await fetchJsonWithTimeout(
        `https://api.weather.gov/alerts/active?area=${encodeURIComponent(state)}`);
      if (!res.ok) {
        const retryable = res.status === 408 || res.status === 425 ||
                          res.status === 429 || res.status >= 500;
        return retryable ? fallbackAlerts : null;
      }
      if (!Array.isArray(data?.features)) return fallbackAlerts;
      const alerts = data.features.filter(isDisplayableAlert);
      setBoundedCache(stateAlertsCache, state, { alerts, ts: Date.now() }, STATE_ALERTS_CACHE_LIMIT);
      return alerts;
    } catch {
      return fallbackAlerts;
    }
  })();
  stateAlertsRequests.set(state, request);
  try {
    return await request;
  } finally {
    if (stateAlertsRequests.get(state) === request) stateAlertsRequests.delete(state);
  }
}

/**
 * Fetch alerts affecting the searched point plus inline polygons visible nearby.
 * Regional lookups are best-effort: the original point feed remains usable if the
 * state metadata or state alert index cannot be reached.
 * @param {number} lat
 * @param {number} lon
 * @param {Object} viewport - map area (alertViewportBounds) regional polygons must touch
 */
async function fetchAlerts(lat, lon, viewport) {
  const [pointAlerts, state] = await Promise.all([
    fetchPointAlerts(lat, lon),
    fetchAlertState(lat, lon)
  ]);
  if (pointAlerts === null) return null;
  if (!state) return pointAlerts;

  const regionalAlerts = await fetchStateAlerts(state);
  if (regionalAlerts === null) return pointAlerts;
  return mergeVisibleAlerts(pointAlerts, regionalAlerts, viewport);
}

/* ─────────────────────────────────────────────────────────────────────────────
   9. UNIT-CONVERSION HELPERS
   ───────────────────────────────────────────────────────────────────────────── */

/** n.toFixed(digits), but never "-0.0": tiny negatives such as -0.04 °C round to 0. */
const toFixedClean = (n, digits) => {
  const s = n.toFixed(digits);
  return Number(s) === 0 ? (0).toFixed(digits) : s;
};

/* Readings are shown in whole units, like weather.gov: most reports carry whole
   °C and whole knots, so a decimal (55.4°F, 6.9 mph) is precision they don't have. */

/** Celsius → Fahrenheit (string, whole degrees). Returns null if input is null. */
const cToF = c => c != null ? toFixedClean((c * 9/5) + 32, 0) : null;

/** km/h → mph (string, whole mph). */
const kmhToMph = k => k != null ? toFixedClean(k * 0.621371, 0) : null;

/** Metres → miles the way US stations report them: fractions (1/4, 3/4, …) below
    3 mi and whole or half miles above — one decimal would show ¼ SM (402 m) as 0.2 mi. */
const mToMi = m => {
  if (m == null) return null;
  const mi = m / 1609.344;
  return mi < 3 ? String(Number((Math.round(mi * 16) / 16).toFixed(2))) : String(Math.round(mi * 2) / 2);
};

/** Metres → feet, to the nearest 100 ft (cloud bases are reported in hundreds of
    feet; the API's metres turn OVC026 into 2592 ft unless rounded back). */
const mToFt = m => m != null ? Math.round(m * 3.28084 / 100) * 100 : null;

/** Pascals → inches of mercury (2 decimal places). */
const paToInHg = pa => pa != null ? (pa / 3386.389).toFixed(2) : null;

/**
 * Format an ISO-8601 timestamp as a locale-aware time string.
 * @param   {string|null} ts
 * @returns {string}
 */
function formatTime(ts) {
  if (!ts) return '—';
  const when = new Date(ts);
  const time = when.toLocaleTimeString('en-US', {
    hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
  });
  // A station's "latest" report can be days old. Add the date when it isn't
  // today, and say how old it is past 2 hours, so stale data doesn't look current.
  const ageHours = (Date.now() - when.getTime()) / 3_600_000;
  const day = when.toDateString() === new Date().toDateString()
    ? '' : when.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ';
  const age = ageHours >= 48 ? ` · ${Math.floor(ageHours / 24)} days old`
            : ageHours >= 2  ? ` · ${Math.floor(ageHours)} h old` : '';
  return day + time + age;
}

/**
 * Render a nullable value, or an "N/A" placeholder, for HTML insertion.
 * It does NOT escape: pass only numbers or app-made strings. Feed text must go
 * through escapeHtml() first.
 * @param   {*}      v     - Value to render (null/undefined → N/A)
 * @param   {string} unit  - Unit suffix appended when v is not null
 * @param   {string} na    - Fallback text
 * @returns {string}        HTML string
 */
function val(v, unit = '', na = 'N/A') {
  return (v == null || v === '')
    ? `<span class="na">${na}</span>`
    : `${v}${unit}`;
}

/**
 * Convert a meteorological wind direction in degrees to a compass abbreviation.
 * @param   {number} deg  - 0–360
 * @returns {string}       e.g. "NNE"
 */
function degToCompass(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  // Wrapped into 0–360 first: a negative or over-full turn still names a direction.
  return dirs[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];
}

/* ─────────────────────────────────────────────────────────────────────────────
   10. WEATHER POPUP RENDERER
   ─────────────────────────────────────────────────────────────────────────────
   Populates #popup-body with a complete weather-data card built from the
   raw GeoJSON observation feature returned by fetchObservations().
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Render observation data into the station info popup panel.
 *
 * @param {Object}      data         - Full GeoJSON observation feature
 * @param {string}      stationId    - ICAO identifier (e.g. "KSAT")
 * @param {string|null} stationName  - Human-readable station name
 * @param {number|null} precipPct    - Real forecast PoP 0–100 (from fetchForecastPoP)
 */
/**
 * Gusts are only reported while the wind gusts, and the 5-minute reports between
 * the full hourly ones sometimes leave a gust out even then (a station gusting at
 * 3:05 and 3:15 can send none at 3:10). So a gust seen in this station's reports
 * within the last 15 minutes is still shown — with its age — instead of the
 * reading flipping to "None" and back at every refresh.
 */
const GUST_CARRY_MS = 15 * 60_000;
const GUST_MEMORY_LIMIT = 50;
/** station → { kmh, at }: the newest gust seen in its reports */
const recentGusts = new Map();

/**
 * The gust to show for a report: its own, or one from the same station within
 * GUST_CARRY_MS before it.
 * @returns {{kmh:number, ageMin:number}|null} null when the station isn't gusting
 */
function shownGust(stationId, props) {
  const at = Date.parse(props?.timestamp);
  const kmh = props?.windGust?.value;
  if (kmh != null) {
    if (Number.isFinite(at)) setBoundedCache(recentGusts, stationId, { kmh, at }, GUST_MEMORY_LIMIT);
    return { kmh, ageMin: 0 };
  }
  const last = recentGusts.get(stationId);
  if (last && Number.isFinite(at) && at >= last.at && at - last.at <= GUST_CARRY_MS) {
    return { kmh: last.kmh, ageMin: Math.round((at - last.at) / 60_000) };
  }
  return null;
}

function renderWeather(data, stationId, stationName, precipPct = null) {
  const p = data.properties;

  /* ── Temperature (dual unit display) ── */
  const tempC     = p.temperature?.value;
  const tempF     = cToF(tempC);
  // Display the actual °C value (not a °F→°C round-trip, which would re-introduce
  // rounding error from the already-rounded Fahrenheit string).
  const tempCDisp = tempC != null ? toFixedClean(tempC, 0) : null;

  /*
   * "Feels Like" — only where it means something, as weather.gov does: the NWS
   * also fills in a heat index at mild temperatures (73.3°F at 73.4°F, or even
   * BELOW the air temperature). Heat index from 80°F; wind chill at 50°F or colder
   * with wind of 3 mph or more. The cutoffs use the whole °F and mph shown, so
   * 26.6°C (shown as 80°F) still gets its heat index.
   */
  const heatC  = p.heatIndex?.value;
  const chillC = p.windChill?.value;
  const windMph = kmhToMph(p.windSpeed?.value);
  let feelsC = null, feelsLabel = 'Feels Like';
  if (heatC != null && tempF != null && Number(tempF) >= 80) {
    feelsC = heatC;  feelsLabel = 'Heat Index';
  } else if (chillC != null && tempF != null && Number(tempF) <= 50 && windMph != null && Number(windMph) >= 3) {
    feelsC = chillC; feelsLabel = 'Wind Chill';
  }
  const feelsF     = cToF(feelsC);
  const feelsCDisp = feelsC != null ? toFixedClean(feelsC, 0) : null;

  /* ── Other observations ── */
  const dewC      = p.dewpoint?.value;
  const dewF      = cToF(dewC);
  const gust     = shownGust(stationId, p);   // this report's gust, or one from the last 15 min
  const gustMph  = gust ? kmhToMph(gust.kmh) : null;
  const visMi     = mToMi(p.visibility?.value);
  // barometricPressure here is the altimeter setting — what US reports and
  // weather.gov call "Barometer". Sea-level pressure (a different quantity) only
  // comes with hourly reports, so preferring it made the value jump between
  // hourly and 5-minute reports; it is now just the fallback.
  const pressInHg = paToInHg(p.barometricPressure?.value ?? p.seaLevelPressure?.value);
  const humidity  = p.relativeHumidity?.value != null
                  ? Math.round(p.relativeHumidity.value) : null;
  // Gusts: the value (with its age when carried over from an earlier report), or
  // "None" when the wind is reported but not gusting — N/A only with no wind data.
  const gustHtml = gustMph != null
    ? gustMph + ' mph' + (gust.ageMin
      ? '<br><span style="font-size:0.7rem;color:var(--text-muted)">' + gust.ageMin + ' min ago</span>' : '')
    : val(null, '', windMph != null ? 'None' : 'N/A');
  // Calm (0 wind) has no meaningful direction: stations still send 0° ("from N").
  const isCalm    = p.windSpeed?.value === 0;
  const windDir   = p.windDirection?.value;
  const dirStr    = windDir != null && !isCalm ? degToCompass(windDir) : null;

  /* ── Cloud layers: show the total sky cover ──
     NWS lists layers lowest first, so the first is often just a thin lower layer
     (FEW at 1500 ft under an overcast). Show the layer with the most cover (the
     sky as a whole); on a tie, the lowest such layer. */
  const coverRank = { CLR: 0, SKC: 0, FEW: 1, SCT: 2, BKN: 3, OVC: 4, VV: 5 };
  const layer = (p.cloudLayers || []).reduce((best, l) =>
    (coverRank[l?.amount] ?? -1) > (coverRank[best?.amount] ?? -1) ? l : best, p.cloudLayers?.[0]);
  const cloudAmt = layer?.amount;
  const cloudFt  = mToFt(layer?.base?.value);
  const amtMap   = {
    CLR:'Clear', SKC:'Clear', FEW:'Few', SCT:'Scattered',
    BKN:'Broken', OVC:'Overcast', VV:'Vert. Vis.'
  };
  // No height for a clear sky: an automated CLR means "nothing below 12,000 ft",
  // and the API's placeholder base would read as "Clear @ 12500 ft".
  // VV is not a cloud layer: the sky is hidden (fog, snow) and that is how far up
  // one can see — so no "@", which would read as a cloud base.
  const isClear  = cloudAmt === 'CLR' || cloudAmt === 'SKC';
  const cloudStr = !cloudAmt ? null
    : cloudAmt === 'VV' ? 'Obscured' + (cloudFt != null ? ` · vert. vis. ${cloudFt} ft` : '')
    : (amtMap[cloudAmt] || cloudAmt) + (cloudFt != null && !isClear ? ` @ ${cloudFt} ft` : '');

  /* ── Present weather in words ("light rain", not the METAR code "-RA") ──
     Dropped when it only repeats the description shown above it. */
  // Same words as NWS ("light rain showers", "patchy fog", "unknown precipitation"),
  // and weather only seen nearby (VCSH) says "in vicinity" instead of looking like
  // it is at the station.
  const pwxWords = (p.presentWeather || [])
    .map(w => [w.intensity,
               w.modifier === 'patches' ? 'patchy' : w.modifier !== 'showers' && w.modifier,
               w.weather === 'unknown' ? 'unknown precipitation' : w.weather,
               w.modifier === 'showers' && 'showers', w.inVicinity && 'in vicinity']
      .filter(Boolean).join(' ').replace(/_/g, ' '))
    .filter(Boolean)
    .join(', ');
  // Compare letters only, ignoring "and": NWS writes "Light Rain and Fog/Mist"
  // in the description for the items rain + fog_mist here.
  const lettersOnly = s => String(s || '').toLowerCase().replace(/\band\b/g, '').replace(/[^a-z]/g, '');
  const pwx = lettersOnly(pwxWords) === lettersOnly(p.textDescription) ? '' : pwxWords;

  /* Free-text observation fields come from an external feed and are interpolated
     into innerHTML below — escape them, same policy as the alert renderer. */
  const descSafe  = escapeHtml(p.textDescription || '—');
  const cloudSafe = escapeHtml(cloudStr || '');
  const pwxSafe   = escapeHtml(pwx);

  /* ── Update popup header and footer ── */
  document.getElementById('popup-id').textContent   = stationId;
  document.getElementById('popup-name').textContent  = stationName || p.stationName || '—';
  document.getElementById('update-time').textContent = 'OBS: ' + formatTime(p.timestamp);

  /* ── Build HTML fragments for optional sections ── */

  // Temperature row: large °F with smaller °C companion
  const tempHTML = tempF != null
    ? `<div class="temp-row">
         <div class="weather-temp">${tempF}<sup>°F</sup></div>
         <div class="temp-celsius-wrap">
           <div class="temp-celsius">${tempCDisp}<sup>°C</sup></div>
         </div>
       </div>`
    : `<div class="weather-temp">—</div>`;

  // Feels-like cell (only rendered when data is available)
  const feelsHTML = feelsF != null
    ? `<div class="weather-item">
         <div class="weather-item-label">${feelsLabel}</div>
         <div class="weather-item-value">
           ${feelsF}°F <span class="feels-c">${feelsCDisp}°C</span>
         </div>
       </div>`
    : '';

  // Precipitation likelihood bar (full-width cell) — real NWS hourly forecast PoP
  const precipHTML = precipPct != null
    ? `<div class="weather-item full">
         <div class="weather-item-label">Precip Chance (this hr)</div>
         <div class="weather-item-value">${precipPct}%</div>
         <div class="precip-bar-wrap">
           <div class="precip-bar" style="width:${precipPct}%"></div>
         </div>
       </div>`
    : '';

  // Sky conditions and present weather (full-width cell)
  const cloudHTML = (cloudStr || pwx)
    ? `<div class="weather-item full">
         <div class="weather-item-label">Sky${pwx ? ' / Weather' : ''}</div>
         <div class="weather-item-value">
           ${cloudSafe}
           ${pwx ? (cloudStr ? '<br>' : '') +
             '<span style="font-size:0.75rem;color:var(--text-muted)">' + pwxSafe + '</span>'
             : ''}
         </div>
       </div>`
    : '';

  /* ── Assemble final popup body ── */
  document.getElementById('popup-body').innerHTML = `
    <div class="weather-main">
      <div class="temp-col">
        ${tempHTML}
        <div class="weather-desc">${descSafe}</div>
      </div>
    </div>
    <div class="weather-grid">
      <div class="weather-item">
        <div class="weather-item-label">Dewpoint</div>
        <div class="weather-item-value">${val(dewF, '°F')}</div>
      </div>
      <div class="weather-item">
        <div class="weather-item-label">Humidity</div>
        <div class="weather-item-value">${val(humidity, '%')}</div>
      </div>
      ${feelsHTML}
      <div class="weather-item">
        <div class="weather-item-label">Wind</div>
        <div class="weather-item-value">
          ${isCalm ? 'Calm' : windMph != null ? windMph + ' mph' : val(null)}
          ${dirStr ? '<br><span style="font-size:0.7rem;color:var(--text-muted)">from ' + dirStr + '</span>' : ''}
        </div>
      </div>
      <div class="weather-item">
        <div class="weather-item-label">Gusts</div>
        <div class="weather-item-value">${gustHtml}</div>
      </div>
      <div class="weather-item">
        <div class="weather-item-label">Visibility</div>
        <div class="weather-item-value">${val(visMi, ' mi')}</div>
      </div>
      <div class="weather-item">
        <div class="weather-item-label">Pressure</div>
        <div class="weather-item-value">${val(pressInHg, ' inHg')}</div>
      </div>
      ${cloudHTML}
      ${precipHTML}
    </div>`;

  popupPanel.style.display = 'block';
}

/* ─────────────────────────────────────────────────────────────────────────────
   11. STATION REFRESH LOOP
   ─────────────────────────────────────────────────────────────────────────────
   doStationRefresh() is called both immediately (when a station is opened) and
   on a repeating interval driven by refreshInterval.  It is a no-op if
   the station id or panel generation no longer matches, preventing stale updates
   from overwriting a station that has since been changed, closed, or re-opened.
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Fetch fresh observation data for stationId and re-render the popup.
 * Guards against race conditions by checking the station's panel generation
 * before and after each asynchronous step.
 *
 * @param {string} stationId
 * @param {number} generation
 */
async function doStationRefresh(stationId, generation) {
  if (!isActiveStation(stationId, generation)) return;
  // Don't poll NOAA for a screen nobody can see (background tab, minimised app);
  // the visibilitychange handler below catches up as soon as it's visible again.
  if (document.hidden) { stationRefreshMissed = true; return; }

  // A timer can fire again before a slow observation+forecast request completes.
  // Reuse the existing request so responses cannot race or duplicate API traffic.
  if (stationRefreshRequest?.stationId === stationId &&
      stationRefreshRequest.generation === generation) {
    return stationRefreshRequest.promise;
  }

  const promise = refreshStationData(stationId, generation);
  stationRefreshRequest = { stationId, generation, promise };
  try {
    await promise;
  } finally {
    if (stationRefreshRequest?.promise === promise) stationRefreshRequest = null;
  }
}

/** True when a refresh was skipped because the page was hidden. */
let stationRefreshMissed = false;
/** The panel opening whose station has no observations at all (404) — never polled. */
let stationNoDataGeneration = 0;

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !stationRefreshMissed) return;
  stationRefreshMissed = false;
  if (activeStationId) doStationRefresh(activeStationId, stationOpenGeneration);
});

/** True only while the exact station-panel lifetime that started a request is open. */
function isActiveStation(stationId, generation) {
  return activeStationId === stationId && stationOpenGeneration === generation;
}

/** The observation the panel shows now and the rain chance shown with it. */
let shownStation = null;   // { stationId, generation, data, pop }
/** Stations with a forecast lookup in flight — one at a time per station. */
const forecastPending = new Set();

/**
 * Look up the station's rain chance in the background (best-effort, cached; never
 * throws) and re-render the NEWEST observation if the value changes what is shown.
 *
 * @param {string}   stationId
 * @param {number[]} coords     - GeoJSON [lon, lat]
 */
async function refreshStationForecast(stationId, coords) {
  if (forecastPending.has(stationId)) return;
  forecastPending.add(stationId);
  try {
    const precipPct = await fetchForecastPoP(coords[1], coords[0], stationId);
    const shown = shownStation;
    // The value belongs to the station, not to the panel opening that asked: a
    // station closed and reopened while this was loading still gets it. Re-render
    // the latest readings of the CURRENT opening (a newer observation may have
    // arrived meanwhile).
    if (activeStationId !== stationId || !shown ||
        shown.stationId !== stationId || shown.generation !== stationOpenGeneration) return;
    if (precipPct !== shown.pop) {
      shown.pop = precipPct;
      // renderWeather rewrites the footer time; keep a failed-refresh note there.
      const timeEl = document.getElementById('update-time');
      const failedNote = timeEl.textContent.endsWith(' · update failed');
      renderWeather(shown.data, stationId, activeStationName, precipPct);
      if (failedNote) timeEl.textContent += ' · update failed';
    }
  } finally {
    forecastPending.delete(stationId);
  }
}

/** Execute one observation/forecast refresh; doStationRefresh provides single-flight control. */
async function refreshStationData(stationId, generation) {
  if (!isActiveStation(stationId, generation)) return;

  const dotEl = document.getElementById('update-dot');
  dotEl.classList.add('refreshing');

  try {
    const data = await fetchObservations(stationId);
    if (!isActiveStation(stationId, generation)) return;
    dotEl.classList.remove('stale');   // fresh data again after a failed refresh

    // Show the observation right away — the separate forecast lookup can take many
    // seconds and must never hold it up. Use the last known rain chance even if it
    // is due for a refresh, so the row doesn't vanish and reappear every 10 minutes
    // — but never once its forecast hour is over ("this hr" from hours ago).
    const popEntry = forecastPoPCache.get(stationId);
    const shownPoP = popEntry && !(popEntry.end <= Date.now()) ? popEntry.pop : null;
    renderWeather(data, stationId, activeStationName, shownPoP);
    shownStation = { stationId, generation, data, pop: shownPoP };
    dotEl.classList.remove('refreshing');   // the readings are on screen

    // Then fetch the real forecast PoP for the station's own coordinates — NOT
    // awaited: this refresh (and so the next observation tick, which waits for it)
    // must not sit behind two slow forecast requests. GeoJSON geometry is [lon, lat].
    const coords = data.geometry?.coordinates;
    if (Array.isArray(coords) && Number.isFinite(coords[0]) && Number.isFinite(coords[1])) {
      refreshStationForecast(stationId, coords);
    }
  } catch (e) {
    if (isActiveStation(stationId, generation)) {
      // If the very first fetch failed we're still showing the loading skeleton —
      // swap it for an error so the panel doesn't hang forever on "Fetching…". The
      // .station-loading marker is kept, so a later successful tick still replaces
      // this; once real data has rendered (no skeleton present) a refresh error
      // leaves the good data untouched and only the footer note changes.
      const body = document.getElementById('popup-body');
      const firstLoad = !!body.querySelector('.station-loading');
      // A 404 before any data means the station has no observations to show; a 404
      // after data is just a failed refresh (the old reading stays, flagged below).
      const noData = e.status === 404 && firstLoad;
      const timeEl = document.getElementById('update-time');
      if (noData) timeEl.textContent = '—';
      else if (firstLoad) timeEl.textContent = 'Error fetching data';
      // Keep the time of the readings still on screen, so their age stays visible.
      else if (!timeEl.textContent.endsWith(' · update failed')) timeEl.textContent += ' · update failed';
      dotEl.classList.toggle('stale', !noData);
      if (noData) {
        // Listed stations with no recent observations answer 404 every time: say so
        // and stop polling instead of promising a retry that can't succeed.
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        stationNoDataGeneration = generation;
        // Nothing is polled, so don't show "LIVE · N s".
        document.getElementById('update-indicator').style.display = 'none';
        body.innerHTML =
          `<div style="text-align:center;color:var(--text-muted);font-size:0.7rem;padding:20px 0">
             ${escapeHtml(e.message)}
           </div>`;
      } else if (firstLoad) {
        body.innerHTML =
          `<div class="station-loading" style="text-align:center;color:var(--red);font-size:0.7rem;padding:20px 0">
             Couldn't load observations — retrying…
           </div>`;
      }
    }
  } finally {
    // Only the open panel's own request may stop the pulse: a leftover request for
    // a station the user already left must not keep (or end) the new one's state.
    if (isActiveStation(stationId, generation)) dotEl.classList.remove('refreshing');
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
   12. STATION PANEL OPEN / CLOSE
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Open the weather info popup for a station.
 * - Cancels any previous refresh timer.
 * - Clears the previous active marker highlight.
 * - Shows a loading skeleton while the first fetch completes.
 * - Starts the refresh timer for live updates.
 *
 * @param {string}          stationId    - ICAO identifier
 * @param {string|null}     stationName  - Human-readable name
 * @param {HTMLElement|null} markerEl    - The .station-marker div to highlight
 */
async function openStation(stationId, stationName, markerEl) {
  if (refreshTimer)    { clearInterval(refreshTimer); refreshTimer = null; }
  if (activeMarkerEl)  { activeMarkerEl.classList.remove('active'); }

  const generation = ++stationOpenGeneration;

  activeMarkerEl = markerEl;
  if (markerEl) markerEl.classList.add('active');

  activeStationId = stationId;
  activeStationName = stationName || null;
  // A request from the previous panel may still be pulsing the dot; this panel
  // starts idle and its own refresh turns the pulse on.
  document.getElementById('update-dot').classList.remove('refreshing', 'stale');
  document.getElementById('update-indicator').style.display = '';   // shown again after a no-data station
  popupPanel.style.display = 'block';
  document.getElementById('popup-id').textContent    = stationId;
  document.getElementById('popup-name').textContent  = stationName || '—';
  // Clear the previous station's observation time until this one's arrives.
  document.getElementById('update-time').textContent = '—';
  document.getElementById('popup-body').innerHTML    =
    `<div class="station-loading" style="text-align:center;color:var(--text-muted);font-size:0.7rem;padding:20px 0">
       Fetching observations…
     </div>`;

  await doStationRefresh(stationId, generation);

  // The user may have closed the panel or opened a different station (or the same
  // one again — every opening gets a new generation) while the first fetch was in
  // flight. Only the still-current opening starts the live-refresh timer, so an
  // orphaned or duplicate interval can never be created. A station with no
  // observations at all (404) is not polled.
  if (!isActiveStation(stationId, generation) || stationNoDataGeneration === generation) return;
  refreshTimer = setInterval(
    () => doStationRefresh(stationId, generation),
    refreshInterval
  );
}

const popupCloseBtn = document.getElementById('popup-close');

/**
 * Close the station panel and stop its refresh timer.
 * @param {boolean} returnFocus - keyboard use: move focus back to the marker the
 *   panel was opened from instead of dropping it at the start of the page. Not for
 *   mouse/touch: focusing the marker makes Leaflet pan the map back to it.
 */
function closeStationPanel(returnFocus) {
  const returnFocusTo = returnFocus ? activeMarkerEl?.closest('.leaflet-marker-icon') : null;
  popupPanel.style.display = 'none';
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  stationOpenGeneration++;
  activeStationId = null;
  if (activeMarkerEl) { activeMarkerEl.classList.remove('active'); activeMarkerEl = null; }
  returnFocusTo?.focus();
}

// A held Enter keeps auto-repeating, and a focused button "clicks" on every
// repeat: FIND would fire a geocoder request each time, the pin button would flip
// pin mode on and off, and a held Enter that opened the panel from a marker would
// repeat onto its close button and shut it again. One press = one click.
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.repeat && e.target.closest?.('button')) e.preventDefault();
}, true);
// Browsers also focus a button that is clicked, so :focus-visible is what tells a
// keyboard press apart from a mouse click or tap.
popupCloseBtn.addEventListener('click', e => {
  // matches(':focus-visible') throws in Safari before 15.4; there, treat the
  // press as a mouse/touch one (just close) rather than letting × do nothing.
  let fromKeyboard = false;
  try { fromKeyboard = e.currentTarget.matches(':focus-visible'); } catch { /* unsupported */ }
  closeStationPanel(fromKeyboard);
});
// Escape anywhere inside the panel closes it, like any dialog.
popupPanel.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  e.preventDefault();   // consumed: pin mode's Escape handler skips it
  closeStationPanel(true);
});

/* ─────────────────────────────────────────────────────────────────────────────
   13. MAP MARKER MANAGEMENT
   ───────────────────────────────────────────────────────────────────────────── */

/** Remove all station markers from the map and clear the tracking array. */
function clearStations() {
  stationMarkers.forEach(m => map.removeLayer(m));
  stationMarkers = [];
  stationRecords = [];   // drop the Tier-3 flagging records too
  clearSearchRadius();   // and the circle around them
}

/**
 * Create and add a single station marker to the map.
 * Returns the icon's inner div element so the caller can toggle .active.
 *
 * @param   {string} id    - ICAO identifier displayed inside the badge
 * @param   {string} name  - Full station name (used as tooltip)
 * @param   {number} lat
 * @param   {number} lng
 * @returns {HTMLElement}   The .station-marker div
 */
function makeStationMarker(id, name, lat, lng) {
  // Some stations have no name; never show the word "undefined" as a tooltip.
  const label  = name ? `${id} — ${name}` : id;
  const iconEl = document.createElement('div');
  iconEl.className   = 'station-marker';
  iconEl.textContent = id;
  iconEl.title       = label;
  iconEl.dataset.label = label;   // base text; flagStationsInAlerts adds the warning note

  const icon   = L.divIcon({ html: iconEl, className: '', iconSize: [28, 28], iconAnchor: [14, 14] });
  // (Leaflet's `alt` option only applies to <img> icons, so it isn't used here.)
  const marker = L.marker([lat, lng], { icon, title: label }).addTo(map);
  marker.on('click', () => openStation(id, name, iconEl));
  // Leaflet makes the marker focusable (role "button") but never turns Enter or
  // Space into a click, so keyboard users could reach a station but not open it.
  // Like a native button: Enter acts on keydown, Space on keyup. (Opening on the
  // Space keydown would move focus to the close button, whose own Space keyup
  // would then close the panel again.)
  const openFromKeyboard = () => {
    openStation(id, name, iconEl);
    // Move focus into the panel: its details get announced and are reachable
    // without tabbing past every other marker on the map.
    popupCloseBtn.focus();
  };
  const markerEl = marker.getElement();
  // Leaflet's box has role="button", so its spoken name would be just the badge
  // text ("KSAT"); give it the full label (flagStationsInAlerts may extend it).
  markerEl.setAttribute('aria-label', label);
  markerEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!e.repeat) openFromKeyboard();
    } else if (e.key === ' ') {
      e.preventDefault();   // no page scroll; opens on keyup
    }
  });
  markerEl.addEventListener('keyup', e => {
    if (e.key === ' ') { e.preventDefault(); openFromKeyboard(); }
  });
  stationMarkers.push(marker);
  return iconEl;
}

/**
 * Plot the stations a search found and draw the circle around them.
 *
 * NOAA returns a whole forecast area's station list — often 150–230 miles
 * across, over 1,000 in Alaska — so only the stations near the searched point
 * are shown (see selectStationsInRadius) and a circle marks that search area.
 * Replaces any previously plotted markers.
 *
 * @param {Object} geoJSON  - FeatureCollection from the NOAA stations endpoint
 * @param {number} lat      - the searched point
 * @param {number} lon
 * @param {number} [minZoom] - the zoom the user had: the circle never zooms out past it
 * @returns {{west:number,south:number,east:number,north:number}|undefined} the
 *          circle's box (the map area the alert loader should look at), or
 *          undefined when no station was found (no circle is drawn then)
 */
function plotStations(geoJSON, lat, lon, minZoom) {
  clearStations();
  // Skip any malformed entry (no id or no usable location): Leaflet throws on a
  // non-numeric position, which would abort plotting every station after it.
  const valid = (geoJSON.features || []).filter(f => {
    const [lng, la] = f?.geometry?.coordinates || [];   // GeoJSON order is [lng, lat]
    return f?.properties?.stationIdentifier && Number.isFinite(la) && Number.isFinite(lng);
  });
  // The room the edge needs depends on the circle's final size on screen, which
  // depends on the edge (the map zooms in whole steps): estimate from the screen,
  // then re-check with the chosen edge until the needed room stops growing.
  let clearance = searchEdgeClearance(lat);
  let pick = selectStationsInRadius(lat, lon, valid, clearance);
  for (let pass = 0; pass < 3; pass++) {
    const needed = searchEdgeClearance(lat, pick.edgeMi);
    if (needed <= clearance) break;
    clearance = needed;
    pick = selectStationsInRadius(lat, lon, valid, clearance);
  }
  const { inside, edgeMi } = pick;
  inside.forEach(({ f, lat: la, lng }) => {
    // Drawn on the same copy of the world as the circle: in the far-western
    // Aleutians (east of 180°) NOAA's stations sit just west of the date line, at
    // -176°…, which would put them a whole world away from a circle at +174°.
    const onScreenLng = lng + 360 * Math.round((lon - lng) / 360);
    const el = makeStationMarker(f.properties.stationIdentifier, f.properties.name, la, onScreenLng);
    // Remember each marker so flagStationsInAlerts() (Tier 3) can later test it
    // against the active warning polygons (NWS's own longitudes) and toggle its
    // .alerted ring.
    stationRecords.push({ el, lat: la, lng });
  });
  // An empty list (NOAA found no stations here): no "0 stations" circle.
  if (!inside.length) return undefined;
  return drawSearchRadius(lat, lon, edgeMi, inside.length, minZoom);
}

/* ── Search radius ──────────────────────────────────────────────────────────── */
const SEARCH_RADIUS_MI  = 50;    // stations within this distance are shown…
const SEARCH_MIN_STATIONS = 8;   // …or the nearest 8, when fewer are that close
const SEARCH_STRETCH    = 1.25;  // to find room between stations the edge may move up to 25% further out…
const SEARCH_INWARD     = 0.7;   // …or 30% further in (never below the nearest 8)
// How the map fits the circle: the box around it (× radius), the room left above
// it for the label and at the other edges (px), and the closest zoom…
const SEARCH_FIT_BOX = 2.15, SEARCH_FIT_TOP = 96, SEARCH_FIT_EDGE = 40, SEARCH_FIT_MAX_ZOOM = 11;
// …and that room in total across and down (searchEdgeClearance sizes the circle with it).
const SEARCH_FIT_PAD_X = 2 * SEARCH_FIT_EDGE, SEARCH_FIT_PAD_Y = SEARCH_FIT_TOP + SEARCH_FIT_EDGE;
const METRES_PER_MILE   = 1609.344;
/**
 * A box covering every world copy on screen — the dimmed area the circle is cut
 * out of. Zoomed right out a wide screen shows ~2,700° of longitude, so it spans
 * 3,600° (Leaflet clips it to the screen, so the size costs nothing).
 */
const SEARCH_MASK_OUTER = [[-85, -1800], [85, -1800], [85, 1800], [-85, 1800]];

/** Great-circle distance between two points, in miles. */
function milesBetween(lat1, lon1, lat2, lon2) {
  const r = x => x * Math.PI / 180;
  const h = Math.sin(r(lat2 - lat1) / 2) ** 2 +
            Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(r(lon2 - lon1) / 2) ** 2;
  return 2 * 3958.8 * Math.asin(Math.sqrt(h));
}

/**
 * Pick the stations to show and where the circle's edge goes.
 *
 * Shows every station within SEARCH_RADIUS_MI, or the nearest SEARCH_MIN_STATIONS
 * when fewer are that close — and always EVERY station inside the edge, so the
 * label's "within N mi" stays true. Only shown stations get markers, so the edge
 * just needs room beyond the last one shown: `clearance` of the radius (a marker's
 * size measured against the circle as it will be drawn on this screen). Stations
 * left out are not drawn, so the edge may sit right next to the first of them —
 * nearly the whole gap is usable. To find such room the edge may settle anywhere
 * from SEARCH_INWARD to SEARCH_STRETCH times that distance (never below the
 * nearest 8), nearest to that distance first; where stations are too dense for any such gap, it takes the
 * widest gap available. The stretch is capped, so a dense list can never grow the
 * circle to cover everything.
 *
 * @param {number}   lat
 * @param {number}   lon
 * @param {Object[]} features  - station Features with valid coordinates
 * @param {number}   clearance - room needed past the last shown station, as a share of the radius
 * @returns {{ inside: {f:Object, lat:number, lng:number, mi:number}[], edgeMi: number }}
 */
function selectStationsInRadius(lat, lon, features, clearance) {
  const all = features.map(f => {
    const [lng, la] = f.geometry.coordinates;
    return { f, lat: la, lng, mi: milesBetween(lat, lon, la, lng) };
  }).sort((a, b) => a.mi - b.mi);
  const n = all.length;
  if (!n) return { inside: [], edgeMi: SEARCH_RADIUS_MI };

  const minCount = Math.min(SEARCH_MIN_STATIONS, n);
  const limitMi  = Math.max(SEARCH_RADIUS_MI, all[minCount - 1].mi);
  const need     = 1 / (1 - clearance);              // edge ÷ last shown station
  // Room after showing the nearest k: next station's distance ÷ the last one's.
  const room = k => (k < n ? all[k].mi / Math.max(all[k - 1].mi, 0.01) : Infinity);

  let fit = 0, widest = 0;
  for (let k = minCount; k <= n; k++) {
    const d = all[k - 1].mi;
    if (d > limitMi * SEARCH_STRETCH) break;
    if (d < limitMi * SEARCH_INWARD && k < n) continue;
    if (room(k) >= need && (!fit || Math.abs(d - limitMi) < Math.abs(all[fit - 1].mi - limitMi))) fit = k;
    if (!widest || room(k) > room(widest)) widest = k;
  }
  const kept = fit || widest || all.filter(s => s.mi <= limitMi).length;

  const lastIn = all[kept - 1].mi;
  const next   = kept < n ? all[kept].mi : Infinity;
  // Just clear of the last station shown, but short of the next one (which is not
  // shown, so the edge may touch it): with too little room that is the most room
  // this list allows.
  const edgeMi = Math.min(Math.max(lastIn, 0.5) * need, next * 0.995);
  return { inside: all.slice(0, kept), edgeMi };
}

/**
 * The room the circle's edge needs past the last shown station, as a share of the
 * radius: a marker's radius plus a small gap, against the circle's size in pixels
 * once the map has zoomed to fit it (whole zoom levels, so often smaller than the
 * screen allows). Without a size (map laid out while hidden) a typical value.
 * @param {number} lat
 * @param {number} [edgeMi] - a proposed radius; omitted: estimate from the screen alone
 */
function searchEdgeClearance(lat, edgeMi) {
  const size = map.getSize();
  if (size.x <= SEARCH_FIT_PAD_X || size.y <= SEARCH_FIT_PAD_Y) return 0.1;
  const markerPx = window.matchMedia('(pointer: coarse), (max-width: 640px)').matches ? 17 : 14;
  let radiusPx;
  if (edgeMi) {
    const r = edgeMi * METRES_PER_MILE;
    const zoom = Math.min(SEARCH_FIT_MAX_ZOOM, map.getBoundsZoom(
      L.latLng(lat, 0).toBounds(r * SEARCH_FIT_BOX), false, L.point(SEARCH_FIT_PAD_X, SEARCH_FIT_PAD_Y)));
    radiusPx = r / (40075016.686 * Math.cos(lat * Math.PI / 180) / (256 * Math.pow(2, zoom)));
  } else {
    radiusPx = Math.min(size.x - SEARCH_FIT_PAD_X, size.y - SEARCH_FIT_PAD_Y) / SEARCH_FIT_BOX;
  }
  return radiusPx > 0 ? Math.min(0.4, (markerPx + 5) / radiusPx) : 0.1;
}

// Above the alert areas (overlay pane, 400) so the dimming covers them evenly,
// below the station markers (600). Its own SVG renderer lives in this pane.
// Leaflet only redraws it when a move ends, so it covers half a screen past each
// edge (not the default 10%): the dimming doesn't stop short while dragging.
map.createPane('searchRadius').style.zIndex = 410;
const searchRadiusRenderer = L.svg({ pane: 'searchRadius', padding: 0.5 });
const searchRadiusLayer = L.layerGroup().addTo(map);
/** The circle on screen: { lat, r (metres), rim, rings[], mask, label } or null. */
let searchRadius = null;

/**
 * Draw the circle around the shown stations and fit it on screen: a crisp rim,
 * a soft glow and a slowly turning dotted ring just OUTSIDE it, and the map
 * outside the circle dimmed. Grows out from the point unless motion is reduced.
 * (plotStations has already cleared the previous circle, via clearStations.)
 * @param {number} [minZoom] - never zoom out past this (see fitSearchRadius)
 * @returns {{west:number,south:number,east:number,north:number}} the circle's box
 */
function drawSearchRadius(lat, lon, miles, count, minZoom) {
  const r = miles * METRES_PER_MILE;
  const ring = opts => L.circle([lat, lon], {
    renderer: searchRadiusRenderer, radius: 0, fill: false, interactive: false, color: '#00d4ff', ...opts
  }).addTo(searchRadiusLayer);
  // Dimmed map outside: a world-sized shape with the circle cut out of it. Added
  // once the map has landed (see startGrow): mid-flight Leaflet only scales the
  // old drawing, so it would visibly shrink towards the centre.
  const mask = L.polygon([SEARCH_MASK_OUTER], {
    renderer: searchRadiusRenderer, stroke: false, fillColor: '#101826', fillOpacity: 0.2, interactive: false
  });
  // Rings `px` screen pixels beyond the rim: three fading glows, then the dotted ring.
  const rings = [
    { px: 4,  layer: ring({ weight: 6,  opacity: 0.30 }) },
    { px: 10, layer: ring({ weight: 8,  opacity: 0.13 }) },
    { px: 18, layer: ring({ weight: 10, opacity: 0.05 }) },
    { px: 30, layer: ring({ weight: 5,  opacity: 0.5, dashArray: '1 13', className: 'search-radius-ticks' }) }
  ];
  const rim = ring({ weight: 2, opacity: 0.95 });
  const shownMi = Math.round(miles);
  const label = L.marker([lat, lon], { interactive: false, keyboard: false, icon: L.divIcon({
    className: '', iconSize: null,
    html: `<span class="search-radius-label"><b>${count}</b> station${count === 1 ? '' : 's'} · within <b>${shownMi} mi</b></span>`
  }) });
  const circle = { lat, r: 0, rim, rings, mask, label };
  searchRadius = circle;
  map.getContainer().classList.add('has-search-radius');

  const bounds = L.latLng(lat, lon).toBounds(r * SEARCH_FIT_BOX);
  const flying = fitSearchRadius(bounds, lat, lon, minZoom);

  // Grow out from the point — at once when motion is reduced, or when the page is
  // in a background tab (no animation frames run there). While the map is still
  // flying, Leaflet scales the drawing mid-zoom, so the grow waits for it to land
  // (with a fallback in case the flight ends without a "moveend").
  const still = prefersReducedMotion.matches || document.hidden;
  const ease = t => 1 - Math.pow(1 - t, 3);
  let started = false;
  const startGrow = () => {
    if (started || searchRadius !== circle) return;
    started = true;
    mask.addTo(searchRadiusLayer).bringToBack();   // under the rings and rim
    const start = performance.now(), duration = still ? 0 : 900;
    (function grow(now) {
      if (searchRadius !== circle) return;     // a newer search replaced it
      const t = duration ? Math.min(1, (now - start) / duration) : 1;
      circle.r = r * ease(t);
      layoutSearchRadius();
      if (t < 1) { requestAnimationFrame(grow); return; }
      label.addTo(searchRadiusLayer);
      layoutSearchRadius();
    })(start);
  };
  if (flying && !still) {
    map.once('moveend', startGrow);
    // (Not while the page is hidden: the flight pauses then, and resumes — and
    // ends with "moveend" — once the page is shown again.)
    setTimeout(() => { if (!document.hidden) startGrow(); }, 2000);
  } else {
    startGrow();
  }

  // The alert loader looks at the circle's own box, not the wider fit box above:
  // that one's corners reach 1.5 radii out, into the dimmed area and margins.
  const area = L.latLng(lat, lon).toBounds(2 * r);
  return { west: area.getWest(), south: area.getSouth(), east: area.getEast(), north: area.getNorth() };
}

/**
 * Fit the circle (and the label and rings outside it) on screen. A map with no
 * size (laid out while hidden) can't be fitted — flyToBounds would divide by
 * zero — and one smaller than the padding (a landscape phone with its keyboard
 * up) would get a nonsense zoom, so either is simply centred at a typical zoom.
 * The fit never zooms OUT past `minZoom`, the zoom the user had: when they are
 * already closer in (Locate Me while zoomed in on a street), the map keeps that
 * zoom and just centres on the point, even if the circle then runs off screen.
 * @param {number} [minZoom=0]
 * @returns {boolean} true when the map is now flying (animating) to the circle
 */
function fitSearchRadius(bounds, lat, lon, minZoom = 0) {
  const size = map.getSize();
  if (size.x <= SEARCH_FIT_PAD_X || size.y <= SEARCH_FIT_PAD_Y) {
    map.setView([lat, lon], Math.max(8, minZoom));
    return false;
  }
  const fitZoom = Math.min(SEARCH_FIT_MAX_ZOOM,
    map.getBoundsZoom(bounds, false, L.point(SEARCH_FIT_PAD_X, SEARCH_FIT_PAD_Y)));
  if (minZoom >= fitZoom) { map.setView([lat, lon], minZoom); return false; }
  // Room for the label above the circle and a margin elsewhere.
  const options = { paddingTopLeft: [SEARCH_FIT_EDGE, SEARCH_FIT_TOP],
                    paddingBottomRight: [SEARCH_FIT_EDGE, SEARCH_FIT_EDGE], maxZoom: SEARCH_FIT_MAX_ZOOM };
  // Reduced motion: no animation at all (a same-zoom fit would still glide).
  if (prefersReducedMotion.matches) { map.fitBounds(bounds, { ...options, animate: false }); return false; }
  map.flyToBounds(bounds, { ...options, duration: 1.2 });
  return true;
}

/**
 * Lay the circle out for the current zoom: the outside rings a fixed number of
 * SCREEN pixels beyond the rim (so they look the same at every zoom), the circle
 * cut out of the dimming, and the label above the top of the rim.
 */
function layoutSearchRadius() {
  const c = searchRadius;
  if (!c) return;
  const metresPerPixel = 40075016.686 * Math.cos(c.lat * Math.PI / 180) / (256 * Math.pow(2, map.getZoom()));
  c.rim.setRadius(c.r);
  c.rings.forEach(g => g.layer.setRadius(c.r ? c.r + g.px * metresPerPixel : 0));

  // The hole follows Leaflet's own drawing of the rim (an ellipse on screen), so
  // the edge of the dimming lines up exactly with the line.
  const p = c.rim._point, rx = c.rim._radius, ry = c.rim._radiusY || rx;
  if (!c.r || !p || !rx) { c.mask.setLatLngs([SEARCH_MASK_OUTER]); return; }
  const hole = [];
  for (let i = 0; i < 128; i++) {
    const a = (i / 128) * 2 * Math.PI;
    hole.push(map.layerPointToLatLng(L.point(p.x + rx * Math.cos(a), p.y + ry * Math.sin(a))));
  }
  c.mask.setLatLngs([SEARCH_MASK_OUTER, hole]);
  c.label.setLatLng(map.layerPointToLatLng(L.point(p.x, p.y - ry)));
}
map.on('zoomend', layoutSearchRadius);

/** Remove the circle (clearStations runs this when a new search starts). */
function clearSearchRadius() {
  searchRadius = null;
  searchRadiusLayer.clearLayers();
  map.getContainer().classList.remove('has-search-radius');
}

/* ─────────────────────────────────────────────────────────────────────────────
   14. POST-GEOCODE PIPELINE
   ─────────────────────────────────────────────────────────────────────────────
   All geocoding paths (ZIP, address, coords, geolocation, dropped pin) converge
   here.  Fetches the nearest stations, plots them, and resets popup state.
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Pan the map to (lat, lon), fetch nearby NOAA stations, and plot them.
 * Resets any open popup and active marker.
 *
 * @param {number} lat
 * @param {number} lon
 * @param {number} gen - the search generation allocated by the caller
 * @returns {Promise<boolean>} true once stations are plotted; false when a newer
 *          area replaced this one (failures throw)
 */
async function loadStationsAt(lat, lon, gen) {
  // Every caller allocates its search generation before its first await and
  // passes it in; the status bar and overlay belong to the newest search. The
  // map itself belongs to the newest AREA (see areaGeneration).
  const area = ++areaGeneration;

  // Drop any alerts from the previous area so a stale banner isn't shown for the
  // new location while its stations and alerts are being fetched.
  clearAlerts();

  // Invalidate the old station panel immediately. Its request must not repaint
  // while the new location is still waiting on the station feed.
  popupPanel.style.display = 'none';
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  stationOpenGeneration++;
  activeStationId = null;
  if (activeMarkerEl) { activeMarkerEl.classList.remove('active'); activeMarkerEl = null; }
  // Remove the old area's markers now too: the map is about to fly away, so they
  // must not linger (or stay clickable and open a stale panel) during the fetch,
  // nor be left behind next to the new location if the station fetch fails.
  clearStations();
  clearAlertFocus();   // an area picked out from the alert list goes too
  // The circle is redrawn once the stations are in: keep its RADIUS switch in
  // place meanwhile rather than letting it blink out. plotStations settles it
  // (shown with the new circle, hidden if no station is found); so does a failure.
  map.getContainer().classList.add('has-search-radius');

  setStatus('loading', 'FETCHING STATIONS…');
  overlayText.textContent = 'Fetching weather stations…';
  // Zoom 8 is about the size of a typical search circle; once the stations are
  // in, the map fits the actual circle (plotStations → drawSearchRadius). Neither
  // zooms OUT: a closer zoom the user already chose is kept, and the map only
  // moves there (Locate Me while zoomed in on a street stays zoomed in).
  const userZoom = map.getZoom();
  moveMapTo(lat, lon, Math.max(8, userZoom));

  let data;
  areaLoading = { status: 'FETCHING STATIONS…', overlay: 'Fetching weather stations…' };
  try {
    data = await fetchStations(lat, lon);
  } catch (err) {
    if (area === areaGeneration) {
      areaLoading = null;
      map.getContainer().classList.remove('has-search-radius');   // no circle is coming
      clearForecastPoint();   // …and no area for FORECAST to describe
    }
    // This area's own failure. Its caller reports it only while its search is
    // the newest; if a newer search has meanwhile failed before reaching the map,
    // this is still the area on screen, so explain why it stayed empty here.
    if (gen !== searchGeneration && area === areaGeneration && mayUpdateSearchUi(gen)) {
      reportSearchError(err.message || 'Something went wrong');
    }
    throw err;
  }
  if (area !== areaGeneration) return false;     // a newer area replaced this one
  areaLoading = null;
  const radiusBox = plotStations(data, lat, lon, userZoom);
  setForecastPoint(lat, lon);   // FORECAST now describes this area
  liveSearchLanded();           // live alerts waiting for the opening search can load

  // A newer search still running owns the status bar and overlay; leave them.
  if (mayUpdateSearchUi(gen)) {
    settledSearch = searchGeneration;
    setStatus('ok', stationCountLabel());
    hideOverlay();
  }

  // Fetch and display any active dangerous-weather alerts for this area, then keep
  // them refreshed on a timer.  Fire-and-forget: alerts are supplementary and must
  // never delay or block the station map. A stale result is discarded internally.
  // Nearby warning polygons are picked from the area the circle covers.
  loadAlertsForArea(lat, lon, radiusBox);
  return true;
}

/* ─────────────────────────────────────────────────────────────────────────────
   14B. DANGEROUS-WEATHER ALERTS  (NWS watches / warnings / advisories)
   ─────────────────────────────────────────────────────────────────────────────
   Alerts are area-based, not station-based: the NWS issues them for polygons or
   county/forecast zones, never for individual observation stations.  So they are
   anchored to the searched point and its search circle's area, displayed three ways:

     • Tier 1 — a banner listing alerts affecting the point plus nearby inline
       polygons inside that area, colour-coded and ranked by
       severity (renderAlertBanner).
     • Tier 2 — each alert's geographic footprint drawn on the map as a coloured
       polygon with a label and detail popup (renderAlertAreas).
     • Tier 3 — a pulsing red ring on any station marker that falls inside an
       active warning POLYGON, since storm-based warnings can cover only part of
       a city and so apply to some stations but not others (flagStationsInAlerts).
   ───────────────────────────────────────────────────────────────────────────── */

/** Coordinates of the most recent search — the location the alerts belong to. */
let currentLat  = null;
let currentLon  = null;
/* Map area used to pick nearby regional polygons. Fixed when the area loads, so
   later window resizes can't add or drop alerts (which would reset the banner). */
let currentViewport = null;
/** setInterval handle for the alert refresh loop, or null when no loop is active. */
let alertsTimer = null;
/** Cached banner element (lives above the script, so it always resolves). */
const alertBanner = document.getElementById('alert-banner');

/* ── Alert AREA overlay state (map polygons) ──────────────────────────────────
   alertAreaGroup holds every alert polygon currently drawn on the map.
   alertAreaSeq guards late, asynchronous zone-geometry draws so a result from an
   earlier render can never paint onto a newer one.
   zoneGeomCache memoises the separate NWS zone-geometry lookups used to outline
   zone-only alerts that arrive without an inline polygon. */
const alertAreaGroup = L.layerGroup().addTo(map);
const alertAreaLayers = [];          // rendered layers plus metadata used for deterministic stacking
// A single alert may contain several rendered paths. Map each SVG element to its
// owning GeoJSON layer so every piece of that logical alert shares toggle state.
const alertAreaOwners = new WeakMap();
let activeAlertAreaOwner = null;
// A partial zone lookup is retried even when the NWS alert ids have not changed.
let alertAreasNeedRetry = false;
let   alertAreaSeq   = 0;
const zoneGeomCache  = new Map();   // zone URL → in-flight/resolved geometry Promise
const ZONE_GEOM_CACHE_LIMIT = 200;
const ZONE_FETCH_CONCURRENCY = 6;
const zoneFetchQueue = [];
let zoneFetchActive = 0;

/**
 * The element of the alert popup that is open right now, or null. Tracked via
 * popupopen/popupclose rather than a DOM query: Leaflet leaves a closed popup in
 * the page for its 200 ms fade-out, which a query would still report as open.
 * @returns {HTMLElement|null}
 */
function openAlertPopupElement() {
  // A live-alert area's popup (14C) follows the same click-away and Escape rules.
  return activeAlertAreaOwner?.getPopup?.()?.getElement?.() ||
         (livePopup?.isOpen() ? livePopup.getElement() : null);
}

/**
 * Apply the alert-popup click contract before Leaflet handles the click:
 * - the active area toggles closed and consumes the event;
 * - a different area continues to Leaflet so it replaces and repositions the popup;
 * - every other outside click closes the popup normally.
 */
function handleAlertPopupClickAway(event) {
  // Browsers fire a click when a mouse drag (map pan) ends; Leaflet ignores it,
  // and so must we, or panning the map would close the popup. Leaflet's "moved"
  // flag only resets on the next press ON the map, so also require that this
  // click's press started there, and never skip keyboard clicks (detail 0).
  if (event.detail && pressStartedInMap && map.dragging?.moved()) return;
  const popup = openAlertPopupElement();
  if (!popup) return;
  const target = event.target;
  if (popup.contains(target)) return;

  const clickedAlertArea = target?.closest?.('.wx-alert-area');
  const clickedAlertOwner = clickedAlertArea ? alertAreaOwners.get(clickedAlertArea) : null;
  if (clickedAlertArea && clickedAlertOwner !== activeAlertAreaOwner) {
    return; // Leaflet closes the previous popup and opens this area's at the click.
  }

  // A click on the live-alert canvas (14C) that closes its popup: remember it, so
  // if it landed on that same alert its own click handler, which runs next, leaves
  // the popup closed (a toggle, like the areas above) instead of reopening it.
  if (livePopup?.isOpen()) liveClosingClick = { event, capId: livePopupCapId };
  map.closePopup();
  if (clickedAlertArea) event.stopPropagation();
}

/** Close an alert popup on Escape even when keyboard focus is outside the map. */
function handleAlertPopupEscape(event) {
  if (event.defaultPrevented) return;   // already used (e.g. it closed the station panel)
  if (event.key === 'Escape' && openAlertPopupElement()) {
    map.closePopup();
    event.preventDefault();   // consumed: other Escape handlers (pin mode) skip it
  }
}

/**
 * Before an alert area's popup opens (capture phase, so ahead of Leaflet), widen
 * its auto-pan padding so the popup also clears the alert banner (top) and an
 * open station panel (desktop: right; phone sheet: bottom). Leaflet only knows
 * the map's own edges, and both of those float above its popup layer.
 */
function prepareAlertPopupPan(event) {
  const area = event.target?.closest?.('.wx-alert-area');
  const popup = area ? alertAreaOwners.get(area)?.getPopup?.() : null;
  if (!popup) return;
  fitAlertPopup(popup.options, event.clientX, event.clientY);
}

/**
 * Size an alert popup for a click at (clientX, clientY) and set its auto-pan
 * padding so it clears the alert banner and an open station panel (shared by the
 * searched area's popups and the live-alert popups, 14C).
 * @param {Object} options - the popup's options (changed in place)
 */
function fitAlertPopup(options, clientX, clientY) {
  const mapBox = document.getElementById('map').getBoundingClientRect();

  // Fit the popup to narrow phones: the content (up to 320px) plus its margins,
  // the wrapper and the 44px × must stay inside the map, or the × is off-screen.
  const width = Math.max(160, Math.min(320, mapBox.width - 104));
  options.maxWidth = width;
  // The popup opens centred above the tap point; these bound its likely footprint
  // (height: the 360px content cap plus margins, frame, tip and offset).
  const halfWidth = width / 2 + 40, height = 440;

  // Never ask for more than half the map, or the popup would have nowhere to go.
  const clampY = v => Math.max(16, Math.min(v, mapBox.height / 2));
  const clampX = v => Math.max(16, Math.min(v, mapBox.width / 2));
  let top = 16, right = 16, bottom = 16;
  if (popupPanel.style.display === 'block') {
    const panel = popupPanel.getBoundingClientRect();
    if (getComputedStyle(popupPanel).position === 'fixed') {   // phone bottom sheet
      bottom = clampY(mapBox.bottom - panel.top + 8);
    } else if (clientY - height < panel.bottom) {         // desktop side panel
      right = clampX(mapBox.right - panel.left + 8);
    }
  }
  if (alertBanner.classList.contains('visible')) {
    const banner = alertBanner.getBoundingClientRect();
    // Only when the popup could reach the banner sideways (on desktop the banner
    // is a 330px column), so a click elsewhere doesn't pan the map for nothing.
    // Where it ends up counts: a popup sticking out on the right is pushed left
    // by Leaflet's own auto-pan, possibly into the banner's column.
    const popupLeft = Math.min(clientX - halfWidth, mapBox.right - right - 2 * halfWidth);
    if (popupLeft < banner.right) top = clampY(banner.bottom - mapBox.top + 8);
  }
  options.autoPanPaddingTopLeft = [16, top];
  options.autoPanPaddingBottomRight = [right, bottom];
  // Leave room for the popup's own frame and tip in what remains, so on short
  // screens its content scrolls instead of being cut off at the map's edge.
  options.maxHeight = Math.max(120, mapBox.height - top - bottom - 60);
}

document.addEventListener('click', prepareAlertPopupPan, { capture: true });
/** Whether the most recent pointer press started on the map (see the click-away guard). */
let pressStartedInMap = false;
document.addEventListener('pointerdown', e => {
  pressStartedInMap = map.getContainer().contains(e.target);
}, { capture: true });
document.addEventListener('click', handleAlertPopupClickAway, { capture: true });
document.addEventListener('keydown', handleAlertPopupEscape);

/* Signature of the alert set currently on screen. The 2-minute refresh loop
   compares against this and skips re-rendering when nothing has changed — so the
   user's banner state (collapsed/expanded, which card is open) and any open map
   area popup survive the tick instead of being reset every two minutes. */
let lastAlertSignature = null;
/** The alert set currently drawn — used to drop lapsed alerts during a feed outage. */
let shownAlerts = [];
/* Identity of the area load whose alerts may still be drawn. clearAlerts() (a new
   area replacing the stations on screen) and every new load replace it. */
let alertLoadToken = null;

/**
 * Build a stable signature of an alert set from its ids. The NWS assigns a fresh
 * id whenever an alert is issued, updated, or replaced, so a matching id set means
 * the displayed alerts are genuinely unchanged.
 * @param   {Object[]} features
 * @returns {string}
 */
function alertsSignature(features) {
  return (features || [])
    .map(f => f.id || f.properties?.id || `${f.properties?.event}@${f.properties?.expires}`)
    .sort()
    .join('|');
}

/**
 * Classify an alert into one of four visual severity buckets used for colour and
 * sort order.  Driven by the NWS `event` name first (so the two life-threatening
 * warnings always stand out) then the `severity` rating.
 *
 * @param   {Object} props - alert Feature `properties`
 * @returns {'crit'|'warn'|'watch'|'info'}
 */
function alertClass(props) {
  const event = (props.event || '').toLowerCase();
  const sev   = props.severity || '';
  // Life-threatening, act-now products get the loudest (red) treatment.
  if (event.includes('tornado warning') || event.includes('flash flood warning')) return 'crit';
  if (event.includes('warning')) return 'warn';
  // Watches mean "conditions are favourable, be prepared" → amber. Checked before
  // the severity fallback because the NWS rates e.g. Tornado Watch "Extreme" —
  // otherwise a watch would outrank (and recolour like) an issued warning.
  if (event.includes('watch')) return 'watch';
  // Any other Extreme/Severe-rated product → warning level (orange).
  if (sev === 'Extreme' || sev === 'Severe') return 'warn';
  // Advisories, special statements, everything else → informational (yellow).
  return 'info';
}

/* Sort keys: class first (crit→info), then NWS severity, urgency, certainty, and expiry. */
const ALERT_CLASS_RANK = { crit: 0, warn: 1, watch: 2, info: 3 };
const ALERT_SEV_WEIGHT = { Extreme: 0, Severe: 1, Moderate: 2, Minor: 3, Unknown: 4 };
const ALERT_URGENCY_WEIGHT = { Immediate: 0, Expected: 1, Future: 2, Past: 3, Unknown: 4 };
const ALERT_CERTAINTY_WEIGHT = { Observed: 0, Likely: 1, Possible: 2, Unlikely: 3, Unknown: 4 };

/** Compare two alert property objects from most to least dangerous. */
function compareAlertDanger(a, b) {
  const classA = ALERT_CLASS_RANK[alertClass(a)] ?? 9;
  const classB = ALERT_CLASS_RANK[alertClass(b)] ?? 9;
  if (classA !== classB) return classA - classB;

  const severityA = ALERT_SEV_WEIGHT[a.severity] ?? 9;
  const severityB = ALERT_SEV_WEIGHT[b.severity] ?? 9;
  if (severityA !== severityB) return severityA - severityB;

  const urgencyA = ALERT_URGENCY_WEIGHT[a.urgency] ?? 9;
  const urgencyB = ALERT_URGENCY_WEIGHT[b.urgency] ?? 9;
  if (urgencyA !== urgencyB) return urgencyA - urgencyB;

  const certaintyA = ALERT_CERTAINTY_WEIGHT[a.certainty] ?? 9;
  const certaintyB = ALERT_CERTAINTY_WEIGHT[b.certainty] ?? 9;
  return certaintyA - certaintyB;
}

/**
 * Order alerts most-dangerous-first so the banner leads with what matters.
 * @param   {Object[]} features
 * @returns {Object[]} a sorted copy (input is not mutated)
 */
function sortAlerts(features) {
  return features.slice().sort((a, b) => {
    const pa = a.properties || {}, pb = b.properties || {};
    const dangerOrder = compareAlertDanger(pa, pb);
    if (dangerOrder !== 0) return dangerOrder;
    // Tie-break on when the hazard itself ends (`ends`); `expires` is only when
    // this copy of the message lapses, often hours earlier for long events.
    return new Date(pa.ends || pa.expires || 0) - new Date(pb.ends || pb.expires || 0);
  });
}

/**
 * Escape a string for safe interpolation into innerHTML.  Alert descriptions are
 * long free-text fields from an external feed, so they are always escaped.
 * @param   {*} s
 * @returns {string}
 */
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/**
 * Re-flow NWS alert text for display.  NWS products are hard-wrapped at about
 * 69 characters, so a single newline is only a line wrap in the middle of a
 * sentence and becomes a space.  Blank lines are real paragraph breaks and are
 * kept, as is the line break in front of a "* " or "- " bullet item.  A paragraph
 * that is only "&&" (the NWS end-of-section marker) is dropped.
 * @param   {string} text - raw `description` or `instruction` from the feed
 * @returns {string} text with paragraphs separated by one blank line
 */
function unwrapAlertText(text) {
  return String(text || '')
    .replace(/\r\n?/g, '\n')                          // normalise Windows/old-Mac line endings
    .split(/\n[ \t]*\n+/)                             // split into paragraphs at blank lines
    .map(para => para.trim().replace(/\n(?![ \t]*[*-] )[ \t]*/g, ' '))   // join wrapped lines
    .filter(para => para && para !== '&&')            // drop NWS "&&" section-end markers
    .join('\n\n');
}

/* The banner opens expanded until the user collapses it; from then on it stays
   collapsed through refreshes, new searches and reloads (no list springing open
   at every pin drop) until they expand it again. */
const ALERT_BANNER_COLLAPSED_KEY = 'wxmap_alerts_collapsed';
let alertBannerCollapsed = false;
try { alertBannerCollapsed = localStorage.getItem(ALERT_BANNER_COLLAPSED_KEY) === '1'; } catch (_) { /* storage blocked */ }

/**
 * Tier 1 — render the alert banner from a list of alert Features.
 * Hides the banner entirely when there are no active alerts.
 * @param {Object[]} features - GeoJSON alert Features from fetchAlerts(), or the
 *        live alerts in view (14C), whose cards carry `detailsUrl` instead of text
 * @param {boolean} [inView] - the list is "alerts in view" (live mode), not the searched area's
 */
function renderAlertBanner(features, inView = false) {
  const sorted = sortAlerts(features || []);

  // No active alerts → clear and hide the banner, then bail.
  if (sorted.length === 0) {
    alertBanner.className = '';
    alertBanner.innerHTML = '';
    return;
  }

  const top      = sorted[0].properties || {};
  const topClass = alertClass(top);
  const plural   = sorted.length === 1 ? '' : 's';

  // Collapsible summary chip: alert count + the single most severe event name.
  const summary = `
    <button class="alert-summary alert-${topClass}" type="button"
            data-role="toggle" aria-expanded="${!alertBannerCollapsed}">
      <span class="alert-summary-icon" aria-hidden="true">⚠️</span>
      <span class="alert-summary-text">${sorted.length} alert${plural}${inView ? ' in view' : ''} · ${escapeHtml(top.event || 'Weather alert')}</span>
      <span class="alert-summary-caret" aria-hidden="true">▾</span>
    </button>`;

  // Alerts of one type ("Extreme Heat Warning" for eight counties) fold into one
  // group row, so a long run of them can't push the other types out of sight. A
  // type with a single alert is a plain card. Groups keep the danger order.
  const groups = new Map();   // event → features, in sorted order
  for (const f of sorted) {
    const event = f.properties?.event || 'Weather alert';
    if (!groups.has(event)) groups.set(event, []);
    groups.get(event).push(f);
  }
  const rows = [...groups].map(([event, members]) =>
    (members.length === 1 ? alertCardHtml(members[0]) : alertGroupHtml(event, members))).join('');

  // Rebuilding replaces every button: remember what was open, where the list was
  // scrolled and which control had keyboard focus, and put them back.
  const scrollTop = alertBanner.scrollTop;
  const focusKey = alertBannerFocusKey();

  // Expanded on arrival so alerts are seen — unless the user has collapsed it.
  alertBanner.className = alertBannerCollapsed ? 'visible' : 'visible expanded';
  alertBanner.innerHTML = summary + '<div class="alert-list">' + rows + '</div>' +
    '<div class="alert-more" aria-hidden="true">▾ More alerts below</div>';
  alertBanner.scrollTop = scrollTop;
  if (focusKey !== null) restoreAlertBannerFocus(focusKey);
  updateAlertScrollHint();
}

/** "from … until …" for an alert, as HTML (each part stays on one line). */
function alertWhenHtml(p) {
  // Show when the hazard ends (see alertEndText). A future start is shown too, so
  // an upcoming alert doesn't read as already in force.
  const startsLater = p.onset && Date.parse(p.onset) > Date.now();
  return [startsLater && `from ${formatWhen(p.onset)}`, alertEndText(p)]
    .filter(Boolean).map(s => '<span class="alert-when">' + escapeHtml(s) + '</span>').join(' ');
}

/**
 * The first few places an alert (or a group) covers, for its header line:
 * "Pima · Pinal · Maricopa +5 more". NWS lists them in `areaDesc`, "; "-separated.
 * @param {string[]} areaDescs
 * @returns {string} plain text ('' when none are known)
 */
function alertPlacesText(areaDescs, max = 3) {
  const places = [...new Set(areaDescs.flatMap(a => String(a || '').split(';'))
    .map(s => s.trim()).filter(Boolean))];
  if (!places.length) return '';
  const more = places.length - max;
  return places.slice(0, max).join(' · ') + (more > 0 ? ` +${more} more` : '');
}

/** An alert's id: the NWS id ("urn:oid:…"), which live alerts share as `cap_id`. */
function alertId(f) {
  return f.properties?.id || f.id || '';
}

/** An alert's places (`areaDesc`): from the feed, or from its NWS record once loaded. */
function alertAreaDesc(f) {
  return f.properties?.areaDesc || alertRecordCache.get(alertId(f))?.areaDesc || '';
}

/**
 * With live alerts on, a swatch of the alert's colour on the map (and in its key):
 * the banner ranks alerts by severity (red, orange, yellow), the map uses the
 * NWS's own hazard colours, and the swatch ties the two together. ('' otherwise:
 * the searched area's own shapes each get a colour of their own.)
 */
function alertSwatchHtml(event) {
  return liveAlertsOn && event
    ? '<span class="alert-swatch" aria-hidden="true" style="background:' + liveAlertColor(event) + '"></span>' : '';
}

/** One alert's card: header (event, times, places) and the body it opens to. */
function alertCardHtml(f) {
  const p   = f.properties || {};
  const id  = alertId(f);
  const cls = alertClass(p);
  const record = alertRecordCache.get(id);
  // Unwrap each part separately so the NWS hard line wraps don't split sentences.
  let detail = [p.description, p.instruction].map(unwrapAlertText).filter(Boolean).join('\n\n');
  let headline = p.headline;
  if (!detail && record) { detail = record.detail; headline = record.headline; }
  // A live alert has no text yet: its card fetches the NWS record when opened.
  // (A record that came with no text is loaded all the same: nothing to wait for.)
  const lazy     = !detail && !record && p.detailsUrl;
  const bodyAttr = lazy ? ' data-details-url="' + escapeHtml(p.detailsUrl) + '"' : '';
  // (After a failed lookup with none on its way, say so rather than "Loading…".)
  const descText = !lazy ? detail || (record ? 'No further details were published for this alert.' : '')
    : alertRecordFailedAt.has(id) && !alertRecordPending(id)
      ? 'Couldn\'t load the details — close and reopen the card to try again.'
      : 'Loading the full NWS text…';
  const areaDesc = alertAreaDesc(f);
  const places   = alertPlacesText([areaDesc]);
  const open     = openAlertCards.has(id);
  return '<div class="alert-card alert-' + cls + (open ? ' open' : '') + '" data-alert-id="' + escapeHtml(id) + '">' +
      '<button class="alert-card-head" type="button" data-role="card" aria-expanded="' + open + '">' +
        '<span class="alert-event">' + alertSwatchHtml(p.event) + escapeHtml(p.event || 'Weather alert') + '</span>' +
        '<span class="alert-expires">' + alertWhenHtml(p) + '</span>' +
        (places ? '<span class="alert-places">' + escapeHtml(places) + '</span>'
                : (alertRecordPending(id) ? '<span class="alert-places">Finding the places…</span>' : '')) +
      '</button>' +
      '<div class="alert-card-body"' + bodyAttr + '>' +
        // First thing in the opened card (above the long NWS text): zoom to this
        // alert's own area — this county or zone, not its whole group.
        '<button class="alert-zoom" type="button" data-role="zoom">📍 Show this area on the map</button>' +
        (areaDesc ? '<p class="alert-areas"><b>Areas:</b> ' + escapeHtml(areaDesc) + '</p>' : '') +
        (headline ? '<p class="alert-headline">' + escapeHtml(headline) + '</p>' : '') +
        '<p class="alert-desc">' + escapeHtml(descText) + '</p>' +
      '</div>' +
    '</div>';
}

/** A group of same-type alerts: one row with the count and places, opening to their cards. */
function alertGroupHtml(event, members) {
  const cls   = alertClass(members[0].properties || {});
  const open  = openAlertGroups.has(event);
  // One time for the group when they all share it (the usual case: one product
  // issued for many zones), otherwise say they differ.
  const whens = [...new Set(members.map(f => alertWhenHtml(f.properties || {})))];
  const when  = whens.length === 1 ? whens[0] : '<span class="alert-when">at different times</span>';
  const places = alertPlacesText(members.map(alertAreaDesc));
  const placesHtml = places ? '<span class="alert-places">' + escapeHtml(places) + '</span>'
    : (members.some(f => alertRecordPending(alertId(f))) ? '<span class="alert-places">Finding the places…</span>' : '');
  return '<div class="alert-group alert-' + cls + (open ? ' open' : '') + '" data-group="' + escapeHtml(event) + '">' +
      '<button class="alert-group-head" type="button" data-role="group" aria-expanded="' + open + '">' +
        // Name and count stay on one line; screen readers hear "8 alerts", not "times 8".
        '<span class="alert-group-title"><span class="alert-event">' + alertSwatchHtml(event) + escapeHtml(event) + '</span>' +
        '<span class="alert-group-count"><span aria-hidden="true">×' + members.length + '</span>' +
        '<span class="sr-only">' + members.length + ' alerts</span></span></span>' +
        '<span class="alert-expires">' + when + '</span>' +
        placesHtml +
      '</button>' +
      '<div class="alert-group-body">' + members.map(alertCardHtml).join('') + '</div>' +
    '</div>';
}

/** Which banner control has keyboard focus, as "role|alert id|group" — or null. */
function alertBannerFocusKey() {
  const el = document.activeElement;
  if (!el || !alertBanner.contains(el)) return null;
  return [el.dataset?.role || '', el.closest('[data-alert-id]')?.dataset.alertId || '',
          el.closest('[data-group]')?.dataset.group || ''].join('|');
}

/** Put focus back on the same control after a rebuild (else on the summary chip). */
function restoreAlertBannerFocus(key) {
  const [role, id, group] = key.split('|');
  const match = [...alertBanner.querySelectorAll('[data-role]')].find(el =>
    el.dataset.role === role &&
    (el.closest('[data-alert-id]')?.dataset.alertId || '') === id &&
    (el.closest('[data-group]')?.dataset.group || '') === group);
  (match || alertBanner.querySelector('[data-role="toggle"]'))?.focus();
}

/**
 * The banner scrolls when its list is longer than the room it has: show the
 * "▾ More alerts below" bar at its bottom edge while there is more to scroll to.
 */
function updateAlertScrollHint() {
  const more = alertBanner.scrollHeight - alertBanner.clientHeight - alertBanner.scrollTop > 8;
  alertBanner.classList.toggle('has-more', more && alertBanner.classList.contains('expanded'));
}
alertBanner.addEventListener('scroll', updateAlertScrollHint, { passive: true });
window.addEventListener('resize', updateAlertScrollHint);

/* What the user opened in the banner: kept across rebuilds (refreshes, panning). */
const openAlertGroups = new Set();   // event names
const openAlertCards  = new Set();   // alert ids
const OPEN_ALERT_CARDS_LIMIT = 50;

/** Remember an opened card; the oldest is forgotten past OPEN_ALERT_CARDS_LIMIT. */
function rememberOpenAlertCard(id) {
  openAlertCards.delete(id);   // (re)insert as the newest
  openAlertCards.add(id);
  while (openAlertCards.size > OPEN_ALERT_CARDS_LIMIT) openAlertCards.delete(openAlertCards.values().next().value);
}

/* Click delegation: toggle the banner, open a group or a card, show on the map. */
alertBanner.addEventListener('click', e => {
  const control = e.target.closest('[data-role]');
  if (e.target.closest('.alert-more')) {   // the "more below" bar scrolls down a page
    alertBanner.scrollBy({ top: alertBanner.clientHeight * 0.8, behavior: prefersReducedMotion.matches ? 'auto' : 'smooth' });
    return;
  }
  if (!control) return;
  const role = control.dataset.role;
  if (role === 'toggle') {
    const expanded = alertBanner.classList.toggle('expanded');
    control.setAttribute('aria-expanded', String(expanded));
    // Remembered: later renders (refreshes, new searches, reloads) keep this.
    alertBannerCollapsed = !expanded;
    try { localStorage.setItem(ALERT_BANNER_COLLAPSED_KEY, expanded ? '0' : '1'); } catch (_) { /* storage blocked */ }
    updateAlertScrollHint();
    if (liveAlertsOn) {
      renderLiveLabels();          // the banner's new size frees or covers map labels
      if (expanded) {
        liveBannerSignature = null;  // redrawn with the lookups now on their way
        renderLiveBanner();
      }
    }
  } else if (role === 'group') {
    const group = control.closest('.alert-group');
    const open = group.classList.toggle('open');
    control.setAttribute('aria-expanded', String(open));
    if (open) openAlertGroups.add(group.dataset.group); else openAlertGroups.delete(group.dataset.group);
    updateAlertScrollHint();
  } else if (role === 'card') {
    const card = control.closest('.alert-card');
