  if (!readout || !tip || index < 0) return;
  // The temperature is "71°F" plus a small "22°C": read as "71°F (22°C)", not run together.
  readout.textContent = [...tip.children].map(el => {
    const celsius = el.querySelector('small');
    return celsius ? el.firstChild.textContent + ' (' + celsius.textContent + ')' : el.textContent;
  }).join(', ');
}

// One set of listeners on the panel serves every week drawn into it.
fcDays.addEventListener('click', e => {
  const tab = e.target.closest('.fc-wk-day');
  if (tab) { selectWeekDay(+tab.dataset.row); return; }
  const chart = e.target.closest('.fc-wk-chart');
  if (!chart || !weekModel) return;
  // The day where the click (or tap) landed, and its hour there: a tap brings no
  // pointermove first.
  const box = chart.getBoundingClientRect();
  const fraction = (e.clientX - box.left) / box.width;
  selectWeekDay(weekRowAt(fraction));
  showWeekHour(weekHourIn(fraction));   // and its numbers (a touch screen has no hover)
});
fcDays.addEventListener('pointermove', e => {
  const chart = e.target.closest('.fc-wk-chart');
  if (!chart || !weekModel) return;
  const box = chart.getBoundingClientRect();
  showWeekHour(weekHourIn((e.clientX - box.left) / box.width));
});
fcDays.addEventListener('pointerout', e => {
  const chart = e.target.closest('.fc-wk-chart');
  // Left the chart (not just moved between its parts), and the keyboard isn't using
  // it (focus from a click doesn't count: the cursor would stick after the pointer left).
  if (chart && !chart.contains(e.relatedTarget) && !chart.matches(':focus-visible')) showWeekHour(-1);
});
fcDays.addEventListener('keydown', e => {
  if (!weekModel) return;
  const tab = e.target.closest('.fc-wk-day');
  if (tab) {   // the days: the usual tab-list keys
    const last = weekModel.rows.length - 1, at = +tab.dataset.row;
    const to = { ArrowRight: Math.min(at + 1, last), ArrowLeft: Math.max(at - 1, 0), Home: 0, End: last }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    selectWeekDay(to, true);
    return;
  }
  if (!e.target.classList.contains('fc-wk-chart') || weekModel.points.length < 2) return;   // (see weekHourAt)
  const last = weekModel.points.length - 1;
  const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 24, PageUp: -24 }[e.key];
  // With no cursor showing (the pointer left), keys start from the picked day.
  const at = weekHour >= 0 ? weekHour : weekFirstHour() - step;
  const to = step !== undefined ? Math.min(Math.max(at + step, 0), last)
    : e.key === 'Home' ? 0 : e.key === 'End' ? last : null;
  if (to != null) {
    e.preventDefault();
    showWeekHour(to);
    readWeekHour(to);
  } else if ((e.key === 'Enter' || e.key === ' ') && weekHour >= 0) {
    e.preventDefault();
    selectWeekDay(weekRowOf(weekModel.points[weekHour]));
  }
});
fcDays.addEventListener('focusin', e => {
  // Keyboard focus only: a click or tap puts the cursor where it landed instead.
  if (!e.target.classList.contains('fc-wk-chart') || !e.target.matches(':focus-visible') ||
      !(weekModel?.points.length >= 2) || weekHour >= 0) return;
  const first = weekFirstHour();
  showWeekHour(first);
  readWeekHour(first);
});

/** The picked day's first hour on the chart (the last hour, for a day past them all). */
function weekFirstHour() {
  const row = weekModel.rows[weekModel.selected];
  const i = weekModel.points.findIndex(h => h.t >= row.start);
  return i < 0 ? weekModel.points.length - 1 : i;
}
fcDays.addEventListener('focusout', e => {
  if (e.target.classList.contains('fc-wk-chart')) showWeekHour(-1);
});

/**
 * A load error as the end of "Couldn't load the forecast: …": lower-case, and
 * without a trailing "please try again" (the Try again button says that).
 * "Request timed out — please try again" → "request timed out".
 */
function forecastErrorReason(error) {
  const reason = String(error?.message || 'no answer')
    .replace(/\s*(?:—\s*please try again|and try again)\.?$/i, '').trim() || 'no answer';
  return reason.charAt(0).toLowerCase() + reason.slice(1);
}

/** Show the 7-day ('days') or hourly ('hours') view. */
function selectForecastTab(tab) {
  const days = tab === 'days';
  fcTabDays.setAttribute('aria-selected', String(days));
  fcTabHours.setAttribute('aria-selected', String(!days));
  fcTabDays.tabIndex = days ? 0 : -1;
  fcTabHours.tabIndex = days ? -1 : 0;
  fcDays.hidden = !days;
  fcHours.hidden = days;
  if (!days) updateHourStripNav(fcHours.querySelector('.fc-strip'));
}

/**
 * The footer's credit for the air quality and pressure, as HTML (" · …"). Open-Meteo's
 * data is free for non-commercial use, credited (CC BY 4.0), and its air-quality
 * data is to be credited to Copernicus's CAMS as well. Each is credited for what is
 * actually shown; what couldn't be had is said to be missing.
 */
function airSourcesHtml(extras) {
  const air = hasAir(extras), pressure = hasPressure(extras);
  const shown = air && pressure ? 'Air quality &amp; pressure' : air ? 'Air quality' : 'Pressure';
  const missing = !air && !pressure ? 'Air quality and pressure are' : !air ? 'Air quality is'
    : !pressure ? 'The pressure forecast is' : '';
  return (air || pressure
    ? ' · ' + shown + ': <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>' +
      (air ? ' (air data: <a href="https://atmosphere.copernicus.eu/" target="_blank" rel="noopener">Copernicus CAMS</a>)' : '')
    : '') + (missing ? ' · ' + missing + ' unavailable right now' : '');
}

/** Open the forecast for the area on the map (or load it again: the Retry button). */
async function openForecast() {
  if (!forecastPoint) {
    // A search that failed behind the open forecast took its area away: say so
    // instead of letting Try again do nothing.
    if (forecastDialog.open) {
      forecastSeq++;   // and ignore the answer still on its way for the old area
      forecastPlace.textContent = '';   // no "Near …" for a place that's gone
      forecastNow.hidden = true;        // …nor its air quality
      forecastFoot.textContent = 'National Weather Service';
      fcDays.innerHTML = fcHours.innerHTML =
        '<p class="fc-empty">There is no area on the map anymore — search for a place first.</p>';
    }
    return;
  }
  const point = forecastPoint;
  const { lat, lon } = point;
  const seq = ++forecastSeq;
  forecastPlace.textContent = `Near ${lat.toFixed(3)}, ${lon.toFixed(3)}`;
  forecastFoot.textContent = 'National Weather Service';
  forecastNow.hidden = true;   // the last place's air doesn't describe this one
  weekModel = null;            // …nor its week
  fcDays.innerHTML = fcHours.innerHTML = '<p class="fc-empty">Loading the forecast…</p>';
  if (!forecastDialog.open) forecastDialog.showModal();
  try {
    const forecast = await fetchAreaForecast(lat, lon);
    if (seq !== forecastSeq || !forecastDialog.open) return;   // closed, or opened again
    if (forecast.place) forecastPlace.textContent = forecast.place;
    const extras = forecast.extras;
    weekModel = forecastWeekModel(forecast.days, forecast.hours, extras, point);
    weekHour = -1;
    // Both the phone list and the wide-screen week: CSS shows the one that fits.
    fcDays.innerHTML = renderForecastDays(forecast.days, extras, point) + renderForecastWeek(weekModel);
    fcHours.innerHTML = renderForecastHours(forecast.hours, Date.now(), extras, point);
    updateHourStripNav(fcHours.querySelector('.fc-strip'));
    if (extras?.aqiNow != null) {
      forecastNow.innerHTML = 'Air quality now: ' + aqiHtml(extras.aqiNow);
      forecastNow.hidden = false;
    }
    forecastFoot.innerHTML = 'National Weather Service' +
      (forecast.updated ? ' · updated ' + escapeHtml(formatWhen(forecast.updated)) : '') +
      airSourcesHtml(extras);
  } catch (error) {
    if (seq !== forecastSeq || !forecastDialog.open) return;
    fcDays.innerHTML = fcHours.innerHTML =
      `<p class="fc-empty">Couldn't load the forecast: ${escapeHtml(forecastErrorReason(error))}.` +
      ' <button type="button" class="fc-retry">Try again</button></p>';
  }
}

forecastBtn.addEventListener('click', openForecast);
document.getElementById('forecast-close').addEventListener('click', () => forecastDialog.close());
fcTabDays.addEventListener('click', () => selectForecastTab('days'));
fcTabHours.addEventListener('click', () => selectForecastTab('hours'));
// Tabs: the arrow keys move between them (the usual tab-list keys).
document.querySelector('.fc-tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const toHours = fcTabDays.getAttribute('aria-selected') === 'true';
  selectForecastTab(toHours ? 'hours' : 'days');
  (toHours ? fcTabHours : fcTabDays).focus();
  e.preventDefault();
});
forecastDialog.addEventListener('click', e => {
  if (e.target === forecastDialog) forecastDialog.close();    // the backdrop (outside the sheet)
  else if (e.target.closest('.fc-retry')) {
    // The button is about to be replaced: keep keyboard focus in the dialog, on the open tab.
    (fcTabDays.getAttribute('aria-selected') === 'true' ? fcTabDays : fcTabHours).focus();
    openForecast();
  }
});
// Esc closes the dialog (the browser does that); it must not also reach the
// page's own Esc handlers (alert popup, pin mode) hidden behind it.
forecastDialog.addEventListener('keydown', e => { if (e.key === 'Escape') e.stopPropagation(); });
// Closing returns focus to FORECAST — unless a failed search hid it meanwhile:
// then focus goes to the search box (the next thing to do) rather than the page
// top. On touch screens to FIND instead: focusing the box would pop up the
// on-screen keyboard nobody asked for.
forecastDialog.addEventListener('close', () => {
  // (Focus is then left on the page or, in Chrome, on the closed dialog's ✕.)
  const stranded = !document.activeElement || document.activeElement === document.body ||
                   forecastDialog.contains(document.activeElement);
  if (!forecastBtn.hidden || !stranded) return;
  (window.matchMedia('(pointer: coarse)').matches ? searchBtn : zipInput).focus();
});

/* ─────────────────────────────────────────────────────────────────────────────
   15. URL QUERY-STRING HELPERS
   ─────────────────────────────────────────────────────────────────────────────
   The app encodes the current search into the URL query string so results can
   be bookmarked and shared.  history.replaceState() updates the address bar
   without triggering a page reload.

   Supported parameters:
     ?lat=…&long=…  → coordinate search
     ?zip=…         → ZIP code search
     ?addr=…        → address search
     ?station=…     → direct station lookup
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Serialise the current search input into the page URL.
 * URLSearchParams performs the required percent-encoding itself. Passing raw
 * values avoids non-standard double encoding and keeps shared URLs interoperable.
 *
 * @param {'coords'|'zip'|'address'} type  - Input type from detectInputType() (never 'badzip')
 * @param {string}                   raw   - Raw search string
 */
function pushQueryParam(type, raw) {
  const params = new URLSearchParams();
  if (type === 'coords') {
    const { lat, lon } = parseCoords(raw);
    // 6 decimals (~0.1 m) via Number(): String(1e-7) would write "1e-7", which the
    // ?lat/?long link reader rejects as invalid coordinates.
    params.set('lat',  String(Number(lat.toFixed(6))));
    params.set('long', String(Number(lon.toFixed(6))));
  } else if (type === 'zip') {
    params.set('zip',  normalizeSearchText(raw));
  } else {
    params.set('addr', raw.trim());
  }
  window.history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
}

/* ─────────────────────────────────────────────────────────────────────────────
   16. MAIN SEARCH DISPATCHER
   ─────────────────────────────────────────────────────────────────────────────
   Reads the search input, classifies it, updates the URL, then dispatches to
   the appropriate geocoding path.
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Primary entry point for user-initiated searches.
 * Called when the FIND button is clicked, Enter is pressed in the input, or an
 * address suggestion is picked.
 *
 * @param {{lat: number, lon: number}} [knownPlace] - Where a picked suggestion
 *        lies, so its address needn't be looked up again
 */
async function doSearch(knownPlace) {
  // The search is under way: a suggestion list still open (or still loading) is stale.
  closeSuggestions();
  const raw = zipInput.value.trim();
  if (!raw) {
    showToast('Please enter a ZIP, coordinates, or address');
    return;
  }

  // A typed search replaces an armed tap/click-to-place, so a later map click
  // (e.g. to close a popup) can't unexpectedly drop a pin over the new results.
  setTapMode(false);

  // Allocate the generation before any geocoding await. Otherwise an older slow
  // address/ZIP lookup can resolve after a newer search and overwrite its intent.
  const gen = ++searchGeneration;
  const type = detectInputType(raw);

  try {
    let place;
    if (type === 'coords') {
      setStatus('loading', 'LOCATING…');
      showOverlay('Parsing coordinates…');
      place = parseCoords(raw);
      const { lat, lon } = place;
      if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180)
        throw new Error('Invalid coordinates — use lat (-90…90), lon (-180…180)');

    } else if (type === 'zip') {
      setStatus('loading', 'LOCATING…');
      showOverlay('Geocoding ZIP code…');
      place = await zipToCoords(normalizeSearchText(raw));   // "(78201)" → "78201"

    } else if (type === 'badzip') {
      // Also catches malformed coordinates ("29.42-98.49").
      throw new Error('Not a valid ZIP code or coordinates — e.g. 78201 or 29.42, -98.49');

    } else if (knownPlace) {
      // A picked suggestion: already located, so straight to its stations (with
      // the same loading overlay as every other search).
      setStatus('loading', 'LOCATING…');
      showOverlay('Fetching weather stations…');
      place = knownPlace;

    } else {
      // Street address — free-form, geocoded by Nominatim and Photon (no API key
      // needed). Results are biased toward the area currently on the map, so
      // "Springfield" picks the one the user is looking at.
      setStatus('loading', 'GEOCODING…');
      showOverlay('Looking up address…');
      // wrap(): after panning onto a neighbouring copy of the world, Leaflet reports
      // longitudes past ±180 (e.g. 261.6), which Photon rejects with HTTP 400.
      const center = map.getCenter().wrap();
      place = await addressToCoords(raw, { lat: center.lat, lon: center.lng });
    }
    if (gen !== searchGeneration) return;

    // A found address gets the search pin, marking the exact spot it was found at.
    // Any other typed search moves away from a dropped pin; leaving it behind would
    // show a stale coordinate label (and dragging it would search the old spot).
    if (type === 'address') showSearchPin(place.lat, place.lon);
    else removeDragPin();

    // Only a search that actually loaded stations becomes the shareable URL, so a
    // typo, unknown ZIP, or spot NOAA doesn't cover can't overwrite a good link.
    if (await loadStationsAt(place.lat, place.lon, gen)) pushQueryParam(type, raw);

  } catch (e) {
    if (gen !== searchGeneration) return;
    reportSearchError(e.message || 'Something went wrong');
  }
}

// Not addEventListener('click', doSearch): the click event would arrive as knownPlace.
searchBtn.addEventListener('click', () => doSearch());
// isComposing: keys that drive an IME composition (e.g. Japanese input) — Enter to
// confirm it, arrows to choose a candidate — belong to the composition, not to the
// search or the suggestion list.
// (Safari ends the composition before this keydown, so check keyCode 229 too.)
zipInput.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (!suggestList.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();   // keep the caret where it is
    moveSuggestionHighlight(e.key === 'ArrowDown' ? 1 : -1);
  } else if (e.key === 'Escape' && (!suggestList.hidden || suggestTimer)) {
    // One Esc closes the list and nothing else — or, before it has appeared,
    // stops the lookup on its way so it never opens.
    e.preventDefault();
    closeSuggestions();
  } else if (e.key === 'Enter' && !e.repeat) {
    // !e.repeat: a held-down Enter must not fire a geocoder request per key repeat
    // (Nominatim allows one request a second).
    if (suggestActive >= 0) pickSuggestion(suggestActive);
    else doSearch();
  }
});

/* ── Address suggestions ─────────────────────────────────────────────────────
   While an address is typed, a list of matching places opens under the search
   bar. They come from Photon, which is built for search-as-you-type (Nominatim's
   usage policy forbids it): one request after a short typing pause, never for a
   ZIP or coordinates, and biased toward the area on the map.
   Photon knows few US house numbers, so the house number typed is left out of the
   request and put back on the matching streets; picking one then looks the house
   up as a normal search (Nominatim first), which finds its exact spot. */
const suggestList = document.getElementById('addr-suggest');
const SUGGEST_DELAY_MS  = 300;   // typing pause before asking
const SUGGEST_MIN_CHARS = 3;     // of the street or place name
const SUGGEST_MAX       = 6;
// Photon's bbox filter (west,south,east,north): the states, Puerto Rico and the
// Virgin Islands. Guam, the Northern Mariana Islands, American Samoa and the far
// western Aleutians lie outside it; a full search (FIND) still finds them.
const SUGGEST_US_BBOX = '-180,15,-64,72';

let suggestTimer   = 0;    // the lookup pending (typing pause, then request); 0 = none
let suggestRequest = 0;    // id of the newest lookup; an older answer is ignored
let suggestions    = [];   // [{ main, sub, text, place }] as listed
let suggestActive  = -1;   // the row highlighted from the keyboard; -1 = none

/**
 * Turn one Photon result into a list entry, or null if it doesn't belong there.
 *
 * @param   {Object} feature     - Photon GeoJSON feature
 * @param   {string} houseNumber - The house number typed ('' if none)
 * @param   {string} query       - The rest of the text, as sent to Photon
 * @returns {{main: string, sub: string, text: string, place: ?{lat: number, lon: number}}|null}
 *          `text` goes into the search field; `place` is null when the house still
 *          has to be looked up (a street with the typed house number)
 */
function suggestionFromFeature(feature, houseNumber, query) {
  const p = feature?.properties || {};
  const [lon, lat] = feature?.geometry?.coordinates || [];
  if (p.countrycode !== 'US' || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  // Bus stops are named after crossings ("N Highland St at 11th St N"): noise here.
  if (p.osm_key === 'public_transport' || (p.osm_key === 'highway' && p.type !== 'street')) return null;

  const isStreet = p.type === 'street';
  const address  = p.housenumber && p.street ? p.housenumber + ' ' + p.street : '';
  // What looked like a house number can be the start of the road's own name
  // ("8 Mile Detroit" → 8 Mile Road, or West 8 Mile Road: a leading direction
  // doesn't count): then this is the road.
  const nameStart = (houseNumber + ' ' + query.split(/\s+/)[0]).toLowerCase();
  const roadName = (p.name || '').toLowerCase().replace(/^(?:north|south|east|west|[nsew])\.?\s+/, '');
  const isNumberedRoad = Boolean(houseNumber && roadName.startsWith(nameStart));
  // Any other street's name is the street itself: give it the house number typed.
  const houseOnStreet = isStreet && p.name && houseNumber && !isNumberedRoad;
  const main = houseOnStreet ? houseNumber + ' ' + p.name : (p.name || address);
  if (!main) return null;
  // Photon's postcode belongs to one stretch of the street, not necessarily to the
  // house typed (6016 Enchantment is 78218; Photon's piece of it says 78244), so
  // it is left off there: never shown as the house's ZIP, nor searched with.
  const postcode = houseOnStreet ? '' : p.postcode;
  const area = [p.type === 'city' ? '' : p.city, [p.state, postcode].filter(Boolean).join(' ')];
  // A named place ("San Antonio Zoo") also shows its street address.
  const sub = [main === address ? '' : address, ...area].filter(Boolean).join(', ');
  return {
    main, sub,
    text: [main, sub].filter(Boolean).join(', '),
    place: houseOnStreet ? null : { lat, lon }
  };
}

/** Ask Photon for places matching `text`; resolves to the list entries (may be empty). */
async function fetchSuggestions(text) {
  const houseNumber = text.match(HOUSE_NUMBER_RE)?.[1] || '';
  const query = text.replace(HOUSE_NUMBER_RE, '').trim();
  if (query.length < SUGGEST_MIN_CHARS) return [];
  const center = map.getCenter().wrap();   // see doSearch: Photon rejects longitudes past ±180
  const url = 'https://photon.komoot.io/api/'
            + '?q=' + encodeURIComponent(query) + '&limit=10&lang=en'
            // Rounded to ~11 km, like the address search: never the exact position.
            + '&lat=' + center.lat.toFixed(1) + '&lon=' + center.lng.toFixed(1)
            + '&bbox=' + SUGGEST_US_BBOX;
  const { response, data } = await fetchJsonWithTimeout(url, {}, 8000);
  if (!response.ok) return [];
  const seen = new Set();
  return (data?.features || [])
    .map(f => suggestionFromFeature(f, houseNumber, query))
    // Photon often lists a street once per piece of road: show it once.
    .filter(s => {
      if (!s || seen.has(s.text)) return false;
      seen.add(s.text);
      return true;
    })
    .slice(0, SUGGEST_MAX);
}

/** Draw the list (or hide it when empty) and keep the combobox ARIA in step. */
function renderSuggestions() {
  suggestList.replaceChildren(...suggestions.map((s, i) => {
    const row = document.createElement('li');
    row.id = 'addr-suggest-' + i;
    row.setAttribute('role', 'option');
    row.setAttribute('aria-selected', String(i === suggestActive));
    row.textContent = s.main;
    if (s.sub) {
      const sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = s.sub;
      row.append(sub);
    }
    return row;
  }));
  suggestList.hidden = !suggestions.length;
  zipInput.setAttribute('aria-expanded', String(suggestions.length > 0));
  if (suggestActive >= 0) {
    zipInput.setAttribute('aria-activedescendant', 'addr-suggest-' + suggestActive);
    suggestList.children[suggestActive].scrollIntoView({ block: 'nearest' });
  } else {
    zipInput.removeAttribute('aria-activedescendant');
  }
}

/** Close the list; a lookup still waiting is cancelled, and one already sent is ignored. */
function closeSuggestions() {
  clearTimeout(suggestTimer);
  suggestTimer = 0;
  suggestRequest++;
  suggestions = [];
  suggestActive = -1;
  renderSuggestions();
}

/** Arrow keys: move the highlight, passing through "none" (the text as typed) at either end. */
function moveSuggestionHighlight(step) {
  const slots = suggestions.length + 1;   // every row, plus "none"
  suggestActive = ((suggestActive + 1 + step + slots) % slots) - 1;
  renderSuggestions();
}

/** Search for the picked entry: put its full address in the field and go. */
function pickSuggestion(index) {
  const pick = suggestions[index];
  if (!pick) return;
  zipInput.value = pick.text;
  doSearch(pick.place);   // null: a house still to be looked up
}

zipInput.addEventListener('input', () => {
  clearTimeout(suggestTimer);
  const request = ++suggestRequest;   // whatever was on its way is out of date now
  suggestActive = -1;                 // the text changed under the highlight: clear it
  renderSuggestions();
  const text = zipInput.value.trim();
  // Only addresses get suggestions: a ZIP or coordinates are already exact.
  if (detectInputType(text) !== 'address') { closeSuggestions(); return; }
  suggestTimer = setTimeout(async () => {
    let list = [];
    try { list = await fetchSuggestions(text); } catch { /* offline or blocked: no list; FIND still works */ }
    // Typed on, searched or left the field meanwhile: this answer is stale.
    if (request !== suggestRequest || document.activeElement !== zipInput) return;
    suggestTimer = 0;     // nothing pending any more
    suggestions = list;
    // The arrow keys may have moved through the old list while this one loaded:
    // that highlight pointed at a row of the old list, not of this one.
    suggestActive = -1;
    renderSuggestions();
  }, SUGGEST_DELAY_MS);
});
zipInput.addEventListener('blur', closeSuggestions);
// mousedown's default would move focus out of the field (closing the list before
// the click lands); the list keeps it, which also lets its scrollbar be dragged.
suggestList.addEventListener('mousedown', e => e.preventDefault());
suggestList.addEventListener('click', e => {
  const row = e.target.closest('li');
  if (row) pickSuggestion([...suggestList.children].indexOf(row));
});

/* ─────────────────────────────────────────────────────────────────────────────
   17. DRAGGABLE-PIN FEATURE
   ─────────────────────────────────────────────────────────────────────────────
   The pin button in the header can be dragged onto the map.  While dragging,
   a ghost pin follows the cursor.  On drop, a draggable Leaflet marker is placed
   at the computed lat/lon and a station search is triggered.  Clicking the pin
   button instead (or tapping the touch-only pin button) arms tap/click-to-place.

   The dropped pin can be:
     • Dragged to a new position  → triggers a new search
     • Double-clicked             → removed from the map
     • Focused + Delete/Backspace → removed from the map
   ───────────────────────────────────────────────────────────────────────────── */

/** Whether the pin button is currently being dragged. */
let pinIsDragging = false;
const mapEl = document.getElementById('map');

dragPinBtn.addEventListener('dragstart', e => {
  e.dataTransfer.effectAllowed = 'copy';
  // Firefox only starts a drag that carries some data.
  e.dataTransfer.setData('text/plain', '');
  // Suppress the browser's default ghost thumbnail — we use our own
  e.dataTransfer.setDragImage(new Image(), 0, 0);
  pinIsDragging = true;
  pinGhost.style.display = 'block';
});

// Move the ghost pin with the cursor; preventDefault marks every spot as a valid
// drop target so the browser fires `drop` instead of animating a cancelled drag.
document.addEventListener('dragover', e => {
  if (!pinIsDragging) return;
  e.preventDefault();
  pinGhost.style.left = e.clientX + 'px';
  pinGhost.style.top  = e.clientY + 'px';
});

// The pin is placed on `drop`, not `dragend`: only a real drop fires it, so a drag
// cancelled with Escape places nothing, and drop coordinates are reliable in every
// browser (Firefox reports bogus dragend coordinates). A drop on anything that
// isn't the map itself (header, alert banner, station panel) places nothing.
document.addEventListener('drop', e => {
  if (!pinIsDragging) return;
  e.preventDefault();   // never let the browser handle the drop (e.g. insert text)
  if (!mapEl.contains(e.target)) return;
  const rect   = mapEl.getBoundingClientRect();
  const latlng = map.containerPointToLatLng([e.clientX - rect.left, e.clientY - rect.top]);
  placeDragPin(latlng.lat, latlng.lng);
});

// Dropped or cancelled, the drag is over: hide the ghost.
dragPinBtn.addEventListener('dragend', () => {
  pinIsDragging = false;
  pinGhost.style.display = 'none';
});

/** Remove the dropped pin marker from the map. */
function removeDragPin() {
  if (!droppedPinMarker) return;
  map.removeLayer(droppedPinMarker);
  droppedPinMarker = null;
}

/**
 * Build a Leaflet DivIcon for the draggable pin at a given position.
 * The icon is a flex column: coordinate label on top, pin emoji below.
 *
 * @param   {number} lat
 * @param   {number} lng
 * @returns {L.DivIcon}
 */
function buildPinIcon(lat, lng) {
  const coordStr = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  const wrap = document.createElement('div');
  wrap.className = 'dropped-pin-wrap';
  wrap.innerHTML = `
    <div class="dropped-pin-coords">${coordStr}</div>
    <div class="dropped-pin-icon">📍</div>
  `;
  // The emoji is horizontally centred in the 90 px-wide icon (flex align-items:center)
  // and sits at the bottom of the ~47 px-tall content, so the pin's tip is at
  // (width/2, content-bottom) = (45, 47). Anchoring there makes the tip sit exactly
  // on the marked coordinate instead of ~29 px to its right.
  // (className: the hook for the click-through rule on the marker box.)
  return L.divIcon({ html: wrap, className: 'dropped-pin-marker', iconSize: [90, 52], iconAnchor: [45, 47] });
}

/**
 * Place the draggable search pin at (lat, lng) and trigger a station search.
 * Removes any previously placed pin first.
 *
 * @param {number} lat
 * @param {number} lng
 */
function placeDragPin(lat, lng) {
  // Any way of placing a pin (drop, Locate Me) ends an armed tap/click mode, so
  // a later casual map click can't drop a second pin unexpectedly.
  setTapMode(false);
  // A drop/tap on a neighbouring copy of the world reports a longitude past ±180,
  // which NOAA answers with 404. Normalise once here (covers drop, tap and Locate).
  ({ lat, lng } = L.latLng(lat, lng).wrap());
  showSearchPin(lat, lng);
  triggerPinSearch(lat, lng);
}

/**
 * Put the draggable search pin at (lat, lng), replacing any earlier one, without
 * searching: placeDragPin searches next, and an address search has already
 * found the spot. Dragging the pin later searches wherever it is dropped.
 *
 * @param {number} lat
 * @param {number} lng
 */
function showSearchPin(lat, lng) {
  removeDragPin();

  droppedPinMarker = L.marker([lat, lng], {
    icon: buildPinIcon(lat, lng),
    draggable: true,
    // Under the station badges, not over them: where the two overlap (a pin
    // dropped on or right next to a station) a click opens the station, and the
    // pin is still dragged by its uncovered part.
    zIndexOffset: -1000,
    title: 'Search location pin — drag to move, press Delete to remove'
  }).addTo(map);

  // Leaflet already makes the marker focusable (tabindex 0, role "button"). Its
  // 'add' event fires synchronously inside addTo(), so a listener registered
  // afterwards would never run — attach the key handler to the element directly.
  droppedPinMarker.getElement().addEventListener('keydown', e => {
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      removeDragPin();
      // The focused element just disappeared; hand focus to whichever pin button
      // is visible instead of dropping keyboard users back at the page start.
      (dragPinBtn.offsetParent ? dragPinBtn : tapPinBtn).focus();
    }
  });

  // Double-click to remove
  droppedPinMarker.on('dblclick', removeDragPin);

  // When the user re-drags the pin on the map, update the label and re-search
  droppedPinMarker.on('dragend', () => {
    // Normalise like placeDragPin, and move the pin onto the same world copy the
    // map is about to fly to.
    const pos = droppedPinMarker.getLatLng().wrap();
    droppedPinMarker.setLatLng(pos);
    const lbl = droppedPinMarker.getElement()?.querySelector('.dropped-pin-coords');
    if (lbl) lbl.textContent = `${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}`;
    triggerPinSearch(pos.lat, pos.lng);
  });
}

/* ── Tap/click-to-place mode ─────────────────────────────────────────────────
   Pressing a pin button — the drag-pin on desktop (by click or keyboard) or the
   touch-only tap-pin — arms a one-shot mode: the next tap/click on the map puts
   the search pin there. It is the no-drag alternative to drag-and-drop, which
   touch screens don't support and keyboard users can't perform. */
const tapPinBtn      = document.getElementById('tap-pin-btn');
const tapPlaceBanner = document.getElementById('tap-place-banner');
let tapModeActive = false;

const TAP_BANNER_TEXT = tapPlaceBanner.textContent.trim();

function setTapMode(active) {
  // Phone layout: the bottom sheet (position: fixed) covers most of the map, so
  // close it to leave room to place the pin. The desktop side panel can stay.
  if (active && popupPanel.style.display === 'block' && getComputedStyle(popupPanel).position === 'fixed') {
    closeStationPanel(false);
  }
  tapModeActive = active;
  tapPlaceBanner.classList.toggle('active', active);
  // A live region is only announced when its text changes AFTER it is rendered,
  // so fill it a moment after it is shown (and empty it when hidden). A single
  // animation frame is too soon: the text would land in the same layout update.
  if (active) {
    // Measure the banner WITH its text first (same task, nothing is painted in
    // between), so the alert banner and panel move to their final place at once
    // instead of jumping when the text arrives.
    tapPlaceBanner.textContent = TAP_BANNER_TEXT;
    mapEl.parentElement.style.setProperty('--tap-banner-h', `${tapPlaceBanner.offsetHeight}px`);
  }
  tapPlaceBanner.textContent = '';
  if (active) setTimeout(() => { if (tapModeActive) tapPlaceBanner.textContent = TAP_BANNER_TEXT; }, 100);
  tapPinBtn.classList.toggle('active', active);
  [dragPinBtn, tapPinBtn].forEach(btn => btn.setAttribute('aria-pressed', String(active)));
  // Shows a crosshair and lets clicks pass through alert polygons and markers
  // (which would otherwise take them for their own popup/panel), so a pin can be
  // placed anywhere — including inside a warning area or on a station.
  mapEl.classList.toggle('tap-mode', active);
  // Its banner covers the top of the map and moves the alert banner and the
  // desktop station panel down (or back up): live-alert chips make way.
  replaceLiveLabelsIfCrowded();
}
setTapMode(false);   // initialise aria-pressed on both buttons

// Publish the pin-mode banner's real height (it wraps to several lines on narrow
// screens, and its text arrives a moment after it appears) so the CSS can move
// the alert banner and the station panel below it instead of under it. Only
// measure it with its text in: it is briefly empty when the mode turns on, and
// that short height would make everything below move down in two steps.
new ResizeObserver(() => {
  if (!tapPlaceBanner.textContent) return;
  mapEl.parentElement.style.setProperty('--tap-banner-h', `${tapPlaceBanner.offsetHeight}px`);
}).observe(tapPlaceBanner);
// …and the live-alert chips keep clear of it as its text arrives (and it grows).
liveLabelSpace.observe(tapPlaceBanner);

dragPinBtn.addEventListener('click', () => setTapMode(!tapModeActive));
tapPinBtn.addEventListener('click', () => setTapMode(!tapModeActive));
// Delete/Backspace on whichever pin button is shown (drag-pin on desktop, tap-pin
// on touch devices, e.g. an iPad with a keyboard) removes the dropped pin.
[dragPinBtn, tapPinBtn].forEach(btn => btn.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && droppedPinMarker) {
    removeDragPin();
    e.preventDefault();
  }
}));
document.addEventListener('keydown', e => {
  // Skip an Escape something else already used (e.g. closing an alert popup),
  // so one key press undoes one thing.
  if (e.key === 'Escape' && tapModeActive && !e.defaultPrevented) setTapMode(false);
});

// Keyboard users can't click a map point: with the map focused, Enter places the
// pin at the map's centre (pan with the arrow keys first to choose the spot).
mapEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !tapModeActive || e.target !== mapEl) return;
  e.preventDefault();
  const center = map.getCenter();
  placeDragPin(center.lat, center.lng);   // also ends the one-shot mode
});

// Markers keep their own clicks (Leaflet doesn't pass them on to the map), so
// this only runs for a click on the map itself.
map.on('click', e => {
  if (!tapModeActive) return;
  placeDragPin(e.latlng.lat, e.latlng.lng);   // also ends the one-shot mode
});

/**
 * Populate the search input with pin coordinates, update the URL, and
 * fetch nearby weather stations.
 *
 * @param {number} lat
 * @param {number} lng
 */
function triggerPinSearch(lat, lng) {
  const gen = ++searchGeneration;
  const coordStr = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  // The field now holds the pin's coordinates: an address list for the old text
  // (open, or still on its way) no longer belongs to it.
  closeSuggestions();
  zipInput.value = coordStr;
  setStatus('loading', 'LOCATING…');
  showOverlay('Fetching stations for pin location…');
  // Like doSearch: only a pin that actually loaded stations becomes the shareable URL.
  loadStationsAt(lat, lng, gen).then(loaded => {
    if (loaded) pushQueryParam('coords', coordStr);
  }).catch(err => {
    if (gen !== searchGeneration) return;
    reportSearchError(err.message || 'Something went wrong');
  });
}

/* ─────────────────────────────────────────────────────────────────────────────
   18. FLOATING ACTION BUTTON — "LOCATE ME"
   ─────────────────────────────────────────────────────────────────────────────
   Uses the browser Geolocation API to retrieve the device's current position.
   On success:
     1. Pans the map to the location.
     2. Places the draggable search pin there.
     3. Populates the search field with the coordinates.
     4. Triggers a station search.

   The button animates to a loading state while the position is being acquired.
   ───────────────────────────────────────────────────────────────────────────── */

fabLocate.addEventListener('click', () => {
  // Busy with a request already. (aria-disabled, not disabled: a disabled button
  // drops keyboard focus to the start of the page.)
  if (fabLocate.getAttribute('aria-disabled') === 'true') return;
  if (!navigator.geolocation) {
    showToast('Geolocation is not supported by this browser.');
    return;
  }
  // Browsers refuse location outside HTTPS/localhost (e.g. http://192.168.x.x) with
  // a "denied" error no setting can fix — say what is really needed.
  if (window.isSecureContext === false) {
    showToast('Locate Me needs the app to be opened over HTTPS (or localhost).');
    return;
  }

  // Allocate before the permission prompt; a search started while it is open wins.
  const gen = ++searchGeneration;

  // Visual loading state on the FAB
  fabLocate.classList.add('locating');
  fabLocate.setAttribute('aria-disabled', 'true');
  setStatus('loading', 'LOCATING…');
  showOverlay('Requesting device location…');

  // The 15 s `timeout` below only starts once permission is granted. If the user
  // dismisses the permission prompt, some browsers never call back at all — so a
  // watchdog makes sure the button and the map overlay are always released.
  let settled = false;
  /** Restore the button exactly once; false when this request already finished. */
  function settle() {
    if (settled) return false;
    settled = true;
    clearTimeout(watchdog);
    fabLocate.classList.remove('locating');
    fabLocate.removeAttribute('aria-disabled');
    return true;
  }
  const watchdog = setTimeout(() => {
    if (!settle() || gen !== searchGeneration) return;
    reportSearchError('No location received. Please try again.');
  }, 60_000);   // generous: the prompt itself may sit unanswered for a while

  navigator.geolocation.getCurrentPosition(
    // ── Success ──────────────────────────────────────────────────────────────
    position => {
      // Even a late answer (after the watchdog gave up, e.g. the user took a long
      // time on the permission prompt) is still the location they asked for — use
      // it unless a newer search has started meanwhile.
      settle();
      if (gen !== searchGeneration) return;
      hideOverlay();

      const { latitude: lat, longitude: lng } = position.coords;

      // Place a pin and kick off the station search — loadStationsAt (reached
      // via triggerPinSearch) pans the map to the location itself. Rounded to 3
      // decimals (~110 m): plenty to find nearby stations, without writing the
      // exact GPS fix into the address bar, browser history and shared links.
      placeDragPin(+lat.toFixed(3), +lng.toFixed(3));
    },

    // ── Error ─────────────────────────────────────────────────────────────────
    err => {
      if (!settle()) return;
      if (gen !== searchGeneration) return;
      const messages = {
        1: 'Location access denied. Please allow it in your browser settings.',
        2: 'Location unavailable. Check your device settings.',
        3: 'Location request timed out. Please try again.'
      };
      reportSearchError(messages[err.code] || 'Could not retrieve location.');
    },

    // ── Options ───────────────────────────────────────────────────────────────
    {
      enableHighAccuracy: true,  // use GPS when available
      timeout: 15_000,           // give up after 15 s
      maximumAge: 60_000         // accept a cached position up to 1 min old
    }
  );
});

/* ─────────────────────────────────────────────────────────────────────────────
   19. URL QUERY-PARAMETER AUTO-TRIGGER
   ─────────────────────────────────────────────────────────────────────────────
   On page load, the query string is parsed and the appropriate action is
   triggered automatically — the user doesn't need to type anything.

   Supported parameters (evaluated in priority order):
     ?station=KSAT         → direct station lookup (fetch obs, pan map, open popup)
     ?lat=…&long=…         → coordinate search
     ?zip=…                → ZIP code search
     ?addr=…               → address search

   URLSearchParams decodes the values written by pushQueryParam exactly once.
   ───────────────────────────────────────────────────────────────────────────── */

(async function parseQueryParams() {
  const params = new URLSearchParams(window.location.search);

  // Station ids are upper-case ICAO codes; tolerate "%20ksat" from a hand-made link.
  const stationParam = params.get('station')?.trim().toUpperCase();
  const lat          = params.get('lat')?.trim();
  const lon          = params.get('long')?.trim();
  const zip          = params.get('zip');
  const addr         = params.get('addr');

  /* ── ?station=KSAT — direct station lookup ── */
  if (stationParam) {
    // Capture the generation before fetching: if the user starts a normal search
    // while this (up to 15 s) fetch is in flight, that newer search bumps it and this
    // stale deep-link result must not hijack their session (popup, timer, markers).
    const gen = ++searchGeneration;
    // Like loadStationsAt: the map belongs to the newest AREA. A user search that
    // fails before reaching the map must not throw this station away.
    const area = ++areaGeneration;
    try {
      setStatus('loading', 'LOADING STATION…');
      showOverlay(`Fetching station ${stationParam}…`);

      areaLoading = { status: 'LOADING STATION…', overlay: `Fetching station ${stationParam}…` };
      let data, sitePoint, noReadings = null;
      try {
        // The observation's own point is rounded (KJFK's is ~1.8 km off), so also
        // ask for the station record's exact site — in parallel, and optional.
        // A station that exists but hasn't reported lately (404) is still plotted,
        // and its panel says so, as when it is opened from the map.
        [data, sitePoint] = await Promise.all([
          fetchObservations(stationParam).catch(e => { if (e.status !== 404) throw e; noReadings = e; return null; }),
          fetchStationPoint(stationParam)
        ]);
      } finally {
        if (area === areaGeneration) areaLoading = null;
      }
      if (area !== areaGeneration) return;        // a user search replaced the map
      if (!data && !sitePoint) throw noReadings || new Error('No coordinates in station response');   // no such station (or no site to show)
      // GeoJSON: [lng, lat]. Same spot a normal search plots the station at.
      const [lng, lat] = sitePoint || data?.geometry?.coordinates || [];
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        throw new Error('No coordinates in station response');
      }

      // A single station has no search circle: zoom 10 around it, and the alert
      // lookup includes the nearby warning polygons visible there (alertViewportBounds).
      moveMapTo(lat, lng, 10);

      const stName = data?.properties?.stationName || stationParam;
      const iconEl = makeStationMarker(stationParam, stName, lat, lng);
      // This path builds its single marker directly (not via plotStations), so
      // register it for Tier-3 alert flagging by hand.
      stationRecords = [{ el: iconEl, lat, lng }];
      setForecastPoint(lat, lng);   // FORECAST describes the station's spot
      liveSearchLanded();           // live alerts waiting for this opening can load

      if (mayUpdateSearchUi(gen)) {
        settledSearch = searchGeneration;
        hideOverlay();
        setStatus('ok', stationParam);
      }

      // Reuse the standard open flow (loading skeleton → observation fetch →
      // render → background rain-chance lookup → guarded live-refresh timer) instead of duplicating
      // its bookkeeping here; the fetch above was only needed to locate the
      // station before a marker existed to click. Fire-and-forget, exactly like
      // a marker click.
      openStation(stationParam, stName, iconEl);

      // Show dangerous-weather alerts for the station's location too (a result
      // made stale by a newer search is discarded inside loadAlertsForArea).
      loadAlertsForArea(lat, lng);

    } catch (e) {
      // Report while this is the newest search — or, like loadStationsAt, while
      // this station is still what the map shows and the newer search has ended
      // (otherwise its loading overlay would stay up with nothing left to clear it).
      if (gen !== searchGeneration && !(area === areaGeneration && mayUpdateSearchUi(gen))) return;
      reportSearchError(e.message || 'Failed to load station');
    }
    return;  // Don't process other params
  }

  /* ── Other params ── */
  if (lat && lon) {
    zipInput.value = `${lat}, ${lon}`;
    // A broken coordinate link (e.g. ?lat=abc) must not silently turn into an
    // address search for the text "abc, def".
    if (detectInputType(zipInput.value) === 'coords') doSearch();
    else showToast('This link has invalid coordinates');
  } else if (zip) {
    zipInput.value = zip.trim();
    // Same guard as lat/long: a broken ?zip=abc link is not an address search.
    if (detectInputType(zipInput.value) === 'zip') doSearch();
    else showToast('This link has an invalid ZIP code');
  } else if (addr) {
    zipInput.value = addr.trim();
    doSearch();
  }
})();

initMobile(); // Initialize mobile-specific features

}); // ── end DOMContentLoaded ──────────────────────────────────────────────────

/* ─────────────────────────────────────────────────────────────────────────────
   MOBILE ENHANCEMENTS — added for PWA mobile optimisation
   ─────────────────────────────────────────────────────────────────────────────
   • Tracks main.sheet-open (and the sheet's real height) on ALL devices — the
     bottom-sheet CSS is width- or pointer-driven (≤640 px OR coarse pointer), so
     a narrow desktop window uses the sheet too and its FAB/toast lift rules must
     still fire.
   • On coarse-pointer (touch) devices only, wires up swipe-down-to-dismiss for
     the bottom sheet. (Tap-to-place lives with the draggable pin, section 17.)
   ───────────────────────────────────────────────────────────────────────────── */
function initMobile() {
  const mainEl      = document.querySelector('main');
  const _popupPanel = document.getElementById('popup-panel');
  const _popupClose = document.getElementById('popup-close');
  const _fabLocate  = document.getElementById('fab-locate');

  /**
   * Observe display changes on #popup-panel so sheet-aware CSS (FAB and toast
   * lifted above the sheet) can react on every device where the sheet layout
   * can apply — not just touch ones.
   */
  const sheetObserver = new MutationObserver(() => {
    const isVisible = _popupPanel.style.display === 'block';
    mainEl.classList.toggle('sheet-open', isVisible);
  });
  sheetObserver.observe(_popupPanel, { attributes: true, attributeFilter: ['style'] });

  /* The sheet is only as tall as its content (up to 70vh). Publish its real height
     so the toast and Locate Me button sit just above it instead of a fixed 70vh,
     which left them floating mid-screen over a short sheet. Set on <html> because
     #toast is not inside <main>. */
  const syncSheetSpace = () => {
    const sheetH = _popupPanel.offsetHeight;
    document.documentElement.style.setProperty('--sheet-h', `${sheetH}px`);
    // The lifted Locate Me button needs 74px of map above the sheet (54px button +
    // 12px lift + 8px gap). With less (landscape phones), it would land on the
    // header's FIND button, so it is hidden while the sheet is open (see CSS).
    // Measured against the visible window: without dvh (iOS < 15.4) <main> runs
    // taller than the screen, so its own height would overstate the room.
    const room = window.innerHeight - mainEl.getBoundingClientRect().top - sheetH;
    mainEl.classList.toggle('sheet-crowded', room < 74);
    // Don't leave keyboard focus on a button that just became invisible.
    if (document.activeElement === _fabLocate && getComputedStyle(_fabLocate).visibility === 'hidden') {
      _popupClose.focus();
    }
  };
  const sheetSpaceObserver = new ResizeObserver(syncSheetSpace);
  sheetSpaceObserver.observe(_popupPanel);
  sheetSpaceObserver.observe(mainEl);                  // rotating the phone changes the room
  window.addEventListener('resize', syncSheetSpace);   // so do Safari's collapsing toolbars

  /* ── Touch-only: swipe gestures exist only on (pointer: coarse) devices. ── */
  if (!window.matchMedia('(pointer: coarse)').matches) return;

  /* ── Swipe-down-to-dismiss the bottom sheet ── */
  let sheetTouchStartY = 0;
  let sheetSwipeIsDismiss = true;   // did the swipe begin at the top of the sheet?

  _popupPanel.addEventListener('touchstart', e => {
    sheetTouchStartY = e.touches[0].clientY;
    // Only a downward swipe that STARTS at the very top of the (scrollable) sheet is
    // a dismiss gesture. If the content is scrolled, the same drag is the user
    // scrolling and must not close the panel.
    sheetSwipeIsDismiss = _popupPanel.scrollTop <= 0;
  }, { passive: true });

  _popupPanel.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - sheetTouchStartY;
    if (sheetSwipeIsDismiss && dy > 80) {
      // Swiped down > 80 px from the top — dismiss the sheet
      _popupClose && _popupClose.click();
    }
  }, { passive: true });

}
</script>
</body>
</html>
