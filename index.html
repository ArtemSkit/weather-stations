      .on('mouseover', () => { liveChipLit = props.cap_id; highlightLiveAlert(props.cap_id, true); })
      .on('mouseout', () => { liveChipLit = null; highlightLiveAlert(props.cap_id, false); })
      .addTo(liveLabelLayer);
  }
  probe.remove();
}

/* The banner in live mode lists the alerts drawn in view, kept in step with the
   map as it moves (rebuilt only when that set changes, so an open card stays). */
let liveBannerSignature = null;

function renderLiveBanner() {
  // While the view's own answer is on its way, keep the list as it is rather than
  // dropping what hasn't loaded yet and adding it back a moment later.
  if (!liveAlertsOn || liveViewPending) return;
  const features = [...liveAlertsDrawnInView()].map(([id, { props }]) => ({
    id: typeof id === 'string' ? id : '',
    properties: { event: props.prod_type, onset: props.onset, ends: props.ends,
                  expires: props.expiration, detailsUrl: props.url }
  }));
  const signature = alertsSignature(features);
  if (signature === liveBannerSignature) return;
  liveBannerSignature = signature;
  liveBannerFeatures = features;
  prefetchLiveAlertPlaces();   // first, so the headers know which places are on the way
  renderAlertBanner(features, true);
}

/** The live alerts the banner lists now (for loading their places). */
let liveBannerFeatures = [];
const LIVE_PLACES_PREFETCH = 60;   // a zoomed-out view can list hundreds

/**
 * Load the places of the listed live alerts (from their NWS records), the most
 * serious first — only while the list is open, and at most LIVE_PLACES_PREFETCH.
 */
function prefetchLiveAlertPlaces() {
  if (!liveAlertsOn || alertBannerCollapsed) return;
  // The top ones first, then those still without places: filtering first would take
  // the next 60 each time a record arrives (and redraws), working through every
  // alert in view — and past the record cache's size, round and round for ever.
  queueAlertRecords(sortAlerts(liveBannerFeatures)
    .slice(0, LIVE_PLACES_PREFETCH)
    .filter(f => !alertAreaDesc(f))
    .map(f => ({ id: alertId(f), url: f.properties.detailsUrl })));
}

/** Everything that follows the view in live mode: count and key, labels, banner. */
function renderLiveView() {
  renderLiveLegend();
  renderLiveLabels();
  renderLiveBanner();
}

/**
 * Open an area's popup: what the map service knows at once, then the alert's
 * full NWS record (headline, severity, areas) in the same layout as the
 * searched area's own alert popups, placed clear of the banner and panel.
 */
function openLiveAlertPopup(props, latlng, clickEvent) {
  const color = liveAlertTextColor(props.prod_type);
  const basic = { event: props.prod_type, onset: props.onset || props.issuance, ends: props.ends,
                  expires: props.expiration };
  const options = { className: 'wx-alert-popup', autoPan: true };
  fitAlertPopup(options, clickEvent.clientX, clickEvent.clientY);
  const popup = L.popup(options).setLatLng(latlng).setContent(alertAreaPopupHtml(basic, color));
  livePopup = popup;
  livePopupCapId = props.cap_id;
  popup.on('remove', () => { if (livePopup === popup) livePopup = null; });
  popup.openOn(map);

  if (!isTrustedNwsApiUrl(props.url, '/alerts/')) return;   // only follow NWS's own links
  fetchJsonWithTimeout(props.url).then(({ response, data }) => {
    if (livePopup !== popup || !response.ok || !data?.properties) return;
    popup.setContent(alertAreaPopupHtml(data.properties, color));
  }).catch(() => { /* the basic popup stays */ });
}

/** Turn live alerts on or off. */
/**
 * Turn live alerts on or off.
 * @param {boolean} on
 * @param {boolean} [waitForSearch] - the app opened on a place to search and is
 *        about to fly there: load once that search's area is on the map (see
 *        liveSearchLanded), or after LIVE_DEFERRED_LOAD_MS — not the starting
 *        view first, which would be a wasted download
 */
function setLiveAlerts(on, waitForSearch = false) {
  liveAlertsOn = on;
  // Remembered on this device: a reload (or reopening the app) comes back as left.
  try { localStorage.setItem(LIVE_ALERTS_ON_KEY, on ? '1' : '0'); } catch (_) { /* storage blocked */ }
  liveAlertsBtn.setAttribute('aria-pressed', String(on));
  liveLegendBtn.hidden = !on;
  clearInterval(liveRefreshTimer);
  clearTimeout(liveMoveTimer);
  clearTimeout(liveRetryTimer);
  clearTimeout(liveGapTimer);
  clearTimeout(liveExpiryTimer);
  liveRun++;
  liveLoadOwed = false;
  liveRefreshMissed = false;
  liveViewPending = false;
  liveAnswered = false;
  liveFreshViews = [];
  if (livePopup) map.closePopup(livePopup);
  // The searched area's own polygons would be drawn twice: hide them with a CSS
  // class (not by removing their layer), so their labels, popups and stacking
  // stay intact for when live alerts are switched off again.
  map.getContainer().classList.toggle('live-alerts-on', on);
  if (on) {
    if (activeAlertAreaOwner) map.closePopup();
    liveState = 'loading';
    liveFailureShown = false;
    liveWaitsForSearch = waitForSearch;
    if (waitForSearch) {
      const since = Date.now();
      liveMoveTimer = setTimeout(() => liveDeferredLoad(since), LIVE_DEFERRED_LOAD_MS);
    }
    else loadLiveAlerts();
    liveRefreshTimer = setInterval(refreshLiveAlerts, ALERTS_REFRESH_MS);
    restoreLiveCache();   // the saved copy at once, while that download runs
  } else {
    liveAlertsSeq++;                 // ignore any answer still on its way
    liveAppliedSeq = liveAlertsSeq;
    liveAlertsLayer.clearLayers();
    livePieces.clear();
    liveCache = [];
    saveLiveCache(true);   // the saved copy is erased with them
    liveState = 'off';
    setLiveLegendOpen(false);
    // (The now-empty canvas stays on the map, hidden by CSS while off.)
    // The banner goes back to the searched area's own alerts.
    renderAlertBanner(shownAlerts);
  }
  // A live banner is rebuilt at every pan: announcing each would be noise, so the
  // banner only speaks up (aria-live) for the searched area's alerts.
  alertBanner.setAttribute('aria-live', on ? 'off' : 'polite');
  liveBannerSignature = null;
  renderLiveView();
}

/**
 * Take off the map (and the saved copy) whatever is over 15 minutes old or has
 * ended — at every 2-minute tick, so even while downloads keep failing (offline)
 * nothing stale stays drawn. (A good answer does the same for its own box.)
 */
function pruneLivePieces(now = Date.now()) {
  let gone = false;
  for (const piece of livePieces) {
    if (liveAlertEnded(piece.props, now) || now - piece.at >= LIVE_CACHE_MAX_AGE_MS) {
      liveAlertsLayer.removeLayer(piece.layer);
      livePieces.delete(piece);
      gone = true;
    }
  }
  const kept = liveCacheTrim(liveCache, now);
  if (kept.length !== liveCache.length) { liveCache = kept; saveLiveCache(); }
  if (gone) renderLiveView();
  scheduleLiveExpiry();
}

/**
 * Wake up the moment the oldest piece — drawn or saved — turns 15 minutes old, and
 * take it off then (pruneLivePieces), not at the next 2-minute check: what's on
 * screen is re-downloaded at each check while online, but areas moved away from,
 * and everything while downloads fail, would otherwise linger up to 2 minutes more.
 */
function scheduleLiveExpiry() {
  clearTimeout(liveExpiryTimer);
  if (!liveAlertsOn) return;
  let oldest = Infinity;
  for (const piece of livePieces) oldest = Math.min(oldest, piece.at);
  for (const piece of liveCache) oldest = Math.min(oldest, piece.at);
  if (oldest === Infinity) return;
  // (A moment past it, so the piece is surely due when the timer runs.)
  liveExpiryTimer = setTimeout(pruneLivePieces, Math.max(0, oldest + LIVE_CACHE_MAX_AGE_MS - Date.now()) + 50);
}
// Back to the page: timers may have been slowed or frozen meanwhile (a phone puts
// the app to sleep), so take off at once whatever came due while away.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && liveAlertsOn) pruneLivePieces();
});

/** The 2-minute refresh tick: skipped while the page is hidden, caught up on return. */
function refreshLiveAlerts() {
  if (!liveAlertsOn) return;
  pruneLivePieces();
  if (document.hidden) { liveRefreshMissed = true; return; }
  loadLiveAlerts();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !liveRefreshMissed) return;
  liveRefreshMissed = false;
  refreshLiveAlerts();
});

// Moving the map loads what came into view — one request per pause, not per frame.
map.on('moveend', () => {
  if (!liveAlertsOn) return;
  // The page's own start-up moves aren't the opening search's: wait for it.
  if (liveWaitsForSearch) return;
  liveViewPending = true;          // what came into view isn't counted until its answer is in
  renderLiveView();                // labels and banner follow what's drawn in view now
  clearTimeout(liveMoveTimer);
  liveMoveTimer = setTimeout(() => {
    // Inside a region downloaded moments ago (as finely): what's drawn is current.
    if (!liveLoadOwed && liveViewFresh(liveFreshViews, map.getBounds(), liveAlertTolerance(map.getZoom()), Date.now())) {
      liveViewPending = false;
      renderLiveView();
    } else loadLiveAlerts();
  }, 350);
});

liveLabelSpace.observe(document.querySelector('.live-alerts-ctl'));
const liveAlertsBtn   = document.getElementById('live-alerts-btn');
const liveAlertsCount = document.getElementById('live-alerts-count');
const liveLegendBtn   = document.getElementById('live-legend-btn');

/**

/* Live alerts come back on after a reload if they were on (RADIUS, the folded
   buttons and the collapsed alert list are remembered the same way). Restored
   last, once the whole control is set up. */
const LIVE_ALERTS_ON_KEY = 'wxmap_live_alerts_on';
/* Opened on a place to search (a shared link, a ZIP…), the map is about to fly
   there: the first live load waits for that search's area instead of fetching
   the whole starting view first — or this long, if the search never gets there
   (longer while it is still looking the place up: see liveDeferredLoad). */
const LIVE_DEFERRED_LOAD_MS = 4000;
const LIVE_DEFERRED_MAX_MS = 20_000;   // …or this, while it is still finding the place
try {
  if (localStorage.getItem(LIVE_ALERTS_ON_KEY) === '1') {
    const opening = new URLSearchParams(location.search);
    setLiveAlerts(true, ['station', 'lat', 'zip', 'addr'].some(key => opening.has(key)));

/* ─────────────────────────────────────────────────────────────────────────────
   14D. FORECAST  (the NWS forecast for the area on the map)
   ─────────────────────────────────────────────────────────────────────────────
   The National Weather Service publishes, for every point it covers, a 7-day
   forecast (14 day and night periods in words) and an hourly forecast (~6.5
   days). Both are free and key-less: /points/{lat},{lon} names the forecast grid
   cell, whose two forecast URLs are then fetched. FORECAST in the header opens
   them for the searched point (or a ?station link's station), with the sun times
   (computed here), air quality and pressure (Open-Meteo) added to them.
   ───────────────────────────────────────────────────────────────────────────── */

/** How long a loaded forecast is reused: NWS refreshes its grids about hourly. */
const FORECAST_VIEW_TTL_MS = 10 * 60_000;
const FORECAST_VIEW_CACHE_LIMIT = 20;
/** "lat,lon" → { at, place, days, hours, updated } */
const forecastViewCache = new Map();
/** The point FORECAST describes: the area on the map, or null before any search. */
let forecastPoint = null;
/** Newest forecast request; an older answer (the dialog reopened elsewhere) is dropped. */
let forecastSeq = 0;

const forecastBtn    = document.getElementById('forecast-btn');
const forecastDialog = document.getElementById('forecast-dialog');
const forecastPlace  = document.getElementById('forecast-place');
const forecastNow    = document.getElementById('forecast-now');
const forecastFoot   = document.getElementById('forecast-foot');
const fcTabDays      = document.getElementById('fc-tab-days');
const fcTabHours     = document.getElementById('fc-tab-hours');
const fcDays         = document.getElementById('fc-days');
const fcHours        = document.getElementById('fc-hours');

/** Point FORECAST at the area now on the map (and show the button). */
function setForecastPoint(lat, lon) {
  forecastPoint = { lat, lon };
  forecastBtn.hidden = false;
}

/** No area on the map (a search failed after clearing it): hide FORECAST. */
function clearForecastPoint() {
  forecastPoint = null;
  forecastBtn.hidden = true;
}

/**
 * Load the 7-day and hourly forecasts for a point (cached for a few minutes).
 * Only follows NOAA's own /gridpoints/ links from the /points answer.
 * @returns {Promise<{at:number, place:string, days:Object[], hours:Object[], updated:string, extras:Object}>}
 * @throws {Error} with a short, readable reason
 */
async function fetchAreaForecast(lat, lon) {
  const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
  const hit = forecastViewCache.get(key);
  if (hit && Date.now() - hit.at < FORECAST_VIEW_TTL_MS) {
    // Air quality or pressure that couldn't be had last time is asked for again
    // (only what's missing), rather than kept missing as long as the NWS forecast is reused.
    if (!hasAir(hit.extras) || !hasPressure(hit.extras)) {
      hit.extras = await fetchAirAndPressure(lat, lon, hit.extras);
    }
    return hit;
  }

  // Air quality and pressure (Open-Meteo) load alongside the NWS forecast. They
  // never fail it: a part that can't be had is just left out (see the function).
  const extrasLoad = fetchAirAndPressure(lat, lon);
  const { response: ptRes, data: point } = await fetchJsonWithTimeout(`https://api.weather.gov/points/${key}`);
  if (ptRes.status === 404) throw new Error('the NWS has no forecast here — coverage is US only');
  if (!ptRes.ok) throw new Error(`the NWS answered HTTP ${ptRes.status}`);
  const props = point?.properties || {};
  const urls = [props.forecast, props.forecastHourly];
  if (!urls.every(url => isTrustedNwsApiUrl(url, '/gridpoints/'))) {
    throw new Error('the NWS has no forecast for this spot');
  }
  const answers = await Promise.all(urls.map(url => fetchJsonWithTimeout(url)));
  for (const { response } of answers) {
    // NWS grids now and then answer 500 for a minute or two: worth a retry.
    if (!response.ok) throw new Error(`the NWS forecast answered HTTP ${response.status}`);
  }
  const [days, hours] = answers.map(({ data }) =>
    (Array.isArray(data?.properties?.periods) ? data.properties.periods : []));
  const result = {
    at: Date.now(), days, hours,
    place: forecastPlaceLabel(props.relativeLocation),
    updated: answers[0].data?.properties?.updateTime || '',
    extras: await extrasLoad
  };
  setBoundedCache(forecastViewCache, key, result, FORECAST_VIEW_CACHE_LIMIT);
  return result;
}

/**
 * Where the forecast is, from the NWS's nearest named place: "8 mi NW of
 * Bulverde, TX" — or "Near San Antonio, TX" when the spot is within a mile of it
 * or inside it. The NWS measures the distance to the place's edge (its limits),
 * not its centre — a spot inside a city gets 0 m — and its bearing points from
 * the place to the spot (a spot northeast of Boerne gets 36°), the way the NWS's
 * own pages say "8 Miles NW Bulverde TX".
 * @param {Object} relativeLocation - the /points answer's `relativeLocation`
 * @returns {string} '' when the NWS names no place
 */
function forecastPlaceLabel(relativeLocation) {
  const near = relativeLocation?.properties;
  if (!near?.city || !near?.state) return '';
  const name = near.city + ', ' + near.state;
  const value = near.distance?.value;   // in metres, or kilometres if its unit says so
  const metres = Number.isFinite(value) ? value * (/km/.test(near.distance.unitCode || '') ? 1000 : 1) : NaN;
  const miles = metres / 1609.344;
  const bearing = near.bearing?.value;
  if (!(miles >= 1) || !Number.isFinite(bearing)) return 'Near ' + name;
  return Math.round(miles) + ' mi ' + degToCompass(bearing) + ' of ' + name;
}

/** A weather symbol for an NWS short forecast ("Chance Showers And Thunderstorms"). */
function forecastEmoji(text, isDaytime) {
  const t = String(text || '').toLowerCase();
  if (/thunder|t-storm/.test(t)) return '⛈️';
  if (/snow|flurr|sleet|blizzard|ice|freezing/.test(t)) return '🌨️';
  if (/rain|shower|drizzle/.test(t)) return '🌧️';
  if (/fog|haze|smoke|dust/.test(t)) return '🌫️';
  if (/partly|mostly sunny|mostly clear/.test(t)) return isDaytime ? '⛅' : '☁️';
  if (/cloud|overcast/.test(t)) return '☁️';
  if (/wind|breezy|blustery/.test(t)) return '💨';
  if (/sunny|clear|fair|hot/.test(t)) return isDaytime ? '☀️' : '🌙';
  return isDaytime ? '🌤️' : '🌙';
}

/** A period's temperature as HTML: °F, with °C beside it in small type. */
function forecastTemp(period) {
  const d = forecastDegrees(period);
  return d ? `${d.f}°F<small>${d.c}°C</small>` : '—';
}

/** A period's temperature in whole °F and °C, or null when it has none. */
function forecastDegrees(period) {
  const t = period?.temperature;
  if (!Number.isFinite(t)) return null;
  const f = period.temperatureUnit === 'C' ? t * 9 / 5 + 32 : t;
  return { f: Math.round(f), c: Math.round((f - 32) * 5 / 9) };
}

/**
 * The 7-day periods paired into calendar days: each day with the night after it
 * ("Friday" + "Friday Night"), so a row can show the day's high and the night's
 * low. A list that starts at night ("Tonight", "Overnight") or ends on a day has
 * that part on its own.
 * @returns {{day:Object|null, night:Object|null}[]}
 */
function forecastDayPairs(periods) {
  const days = [];
  for (let i = 0; i < periods.length; i++) {
    const period = periods[i], next = periods[i + 1];
    if (period.isDaytime && next && !next.isDaytime) { days.push({ day: period, night: next }); i++; }
    else if (period.isDaytime) days.push({ day: period, night: null });
    else days.push({ day: null, night: period });
  }
  return days;
}

/**
 * The forecast place's own wall-clock date and hour, read from the timestamp
 * ("2026-10-01T21:00:00-05:00"): the times belong to the searched place, which
 * may be in another time zone than the device.
 * @returns {{dayKey:string, day:string, hour:number}|null}
 */
function forecastLocalTime(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})T(\d{2})/.exec(iso || '');
  if (!m) return null;
  const date = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return {
    dayKey: `${m[1]}-${m[2]}-${m[3]}`,
    day: date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' }),
    hour: +m[4]
  };
}

/** "3 PM" for hour 15. */
function forecastHourLabel(hour) {
  return `${hour % 12 || 12} ${hour < 12 ? 'AM' : 'PM'}`;
}

/* ── Sun, air quality and pressure ───────────────────────────────────────────
   Sunrise, sunset and civil twilight — "first light" and "last light", when the
   sun is 6° below the horizon and it is still light enough to see outdoors — are
   worked out on the device from the date and the place: nothing to download.
   Air quality (the US AQI) and the pressure forecast come from Open-Meteo (free,
   no key), since the NWS forecast has neither. */

/**
 * When the sun crosses two altitudes on a local date at a place: rise and set
 * (−0.833°: the top of the disc, allowing for the air bending its light) and civil
 * twilight (−6°). The usual low-precision solar formulas (as in NOAA's and
 * SunCalc's calculators): within a minute of the US Naval Observatory's times,
 * two in the far north, where the first or last day of the polar night can come
 * out a day off (a few minutes of sun on a day the Observatory gives none).
 * @param {string} dayKey - the place's own date, "2026-10-03"
 * @returns {{sun: (Object|string), light: (Object|string)}|null} each { rise, set }
 *          (ms since 1970), or 'up' (it never sinks that low that day) or 'down'
 *          (it never climbs that high: polar night, or no twilight)
 */
function sunTimes(dayKey, lat, lon) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dayKey || '');
  if (!m || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  const rad = Math.PI / 180, dayMs = 864e5;
  const j2000 = 10957.5;   // 2000-01-01 12:00 UTC, in days since 1970
  const lw = -lon * rad, phi = lat * rad;
  // Days from J2000 to the place's mean noon on that date (its clock aside), so
  // the solar noon found below always falls on that date, even near ±180°.
  const days = Date.UTC(+m[1], +m[2] - 1, +m[3], 12) / dayMs - lon / 360 - j2000;
  const cycle = Math.round(days - lw / (2 * Math.PI));
  // (SunCalc adds 0.0009 day here too; that put every time ~1 min later than the
  // US Naval Observatory's. The sunrise equation proper uses it for the day count only.)
  const approxNoon = lw / (2 * Math.PI) + cycle;
  const anomaly = rad * (357.5291 + 0.98560028 * approxNoon);
  const centre = rad * (1.9148 * Math.sin(anomaly) + 0.02 * Math.sin(2 * anomaly) + 0.0003 * Math.sin(3 * anomaly));
  const eclipticLon = anomaly + centre + rad * 102.9372 + Math.PI;
  const declination = Math.asin(Math.sin(rad * 23.4397) * Math.sin(eclipticLon));
  const noon = approxNoon + 0.0053 * Math.sin(anomaly) - 0.0069 * Math.sin(2 * eclipticLon);
  const toMs = d => (d + j2000) * dayMs;
  const crossing = altitude => {
    const cosHour = (Math.sin(altitude * rad) - Math.sin(phi) * Math.sin(declination)) /
                    (Math.cos(phi) * Math.cos(declination));
    if (cosHour < -1) return 'up';
    if (cosHour > 1) return 'down';
    const half = Math.acos(cosHour) / (2 * Math.PI);   // half the time above it, in days
    return { rise: toMs(noon - half), set: toMs(noon + half) };
  };
  return { sun: crossing(-0.833), light: crossing(-6) };
}

/** A timestamp's offset from UTC in minutes ("…-05:00" → -300), or null without one. */
function isoOffsetMinutes(iso) {
  const m = /(?:([+-])(\d{2}):?(\d{2})|Z)$/.exec(iso || '');
  if (!m) return null;
  return m[1] ? (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]) : 0;
}

/**
 * "7:24 AM": a moment on the place's own clock, `offset` minutes from UTC (taken
 * from the forecast's timestamps, so daylight saving time is already in it).
 */
function clockLabel(ms, offset) {
  const t = new Date(Math.round(ms / 60_000) * 60_000 + offset * 60_000);
  const h = t.getUTCHours();
  return (h % 12 || 12) + ':' + String(t.getUTCMinutes()).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM');
}

/** "11 h 48 min" for a span of time. */
function durationLabel(ms) {
  const minutes = Math.round(ms / 60_000);
  return Math.floor(minutes / 60) + ' h ' + (minutes % 60) + ' min';
}

const OPEN_METEO_AIR      = 'https://air-quality-api.open-meteo.com/v1/air-quality';
const OPEN_METEO_FORECAST = 'https://api.open-meteo.com/v1/forecast';
/** The pollutants Open-Meteo rates on the US AQI scale; the worst one sets the AQI. */
const AQI_POLLUTANTS = {
  us_aqi_pm2_5: 'fine particles (PM2.5)', us_aqi_pm10: 'coarse particles (PM10)',
  us_aqi_ozone: 'ozone', us_aqi_nitrogen_dioxide: 'nitrogen dioxide',
  us_aqi_sulphur_dioxide: 'sulfur dioxide', us_aqi_carbon_monoxide: 'carbon monoxide'
};

/** Whether fetchAirAndPressure's answer has air quality in it. */
function hasAir(extras) {
  return Boolean(extras && (extras.aqiNow != null || extras.aqi.size));
}

/** Whether fetchAirAndPressure's answer has the pressure forecast in it. */
function hasPressure(extras) {
  return Boolean(extras && extras.pressure.size);
}

/** The UTC hour a timestamp falls in, as a key ("2026-10-03T20"); '' if unreadable. */
function utcHourKey(iso) {
  const ms = Date.parse(iso);
  return Number.isFinite(ms) ? new Date(ms).toISOString().slice(0, 13) : '';
}

/**
 * Air quality (US AQI, about 5 days ahead) and sea-level pressure (8 days ahead)
 * for a point, by UTC hour ("2026-10-03T20", as utcHourKey gives for the NWS's
 * times). Never throws: either part that fails is simply empty, and the NWS
 * forecast shows without it.
 * @param {Object} [have] - an earlier answer: only the parts missing from it are
 *        asked for again, and the rest is kept
 * @returns {Promise<{aqi: Map<string,{value:number, pollutant:string}>,
 *                    pressure: Map<string,number>, aqiNow: ?number}>}
 */
async function fetchAirAndPressure(lat, lon, have = null) {
  // Rounded to ~11 km like every other third-party request (and both grids are coarser).
  // UTC times, not the place's clock: Open-Meteo gives a whole answer one UTC offset
  // (today's, wrong across a daylight-saving change), and the rounded point can
  // even fall in the next time zone. UTC hours always line up with the NWS's.
  // past_days=1: the answer starts at 00:00 UTC today, which is the evening in the
  // US; without yesterday's hours, "Tonight" would miss its first ones.
  const where = '?latitude=' + lat.toFixed(1) + '&longitude=' + lon.toFixed(1) + '&timezone=GMT&past_days=1';
  const get = url => fetchJsonWithTimeout(url, {}, 8000)
    .then(({ response, data }) => (response.ok ? data : null), () => null);
  const keepAir = hasAir(have), keepPressure = hasPressure(have);
  const [air, sky] = await Promise.all([
    keepAir ? null
      : get(OPEN_METEO_AIR + where + '&forecast_days=7&current=us_aqi&hourly=us_aqi,' + Object.keys(AQI_POLLUTANTS).join(',')),
    keepPressure ? null : get(OPEN_METEO_FORECAST + where + '&forecast_days=8&hourly=pressure_msl')
  ]);
  // Open-Meteo lists each hour as "2026-10-03T20:00" (UTC, as asked).
  const byHour = (data, read) => {
    const hourly = data?.hourly, out = new Map();
    (Array.isArray(hourly?.time) ? hourly.time : []).forEach((time, i) => {
      const value = read(hourly, i);
      if (value != null) out.set(String(time).slice(0, 13), value);
    });
    return out;
  };
  const aqi = byHour(air, (hourly, i) => {
    const value = hourly.us_aqi?.[i];
    if (!Number.isFinite(value)) return null;
    // The pollutant with the highest index of its own is the one setting the AQI.
    let worst = '', worstValue = -1;
    for (const key of Object.keys(AQI_POLLUTANTS)) {
      const own = hourly[key]?.[i];
      if (Number.isFinite(own) && own > worstValue) { worst = AQI_POLLUTANTS[key]; worstValue = own; }
    }
    return { value: Math.round(value), pollutant: worst };
  });
  const pressure = byHour(sky, (hourly, i) =>
    (Number.isFinite(hourly.pressure_msl?.[i]) ? hourly.pressure_msl[i] : null));
  const now = air?.current?.us_aqi;
  return {
    aqi: keepAir ? have.aqi : aqi,
    aqiNow: keepAir ? have.aqiNow : (Number.isFinite(now) ? Math.round(now) : null),
    pressure: keepPressure ? have.pressure : pressure
  };
}

/**
 * The EPA's AQI category for a value: its name, a level for the colour (1–6) and
 * the EPA's own advice, shortened.
 */
function aqiCategory(value) {
  const levels = [
    [50, 'Good', 'Air quality is fine for everyone.'],
    [100, 'Moderate', 'Unusually sensitive people should consider less long or heavy exertion outdoors.'],
    [150, 'Unhealthy for sensitive groups', 'People with heart or lung disease (asthma included), older adults and children should cut down on long or heavy exertion outdoors.'],
    [200, 'Unhealthy', 'Everyone should cut down on long or heavy exertion outdoors; sensitive groups should avoid it.'],
    [300, 'Very unhealthy', 'Sensitive groups should avoid all activity outdoors; everyone else should avoid long or heavy exertion.'],
    [Infinity, 'Hazardous', 'Everyone should avoid all exertion outdoors.']
  ];
  const index = levels.findIndex(([top]) => value <= top);
  return { label: levels[index][1], level: index + 1, advice: levels[index][2] };
}

/** "AQI 42 Good" as HTML, with a dot in the EPA's colour for the category. */
function aqiHtml(value) {
  const category = aqiCategory(value);
  return '<span class="fc-aqi fc-aqi-' + category.level + '">AQI ' + value + ' ' + category.label + '</span>';
}

/** Sea-level pressure in hPa as inHg ("30.01"), the unit the station panel shows. */
function hpaToInHg(hpa) {
  return (hpa / 33.86389).toFixed(2);
}

/**
 * A forecast row's sun, air and pressure facts: the summary lines (a glance) and
 * the paragraphs shown when the row is opened.
 * @param {Object[]} parts   - the row's NWS periods (a day and its night, or one)
 * @param {Object}  [extras] - fetchAirAndPressure's answer
 * @param {{lat:number, lon:number}} [point] - where the forecast is
 * @returns {{sun: string, air: string, facts: string, sunsetAt: string, aqi: ?number}} HTML
 *          ('' where nothing is known), plus the plain sunset time and worst AQI the
 *          wide-screen week's day columns show
 */
function forecastRowExtras(parts, extras, point) {
  const first = parts[0], last = parts[parts.length - 1];
  // sunsetAt and aqi are plain values for the wide-screen week's day columns.
  const out = { sun: '', air: '', facts: '', sunsetAt: '', aqi: null };
  const facts = [];

  // Sun, on the place's own clock. A day row: that day's sunrise and sunset. A
  // night on its own ("Tonight", "Overnight"): the sunset it starts with and the
  // sunrise it ends with — not its date's, whose sunrise is already over (or, for
  // a night starting after midnight, whose sunset is still to come).
  const when = forecastLocalTime(first?.startTime);
  const offset = isoOffsetMinutes(first?.startTime);
  const endOffset = isoOffsetMinutes(last?.endTime) ?? offset;
  const dateAt = (ms, off) => new Date(ms + off * 60_000).toISOString().slice(0, 10);
  const nightOnly = parts.length === 1 && first?.isDaytime === false;
  const endMs = Date.parse(last?.endTime);
  let eveningKey = when?.dayKey, morningKey = when?.dayKey;
  if (nightOnly && Number.isFinite(endMs) && offset != null) {
    eveningKey = dateAt(endMs - 12 * 3_600_000, offset);   // a night ends in the morning, ~12 h after dusk
    morningKey = dateAt(endMs, endOffset);
  }
  const evening = when && offset != null && point && sunTimes(eveningKey, point.lat, point.lon);
  const morning = evening && nightOnly ? sunTimes(morningKey, point.lat, point.lon) : evening;
  if (evening && morning) {
    // "7:24 AM" — and in the far north, where a summer sunset can come after
    // midnight, the day it falls on when that isn't `dayKey`.
    const clock = (ms, off, dayKey) => {
      const date = dateAt(ms, off);
      return clockLabel(ms, off) +
        (date > dayKey ? ' (after midnight)' : date < dayKey ? ' (the evening before)' : '');
    };
    const atDusk = ms => clock(ms, offset, eveningKey);
    const atDawn = ms => clock(ms, nightOnly ? endOffset : offset, morningKey);
    if (typeof evening.sun === 'object' && typeof morning.sun === 'object') {
      // Sunset first and brightest: the time most people look for at a glance.
      out.sunsetAt = atDusk(evening.sun.set);
      out.sun = '<span class="fc-sunset"><span aria-hidden="true">🌇 </span>Sunset ' + out.sunsetAt +
                '</span> · <span aria-hidden="true">🌅 </span>Sunrise ' + atDawn(morning.sun.rise);
      // Opened: in time order, twilight included ("last light" is when it gets too
      // dark to see outdoors without lights, some 25 minutes after sunset).
      const firstLight = typeof morning.light === 'object' && 'first light ' + atDawn(morning.light.rise);
      const lastLight = typeof evening.light === 'object' ? 'last light ' + atDusk(evening.light.set)
        : evening.light === 'up' && 'light all night';
      const sunrise = 'sunrise ' + atDawn(morning.sun.rise), sunset = 'sunset ' + atDusk(evening.sun.set);
      const steps = (nightOnly ? [sunset, lastLight, firstLight, sunrise] : [firstLight, sunrise, sunset, lastLight])
        .filter(Boolean).join(' · ');
      const span = nightOnly
        ? durationLabel(morning.sun.rise - evening.sun.set) + ' from sunset to sunrise'
        : durationLabel(evening.sun.set - morning.sun.rise) + ' of sun';
      facts.push('<p><b>Daylight:</b> ' + steps + ' (' + span + ')</p>');
    } else if (nightOnly && (typeof evening.sun === 'object' || typeof morning.sun === 'object')) {
      // The night the midnight sun or polar night starts or ends: one side of it has
      // a sunset or sunrise and the other doesn't, so each half is told as it is
      // (Utqiaġvik, May 10: "Sunset 1:50 AM (after midnight) · then the sun stays up").
      const dusk = typeof evening.sun === 'object';
      const dawn = typeof morning.sun === 'object';
      if (dusk) out.sunsetAt = atDusk(evening.sun.set);
      out.sun = '<span class="fc-sunset"><span aria-hidden="true">🌇 </span>' +
        (dusk ? 'Sunset ' + atDusk(evening.sun.set) : 'No sunset') + '</span> · ' +
        (dawn ? '<span aria-hidden="true">🌅 </span>Sunrise ' + atDawn(morning.sun.rise)
          : morning.sun === 'up' ? 'then the sun stays up' : 'No sunrise');
      const halves = [
        ...(dusk ? ['sunset ' + atDusk(evening.sun.set),
                    typeof evening.light === 'object' && 'last light ' + atDusk(evening.light.set)]
          : ['no sunset']),
        ...(dawn ? [typeof morning.light === 'object' && 'first light ' + atDawn(morning.light.rise),
                    'sunrise ' + atDawn(morning.sun.rise)]
          : morning.sun === 'up' ? ['then the sun stays up all day']
          : ['no sunrise: the sun stays down all day' + (typeof morning.light === 'object'
              ? ', with twilight from ' + atDawn(morning.light.rise) + ' to ' + atDawn(morning.light.set) : '')])
      ].filter(Boolean).join(' · ');
      facts.push('<p><b>Daylight:</b> ' + halves + '.</p>');
    } else {
      // Midnight sun or polar night (all day, or on both sides of the night).
      if (evening.sun === 'up') {
        out.sun = '<span class="fc-sunset"><span aria-hidden="true">☀️ </span>No sunset</span> — the sun stays up all day';
        facts.push('<p><b>Daylight:</b> the sun stays up all day.</p>');
      } else {
        out.sun = '<span aria-hidden="true">🌑 </span>No sunrise — the sun stays down all day';
        facts.push('<p><b>Daylight:</b> the sun stays down all day' + (typeof evening.light === 'object'
          ? '; twilight from ' + atDusk(evening.light.rise) + ' to ' + atDusk(evening.light.set) : '') + '.</p>');
      }
    }
  }

  // Air and pressure: the hours the row covers, from its first period's start to
  // its last one's end, as UTC hour keys (in which string order is time order).
  const from = utcHourKey(first?.startTime), to = utcHourKey(last?.endTime);
  const rowHours = (Date.parse(last?.endTime) - Date.parse(first?.startTime)) / 3_600_000;
  // A forecast that runs out early in the row would pass a few hours off as the
  // whole day (the afternoon's ozone peak missing): it needs half the row or more.
  const within = map => {
    const hours = [...(map || new Map())].filter(([key]) => key >= from && key < to);
    return hours.length * 2 >= rowHours ? hours : [];
  };
  // "3 PM": a UTC hour key on the place's clock (the offset of the period it is in).
  const hourOf = key => {
    const ms = Date.parse(key + ':00:00Z');
    const part = parts.find(p => ms >= Date.parse(p.startTime) && ms < Date.parse(p.endTime)) || first;
    const startOffset = isoOffsetMinutes(part?.startTime) ?? offset ?? 0;
    const endOffset = isoOffsetMinutes(part?.endTime) ?? startOffset;
    // A night the clocks change in (its start and end differ in offset): they change
    // at 2 AM on the old clock (the US rule), so the hours after use the new offset.
    const changeAt = endOffset === startOffset ? Infinity : Date.parse(
      new Date(Date.parse(part.endTime) + startOffset * 60_000).toISOString().slice(0, 10) + 'T02:00:00Z') - startOffset * 60_000;
    const partOffset = ms >= changeAt ? endOffset : startOffset;
    return forecastHourLabel(new Date(ms + partOffset * 60_000).getUTCHours());
  };
  // "; the air-quality forecast runs to 8 AM" when it ends before the row's last
  // hour (hours missing elsewhere, say a gap in the data, are no end).
  const runsOut = (hours, what) => {
    const lastKey = hours[hours.length - 1][0];
    return lastKey < utcHourKey(new Date(Date.parse(last.endTime) - 3_600_000).toISOString())
      ? '; the ' + what + ' forecast runs to ' + hourOf(lastKey) : '';
  };

  const air = within(extras?.aqi);
  if (air.length) {
    const [worstKey, worst] = air.reduce((a, b) => (b[1].value > a[1].value ? b : a));
    const category = aqiCategory(worst.value);
    out.air = aqiHtml(worst.value);
    out.aqi = worst.value;
    facts.push('<p><b>Air quality:</b> up to ' + worst.value + ', ' + category.label.toLowerCase() +
      (worst.pollutant ? ' — mostly ' + worst.pollutant : '') + ', worst around ' + hourOf(worstKey) +
      runsOut(air, 'air-quality') + '. ' + category.advice + '</p>');
  }

  const pressure = within(extras?.pressure);
  if (pressure.length) {
    const start = pressure[0][1], end = pressure[pressure.length - 1][1];
    const change = end - start;
    // Over a day, a couple of hPa is the normal ebb and flow; 6 or more is a big swing.
    const trend = Math.abs(change) < 2 ? 'steady' : (change > 0 ? 'rising' : 'falling') +
      (Math.abs(change) >= 6 ? ' sharply' : '');
    const [lowKey, low] = pressure.reduce((a, b) => (b[1] < a[1] ? b : a));
    const span = trend === 'steady' ? hpaToInHg((start + end) / 2) + ' inHg'
      : hpaToInHg(start) + ' → ' + hpaToInHg(end) + ' inHg';
    out.air += (out.air ? ' · ' : '') + 'Pressure ' + trend + ', ' + span;
    // The change is told from the rounded ends, so it adds up with the numbers beside it.
    facts.push('<p><b>Pressure:</b> ' + hpaToInHg(start) + ' → ' + hpaToInHg(end) + ' inHg (' +
      Math.round(start) + ' → ' + Math.round(end) + ' hPa), ' + trend +
      (trend === 'steady' ? '' : ' by ' + Math.abs(Math.round(end) - Math.round(start)) + ' hPa') +
      '; lowest ' + hpaToInHg(low) + ' inHg around ' + hourOf(lowKey) + runsOut(pressure, 'pressure') + '.</p>');
  }

  // A time never breaks across lines ("7:41 | PM"): a no-break space before AM/PM.
  const keepTimes = html => html.replace(/(\d) (AM|PM)\b/g, '$1\u00A0$2');
  out.sun = keepTimes(out.sun);
  out.facts = keepTimes(facts.join(''));
  return out;
}

/**
 * The 7-day forecast as one row per day: the day's sky, its high and the night's
 * low (↑ 73° ↓ 63°, with °C below), the night's sky, the higher of the two rain
 * chances and the day's wind, then the sunset and sunrise, and the air quality
 * and pressure where known. Each row opens to the forecaster's full wording for
 * the day and the night, then the daylight, air and pressure in detail.
 * @param {Object[]} periods - the NWS 7-day periods
 * @param {Object}  [extras] - fetchAirAndPressure's answer
 * @param {{lat:number, lon:number}} [point] - where the forecast is (for the sun)
 */
function renderForecastDays(periods, extras, point) {
  if (!periods.length) return '<p class="fc-empty">The NWS sent no forecast periods.</p>';
  return forecastDayPairs(periods).map(({ day, night }) => {
    const main = day || night;   // the day's own period, or a night on its own
    const high = day && forecastDegrees(day);
    const low = night && forecastDegrees(night);
    // ↑ high and ↓ low — the arrows are for the eye; screen readers hear the words.
    const tempHtml = (part, word, d) => '<span class="fc-' + part + '"><span aria-hidden="true">' +
      (part === 'hi' ? '↑' : '↓') + '</span><span class="sr-only">' + word + ' </span>' + d.f + '°</span>';
    const temps = [high && tempHtml('hi', 'High', high), low && tempHtml('lo', 'Low', low)].filter(Boolean);
    const celsius = [high, low].filter(Boolean).map(d => d.c + '°').join(' / ');
    const pops = [day, night].map(p => p?.probabilityOfPrecipitation?.value).filter(v => v != null);
    const pop = pops.length ? Math.max(...pops) : null;
    const wind = [main.windDirection, main.windSpeed].filter(Boolean).join(' ');
    const meta = [pop ? '💧 ' + Math.round(pop) + '% chance of rain' : '', wind ? 'Wind ' + wind : '']
      .filter(Boolean).map(escapeHtml).join(' · ');
    const nightSky = day && night && night.shortForecast
      ? '<span class="fc-night-sky">Night: ' + escapeHtml(night.shortForecast) + '</span>' : '';
    const words = [day, night].filter(Boolean).map(p =>
      '<p><b>' + escapeHtml(p.name || '') + ':</b> ' + escapeHtml(p.detailedForecast || '') + '</p>').join('');
    const more = forecastRowExtras([day, night].filter(Boolean), extras, point);
    return '<details class="fc-day' + (day ? '' : ' fc-night') + '"><summary>' +
        '<span class="fc-icon" aria-hidden="true">' + forecastEmoji(main.shortForecast, !!day) + '</span>' +
        '<span class="fc-name">' + escapeHtml(main.name || '') + '</span>' +
        '<span class="fc-temps">' + (temps.length ? temps.join('') + '<small>' + celsius + 'C</small>' : '—') + '</span>' +
        '<span class="fc-short">' + escapeHtml(main.shortForecast || '') + nightSky + '</span>' +
        (meta ? '<span class="fc-meta">' + meta + '</span>' : '') +
        (more.sun ? '<span class="fc-sun">' + more.sun + '</span>' : '') +
        (more.air ? '<span class="fc-air">' + more.air + '</span>' : '') +
      '</summary>' + words + more.facts + '</details>';
  }).join('');
}

/**
 * The next 48 hours (hours already over are skipped): at a glance in the hour
 * strip (renderHourStrip), then in full, under a heading per day, each hour with
 * its air quality and pressure where known.
 * @param {Object}  [extras] - fetchAirAndPressure's answer
 * @param {{lat:number, lon:number}} [point] - where the forecast is (for the nights)
 */
function renderForecastHours(periods, now = Date.now(), extras, point) {
  const upcoming = periods.filter(period => Date.parse(period?.endTime) > now).slice(0, 48);
  if (!upcoming.length) return '<p class="fc-empty">The NWS sent no hourly forecast.</p>';
  let lastDay = '';
  const rows = upcoming.map(period => {
    const when = forecastLocalTime(period.startTime);
    let heading = '';
    if (when && when.dayKey !== lastDay) {
      heading = `<li class="fc-hour-day">${escapeHtml(when.day)}</li>`;
      lastDay = when.dayKey;
    }
    const pop = period.probabilityOfPrecipitation?.value;
    const wind = [period.windDirection, period.windSpeed].filter(Boolean).join(' ');
    const popText = pop != null ? '💧' + Math.round(pop) + '%' : '';
    // The same hour in Open-Meteo's lists, by UTC ("2026-10-03T20").
    const key = utcHourKey(period.startTime);
    const air = extras?.aqi?.get(key);
    const hpa = extras?.pressure?.get(key);
    // Every cell is always there (empty when unknown): on wide screens they line up
    // as table columns; on phones sky and wind share a line, air and pressure the next.
    const cell = (name, html) => '<span class="fc-hour-' + name + '">' + html + '</span>';
    const extra = air || hpa != null
      ? '<span class="fc-hour-air">' + cell('aqi', air ? aqiHtml(air.value) : '') +
        cell('press', hpa != null ? hpaToInHg(hpa) + ' inHg' : '') + '</span>' : '';
    return `${heading}<li class="fc-hour">
      <span class="fc-hour-time">${when ? forecastHourLabel(when.hour) : ''}</span>
      <span class="fc-icon" aria-hidden="true">${forecastEmoji(period.shortForecast, period.isDaytime)}</span>
      <span class="fc-temp">${forecastTemp(period)}</span>
      <span class="fc-hour-pop" style="--pop:${pop != null ? Math.round(pop) : 0}%">${popText}</span>
      <span class="fc-hour-short">` + cell('sky', escapeHtml(period.shortForecast || '')) +
        cell('wind', escapeHtml(wind)) + extra + `</span>
    </li>`;
  });
  // Column names for the wide-screen table (hidden on phones, where rows wrap).
  const head = '<li class="fc-hour fc-hour-head" aria-hidden="true"><span>Time</span><span></span>' +
    '<span>Temperature</span><span>Rain</span><span>Sky</span><span>Wind</span>' +
    (extras && (extras.aqi.size || extras.pressure.size) ? '<span>Air quality</span><span>Pressure</span>' : '') + '</li>';
  return renderHourStrip(upcoming, now, extras, point) + `<ul class="fc-hours">${head}${rows.join('')}</ul>`;
}

/* ── The hours at a glance (every screen) ────────────────────────────────────
   The HOURLY tab opens with the next 48 hours side by side, one column per hour:
   time, sky and temperature, a curve running through the temperatures, then each
   hour's chance of rain (a bar), wind (an arrow pointing where it blows), air
   quality and pressure — the nights shaded from sunset to sunrise, as in the week.
   It scrolls sideways (swipe, or the ‹ › buttons with a mouse); the row names stay
   put on the left. Clicking an hour shows it in the full list below, which is also
   the accessible version of the same numbers. */

/** Each hour column's width in px (the CSS uses the same). */
const STRIP_COL = 56;
/** The temperature graph's row in a column: where it starts (8 px padding + the
    time and sky rows), its height, where its top gridline sits, the room under the
    lowest dot, and how far above its dot a value's label reaches (px). The
    sunset/sunrise row comes right after it. */
const STRIP_CURVE = { top: 58, height: 124, pad: 8, base: 12, label: 22 };
/** The 16 compass points, for turning "NNE" into degrees. */
const STRIP_COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];

/** The hour strip as HTML ('' with fewer than two hours). */
function renderHourStrip(hours, now, extras, point) {
  const t0 = Date.parse(hours[0]?.startTime), t1 = Date.parse(hours[hours.length - 1]?.endTime);
  if (hours.length < 2 || !(t1 > t0)) return '';
  const x = t => (t - t0) / 3_600_000 * STRIP_COL;
  const temps = hours.map(p => forecastDegrees(p)?.f);
  const known = temps.filter(Number.isFinite);
  // The graph's scale: round steps (2°, 5° or 10°, to give a few gridlines) from
  // the coolest hour's step to the warmest's, the top gridline near the top of the
  // row — no empty band under the sky icons.
  const min = Math.min(...known), max = Math.max(...known);
  const step = max - min <= 10 ? 2 : max - min <= 24 ? 5 : 10;
  const low = Math.floor(min / step) * step;
  const plot = STRIP_CURVE.height - STRIP_CURVE.pad - STRIP_CURVE.base;
  // The top: the warmest hour's step — or, when its label (above its dot) would
  // rise out of the graph, just the few degrees more it needs, not a whole step.
  const room = (STRIP_CURVE.label - STRIP_CURVE.pad) / plot;
  const high = Math.max(Math.ceil(max / step) * step, low + step, (max - room * low) / (1 - room));
  const ticks = known.length
    ? Array.from({ length: Math.floor((high - low) / step + 1e-9) + 1 }, (_, i) => low + i * step) : [];
  const y = f => STRIP_CURVE.pad + (1 - (f - low) / (high - low)) * plot;
  let anyAir = false, anyPressure = false;

  const cols = hours.map((p, i) => {
    const when = forecastLocalTime(p.startTime);
    const pop = p.probabilityOfPrecipitation?.value;
    const key = utcHourKey(p.startTime);
    const air = extras?.aqi?.get(key), hpa = extras?.pressure?.get(key);
    anyAir ||= !!air;
    anyPressure ||= hpa != null;
    const isNow = i === 0 && now >= t0;
    const newDay = when && when.hour === 0;
    // At midnight the day's name takes the time's place ("Sun").
    const time = isNow ? 'Now' : newDay ? when.day.slice(0, 3) : when ? forecastHourLabel(when.hour) : '';
    // Wind: the arrow points where the wind blows (from NNE → toward SSW).
    const from = STRIP_COMPASS.indexOf(String(p.windDirection || '').toUpperCase());
    const speed = (String(p.windSpeed || '').match(/\d+/g) || []).join('–');
    return '<div class="fc-strip-col' + (newDay ? ' fc-strip-day' : '') + (isNow ? ' fc-strip-now' : '') +
        '" data-hour="' + i + '">' +
      '<span class="fc-strip-time">' + escapeHtml(time) + '</span>' +
      '<span class="fc-strip-icon">' + forecastEmoji(p.shortForecast, p.isDaytime) + '</span>' +
      '<span class="fc-strip-curve"></span><span class="fc-strip-sunrow"></span>' +
      '<span class="fc-strip-rain">' + (pop > 0 ? '<i style="height:' + Math.max(2, Math.round(pop / 100 * 30)) + 'px"></i>' : '') +
        '<small>' + (pop != null ? Math.round(pop) + '%' : '') + '</small></span>' +
      // ("Variable" or another word: a ~ in place of the arrow.)
      '<span class="fc-strip-wind">' + (from >= 0 ? '<i style="transform:rotate(' + (from * 22.5 + 180) + 'deg)">↑</i>'
        : p.windDirection ? '<i>~</i>' : '') + '<small>' + escapeHtml(speed) + '</small></span>' +
      '<span class="fc-strip-aqi">' + (air ? '<span class="fc-aqi fc-aqi-' + aqiCategory(air.value).level + '">' + air.value + '</span>' : '') + '</span>' +
      '<span class="fc-strip-press">' + (hpa != null ? hpaToInHg(hpa) : '') + '</span>' +
    '</div>';
  }).join('');

  // The temperature graph: gridlines on the scale's round steps, the curve through
  // the middle of each column, and each hour's temperature right above its dot.
  const pts = hours.map((p, i) => Number.isFinite(temps[i]) ? [i * STRIP_COL + STRIP_COL / 2, y(temps[i]), temps[i]] : null)
    .filter(Boolean);
  const width = hours.length * STRIP_COL;
  const line = smoothPath(pts);
  const area = pts.length > 1 ? line + 'L' + weekNum(pts[pts.length - 1][0]) + ',' + STRIP_CURVE.height +
    'L' + weekNum(pts[0][0]) + ',' + STRIP_CURVE.height + 'Z' : '';
  const grid = ticks.map(t => '<line class="fc-strip-grid" x1="0" x2="' + width + '" y1="' + weekNum(y(t)) +
    '" y2="' + weekNum(y(t)) + '"/>').join('');
  const curve = '<svg class="fc-strip-svg" width="' + width + '" height="' + STRIP_CURVE.height + '" viewBox="0 0 ' + width + ' ' +
      STRIP_CURVE.height + '" style="top:' + STRIP_CURVE.top + 'px" aria-hidden="true" focusable="false">' +
    '<defs><linearGradient id="fc-strip-heat" gradientUnits="userSpaceOnUse" x1="0" y1="' + STRIP_CURVE.pad + '" x2="0" y2="' +
      (STRIP_CURVE.height - STRIP_CURVE.base) + '"><stop offset="0" stop-color="#ffb37a"/><stop offset="1" stop-color="#8fd3ff"/></linearGradient></defs>' +
    grid + (area ? '<path class="fc-strip-area" d="' + area + '"/>' : '') + '<path class="fc-strip-line" d="' + line + '"/>' +
    pts.map(([cx, cy]) => '<circle cx="' + weekNum(cx) + '" cy="' + weekNum(cy) + '" r="3.5"/>').join('') +
    pts.map(([cx, cy, f]) => '<text class="fc-strip-val" x="' + weekNum(cx) + '" y="' + weekNum(cy - 9) + '">' + f + '°</text>').join('') +
    '</svg>';

  // The nights, and when the sun sets and rises (on the clock of the hour it falls
  // in: the 48 hours can span a daylight-saving change).
  const offsetAt = t => isoOffsetMinutes((hours.find(p => t < Date.parse(p.endTime)) || hours[0]).startTime);
  const nights = [], marks = [];
  for (const band of sunBands(t0, t1, point, hours[0].startTime)) {
    const from = Math.max(band.from, t0), to = Math.min(band.to, t1);
    if (to > from) nights.push('<span class="fc-strip-band fc-wk-' + band.kind + '" style="left:' + weekNum(x(from)) +
      'px;width:' + weekNum(x(to) - x(from)) + 'px"></span>');
    const sunset = band.kind === 'dusk' || band.kind === 'twilight' ? band.from : null;
    const sunrise = band.kind === 'dawn' || band.kind === 'twilight' ? band.to : null;
    for (const [at, emoji, word] of [[sunset, '🌇', 'Sunset'], [sunrise, '🌅', 'Sunrise']]) {
      const offset = at != null && at > t0 && at < t1 ? offsetAt(at) : null;
      if (offset != null) {
        // In their own row under the curve: neither the hours nor the curve covered.
        marks.push('<span class="fc-strip-sun" style="left:' + weekNum(x(at)) + 'px;top:' +
          (STRIP_CURVE.top + STRIP_CURVE.height) + 'px" title="' + word + '">' +
          emoji + ' ' + clockLabel(at, offset) + '</span>');
      }
    }
  }

  // Row names, pinned on the left while the hours scroll (each row says what it is);
  // the graph's row carries its scale, each step level with its gridline, with the
  // unit right above the top number (at the foot of the sky row's empty cell).
  const unit = ticks.length ? '<span class="fc-strip-unit">°F</span>' : '';
  const scale = '<span class="fc-strip-scale">' + ticks.map(t =>
    '<i style="top:' + weekNum(y(t)) + 'px">' + t + '°</i>').join('') + '</span>';
  const labels = ['', unit, scale, '', 'Rain', 'Wind mph', anyAir ? 'Air AQI' : '', anyPressure ? 'Pressure' : '']
    .map(text => (text.startsWith('<') ? text : '<span>' + text + '</span>')).join('');
  return '<div class="fc-strip-wrap">' +
    // Drawn for the eye: the list under it reads the same hours out in full.
    // (tabindex -1: browsers make a scroll box focusable by itself — not this one.)
    '<div class="fc-strip" aria-hidden="true" tabindex="-1">' +
      '<div class="fc-strip-labels">' + labels + '</div>' +
      '<div class="fc-strip-cols" style="width:' + width + 'px">' + nights.join('') + cols + curve + marks.join('') + '</div>' +
    '</div>' +
    // Mouse-only, like the strip they scroll: screen readers have the list.
    '<button type="button" class="fc-strip-nav fc-strip-prev" aria-hidden="true" tabindex="-1" title="Earlier hours">‹</button>' +
    '<button type="button" class="fc-strip-nav fc-strip-next" aria-hidden="true" tabindex="-1" title="Later hours">›</button>' +
  '</div>';
}

/** Show or hide the strip's ‹ › buttons by whether there is more to scroll that way. */
function updateHourStripNav(strip) {
  const wrap = strip?.parentElement;
  if (!wrap) return;
  const more = strip.scrollWidth - strip.clientWidth;
  wrap.querySelector('.fc-strip-prev').hidden = strip.scrollLeft <= 1;
  wrap.querySelector('.fc-strip-next').hidden = strip.scrollLeft >= more - 1;
}

// The strip: ‹ › step six hours; clicking an hour shows it in the full list.
fcHours.addEventListener('click', e => {
  const nav = e.target.closest('.fc-strip-nav');
  if (nav) {
    const strip = nav.parentElement.querySelector('.fc-strip');
    strip.scrollBy({ left: (nav.classList.contains('fc-strip-next') ? 1 : -1) * 6 * STRIP_COL,
                     behavior: prefersReducedMotion.matches ? 'auto' : 'smooth' });
    return;
  }
  const col = e.target.closest('.fc-strip-col');
  if (!col) return;
  const row = fcHours.querySelectorAll('.fc-hour:not(.fc-hour-head)')[+col.dataset.hour];
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: prefersReducedMotion.matches ? 'auto' : 'smooth' });
  fcHours.querySelectorAll('.fc-hour-picked').forEach(el => el.classList.remove('fc-hour-picked'));
  void row.offsetWidth;   // restart the highlight if the same hour is clicked again
  row.classList.add('fc-hour-picked');
});
// (Scroll events don't bubble: listen in the capture phase.)
fcHours.addEventListener('scroll', e => {
  if (e.target.classList?.contains('fc-strip')) updateHourStripNav(e.target);
}, true);
window.addEventListener('resize', () => {
  if (forecastDialog.open && !fcHours.hidden) updateHourStripNav(fcHours.querySelector('.fc-strip'));
});

/* ── The week at a glance (wide screens) ─────────────────────────────────────
   On a wide screen the 7-day forecast becomes a timeline: the days side by side,
   and under them one continuous chart of their hours — temperature, chance of
   rain, air quality and pressure, each on its own strip and scale — with every
   night shaded from sunset to sunrise. Each day's column sits right above its own
   hours. Picking a day (or a spot on the chart) shows its full forecast below.
   Phones keep the list (renderForecastDays); CSS shows one or the other. */

/** The chart's width in SVG units (stretched to fit; strokes keep their width). */
const WEEK_W = 1000;
/** Strip heights in px, and where each plot lies inside its strip. */
const WEEK_TEMP     = { height: 192, top: 60, bottom: 150 };   // room for the labels above and below
const WEEK_RAIN     = { height: 58, base: 52, full: 32 };   // a 100% chance rises `full` px
const WEEK_AIR      = { height: 40, top: 24, band: 8 };
const WEEK_PRESSURE = { height: 80, top: 32, bottom: 56 };   // room under the low's label

let weekModel = null;   // the open forecast's week, for the chart's pointer and keys
let weekHour  = -1;     // the hour the chart's cursor is on; -1 = none

/** A fraction of the chart's width as a CSS left/width ("12.500%"). */
const weekPct = x => (x * 100).toFixed(3) + '%';
/** One decimal: plenty for SVG coordinates, and keeps the markup small. */
const weekNum = v => Math.round(v * 10) / 10;
/** A labelled point near the chart's edge leans its label inwards (CSS). */
const weekEdge = x => (x < 0.05 ? ' fc-wk-pt-start' : x > 0.92 ? ' fc-wk-pt-end' : '');

/**
 * The week laid out: the day columns (a day and its night, as in the list), the
 * hours placed under them, the nights to shade and each strip's scale.
 * @returns {Object|null} null when the NWS sent no usable periods
 */
function forecastWeekModel(periods, hours, extras, point) {
  const rows = forecastDayPairs(periods).map(({ day, night }) => {
    const parts = [day, night].filter(Boolean);
    return { day, night, parts,
             start: Date.parse(parts[0].startTime), end: Date.parse(parts[parts.length - 1].endTime) };
  }).filter(row => row.end > row.start);   // (an unreadable time fails this too)
  if (!rows.length) return null;
  // Columns as wide as their hours, but never under 20, so a part day ("Tonight", or
  // "This Afternoon" opened at 5 PM) still has room for its name and numbers (at
  // 1024 px too). The chart follows the same columns, its time running evenly within each.
  const weights = rows.map(row => Math.max((row.end - row.start) / 3_600_000, 20));
  const total = weights.reduce((a, b) => a + b, 0);
  let edge = 0;
  rows.forEach((row, i) => {
    row.from = edge / total;
    row.width = weights[i] / total;
    edge += weights[i];
    row.more = forecastRowExtras(row.parts, extras, point);
  });
  const t0 = rows[0].start, t1 = rows[rows.length - 1].end;
  /** Where a moment falls across the chart, 0–1. */
  const xAt = t => {
    if (!(t > t0)) return 0;
    if (t >= t1) return 1;
    const row = rows.find(r => t < r.end);
    return row.from + (t - row.start) / (row.end - row.start) * row.width;
  };
  // Each hour at its middle, with its air quality and pressure (matched by UTC hour).
  const points = (hours || []).map(period => {
    const key = utcHourKey(period.startTime);
    return { period, t: Date.parse(period.startTime) + 1_800_000, deg: forecastDegrees(period),
             air: extras?.aqi?.get(key), hpa: extras?.pressure?.get(key) };
  }).filter(h => h.deg && h.t >= t0 && h.t < t1);
  points.forEach(h => { h.x = xAt(h.t); });
  // Each strip its own scale (never two on one plot); a flat week still gets 4 units.
  const temps = points.map(h => h.deg.f), hpas = points.map(h => h.hpa).filter(v => v != null);
  const lowT = Math.min(...temps), spanT = Math.max(Math.max(...temps) - lowT, 4);
  const lowP = Math.min(...hpas), spanP = Math.max(Math.max(...hpas) - lowP, 4);
  return {
    rows, points, t0, t1, xAt, selected: 0,
    nights: weekNights(rows, point, xAt),
    tempY: f => WEEK_TEMP.top + (1 - (f - lowT) / spanT) * (WEEK_TEMP.bottom - WEEK_TEMP.top),
    pressureY: hpa => WEEK_PRESSURE.top + (1 - (hpa - lowP) / spanP) * (WEEK_PRESSURE.bottom - WEEK_PRESSURE.top)
  };
}

/**
 * The stretches to shade between t0 and t1 (ms), from the sun at the place: dusk
 * (sunset to last light), night (last light to first light), dawn (first light to
 * sunrise), or all twilight where it never gets fully dark; a polar-night day is
 * all night. Not clipped: a band can start before t0 or end after t1.
 * @param {string} startIso - a timestamp at t0, for the place's date and UTC offset
 * @returns {{kind: string, from: number, to: number}[]}
 */
function sunBands(t0, t1, point, startIso) {
  const first = forecastLocalTime(startIso);
  const offset = isoOffsetMinutes(startIso);
  if (!point || !first || offset == null || !(t1 > t0)) return [];
  const shift = (key, days) => new Date(Date.parse(key + 'T00:00:00Z') + days * 86_400_000).toISOString().slice(0, 10);
  const midnight = key => Date.parse(key + 'T00:00:00Z') - offset * 60_000;
  const sun = key => sunTimes(key, point.lat, point.lon);
  const bands = [];
  // From the evening before the first day (its night may still be on) to past the last.
  let key = shift(first.dayKey, -1), yesterday = sun(shift(key, -1));
  for (let i = 0, days = Math.ceil((t1 - t0) / 86_400_000) + 2; i < days; i++, key = shift(key, 1)) {
    const today = sun(key), next = sun(shift(key, 1)), end = midnight(shift(key, 1));
    if (today.sun === 'down') {
      bands.push({ kind: 'night', from: midnight(key), to: end });   // polar night: all day
    } else if (typeof today.sun === 'object') {   // (the midnight sun, 'up': no night at all)
      const { rise: up, set } = today.sun;
      // The first sunrise after polar night: the night before ended at midnight, so
      // this morning's dark (and its first light) is this day's to shade.
      if (yesterday.sun === 'down') {
        const light = typeof today.light === 'object' && today.light.rise > midnight(key) && today.light.rise < up
          ? today.light.rise : null;
        bands.push(...(light != null ? [{ kind: 'night', from: midnight(key), to: light }, { kind: 'dawn', from: light, to: up }]
                                     : [{ kind: 'dawn', from: midnight(key), to: up }]));
      }
      const dark = typeof today.light === 'object' ? today.light.set : null;
      if (typeof next.sun === 'object') {
        const rise = next.sun.rise;
        const light = typeof next.light === 'object' ? next.light.rise : null;
        if (dark != null && light != null && light > dark) {
          bands.push({ kind: 'dusk', from: set, to: dark }, { kind: 'night', from: dark, to: light },
                     { kind: 'dawn', from: light, to: rise });
        } else {
          bands.push({ kind: 'twilight', from: set, to: rise });   // never fully dark (the far north in summer)
        }
      } else if (next.sun === 'down') {
        // Polar night from tomorrow: dusk, then night to midnight (tomorrow shades
        // itself). No dawn: its end would read as a sunrise that never comes.
        const dusk = dark != null && dark > set && dark < end ? dark : end;
        bands.push({ kind: 'dusk', from: set, to: dusk });
        if (dusk < end) bands.push({ kind: 'night', from: dusk, to: end });
      } else {
        // The midnight sun from tomorrow: the sun only dips below the horizon. Its
        // sunset is still marked (an empty band: nothing to shade).
        bands.push({ kind: 'dusk', from: set, to: set });
      }
    }
    yesterday = today;
  }
  return bands;
}

/** The week's nights as chart fractions (see sunBands). */
function weekNights(rows, point, xAt) {
  const t0 = rows[0].start, t1 = rows[rows.length - 1].end;
  return sunBands(t0, t1, point, rows[0].parts[0].startTime)
    .map(band => ({ kind: band.kind, from: xAt(Math.max(band.from, t0)), to: xAt(Math.min(band.to, t1)) }))
    .filter(band => band.to > band.from);
}

/**
 * An SVG path through points [x, y]: smooth, but never bulging past them (a
 * monotone cubic — the curve shows no high or low the data doesn't have).
 */
function smoothPath(pts) {
  if (!pts.length) return '';
  const xy = (x, y) => weekNum(x) + ',' + weekNum(y);
  if (pts.length < 2) return 'M' + xy(pts[0][0], pts[0][1]);
  const n = pts.length, slope = [], tangent = [];
  for (let i = 0; i < n - 1; i++) slope[i] = (pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]);
  tangent[0] = slope[0];
  tangent[n - 1] = slope[n - 2];
  for (let i = 1; i < n - 1; i++) tangent[i] = slope[i - 1] * slope[i] <= 0 ? 0 : (slope[i - 1] + slope[i]) / 2;
  // Fritsch–Carlson: shorten tangents that would make a segment overshoot.
  for (let i = 0; i < n - 1; i++) {
    if (slope[i] === 0) { tangent[i] = tangent[i + 1] = 0; continue; }
    const a = tangent[i] / slope[i], b = tangent[i + 1] / slope[i], h = a * a + b * b;
    if (h > 9) { const k = 3 / Math.sqrt(h); tangent[i] = k * a * slope[i]; tangent[i + 1] = k * b * slope[i]; }
  }
  let d = 'M' + xy(pts[0][0], pts[0][1]);
  for (let i = 0; i < n - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], third = (x1 - x0) / 3;
    d += 'C' + xy(x0 + third, y0 + tangent[i] * third) + ' ' + xy(x1 - third, y1 - tangent[i + 1] * third) + ' ' + xy(x1, y1);
  }
  return d;
}

/** A day's column: name and date, sky, high and low, rain chance, sunset, air. */
function forecastWeekDayHtml(row, index, selected) {
  const main = row.day || row.night;
  const when = forecastLocalTime(main.startTime);
  const [weekday, date] = (when?.day || '').split(', ');
  // The NWS calls part of today "This Afternoon" (or "Today") and a night "Tonight".
  const name = !row.day ? main.name || weekday : /^(this|today)\b/i.test(main.name || '') ? 'Today' : weekday || main.name;
  // "Wed"; a night longer than "Tonight" ("Overnight") is "Night" (its date is under it).
  const shortName = name === weekday ? name.slice(0, 3) : !row.day && (name || '').length > 7 ? 'Night' : name || '';
  const temp = (part, word, d) => d ? '<span class="fc-' + part + '"><span aria-hidden="true">' +
    (part === 'hi' ? '↑' : '↓') + '</span><span class="sr-only">' + word + ' </span>' + d.f + '°</span>' : '';
  const temps = temp('hi', 'High', row.day && forecastDegrees(row.day)) + temp('lo', 'Low', row.night && forecastDegrees(row.night));
  const pops = row.parts.map(p => p.probabilityOfPrecipitation?.value).filter(v => v != null);
  const pop = pops.length ? Math.round(Math.max(...pops)) : null;
  return '<button type="button" role="tab" class="fc-wk-day" id="fc-wk-tab-' + index + '" data-row="' + index + '"' +
      ' aria-selected="' + selected + '" aria-controls="fc-wk-detail" tabindex="' + (selected ? 0 : -1) + '">' +
    // The full name, and a short one ("Wed") the CSS swaps in where columns are narrow.
    '<span class="fc-wk-name"><span class="fc-wk-long">' + escapeHtml(name || '') + '</span>' +
      '<span class="fc-wk-short" aria-hidden="true">' + escapeHtml(shortName) + '</span></span>' +
    '<span class="fc-wk-date">' + escapeHtml(date || '') + '</span>' +
    '<span class="fc-wk-main"><span class="fc-wk-icon" aria-hidden="true">' + forecastEmoji(main.shortForecast, !!row.day) +
      '</span><span class="fc-wk-temps">' + (temps || '—') + '</span></span>' +
    '<span class="fc-wk-sky">' + escapeHtml(main.shortForecast || '') + '</span>' +
    '<span class="fc-wk-meta">' +
      (row.more.sunsetAt ? '<span class="fc-wk-sunset"><span aria-hidden="true">🌇 </span><span class="sr-only">Sunset </span>' +
        row.more.sunsetAt + '</span>' : '') +
      (pop != null ? '<span class="fc-wk-pop"><span aria-hidden="true">💧 </span>' + pop +
        '%<span class="sr-only"> chance of rain</span></span>' : '') +
    '</span>' +
    (row.more.aqi != null ? '<span class="fc-wk-aqi">' + aqiHtml(row.more.aqi) + '</span>' : '') +
  '</button>';
}

/** The temperature strip: the curve (warm to cool), each day's high and each night's low. */
function weekTempStrip(model) {
  const { points, rows } = model;
  const xy = points.map(h => [h.x * WEEK_W, model.tempY(h.deg.f)]);
  const line = smoothPath(xy);
  const area = line + 'L' + weekNum(xy[xy.length - 1][0]) + ',' + WEEK_TEMP.height +
               'L' + weekNum(xy[0][0]) + ',' + WEEK_TEMP.height + 'Z';
  // The high in each day's daytime and the low in each night, where the curve covers
  // most of that period: a morning's few hours would pass for the day's high.
  const extreme = (part, pick) => {
    const from = Date.parse(part.startTime), to = Date.parse(part.endTime);
    const hrs = points.filter(h => h.t >= from && h.t < to);
    return hrs.length >= 3 && hrs.length * 2 >= (to - from) / 3_600_000
      ? hrs.reduce((a, b) => (pick(b.deg.f, a.deg.f) ? b : a)) : null;
  };
  const marks = rows.flatMap(row => [
    row.day && ['hi', extreme(row.day, (a, b) => a > b)],
    row.night && ['lo', extreme(row.night, (a, b) => a < b)]
  ]).filter(mark => mark && mark[1]).map(([kind, h]) =>
    '<span class="fc-wk-pt fc-wk-pt-' + kind + weekEdge(h.x) + '" style="left:' + weekPct(h.x) + ';top:' +
    weekNum(model.tempY(h.deg.f)) + 'px"><b>' + h.deg.f + '°</b></span>').join('');
  // The hourly forecast reaches ~6½ days: past that, the columns stand alone (said
  // so where there's room for it).
  const end = points[points.length - 1].x;
  const gap = end < 0.88 ? '<span class="fc-wk-gap" style="left:' + weekPct((end + 1) / 2) +
    '">The hourly forecast doesn\'t reach this far yet</span>' : '';
  return '<div class="fc-wk-strip fc-wk-temp" style="height:' + WEEK_TEMP.height + 'px">' +
    '<span class="fc-wk-label">Temperature (°F)</span>' +
    '<svg viewBox="0 0 ' + WEEK_W + ' ' + WEEK_TEMP.height + '" preserveAspectRatio="none" height="' + WEEK_TEMP.height + '" focusable="false">' +
      '<defs><linearGradient id="fc-wk-heat" gradientUnits="userSpaceOnUse" x1="0" y1="' + WEEK_TEMP.top +
        '" x2="0" y2="' + WEEK_TEMP.bottom + '"><stop offset="0" stop-color="#ffb37a"/><stop offset="1" stop-color="#8fd3ff"/></linearGradient></defs>' +
      '<path class="fc-wk-area" d="' + area + '"/><path class="fc-wk-line" d="' + line + '"/>' +
    '</svg>' + marks + gap + '</div>';
}

/**
 * The rain strip: each hour's chance as a filled step (100% = full height). An area
 * rather than bars, so a run of low chances reads as a low band, not a dotted line.
 */
function weekRainStrip(model) {
  const { points } = model;
  const y = h => WEEK_RAIN.base - (h.period.probabilityOfPrecipitation?.value || 0) / 100 * WEEK_RAIN.full;
  // Each hour spans halfway to its neighbours.
  const edge = i => (i <= 0 ? points[0].x : i >= points.length ? points[points.length - 1].x
    : (points[i - 1].x + points[i].x) / 2) * WEEK_W;
  let top = '';
  points.forEach((h, i) => { top += 'L' + weekNum(edge(i)) + ',' + weekNum(y(h)) + 'L' + weekNum(edge(i + 1)) + ',' + weekNum(y(h)); });
  const most = Math.max(0, ...points.map(h => h.period.probabilityOfPrecipitation?.value || 0));
  const area = 'M' + weekNum(edge(0)) + ',' + WEEK_RAIN.base + top + 'L' + weekNum(edge(points.length)) + ',' + WEEK_RAIN.base + 'Z';
  return '<div class="fc-wk-strip fc-wk-rain" style="height:' + WEEK_RAIN.height + 'px">' +
    '<span class="fc-wk-label">Chance of rain' + (most ? ' (up to ' + Math.round(most) + '%)' : ' (none expected)') + '</span>' +
    '<svg viewBox="0 0 ' + WEEK_W + ' ' + WEEK_RAIN.height + '" preserveAspectRatio="none" height="' + WEEK_RAIN.height + '" focusable="false">' +
      '<line class="fc-wk-base" x1="0" x2="' + WEEK_W + '" y1="' + WEEK_RAIN.base + '" y2="' + WEEK_RAIN.base + '"/>' +
      (most ? '<path class="fc-wk-rain-area" d="' + area + '"/>' : '') +
    '</svg></div>';
}

/** The air strip: each hour in its EPA colour, with a key to the categories shown. */
function weekAirStrip(model) {
  const { points } = model;
  const levels = new Set();
  const cells = points.map((h, i) => {
    if (!h.air) return '';
    const level = aqiCategory(h.air.value).level;
    levels.add(level);
    const left = i ? (points[i - 1].x + h.x) / 2 : h.x;
    const right = points[i + 1] ? (points[i + 1].x + h.x) / 2 : h.x;
    return '<rect class="fc-aqi-' + level + '" x="' + weekNum(left * WEEK_W) + '" y="' + WEEK_AIR.top +
           '" width="' + weekNum(Math.max(right - left, 0.001) * WEEK_W) + '" height="' + WEEK_AIR.band + '"/>';
  }).join('');
  if (!levels.size) return '';
  const key = [...levels].sort().map(level => {
    const value = [0, 25, 75, 125, 175, 250, 350][level];
    return '<span class="fc-aqi fc-aqi-' + level + '">' + aqiCategory(value).label + '</span>';
  }).join('');
  return '<div class="fc-wk-strip fc-wk-air" style="height:' + WEEK_AIR.height + 'px">' +
    '<span class="fc-wk-label">Air quality ' + key + '</span>' +
    '<svg viewBox="0 0 ' + WEEK_W + ' ' + WEEK_AIR.height + '" preserveAspectRatio="none" height="' + WEEK_AIR.height + '" focusable="false">' +
      cells + '</svg></div>';
}

/** The pressure strip: the line, with the week's highest and lowest marked. */
function weekPressureStrip(model) {
  const known = model.points.filter(h => h.hpa != null);
  if (known.length < 2) return '';
  const line = smoothPath(known.map(h => [h.x * WEEK_W, model.pressureY(h.hpa)]));
  const top = known.reduce((a, b) => (b.hpa > a.hpa ? b : a)), low = known.reduce((a, b) => (b.hpa < a.hpa ? b : a));
  const mark = (h, kind) => '<span class="fc-wk-pt fc-wk-pt-' + kind + weekEdge(h.x) + '" style="left:' + weekPct(h.x) + ';top:' +
    weekNum(model.pressureY(h.hpa)) + 'px"><b>' + hpaToInHg(h.hpa) + '</b></span>';
  return '<div class="fc-wk-strip fc-wk-pressure" style="height:' + WEEK_PRESSURE.height + 'px">' +
    '<span class="fc-wk-label">Pressure (inHg)</span>' +
    '<svg viewBox="0 0 ' + WEEK_W + ' ' + WEEK_PRESSURE.height + '" preserveAspectRatio="none" height="' + WEEK_PRESSURE.height + '" focusable="false">' +
      '<path d="' + line + '"/></svg>' + mark(top, 'ph') + mark(low, 'pl') + '</div>';
}

/** The picked day in full: the forecaster's words, then its daylight, air and pressure. */
function renderWeekDetail(model, index) {
  const row = model?.rows[index];
  if (!row) return '';
  const main = row.day || row.night;
  const when = forecastLocalTime(main.startTime);
  return '<div class="fc-wk-words"><h3 class="fc-wk-title">' + escapeHtml(when ? when.day : main.name || '') + '</h3>' +
    row.parts.map(p => '<p><b>' + escapeHtml(p.name || '') + ':</b> ' + escapeHtml(p.detailedForecast || '') + '</p>').join('') +
    '</div>' + (row.more.facts ? '<div class="fc-wk-facts">' + row.more.facts + '</div>' : '');
}

/** The whole week view as HTML ('' without a model). */
function renderForecastWeek(model, now = Date.now()) {
  if (!model) return '';
  const { rows, points } = model;
  const selected = rows[model.selected];
  const backdrop = model.nights.map(band => '<span class="fc-wk-' + band.kind + '" style="left:' +
      weekPct(band.from) + ';width:' + weekPct(band.to - band.from) + '"></span>').join('') +
    rows.slice(1).map(row => '<span class="fc-wk-sep" style="left:' + weekPct(row.from) + '"></span>').join('') +
    '<span class="fc-wk-sel" style="left:' + weekPct(selected.from) + ';width:' + weekPct(selected.width) + '"></span>' +
    (now >= model.t0 && now < model.t1
      ? '<span class="fc-wk-now" style="left:' + weekPct(model.xAt(now)) + '"><span>Now</span></span>' : '');
  const strips = points.length >= 2
    ? weekTempStrip(model) + weekRainStrip(model) + weekAirStrip(model) + weekPressureStrip(model)
    : '<p class="fc-empty">The NWS sent no hourly forecast for these days.</p>';
  return '<div class="fc-week">' +
    '<div class="fc-wk-days" role="tablist" aria-label="Days" style="grid-template-columns:' +
      rows.map(row => 'minmax(0,' + row.width.toFixed(4) + 'fr)').join(' ') + '">' +
      rows.map((row, i) => forecastWeekDayHtml(row, i, i === model.selected)).join('') + '</div>' +
    // The strips are drawn for the eye; keyboard and screen-reader users step
    // through the hours with the arrow keys (read out below), and the HOURLY tab
    // lists them all.
    '<div class="fc-wk-chart" tabindex="0" role="group" aria-label="Hour by hour: temperature, chance of rain, air quality and pressure. Use the arrow keys to go through the hours and Enter to pick that day.">' +
      '<div class="fc-wk-back" aria-hidden="true">' + backdrop + '</div>' +
      '<div aria-hidden="true">' + strips + '</div>' +
      '<span class="fc-wk-cursor" aria-hidden="true" hidden></span><span class="fc-wk-dot" aria-hidden="true" hidden></span>' +
      '<div class="fc-wk-tip" aria-hidden="true" hidden></div>' +
    '</div>' +
    '<p class="sr-only" id="fc-wk-readout" aria-live="polite"></p>' +
    '<div class="fc-wk-detail" id="fc-wk-detail" role="tabpanel" aria-labelledby="fc-wk-tab-' + model.selected + '">' +
      renderWeekDetail(model, model.selected) + '</div>' +
  '</div>';
}

/** One hour in the chart's tooltip: when, temperature, sky, rain, wind, air, pressure. */
function weekHourHtml(h) {
  const p = h.period;
  const when = forecastLocalTime(p.startTime);
  const pop = p.probabilityOfPrecipitation?.value;
  const wind = [p.windDirection, p.windSpeed].filter(Boolean).join(' ');
  return [
    '<b>' + (when ? escapeHtml(when.day.split(',')[0]) + ', ' + forecastHourLabel(when.hour) : '') + '</b>',
    '<span class="fc-wk-tip-temp">' + forecastTemp(p) + '</span>',
    p.shortForecast ? '<span>' + escapeHtml(p.shortForecast) + '</span>' : '',
    pop != null ? '<span>' + Math.round(pop) + '% chance of rain</span>' : '',
    wind ? '<span>Wind ' + escapeHtml(wind) + '</span>' : '',
    h.air ? '<span>' + aqiHtml(h.air.value) + '</span>' : '',
    h.hpa != null ? '<span>Pressure ' + hpaToInHg(h.hpa) + ' inHg</span>' : ''
  ].filter(Boolean).join('');
}

/** Put the chart's cursor and tooltip on hour `index` of the week (-1 hides them). */
function showWeekHour(index) {
  const chart = fcDays.querySelector('.fc-wk-chart');
  if (!chart) return;
  const h = weekModel?.points[index];
  const cursor = chart.querySelector('.fc-wk-cursor'), dot = chart.querySelector('.fc-wk-dot');
  const tip = chart.querySelector('.fc-wk-tip');
  weekHour = h ? index : -1;
  for (const el of [cursor, dot, tip]) el.hidden = !h;
  if (!h) return;
  cursor.style.left = dot.style.left = tip.style.left = weekPct(h.x);
  dot.style.top = weekModel.tempY(h.deg.f) + 'px';   // the temperature strip opens the chart
  tip.innerHTML = weekHourHtml(h);
  tip.classList.toggle('fc-wk-tip-left', h.x > 0.62);   // on the side with room
}

/** The day column at a spot across the chart (0–1). */
function weekRowAt(fraction) {
  const i = weekModel.rows.findIndex(r => fraction < r.from + r.width);
  return i < 0 ? weekModel.rows.length - 1 : i;
}

/**
 * The hour nearest to a spot across the chart (0–1), or -1 with no hours (a single
 * one is none: the chart then says the NWS sent no hourly forecast).
 */
function weekHourAt(fraction) {
  const model = weekModel;
  if (!model || model.points.length < 2) return -1;
  const row = model.rows[weekRowAt(fraction)];
  const t = row.start + Math.min(Math.max((fraction - row.from) / row.width, 0), 1) * (row.end - row.start);
  let best = 0;
  model.points.forEach((h, i) => { if (Math.abs(h.t - t) < Math.abs(model.points[best].t - t)) best = i; });
  return best;
}

/** The day an hour of the chart belongs to. */
function weekRowOf(h) {
  return weekModel.rows.findIndex(row => h.t >= row.start && h.t < row.end);
}

/**
 * The hour to show for a spot on the chart: the nearest one, if it is in the day
 * column there (past the end of the hourly forecast, the nearest hour is days
 * back, nowhere near the pointer), or -1.
 */
function weekHourIn(fraction) {
  const hour = weekHourAt(fraction);
  return hour >= 0 && weekRowOf(weekModel.points[hour]) === weekRowAt(fraction) ? hour : -1;
}

/** Pick a day: its column, its band on the chart, its forecast below. */
function selectWeekDay(index, focusTab) {
  const model = weekModel;
  if (!model?.rows[index]) return;
  model.selected = index;
  const tabs = fcDays.querySelectorAll('.fc-wk-day');
  tabs.forEach((tab, i) => {
    tab.setAttribute('aria-selected', String(i === index));
    tab.tabIndex = i === index ? 0 : -1;
  });
  const row = model.rows[index];
  const band = fcDays.querySelector('.fc-wk-sel'), detail = fcDays.querySelector('#fc-wk-detail');
  if (band) { band.style.left = weekPct(row.from); band.style.width = weekPct(row.width); }
  if (detail) {
    detail.innerHTML = renderWeekDetail(model, index);
    detail.setAttribute('aria-labelledby', 'fc-wk-tab-' + index);
  }
  if (focusTab) tabs[index]?.focus();
}

/** Read an hour out to screen readers (the chart itself is drawn for the eye). */
function readWeekHour(index) {
  const readout = fcDays.querySelector('#fc-wk-readout');
  const tip = fcDays.querySelector('.fc-wk-tip');
