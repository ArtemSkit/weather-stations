<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════════════════════╗
  ║  WX.MAP — Weather Station Finder                                            ║
  ║  A Progressive Web App for exploring NOAA weather observation stations.     ║
  ║                                                                             ║
  ║  Architecture overview                                                      ║
  ║  ─────────────────────                                                      ║
  ║  • Single HTML file — no build step, no bundler, no framework.              ║
  ║  • Vendored Leaflet.js — interactive map tiles from OpenStreetMap.           ║
  ║  • NOAA Weather.gov public API — station list + live observations.          ║
  ║  • Nominatim (OSM) — free ZIP and house-number geocoding (no key).          ║
  ║  • Photon (OSM) — free, typo-tolerant address geocoding and suggestions.    ║
  ║  • Open-Meteo — free air-quality and pressure forecasts (no key).           ║
  ║  • Service Worker (external sw.js) — offline caching for the app shell      ║
  ║    so it loads even without a network connection; also delivers updates.    ║
  ║  • Web App Manifest (external manifest.json) — enables the browser's        ║
  ║    "Add to Home Screen" / "Install App" prompt.                             ║
  ╚══════════════════════════════════════════════════════════════════════════════╝
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Real-time NOAA weather station map. Search by ZIP, address, or coordinates. Live observations updated every minute.">
<meta name="theme-color" content="#0a0e17">

<!-- iOS PWA / home-screen optimisations -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WX.MAP">
<meta name="mobile-web-app-capable" content="yes">
<!-- Keep the layout fitted while allowing browser zoom for accessibility. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- Favicon (inline SVG data-URI) — avoids a 404 for /favicon.ico and gives the tab an icon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20192%20192'%3E%3Crect%20width='192'%20height='192'%20rx='45'%20fill='%230a0e17'/%3E%3Ctext%20x='96'%20y='135'%20font-size='120'%20text-anchor='middle'%3E%F0%9F%8C%A6%3C/text%3E%3C/svg%3E">

<!-- Apple touch icon (inline SVG data-URI) -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='100'%20fill='%230a0e17'/%3E%3Ctext%20x='256'%20y='340'%20font-size='280'%20text-anchor='middle'%3E%F0%9F%8C%A6%3C/text%3E%3C/svg%3E">

<!-- PWA: Web App Manifest (external file for better browser support). Linked from
     script so a page opened as a local file (file://) — which can't install or
     fetch the manifest — doesn't log a CORS error on every load. -->
<script>
  if (location.protocol !== 'file:') {
    const manifestLink = document.createElement('link');
    manifestLink.rel  = 'manifest';
    manifestLink.href = './manifest.json';
    document.head.appendChild(manifestLink);
  }
</script>

<!-- Fonts -->
<!-- The font files themselves come from fonts.gstatic.com, so warm that up too. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the first paint (media swap): on a slow network or a
     captive portal the installed app must not sit blank waiting for a cross-origin
     stylesheet. Text shows in fallback fonts until it arrives. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
</noscript>

<!-- Leaflet is vendored so the map shell can initialize without a CDN connection. -->
<link rel="stylesheet" href="./leaflet.css"/>

<title>WX.MAP — Weather Station Finder</title>
<style>
  /* ════════════════════════════════════════════════════════════════════════════
     DESIGN TOKENS
     All colours, radii, and spacing constants are defined here as CSS custom
     properties so they can be referenced consistently throughout the stylesheet.
     ════════════════════════════════════════════════════════════════════════════ */
  :root {
    --bg:        #0a0e17;   /* darkest background — map canvas, inputs */
    --surface:   #111827;   /* header, popup panel background          */
    --surface2:  #1a2438;   /* popup header, code-chip backgrounds     */
    --border:    #1e3a5f;   /* all borders and dividers                */
    --accent:    #00d4ff;   /* primary highlight (cyan)                */
    --accent2:   #ff6b35;   /* secondary highlight (orange) for pins   */
    --text:      #e2eaf6;   /* primary readable text                   */
    --text-muted:#7193b5;   /* secondary text; ≥4.5:1 on bg, surface AND surface2 */
    --green:     #00ff9d;   /* OK / live status                        */
    --yellow:    #ffd700;   /* loading / refreshing state              */
    --red:       #ff4757;   /* error state, close hover                */
    --radius:    4px;        /* standard border-radius                 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Space Mono', monospace;
    background: var(--bg);
    color: var(--text);
    /* Fallback first, then dynamic viewport height for modern browsers */
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ════════════════════════════════════════════════════════════════════════════
     HEADER
     ════════════════════════════════════════════════════════════════════════════ */
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    flex-shrink: 0;
  }
  /* The address suggestions hang down over the map: while they are open, lift the
     header above everything there (alert banner 1100, phone sheet 1100, pin-mode
     banner 1150), still below the toasts (1200). Only then, so a phone's tall
     station sheet keeps covering the header rather than hiding under it. */
  header:has(#addr-suggest:not([hidden])) { z-index: 1160; }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .logo span { color: var(--accent2); }

  /* ── Search bar (input + drag-pin + FIND button) ── */
  .search-bar {
    position: relative;   /* anchors the suggestion list */
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    max-width: 480px;
  }

  /* ── Address suggestions: a list hanging under the whole search bar ── */
  #addr-suggest {
    position: absolute;
    top: calc(100% + 4px); left: 0; right: 0;
    list-style: none;
    padding: 4px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    max-height: 60vh; max-height: 60dvh;
    overflow-y: auto;
  }
  #addr-suggest[hidden] { display: none; }
  #addr-suggest li {
    padding: 7px 12px;
    font-size: 0.75rem;
    line-height: 1.35;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  #addr-suggest li .sub { display: block; font-size: 0.68rem; color: var(--text-muted); }
  #addr-suggest li:hover { background: var(--surface2); }
  /* The keyboard highlight: an accent edge too, so it isn't told by colour alone.
     Windows High Contrast drops both, but paints the transparent outline. */
  #addr-suggest li[aria-selected="true"] {
    background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent);
    outline: 2px solid transparent; outline-offset: -2px;
  }

  .search-bar input {
    flex: 1;
    min-width: 0;   /* a flex item won't shrink below its ~226px built-in width otherwise */
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.05em;
  }
  /* Windows High Contrast paints even a transparent outline (in a system colour): it shows only on focus. */
  .search-bar input:focus   { border-color: var(--accent); outline: 2px solid transparent; }
  .search-bar input::placeholder { color: var(--text-muted); }

  /* FIND button */
  #search-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    padding: 8px 18px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  #search-btn:hover  { opacity: 0.85; }
  #search-btn:active { transform: scale(0.97); }

  /* ── Drag-to-map pin button ── */
  #drag-pin {
    width: 34px; height: 34px;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--accent2);
    transition: border-color 0.15s, transform 0.15s;
    user-select: none;
    outline: none;
    padding: 0;
    line-height: 1;
  }
  #drag-pin:hover  { border-color: var(--accent2); transform: scale(1.1); }
  #drag-pin:focus  { border-color: var(--accent); outline: 2px solid transparent; }   /* see .search-bar input:focus */
  #drag-pin:active { cursor: grabbing; }

  /*
   * Ghost pin element — absolutely positioned, follows the mouse cursor
   * while the user is dragging the pin button over the map.  Hidden by default,
   * shown via JS when a drag starts.
   */
  #pin-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    display: none;
    font-size: 30px;
    transform: translate(-50%, -100%);
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.8));
  }

  /* ── Status bar (right side of header) ── */
  .status-bar {
    margin-left: auto;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .status-bar .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    margin-right: 6px;
    vertical-align: middle;
    transition: background 0.3s;
  }
  .status-bar.loading .dot { background: var(--yellow); animation: pulse 1s infinite; }
  .status-bar.ok      .dot { background: var(--green); }
  .status-bar.error   .dot { background: var(--red); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Preserve state cues while respecting users who disable non-essential motion. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ════════════════════════════════════════════════════════════════════════════
     MAP AREA
     ════════════════════════════════════════════════════════════════════════════ */
  main { flex: 1; position: relative; overflow: hidden; }
  #map  { width: 100%; height: 100%; background: var(--bg); }
  /* Leaflet's focus ring sits 1px OUTSIDE the map, where main's overflow:hidden
     clips it, and an inside outline would be painted under the tile panes
     (z-index 400). So draw the ring as a layer above the tiles and below the
     controls (800), letting keyboard users see that the map has focus. */
  #map:focus-visible { outline: none; }
  #map:focus-visible::after {
    content: ''; position: absolute; inset: 0; z-index: 799;
    pointer-events: none; box-shadow: inset 0 0 0 2px var(--accent);
    /* Windows High Contrast drops box-shadow but paints outlines in a system
       colour, so this invisible outline becomes the ring there. */
    outline: 2px solid transparent; outline-offset: -2px;
  }

  /* Dark-mode tile filter — desaturate + hue-rotate to match the UI palette */
  .leaflet-tile-pane { filter: brightness(0.7) saturate(0.6) hue-rotate(190deg); }

  /* Lift the bottom-left zoom control so it clears the version badge in the corner.
     (The mobile media query lifts it further, clear of the larger phone layout.) */
  .leaflet-control-zoom { margin-bottom: 34px !important; }

  /* Override Leaflet control colours */
  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--accent) !important;
    border-color: var(--border) !important;
    font-family: 'Space Mono', monospace !important;
  }
  /* The overrides above beat Leaflet's greyed-out style, so restore it: at the
     max/min zoom the useless + or − must look disabled. */
  .leaflet-control-zoom a.leaflet-disabled { color: var(--text-muted) !important; cursor: default; }
  .leaflet-control-attribution {
    background: rgba(10,14,23,0.85) !important;
    color: var(--text-muted) !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: var(--accent) !important; }

  /* ════════════════════════════════════════════════════════════════════════════
     MAP MARKERS
     ════════════════════════════════════════════════════════════════════════════ */

  /* Station identifier badge (circular, cyan border) */
  .station-marker {
    width: 28px; height: 28px;
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    /* Narrow monospace so 4–5 character ids (KSEA, SEAW1) fit inside the ring —
       the wide Syne display face spilled across it. */
    font-family: 'Space Mono', monospace;
    font-size: 7px; font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 10px rgba(0,212,255,0.3);
    text-align: center; line-height: 1.1;
    position: relative;   /* anchor for the .alerted pulse ring (::after) */
  }
  .station-marker:hover,
  .station-marker.active {
    background: var(--accent); color: var(--bg);
    box-shadow: 0 0 20px rgba(0,212,255,0.6);
    transform: scale(1.15);
  }

  /*
   * Tier-3 "in the danger zone" highlight.
   * Added by flagStationsInAlerts() when a station's coordinates fall inside an
   * active NWS warning polygon (e.g. a tornado or flash-flood warning). The
   * pulsing red ring is drawn as a ::after pseudo-element so it layers on top of
   * the marker without disturbing its existing border, colour, or .active scale.
   */
  .station-marker.alerted {
    border-color: var(--red);
    color: var(--red);
  }
  /* Open or hovered: the cyan fill needs dark text (red on cyan is ~1.9:1). */
  .station-marker.alerted:hover,
  .station-marker.alerted.active { color: var(--bg); }
  .station-marker.alerted::after {
    content: '';
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--red);
    animation: alertPulse 1.4s ease-out infinite;
    pointer-events: none;
  }
  @keyframes alertPulse {
    0%   { transform: scale(1);   opacity: 0.9; }
    100% { transform: scale(1.8); opacity: 0;   }
  }

  /*
   * Dropped / draggable pin marker.
   * Consists of a coordinate label (above) and the pin emoji (below),
   * vertically stacked inside a flex column.
   */
  .dropped-pin-wrap {
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
  }
  .dropped-pin-coords {
    background: var(--surface2);
    border: 1px solid var(--accent2);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 9px; padding: 2px 6px;
    border-radius: 3px; white-space: nowrap; margin-bottom: 2px;
    pointer-events: none;   /* pass clicks through to the Leaflet marker */
  }
  .dropped-pin-icon { font-size: 26px; line-height: 1; }
  /* The pin's marker box is 90×52 px, label included, so it would swallow clicks
     meant for what lies under it (the map, alert areas, nearby stations). Only
     the 📍 itself takes clicks, drags and double-clicks (they bubble up to
     Leaflet's marker); the rest of the box lets them through. (Station badges
     are drawn above the pin anyway: see placeDragPin.) */
  .leaflet-marker-icon.dropped-pin-marker.leaflet-interactive { pointer-events: none; }
  .dropped-pin-icon { pointer-events: auto; }
  /* (Pin mode: like every marker, the 📍 lets the tap through to the map too.) */
  #map.tap-mode .dropped-pin-icon { pointer-events: none; }

  /* ════════════════════════════════════════════════════════════════════════════
     WEATHER STATION INFO POPUP PANEL
     Slides in from the right; remains on top of the map.
     ════════════════════════════════════════════════════════════════════════════ */
  #popup-panel {
    position: absolute; top: 16px; right: 16px;
    width: 314px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    z-index: 1000; display: none;
    /* Scroll instead of clipping the footer (refresh interval) in short windows. */
    max-height: calc(100% - 32px); overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,212,255,0.1);
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity:0; transform: translateX(20px); }
    to   { opacity:1; transform: translateX(0); }
  }

  /* ════════════════════════════════════════════════════════════════════════════
     DANGEROUS-WEATHER ALERT BANNER (Tier 1)
     Floats top-left over the map and lists the active NWS watches/warnings for
     the searched area. Hidden entirely when there are no active alerts.
     ════════════════════════════════════════════════════════════════════════════ */
  #alert-banner {
    position: absolute; top: 16px; left: 16px;
    z-index: 1100;                       /* above the station popup (1000) */
    width: 330px; max-width: calc(100% - 32px);
    /* Never let a long list of alerts run off the bottom of the map, nor cover the
       bottom-left zoom control and the LIVE ALERTS button above it (which ends
       ~140px above the map's bottom edge).
       The 4rem floor keeps the summary chip visible in very short windows: there,
       showing the alert matters more than keeping clear of the zoom buttons. */
    max-height: max(4rem, calc(100% - 16px - 150px)); overflow-y: auto;
    display: none; flex-direction: column; gap: 8px;
    font-family: 'Syne', sans-serif;
  }
  #alert-banner.visible { display: flex; }

  /* Collapsible summary chip — shows the count + most severe event name. */
  .alert-summary {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-left: 4px solid var(--red);
    border-radius: 6px; padding: 9px 12px;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem;
    cursor: pointer; text-align: left; width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .alert-summary .alert-summary-icon { font-size: 0.95rem; line-height: 1; }
  .alert-summary .alert-summary-text { flex: 1; }
  .alert-summary .alert-summary-caret { color: var(--text-muted); transition: transform 0.2s; }
  #alert-banner.expanded .alert-summary .alert-summary-caret { transform: rotate(180deg); }
  /* Summary chip border tinted to the most severe active alert (see alertClass()). */
  .alert-summary.alert-warn  { border-left-color: var(--accent2); }
  .alert-summary.alert-watch { border-left-color: #ffae42; }
  .alert-summary.alert-info  { border-left-color: var(--yellow); }

  /* The list of individual alert cards — only shown when expanded. */
  .alert-list { display: none; flex-direction: column; gap: 8px; }
  #alert-banner.expanded .alert-list { display: flex; }

  .alert-card {
    background: var(--surface);
    border: 1px solid var(--border); border-left: 4px solid var(--text-muted);
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  /* Severity-driven accent colour (see alertClass()). */
  .alert-card.alert-crit  { border-left-color: var(--red); }
  .alert-card.alert-warn  { border-left-color: var(--accent2); }
  .alert-card.alert-watch { border-left-color: #ffae42; }
  .alert-card.alert-info  { border-left-color: var(--yellow); }
  .alert-card.alert-crit  .alert-event { color: var(--red); }
  .alert-card.alert-warn  .alert-event { color: var(--accent2); }
  .alert-card.alert-watch .alert-event { color: #ffae42; }
  .alert-card.alert-info  .alert-event { color: var(--yellow); }
  /* The alert's colour on the map (live alerts): a small square before its name. */
  .alert-swatch {
    display: inline-block; width: 0.7em; height: 0.7em; margin-right: 7px; vertical-align: 0.02em;
    border-radius: 2px; outline: 1px solid rgba(255,255,255,0.35);
  }

  /* Card header (always visible) — click to reveal the full description. */
  /* The banner scrolls (overflow-y: auto), which also clips anything drawn outside
     it — so keyboard focus rings on its full-width buttons are drawn inside. */
  .alert-summary:focus-visible,
  .alert-card-head:focus-visible,
  .alert-group-head:focus-visible,
  .alert-zoom:focus-visible,
  /* A long card body scrolls, so newer browsers let Tab focus it (to scroll with
     the arrow keys); the card's overflow:hidden would clip an outside ring. */
  .alert-card-body:focus-visible { outline: 2px solid var(--text); outline-offset: -3px; }

  .alert-card-head {
    /* Wraps so a long "from … until …" time drops under the event name instead of
       being clipped by the card (overflow: hidden). */
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 8px;
    width: 100%; padding: 10px 12px; cursor: pointer; text-align: left;
    background: transparent; border: none;
  }
  .alert-event   { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.9rem; }
  .alert-expires { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--text-muted); }
  /* Each part ("from …", "until …") stays whole; a narrow card breaks between them. */
  .alert-when    { white-space: nowrap; }

  /* Card body (description + safety instruction) — collapsed until .open.
     Tall enough to show a useful chunk of the (now larger) text before scrolling,
     but capped by the viewport so it never swallows a phone screen. */
  .alert-card-body {
    display: none;
    padding: 0 12px 12px;
    max-height: min(50vh, 320px); overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  .alert-card.open .alert-card-body { display: block; }
  /* Body text sized to match the alert-area popup (≥ ~13.6px) so it stays
     readable on phones; the description uses the primary text colour because it
     is the main content, not secondary metadata. */
  .alert-headline {
    font-size: 0.9rem; color: var(--text); margin: 10px 0 8px; line-height: 1.5;
  }
  .alert-desc {
    font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--text);
    line-height: 1.55; white-space: pre-line;   /* keep the paragraph breaks left by unwrapAlertText() */
  }
  /* Where an alert applies: the first few places on its header line, all of them
     at the top of its body. */
  .alert-places {
    flex-basis: 100%; font-family: 'Space Mono', monospace; font-size: 0.72rem;
    color: var(--text); opacity: 0.85; line-height: 1.4;
  }
  .alert-areas { margin: 10px 0 0; font-size: 0.8rem; line-height: 1.45; color: var(--text-muted); }
  .alert-areas b { color: var(--text); }
  /* "📍 Show on map": fits the map to the alert's (or the group's) areas. */
  .alert-zoom {
    margin-top: 10px; padding: 6px 10px; cursor: pointer; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface2); color: var(--accent); border: 1px solid var(--border);
    border-radius: var(--radius); font-family: 'Syne', sans-serif; font-weight: 700;
    font-size: 0.72rem; letter-spacing: 0.04em;
  }
  .alert-zoom:hover { border-color: var(--accent); }

  /* Same-type alerts grouped: one row ("Extreme Heat Warning ×8") opening to their cards. */
  .alert-group {
    background: var(--surface);
    border: 1px solid var(--border); border-left: 4px solid var(--text-muted);
    border-radius: 6px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .alert-group.alert-crit  { border-left-color: var(--red); }
  .alert-group.alert-warn  { border-left-color: var(--accent2); }
  .alert-group.alert-watch { border-left-color: #ffae42; }
  .alert-group.alert-info  { border-left-color: var(--yellow); }
  .alert-group.alert-crit  > .alert-group-head .alert-event { color: var(--red); }
  .alert-group.alert-warn  > .alert-group-head .alert-event { color: var(--accent2); }
  .alert-group.alert-watch > .alert-group-head .alert-event { color: #ffae42; }
  .alert-group.alert-info  > .alert-group-head .alert-event { color: var(--yellow); }
  .alert-group-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
    width: 100%; padding: 10px 12px; cursor: pointer; text-align: left;
    background: transparent; border: none;
  }
  .alert-group-head .alert-expires { margin-left: auto; }
  /* The name and its count wrap as one piece: the badge never drops to its own line. */
  .alert-group-title { display: inline-flex; align-items: baseline; gap: 8px; }
  .alert-group-count {
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.72rem;
    color: var(--bg); background: var(--text-muted); border-radius: 9px; padding: 1px 7px;
  }
  .alert-group-body {
    display: none; flex-direction: column; gap: 6px;
    padding: 0 8px 8px; border-top: 1px solid var(--border);
  }
  .alert-group.open .alert-group-body { display: flex; }
  .alert-group-body .alert-card { box-shadow: none; }
  .alert-group-body > .alert-card:first-child { margin-top: 8px; }
  /* Read by screen readers only ("8 alerts" beside the visual "×8"). */
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  /* "▾ More alerts below": pinned to the banner's bottom edge while its list
     continues past what fits — so the alerts further down aren't missed. */
  .alert-more {
    display: none; position: sticky; bottom: 0; flex-shrink: 0;
    justify-content: center; padding: 18px 0 6px; margin-top: -8px; cursor: pointer;
    background: linear-gradient(to bottom, rgba(10,14,23,0), rgba(10,14,23,0.95) 55%);
    color: var(--accent); font-family: 'Space Mono', monospace; font-size: 0.72rem; letter-spacing: 0.05em;
  }
  #alert-banner.has-more .alert-more { display: flex; }

  /* ════════════════════════════════════════════════════════════════════════════
     ALERT AREA OVERLAY  (map polygons — see renderAlertAreas())
     Each active alert with a geographic footprint is drawn as a coloured polygon.
     A small always-on chip names the event; clicking or tapping the area opens a
     popup with severity and the in-effect time window. Colours are hashed per
     alert so overlapping areas stay visually distinct.
     ════════════════════════════════════════════════════════════════════════════ */

  /* Always-on event chip centred on each alert polygon. */
  .leaflet-tooltip.alert-area-label {
    /* 0.92: at 0.82 light map tiles showed through enough to drop blue labels
       below 4.5:1 contrast. */
    background: rgba(10,14,23,0.92);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  /* A live chip's swatch: the area's own colour, to tell neighbouring areas apart. */
  .live-chip-swatch {
    display: inline-block; width: 0.8em; height: 0.8em; margin-right: 5px; vertical-align: -0.08em;
    border-radius: 2px; outline: 1px solid rgba(255,255,255,0.4);
  }
  /* Leaflet draws a little caret on directional tooltips — hide it for these chips. */
  .leaflet-tooltip.alert-area-label::before { display: none !important; }

  /* Dark-theme styling for the alert detail popup. Scoped via the .wx-alert-popup
     class so it never affects any other Leaflet popup. */
  .wx-alert-popup .leaflet-popup-content-wrapper {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .wx-alert-popup .leaflet-popup-tip {
    background: var(--surface);
    border: 1px solid var(--border);
    /* The tip is decorative; clicks at its anchor must reach the alert polygon
       underneath so an exact second click toggles the popup closed. */
    pointer-events: none;
  }
  .wx-alert-popup .leaflet-popup-content {
    /* Right margin clears the enlarged 32px × button (44px on touch, below). */
    margin: 14px 40px 14px 16px;
    max-height: min(55vh, 360px);
    overflow-y: auto;
    font-family: 'Space Mono', monospace;
  }
  .wx-alert-popup a.leaflet-popup-close-button {
    width: 32px; height: 32px;
    color: var(--text-muted);
    font-size: 20px;
    line-height: 30px;
  }
  .wx-alert-popup a.leaflet-popup-close-button:hover { color: var(--red); }
  .wx-alert-popup a.leaflet-popup-close-button:focus-visible {
    color: var(--text);
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .wx-alert-pop-event {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem;
    letter-spacing: 0.04em; display: block; margin-bottom: 4px;
  }
  .wx-alert-pop-meta {
    font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 6px;
  }
  .wx-alert-pop-when { font-size: 0.875rem; color: var(--text); margin-bottom: 8px; line-height: 1.55; }
  .wx-alert-pop-when b { color: var(--accent); font-weight: 700; }
  .wx-alert-pop-head { font-size: 0.875rem; color: var(--text); line-height: 1.55; margin-bottom: 8px; }
  .wx-alert-pop-area { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }

  @media (pointer: coarse) {
    .wx-alert-popup a.leaflet-popup-close-button {
      width: 44px; height: 44px; line-height: 42px;
    }
    .wx-alert-popup .leaflet-popup-content { margin-right: 52px; }
  }

  /* Header row: station ID + full name on the left, close button on the right */
  .popup-header {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 12px 14px;
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 8px;
  }
  .popup-station-id {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 1rem; color: var(--accent); letter-spacing: 0.08em;
  }
  .popup-station-name {
    font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; line-height: 1.4;
  }
  .popup-close {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    width: 24px; height: 24px; border-radius: var(--radius);
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s; line-height: 1;
  }
  .popup-close:hover { border-color: var(--red); color: var(--red); }

  .popup-body { padding: 14px; }

  /* ── Temperature display row ── */
  .weather-main {
    display: flex; align-items: flex-start; gap: 14px;
    margin-bottom: 14px; padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .temp-col { flex: 1; }
  .temp-row { display: flex; align-items: baseline; }

  /* Large Fahrenheit number */
  .weather-temp {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 2.4rem; color: var(--text); line-height: 1;
  }
  .weather-temp sup { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }

  /*
   * Celsius companion — separated by a left border.
   * Intentionally smaller and muted so it doesn't compete with the °F reading.
   */
  .temp-celsius-wrap {
    display: flex; align-items: baseline;
    margin-left: 10px; padding-left: 10px;
    border-left: 1px solid var(--border);
  }
  .temp-celsius {
    font-family: 'Syne', sans-serif; font-weight: 600;
    font-size: 1.15rem; color: var(--text-muted); line-height: 1;
  }
  .temp-celsius sup { font-size: 0.6rem; font-weight: 400; }

  .weather-desc {
    font-size: 0.72rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 5px;
  }

  /* ── 2-column metric grid ── */
  .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .weather-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 10px;
  }
  .weather-item.full { grid-column: 1 / -1; }   /* spans both columns */
  .weather-item-label {
    font-size: 0.58rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px;
  }
  .weather-item-value {
    font-family: 'Syne', sans-serif; font-weight: 600;
    font-size: 0.85rem; color: var(--accent);
  }
  /* val() puts the "N/A" placeholder INSIDE the value element. */
  .weather-item-value .na { color: var(--text-muted); font-size: 0.75rem; }
  .feels-c { font-size: 0.7rem; color: var(--text-muted); font-weight: 400; }

  /* Precipitation likelihood progress bar */
  .precip-bar-wrap {
    margin-top: 5px; height: 4px;
    background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .precip-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 2px; transition: width 0.4s ease;
  }

  /* ── Popup footer: observation timestamp (left) + live refresh indicator (right) ── */
  .popup-footer {
    padding: 10px 14px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .update-time { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.04em; }
  /* The refresh control keeps its size; a long timestamp ("… · 2 h old") wraps instead. */
  .update-indicator { display: flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap; }
  .update-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); flex-shrink: 0;
  }
  .update-dot.stale      { background: var(--red); }   /* the last refresh failed */
  .update-dot.refreshing { animation: pulse 0.8s infinite; background: var(--yellow); }

  /* Editable refresh interval — inline number input */
  .interval-wrap {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.04em;
  }
  #interval-input {
    width: 52px; height: 24px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; color: var(--accent);
    font-family: 'Space Mono', monospace; font-size: 0.75rem;
    text-align: center; padding: 1px 4px; outline: none;
    transition: border-color 0.15s;
    appearance: textfield;  /* hide number spinner arrows */
    -moz-appearance: textfield;
  }
  #interval-input::-webkit-outer-spin-button,
  #interval-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    appearance: none;
  }
  #interval-input:focus { border-color: var(--accent); outline: 2px solid transparent; }   /* see .search-bar input:focus */

  /* ════════════════════════════════════════════════════════════════════════════
     FORECAST  (header button + dialog with the NWS 7-day and hourly forecast)
     ════════════════════════════════════════════════════════════════════════════ */
  /* Shown once an area is loaded; sits just before the status text on the right. */
  #forecast-btn {
    margin-left: auto; flex-shrink: 0;
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 6px 12px; cursor: pointer;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.68rem; letter-spacing: 0.1em;
  }
  #forecast-btn:hover { background: rgba(0,212,255,0.1); }
  #forecast-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #forecast-btn:not([hidden]) ~ .status-bar { margin-left: 0; }

  #forecast-dialog {
    margin: auto;   /* centred: the page's global margin reset would pin it top-left */
    padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    background: var(--surface); color: var(--text);
    width: min(560px, calc(100vw - 32px)); max-width: none; max-height: min(82vh, 760px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  #forecast-dialog::backdrop { background: rgba(5,7,12,0.6); }
  /* The sheet fills the dialog, so a click on the dialog itself is a backdrop click. */
  .fc-sheet { display: flex; flex-direction: column; max-height: inherit; }
  .fc-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 14px 14px 10px 16px; border-bottom: 1px solid var(--border);
  }
  .fc-head h2 { margin: 0; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 800; letter-spacing: 0.04em; }
  .fc-place { margin-top: 2px; font-size: 0.72rem; color: var(--text-muted); }
  .fc-close {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; cursor: pointer;
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); font-size: 0.9rem;
  }
  .fc-close:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .fc-tabs { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--border); }
  .fc-tabs [role="tab"] {
    background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer;
    padding: 8px 12px; color: var(--text-muted);
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.7rem; letter-spacing: 0.1em;
  }
  .fc-tabs [role="tab"][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .fc-tabs [role="tab"]:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .fc-body { overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
  .fc-body [role="tabpanel"]:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .fc-empty { padding: 18px 16px; margin: 0; font-size: 0.75rem; color: var(--text-muted); }
  .fc-retry {
    margin-left: 6px; padding: 4px 10px; cursor: pointer; border-radius: var(--radius);
    background: var(--surface2); color: var(--accent); border: 1px solid var(--border); font: inherit;
  }
  /* 7-day: one row per day or night; tap a row for the full wording. */
  .fc-day + .fc-day { border-top: 1px solid var(--border); }
  .fc-day.fc-night { background: rgba(255,255,255,0.025); }
  .fc-day summary {
    display: grid; grid-template-columns: 32px 1fr auto;
    grid-template-areas: "icon name temp" "icon short short" "icon meta meta" "icon sun sun" "icon air air";
    gap: 2px 10px; padding: 10px 16px; cursor: pointer; list-style: none;
  }
  .fc-day summary::-webkit-details-marker { display: none; }
  .fc-day summary:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .fc-icon { grid-area: icon; align-self: center; font-size: 1.4rem; line-height: 1; text-align: center; }
  .fc-name { grid-area: name; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.8rem; }
  .fc-temp { grid-area: temp; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.9rem; color: var(--accent); white-space: nowrap; }
  .fc-temp small { margin-left: 4px; font-size: 0.65rem; font-weight: 400; color: var(--text-muted); }
  .fc-short { grid-area: short; font-size: 0.74rem; }
  /* A day's ↑ high and ↓ low: warm and cool, °C in small type beneath. */
  .fc-temps {
    grid-area: temp; display: flex; flex-wrap: wrap; justify-content: flex-end; column-gap: 8px;
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.9rem; white-space: nowrap;
  }
  .fc-hi { color: #ffb37a; }
  .fc-lo { color: #8fd3ff; }
  .fc-hi > span[aria-hidden], .fc-lo > span[aria-hidden] { margin-right: 1px; font-size: 0.75rem; }
  .fc-temps small {
    flex-basis: 100%; text-align: right; font-size: 0.65rem; font-weight: 400; color: var(--text-muted);
  }
  .fc-night-sky { display: block; color: var(--text-muted); font-size: 0.7rem; }
  .fc-meta { grid-area: meta; font-size: 0.66rem; color: var(--text-muted); }
  /* Sun, air and pressure lines: the sunset stands out (warm, bold), the rest is quiet. */
  .fc-sun, .fc-air { font-size: 0.66rem; color: var(--text-muted); }
  .fc-sun { grid-area: sun; }
  .fc-air { grid-area: air; }
  .fc-sunset { color: #ffb37a; font-weight: 700; font-size: 0.74rem; }
  /* AQI: a dot in the EPA's colour for the category (the words say it too). */
  .fc-aqi::before {
    content: ''; display: inline-block; width: 0.6em; height: 0.6em; margin-right: 4px;
    border-radius: 50%; vertical-align: 0.02em; background: var(--aqi);
    outline: 1px solid rgba(255,255,255,0.35);   /* the dark purple and maroon need an edge here */
  }
  .fc-aqi-1 { --aqi: #00e400; } .fc-aqi-2 { --aqi: #ffff00; } .fc-aqi-3 { --aqi: #ff7e00; }
  .fc-aqi-4 { --aqi: #ff0000; } .fc-aqi-5 { --aqi: #8f3f97; } .fc-aqi-6 { --aqi: #7e0023; }
  .fc-now { margin-top: 3px; font-size: 0.7rem; }
  .fc-foot a { color: var(--accent); white-space: nowrap; }   /* not split at "Open-|Meteo" */
  /* Phones: sky and wind on one line, AQI and pressure on the next, spaced apart
     (no separators to strand at a line start); a short reading that doesn't fit
     moves down whole ("N 10 mph", "29.98 inHg" never split). The AQI may wrap:
     "Unhealthy for sensitive groups" is wider than the column. */
  .fc-hour-short, .fc-hour-air { display: flex; flex-wrap: wrap; column-gap: 12px; }
  .fc-hour-air { flex-basis: 100%; font-size: 0.66rem; }
  .fc-hour-wind, .fc-hour-press { white-space: nowrap; }
  /* An unknown reading (no AQI for that hour, say) takes no gap before the next. */
  .fc-hour-short > :empty, .fc-hour-air > :empty { display: none; }
  .fc-hour.fc-hour-head { display: none; }   /* (outranks .fc-hour's grid) */
  .fc-day p { margin: 0; padding: 0 16px 12px 58px; font-size: 0.74rem; line-height: 1.55; color: var(--text-muted); }
  .fc-day p b { color: var(--text); font-weight: 700; }
  /* Hourly: a day heading that stays in view, then one line per hour. */
  .fc-hours { list-style: none; margin: 0; padding: 0; }
  .fc-hour-day {
    position: sticky; top: 0; z-index: 1; padding: 6px 16px; background: var(--surface2);
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.7rem; letter-spacing: 0.06em;
  }
  .fc-hour {
    display: grid; grid-template-columns: 50px 24px 82px 44px 1fr; align-items: center; gap: 6px;
    padding: 7px 16px; font-size: 0.72rem; border-top: 1px solid var(--border);
  }
  .fc-hour > * { grid-area: auto; }   /* plain columns, not the 7-day row's named areas */
  .fc-hour .fc-icon { font-size: 1.05rem; }
  .fc-hour-time { font-family: 'Space Mono', monospace; color: var(--text-muted); }
  .fc-hour .fc-temp { font-size: 0.8rem; }
  .fc-hour-pop { color: var(--text-muted); }
  .fc-hour-short { color: var(--text-muted); }
  /* The narrowest phones (320 px): slimmer columns, so the last one still fits a
     long word ("Thunderstorms") or a wind ("NNW 10 mph") without the list
     scrolling sideways. */
  @media (max-width: 359px) {
    .fc-hour { grid-template-columns: 40px 22px 76px 44px minmax(0, 1fr); gap: 4px; padding-left: 12px; padding-right: 12px; }
    .fc-hour-pop { white-space: nowrap; }   /* "💧100%" in one piece */
  }
  .fc-foot { padding: 8px 16px; border-top: 1px solid var(--border); font-size: 0.62rem; color: var(--text-muted); }

  /* ════════════════════════════════════════════════════════════════════════════
     FLOATING ACTION BUTTON — "Locate Me"
     Positioned bottom-right, above the map attribution bar.
     ════════════════════════════════════════════════════════════════════════════ */
  #fab-locate {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    z-index: 1000;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 20px rgba(0,212,255,0.4);
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    outline: none;
  }
  #fab-locate:hover  {
    transform: scale(1.1);
    box-shadow: 0 6px 28px rgba(0,212,255,0.6);
  }
  #fab-locate:active { transform: scale(0.96); }
  #fab-locate.locating {
    background: var(--yellow);
    animation: pulse 0.8s infinite;
    cursor: wait;
  }
  /* Solid, high-contrast keyboard focus ring (a faint glow was under 3:1). */
  #fab-locate:focus { outline: 2px solid var(--text); outline-offset: 3px; }
  /* Browsers that know :focus-visible hide the ring after a mouse click/tap;
     older ones (Safari < 15.4) keep it, which beats having no ring at all. */
  #fab-locate:focus:not(:focus-visible) { outline: none; }

  /* ════════════════════════════════════════════════════════════════════════════
     APP VERSION BADGE  (bottom-left corner)
     Tiny label showing the running build version; tapping it opens the project's
     GitHub repository. Sits below the zoom control; see refreshVersionBadge() for
     how the text is set.
     ════════════════════════════════════════════════════════════════════════════ */
  #app-version {
    position: fixed;
    left:   calc(8px + var(--safe-left));
    bottom: calc(6px + var(--safe-bottom));
    z-index: 800;                    /* above the map, below panels/banners */
    font-family: 'Space Mono', monospace;
    font-size: 0.66rem;              /* a touch larger so it's actually readable */
    font-weight: 700;
    letter-spacing: 0.06em;
    /* High-contrast accent text on a near-solid chip so it stands out against the
       busy, dark-filtered map tiles instead of blending into them. */
    color: var(--accent);
    background: rgba(10,14,23,0.92);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 3px 7px;
    text-decoration: none;           /* a link, but styled as the badge it always was */
    cursor: pointer;
    user-select: none;
  }
  #app-version:hover { background: var(--surface2); }
  #app-version:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  /* Below ~340 px the one-line map credits reach the bottom-left corner: lift the
     badge just above them (still under the zoom control) instead of overlapping. */
  @media (max-width: 340px) {
    #app-version { bottom: calc(20px + var(--safe-bottom)); }
  }

  /* ════════════════════════════════════════════════════════════════════════════
     LOADING OVERLAY (full-map spinner)
     ════════════════════════════════════════════════════════════════════════════ */
  #map-overlay {
    position: absolute; inset: 0;
    background: rgba(10,14,23,0.75);
    display: none; align-items: center; justify-content: center;
    z-index: 999; flex-direction: column; gap: 12px;
  }
  #map-overlay.visible { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay-text {
    /* Full text colour: muted grey over the see-through overlay and light map
       tiles fell below the 4.5:1 contrast small text needs. */
    font-size: 0.7rem; color: var(--text);
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* ════════════════════════════════════════════════════════════════════════════
     TOAST NOTIFICATION (bottom-centre, slides up)
     ════════════════════════════════════════════════════════════════════════════ */
  #toast {
    /* fixed, not absolute: while hidden it sits 80px below the screen, and an
       absolute box down there makes the page taller than the window — so moving
       keyboard focus to a marker near the bottom scrolled the whole app up. */
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--red);
    color: var(--text); padding: 10px 20px;
    border-radius: var(--radius); font-size: 0.72rem;
    z-index: 1200;   /* above the alert banner, bottom sheet and pin-mode banner */
    /* Hidden = faded out, not just pushed 80px down: when it is lifted above the
       bottom sheet, "80px down" is still mid-screen. Fading keeps it in the
       accessibility tree, so the role="alert" announcement still works. */
    opacity: 0; pointer-events: none;
    transition: transform 0.3s ease, opacity 0.3s ease;
    /* Long messages wrap instead of running off both edges of a phone screen. */
    width: max-content; max-width: calc(100vw - 32px); text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Custom scrollbar (webkit only) */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ════════════════════════════════════════════════════════════════════════════
     SAFE-AREA & MOBILE FOUNDATIONS
     Respect iOS notch, home indicator, and Android cutouts via env().
     ════════════════════════════════════════════════════════════════════════════ */
  :root {
    --safe-top:    env(safe-area-inset-top,    0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left:   env(safe-area-inset-left,   0px);
    --safe-right:  env(safe-area-inset-right,  0px);
  }

  /* Prevent tap-highlight flash on touch */
  * { -webkit-tap-highlight-color: transparent; }

  /* Prevent pull-to-refresh, and drop double-tap zoom (taps respond instantly).
     `manipulation` still allows pinch-zoom, which low-vision users rely on; the
     map handles its own gestures (Leaflet sets touch-action on its container). */
  body { touch-action: manipulation; overscroll-behavior: none; }

  /* ════════════════════════════════════════════════════════════════════════════
     TAP-TO-PLACE MODE INDICATOR
     Shown across the top of the map (inside <main>, so it never hides the header
     or slips under a phone's notch) while tap/click-to-place mode is armed.
     ════════════════════════════════════════════════════════════════════════════ */
  #tap-place-banner {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0;
    background-color: var(--surface);   /* opaque base under the tinted fill */
    background-image: linear-gradient(rgba(255,107,53,0.15), rgba(255,107,53,0.15));
    border-bottom: 1px solid var(--accent2);
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    /* Side padding clears a landscape notch (viewport-fit=cover). */
    padding: 7px calc(12px + var(--safe-right)) 7px calc(12px + var(--safe-left));
    z-index: 1150;                       /* above the alert banner while the mode is armed */
    animation: slideIn 0.2s ease;
  }
  #tap-place-banner.active { display: block; }

  /* While placing a pin: crosshair cursor, and alert polygons and markers let
     clicks through to the map (they would otherwise open their own popup or the
     station panel instead), so the pin goes exactly where the user taps. */
  #map.tap-mode.leaflet-container { cursor: crosshair; }
  #map.tap-mode .wx-alert-area,
  #map.tap-mode .live-area-label,
  #map.tap-mode .leaflet-marker-icon { pointer-events: none; }
  /* Live-alert areas are drawn on one canvas, which shows a pointer over them;
     keep the crosshair there too (their clicks reach the map in pin mode). */
  #map.tap-mode .leaflet-liveAlerts-pane canvas { cursor: crosshair !important; }
  /* Live alerts on: the searched area's own polygons and labels are hidden (not
     removed), so nothing is drawn twice and they return intact afterwards. */
  #map.live-alerts-on .wx-alert-area,
  #map.live-alerts-on .alert-area-label:not(.live-area-label) { display: none; }
  /* Live alerts off: their canvas, which covers the whole map, is hidden so it
     can't catch clicks meant for the searched area's polygons below it. Hidden,
     never removed: Leaflet's canvas, once removed and added back, keeps a stale
     redraw request and draws nothing new until the map is moved. */
  #map:not(.live-alerts-on) .leaflet-liveAlerts-pane { display: none; }

  /* ════════════════════════════════════════════════════════════════════════════
     SEARCH RADIUS (the circle around the stations a search found)
     Nothing is drawn INSIDE the circle — that is the part people read. The rim
     glow, the slowly turning dotted ring and the dimmed map are all outside it.
     The pane never takes clicks: alert areas and the map below stay clickable.
     ════════════════════════════════════════════════════════════════════════════ */
  .leaflet-searchRadius-pane,
  .leaflet-searchRadius-pane svg { pointer-events: none; }
  .search-radius-ticks { animation: radius-sweep 18s linear infinite; }
  @keyframes radius-sweep { to { stroke-dashoffset: -240; } }
  .search-radius-label {
    display: inline-block; white-space: nowrap;
    /* Above the top of the rim, clear of the rings outside it. */
    transform: translate(-50%, calc(-100% - 38px));
    background: rgba(10,14,23,0.92); border: 1px solid var(--accent); border-radius: 14px;
    padding: 4px 11px; color: var(--text); font-size: 0.68rem;
    box-shadow: 0 0 18px rgba(0,212,255,0.35);
  }
  .search-radius-label b { color: var(--accent); }

  /* "Show this area on the map": the area it zoomed to, picked out for a few
     seconds — a soft cyan glow that breathes along its edge, a slow white dashed
     outline and one brief flash of light inside, with its name in a chip. Then
     it all fades away (or at a click on the map). Never takes clicks. */
  .leaflet-alertFocus-pane,
  .leaflet-alertFocusLabel-pane { pointer-events: none; transition: opacity 0.8s ease; }
  .leaflet-alertFocus-pane.fading,
  .leaflet-alertFocusLabel-pane.fading { opacity: 0; }
  .leaflet-alertFocus-pane svg,
  .leaflet-alertFocus-pane path { pointer-events: none !important; }
  .alert-focus-halo {
    animation: alert-focus-flash 1.4s ease-out 2, alert-focus-breathe 2.6s ease-in-out infinite;
  }
  @keyframes alert-focus-flash   { from { fill-opacity: 0.3; } to { fill-opacity: 0; } }
  @keyframes alert-focus-breathe { 0%, 100% { stroke-opacity: 0.22; } 50% { stroke-opacity: 0.6; } }
  .alert-focus-line { animation: alert-focus-march 2.6s linear infinite; }   /* an unhurried ~14 px/s */
  @keyframes alert-focus-march { to { stroke-dashoffset: -36; } }   /* two dash periods: a seamless loop */
  .leaflet-tooltip.alert-focus-label {
    /* Opaque: an area's own name chip may sit right underneath it. */
    background: rgb(10,14,23); border: 1px solid var(--accent); border-radius: 14px;
    padding: 4px 11px; color: var(--text); box-shadow: 0 0 18px rgba(0,212,255,0.35);
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.02em;
    white-space: normal; max-width: 240px; width: max-content; text-align: center;
  }
  .leaflet-tooltip.alert-focus-label::before { display: none !important; }
  /* RADIUS switch (next to LIVE ALERTS): shown only while a circle is drawn. Off,
     the plain map is shown — no rim, glow, dimming or label (the stations stay). */
  #search-radius-btn { display: none; }
  #map.has-search-radius #search-radius-btn { display: inline-flex; }
  #search-radius-btn .ring { width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; flex-shrink: 0; }
  #search-radius-btn[aria-pressed="false"] { color: var(--text-muted); }
  #map.radius-off .leaflet-searchRadius-pane,
  #map.radius-off .search-radius-label { display: none; }
  /* Under 390px wide, the fold button, LIVE ALERTS · 123, KEY and RADIUS don't fit
     on one row, and a second row would push the controls into the alert banner's
     space: RADIUS then shows just its ring (the word stays for screen readers, and
     in the title). */
  @media (max-width: 389px) {
    #search-radius-btn .radius-text {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }
  }

  /* ════════════════════════════════════════════════════════════════════════════
     LIVE ALERTS (map control above the zoom buttons: toggle + colour key)
     ════════════════════════════════════════════════════════════════════════════ */
  .live-alerts-ctl { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .live-alerts-row { display: flex; flex-wrap: wrap; gap: 6px; }
  /* The buttons the ‹ fold button tucks away (and brings back). */
  #map-tools { display: flex; flex-wrap: wrap; gap: 6px; }
  #map-tools[hidden] { display: none; }
  .live-alerts-ctl #map-tools-toggle { padding: 5px 9px; }
  #map-tools-toggle svg { flex-shrink: 0; transition: transform 0.2s ease; }
  #map-tools-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }   /* › when folded */
  /* Folded with live alerts on: a red lamp on the fold button says they still run. */
  #map-tools-toggle .lamp { display: none; width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
  #map.live-alerts-on #map-tools-toggle[aria-expanded="false"] .lamp { display: block; }
  .live-alerts-ctl button {
    display: inline-flex; align-items: center; gap: 7px; min-height: 30px;
    background: var(--surface); color: var(--accent); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 5px 10px; cursor: pointer;
    font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.7rem; letter-spacing: 0.08em;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }
  .live-alerts-ctl button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .live-alerts-ctl button[hidden] { display: none; }   /* KEY only while live alerts are on */
  #live-alerts-btn .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  #live-alerts-btn[aria-pressed="true"] { border-color: var(--red); color: #ffb3ba; background: #2a1219; }
  #live-alerts-btn[aria-pressed="true"] .lamp { background: var(--red); animation: live-lamp 1.6s infinite; }
  @keyframes live-lamp {
    0%   { box-shadow: 0 0 0 0 rgba(255,71,87,0.6); }
    100% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
  }
  #live-alerts-count { color: var(--text); font-family: 'Space Mono', monospace; font-weight: 400; }
  #live-legend {
    width: 250px; max-width: calc(100vw - 40px); max-height: min(40vh, 320px); overflow-y: auto;
    background: rgba(17,24,39,0.96); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6); padding: 6px; list-style: none; margin: 0;
  }
  #live-legend[hidden] { display: none; }
  /* An open colour key rises above the alert banner (1100) rather than under it
     (a phone's open station sheet still covers it: see the mobile block). */
  .leaflet-bottom.leaflet-left:has(#live-legend:not([hidden])) { z-index: 1101; }
  #live-legend li + li { margin-top: 1px; }
  .live-alerts-ctl #live-legend button {
    width: 100%; box-shadow: none; border: none; background: transparent; color: var(--text);
    font-family: 'Space Mono', monospace; font-weight: 400; letter-spacing: 0; font-size: 0.68rem;
    text-align: left; min-height: 28px;
  }
  .live-alerts-ctl #live-legend button:hover { background: var(--surface2); }
  #live-legend button[aria-pressed="false"] { opacity: 0.45; }
  #live-legend button[aria-pressed="false"] .live-legend-name { text-decoration: line-through; }
  .live-legend-swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.35); }
  .live-legend-name { flex: 1; }
  .live-legend-count { color: var(--text-muted); }
  #live-legend .live-legend-empty { padding: 6px 8px; color: var(--text-muted); font-size: 0.68rem; }

  /* Desktop: while pin mode is on, its banner (which wraps to two lines in
     mid-width windows) would cover the panel's ✕ — start the panel below it.
     (Phones are unaffected: their bottom sheet pins top and max-height with
     !important in the mobile block.) */
  /* --tap-banner-h is the pin-mode banner's real height (measured in section 17). */
  main:has(#tap-place-banner.active) #popup-panel {
    top: calc(var(--tap-banner-h, 48px) + 16px);
    max-height: calc(100% - var(--tap-banner-h, 48px) - 32px);
  }
  /* The alert banner moves below it too, so the alert summary stays visible. */
  main:has(#tap-place-banner.active) #alert-banner {
    top: calc(var(--tap-banner-h, 48px) + 16px);
    max-height: max(4rem, calc(100% - var(--tap-banner-h, 48px) - 16px - 150px));
  }

  /* Desktop: the station panel fills the top-right column and can reach the
     bottom of the map, where the Locate Me button would cover its refresh-interval
     box. Move the button left of the panel while it is open. (Phones use the
     bottom-sheet rule in the mobile block below instead.) */
  main.sheet-open #fab-locate { right: calc(16px + 314px + 16px); }
  /* …and in narrow desktop windows keep the alert banner from sliding under the
     left edge of that panel (banner at left 16px, panel 314px wide at right 16px). */
  main.sheet-open #alert-banner { max-width: calc(100% - 16px - 314px - 32px); }

  /* ════════════════════════════════════════════════════════════════════════════
     TOUCH-ONLY CONTROL SWAP
     Drag-and-drop isn't available on touch screens, so the drag-pin is replaced by
     the tap-to-place button. Deliberately gated on (pointer: coarse) alone — NOT
     the width-based mobile query below — because a narrow desktop window is still
     mouse-driven: it must keep the drag-pin and never show the tap button. Both
     buttons share one click handler (section 17), so either works wherever shown.
     ════════════════════════════════════════════════════════════════════════════ */
  @media (pointer: coarse) {
    #drag-pin    { display: none !important; }
    /* A flex <button> loses the browser's automatic centring of its content. */
    #tap-pin-btn { display: flex !important; align-items: center; justify-content: center; padding: 0; }
  }

  /* ════════════════════════════════════════════════════════════════════════════
     MOBILE STYLES  (≤ 640 px wide OR coarse pointer — touch screens)
     ════════════════════════════════════════════════════════════════════════════ */
  @media (pointer: coarse), (max-width: 640px) {

    /* ── Header: two-row layout ── */
    header {
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px calc(14px + var(--safe-right)) 10px calc(14px + var(--safe-left));
      padding-top: calc(10px + var(--safe-top));
    }

    .logo {
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* Status bar moves to the right on the first row, beside the logo */
    .status-bar {
      font-size: 0.65rem;
    }
    /* …and shares that row with FORECAST: it takes the space left and a long
       status ("FETCHING STATIONS…") is cut short with "…" rather than wrapping. */
    .status-bar { flex: 1 1 0; min-width: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; }
    /* Narrower type than the wide Syne, so "20 STATIONS" still fits beside it. */
    #forecast-btn { padding: 5px 8px; font-family: 'Space Mono', monospace; font-size: 0.66rem; letter-spacing: 0.04em; }
    /* The forecast opens as a sheet from the bottom of the screen. */
    #forecast-dialog {
      width: 100vw; max-height: 86vh; max-height: 86dvh;
      margin: auto 0 0; border-radius: 14px 14px 0 0; border-bottom: none;
    }
    /* Room for the home bar, inside the sheet: a tap on the dialog's own padding
       would count as a tap outside it and close the forecast. */
    .fc-foot { padding-bottom: calc(8px + var(--safe-bottom)); }
    /* A phone on its side: the notch is at one side of the full-width sheet. (On the
       sheet, not the dialog, for the same reason as above.) */
    .fc-sheet { padding-left: var(--safe-left); padding-right: var(--safe-right); }

    /* Search bar stretches to full width on the second row */
    .search-bar {
      order: 3;           /* push below logo + status */
      flex-basis: 100%;
      max-width: 100%;
      gap: 6px;
    }

    /* Bigger touch target for the text input — 44 px height minimum */
    .search-bar input {
      height: 44px;
      padding: 0 14px;
      font-size: 16px;    /* prevent iOS auto-zoom on focus */
      letter-spacing: 0.02em;
    }

    /* FIND button — full-height touch target */
    #search-btn {
      height: 44px;
      padding: 0 20px;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    /* Suggestions: finger-sized rows, and a shorter list, so less of it ends up
       under the on-screen keyboard (the rest scrolls into view). */
    #addr-suggest { max-height: 40vh; max-height: 40dvh; }
    #addr-suggest li { padding: 10px 14px; font-size: 0.85rem; }
    #addr-suggest li .sub { font-size: 0.75rem; }

    /* !important: the button's inline border style would otherwise always win. */
    #tap-pin-btn.active { border-color: var(--accent2) !important; }

    /* ── Bottom-left corner: the zoom buttons sit just above the version badge and
       the LIVE ALERTS · KEY · RADIUS row just above them — low in the corner, not
       halfway up the screen. (The row can't go below the zoom buttons: at 260–300px
       wide it would run into the Locate Me button in the opposite corner.) ── */
    .leaflet-control-zoom { margin-bottom: calc(38px + var(--safe-bottom)) !important; }
    .leaflet-bottom .live-alerts-ctl { margin-bottom: 6px; }
    /* Below ~340 px the version badge is lifted above the map credits: so are they. */
    @media (max-width: 340px) {
      .leaflet-control-zoom { margin-bottom: calc(52px + var(--safe-bottom)) !important; }
    }
    /* viewport-fit=cover: keep Leaflet's own controls out of a landscape notch
       and rounded corners, like every other edge element. */
    .leaflet-left .leaflet-control { margin-left: calc(10px + var(--safe-left)) !important; }
    .leaflet-control-attribution {
      margin-right: var(--safe-right) !important;
      margin-bottom: var(--safe-bottom) !important;
    }

    /* ── FAB — larger, above home indicator ── */
    #fab-locate {
      width: 54px; height: 54px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      box-shadow: 0 4px 24px rgba(0,212,255,0.5);
    }
    #fab-locate svg { width: 24px; height: 24px; }

    /* ── Popup panel: BOTTOM SHEET on mobile ── */
    #popup-panel {
      /* Override the desktop absolute top-right positioning */
      position: fixed !important;
      top: auto !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
      border-radius: 16px 16px 0 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
      border-top: 1px solid var(--border);
      max-height: 70vh !important;   /* beats the desktop pin-mode panel rule */
      /* dvh = the height actually visible; vh counts the area under mobile browser
         toolbars, which made the sheet leave too little map. vh stays as fallback. */
      max-height: 70dvh !important;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      /* slide up from bottom */
      animation: sheetSlideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1) !important;
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left); padding-right: var(--safe-right);
      /* z-index above FAB */
      z-index: 1100 !important;
    }

    @keyframes sheetSlideUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    /* The id selector + !important above outranks the global reduced-motion rule,
       so honour the user's setting for the sheet explicitly. */
    @media (prefers-reduced-motion: reduce) {
      #popup-panel { animation: none !important; }
    }

    /* Drag handle above popup header */
    #popup-panel::before {
      content: '';
      display: block;
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px auto 0;
    }

    /* Slightly larger close button */
    .popup-close {
      width: 36px !important; height: 36px !important;
      font-size: 16px !important;
      flex-shrink: 0;
    }

    /* Temperature number: slightly smaller to fit mobile width */
    .weather-temp { font-size: 2rem; }

    /* ── Toast: rise above bottom sheet when open ──
       #toast is a following sibling of <main> (not a descendant), so the
       sibling combinator is required for sheet-open to reach it. */
    main.sheet-open ~ #toast {
      /* --sheet-h is the sheet's real height, measured in initMobile() */
      bottom: calc(var(--sheet-h, 70vh) + 8px) !important;
    }
    /* Locate Me sits at the right just above the sheet (12–66px from the edge):
       shift the toast left of it instead of lifting it higher, which pushed it onto
       the search bar. Right edge = 100vw - 74px; left edge stays 8px. */
    main.sheet-open:not(.sheet-crowded) ~ #toast {
      left: calc(50% - 33px + (var(--safe-left) - var(--safe-right)) / 2);
      max-width: calc(100vw - 82px - var(--safe-left) - var(--safe-right));
    }

    /* ── Station markers: slightly larger hit-area on touch ── */
    .station-marker {
      width: 34px !important; height: 34px !important;
      font-size: 8px !important;
      /* Leaflet positions a 28 px icon box; pull the 34 px badge back by half the
         extra 6 px so it stays centred on the station's coordinate. */
      margin: -3px;
    }

    /* ── Alert banner: span the full width on narrow screens ── */
    #alert-banner {
      top: 8px; width: auto; max-width: none;
      /* Clear a landscape phone's notch / rounded corners (viewport-fit=cover). */
      left: calc(8px + var(--safe-left)); right: calc(8px + var(--safe-right));
      /* Full width here, so stay above the bottom-left controls (the zoom buttons
         and the LIVE ALERTS row above them, ~140px up) and the Locate Me button
         (right, ~70px). The 4rem floor keeps the summary chip visible on short
         landscape phones. */
      max-height: max(4rem, calc(100% - 8px - 160px - var(--safe-bottom)));
    }
    /* Pin mode on phones: same idea as the desktop rule above, with phone spacing
       (these selectors match the desktop ones in specificity and come later). */
    main:has(#tap-place-banner.active) #alert-banner {
      top: calc(var(--tap-banner-h, 74px) + 8px);
      max-height: max(4rem, calc(100% - var(--tap-banner-h, 74px) - 8px - 160px - var(--safe-bottom)));
    }
    main.sheet-open:has(#tap-place-banner.active) #alert-banner {
      max-height: max(4rem, calc(100% - var(--tap-banner-h, 74px) - 8px - var(--sheet-h, 70vh) - 74px));
    }
    /* With the bottom sheet open: full width (undo the desktop side-by-side rule)
       and end above the Locate Me button, which then sits 12px above the sheet
       (whose real height is --sheet-h) and is 54px tall: 12 + 54 + 8px gap = 74px. */
    main.sheet-open #alert-banner {
      max-width: none;
      max-height: max(4rem, calc(100% - 8px - var(--sheet-h, 70vh) - 74px));
    }

    /* ── Map overlay text: readable on small screens ── */
    .overlay-text { font-size: 0.75rem; }

    /* ── Interval input: bigger touch target ── */
    #interval-input {
      width: 56px;
      height: 28px;
      /* 16px: iOS Safari zooms the whole page into any smaller input on focus. */
      font-size: 16px !important;
      padding: 0 4px;
    }
    /* ── FAB shift: above bottom sheet when open ── */
    main.sheet-open #fab-locate {
      bottom: calc(var(--sheet-h, 70vh) + 12px);   /* the sheet height already includes its safe-area padding */
      right: calc(12px + env(safe-area-inset-right, 0px));   /* undo the desktop side-step */
      /* When an open sheet leaves only a thin strip of map, the alert banner's
         minimum height can reach down to this button; keep the button on top
         and tappable (the banner's whole summary chip stays clickable). */
      z-index: 1150;
      transition: bottom 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    /* An open station sheet covers the colour key like the other map controls. */
    main.sheet-open .leaflet-bottom.leaflet-left:has(#live-legend:not([hidden])) { z-index: 1000; }
    /* No room above the sheet (set in initMobile): hide rather than cover the header. */
    main.sheet-open.sheet-crowded #fab-locate { visibility: hidden; }

    /* ── Toast: above the bottom-left controls — the LIVE ALERTS row tops out ~137px
       up (~151px under 340px wide, where the controls sit higher) — so it never
       covers those buttons, and so above Locate Me too; 54px clear of each side
       (and of a landscape notch). ── */
    #toast { bottom: calc(145px + var(--safe-bottom)); max-width: calc(100vw - 108px - var(--safe-left) - var(--safe-right)); }
    @media (max-width: 340px) {
      #toast { bottom: calc(159px + var(--safe-bottom)); }
    }
  }

  /* Short screens (a phone on its side): a compact forecast head — place and air
     quality on one line, less padding — so the forecast keeps most of the height. */
  @media (max-height: 520px) {
    .fc-head { padding: 8px 12px 6px 16px; }
    .fc-head h2 { font-size: 0.9rem; }
    .fc-place, .fc-now { display: inline-block; margin: 0 16px 0 0; }
    .fc-now[hidden] { display: none; }
    .fc-close { width: 30px; height: 30px; }
    .fc-tabs [role="tab"] { padding: 6px 12px; }
  }

  /* ════════════════════════════════════════════════════════════════════════════
     FORECAST ON WIDE SCREENS — the week at a glance (section 14D)
     From 960 × 600 px up the dialog grows to use the screen, and the 7-day list
     gives way to a timeline: the days side by side over one continuous chart of
     their hours, the nights shaded from sunset to sunrise. After the phone rules,
     so a large touch screen (a tablet in landscape) gets it too.
     ════════════════════════════════════════════════════════════════════════════ */
  .fc-week { display: none; }
  @media (min-width: 960px) and (min-height: 600px) {
    #forecast-dialog {
      width: min(1880px, calc(100vw - 64px));   /* big monitors: use them (text keeps its size, the chart widens) */
      max-height: min(94vh, 1000px); max-height: min(94dvh, 1000px);
      margin: auto; border-radius: 10px; border-bottom: 1px solid var(--border);
    }
    .fc-foot { padding-bottom: 8px; }
    .fc-place, .fc-now { display: inline-block; margin-right: 18px; }   /* one line: room for the week */
    .fc-now[hidden] { display: none; }
    #fc-days > .fc-day { display: none; }   /* the phone list */
    .fc-week { display: block; }
    /* Hourly: a table — one row per hour, its readings in aligned columns. */
    .fc-hour {
      /* (Its minimums fit the 896 px dialog of a 960 px window.) */
      grid-template-columns: 56px 26px 112px 92px minmax(110px, 1.1fr) minmax(90px, 0.7fr) minmax(140px, 0.8fr) minmax(96px, 0.7fr);
      gap: 12px; padding: 8px 20px;
    }
    .fc-hour-short, .fc-hour-air { display: contents; }
    /* Empty cells stay here: they hold their column's place in the table. */
    .fc-hour-short > :empty, .fc-hour-air > :empty { display: block; }
    /* The chance of rain as a bar behind its number: 100% fills the cell. */
    .fc-hour:not(.fc-hour-head) .fc-hour-pop {
      padding: 2px 6px; border-radius: 3px; color: var(--text);   /* readable on the bar */
      background: linear-gradient(90deg, rgba(90,169,255,0.32) var(--pop, 0%), rgba(90,169,255,0.06) 0);
    }
    .fc-hour-sky { color: var(--text); }
    .fc-hour-air > span { font-size: 0.72rem; }
    .fc-hour.fc-hour-head {
      display: grid; padding-top: 10px; padding-bottom: 8px; border-top: 0;
      font-size: 0.64rem; color: var(--text-muted);
    }
    .fc-hour-day { padding-left: 20px; }
  }

  /* The days: columns as wide as their hours, hairlines between, the picked one lit. */
  .fc-wk-days { display: grid; border-bottom: 1px solid var(--border); }
  .fc-wk-day {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0;
    margin: 0; padding: 14px 12px 14px 14px; text-align: left; cursor: pointer;
    background: none; color: var(--text); font: inherit; overflow-wrap: break-word;
    border: 0; border-left: 1px solid var(--border); box-shadow: inset 0 3px 0 transparent;
    overflow: hidden;   /* a column never spills into its neighbour (or scrolls the dialog) */
    transition: background-color 0.15s;
  }
  .fc-wk-day:first-child { border-left: 0; }
  .fc-wk-day:hover { background: rgba(255,255,255,0.03); }
  .fc-wk-day[aria-selected="true"] { background: var(--surface2); box-shadow: inset 0 3px 0 var(--accent); }
  .fc-wk-day:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .fc-wk-name {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.88rem;
  }
  .fc-wk-short { display: none; }
  /* Narrow columns: "Wed" in place of "Wednesday" (still read out in full). Told
     by each column's own width, which hangs on the window and on how many days
     the week has (with eight, "Wednesday" doesn't fit even at 1280 px). */
  .fc-wk-day { container-type: inline-size; }
  @container (max-width: 139px) {
    .fc-wk-short { display: inline; }
    .fc-wk-long { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  }
  @media (max-width: 1279px) {
    .fc-wk-day { padding-left: 11px; padding-right: 8px; }
    .fc-wk-name { font-size: 0.8rem; }
    .fc-wk-sunset { font-size: 0.74rem; }
  }
  .fc-wk-date { margin-top: -4px; font-size: 0.64rem; color: var(--text-muted); }
  .fc-wk-main { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 6px 0 2px; }
  .fc-wk-icon { font-size: 1.8rem; line-height: 1; }
  .fc-wk-temps {
    display: flex; flex-wrap: wrap; column-gap: 8px;
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1.08rem;
  }
  .fc-wk-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .fc-wk-meta > span { white-space: nowrap; }   /* "7:17 PM" stays whole; the pair may wrap */
  .fc-wk-sky {
