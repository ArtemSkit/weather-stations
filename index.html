    renderer: searchRadiusRenderer, radius: 0, fill: false, interactive: false, color: '#00d4ff', ...opts
  }).addTo(searchRadiusLayer);
  // Dimmed map outside: a world-sized shape with the circle cut out of it. Added
  // once the map has landed (see startGrow): mid-flight Leaflet only scales the
  // old drawing, so it would visibly shrink towards the centre.
  const mask = L.polygon([SEARCH_MASK_OUTER], {
    renderer: searchRadiusRenderer, stroke: false, fillColor: '#05070c', fillOpacity: 0.32, interactive: false
  });
  // Rings `px` screen pixels beyond the rim: three fading glows, then the dotted ring.
  const rings = [
    { px: 4,  layer: ring({ weight: 6,  opacity: 0.30 }) },
    { px: 10, layer: ring({ weight: 8,  opacity: 0.13 }) },
    { px: 18, layer: ring({ weight: 10, opacity: 0.05 }) },
    { px: 30, layer: ring({ weight: 5,  opacity: 0.5, dashArray: '1 13', className: 'search-radius-ticks' }) }
  ];
  const rim = ring({ weight: 2, opacity: 0.95 });
  const shownMi = Math.round(miles);
  const label = L.marker([lat, lon], { interactive: false, keyboard: false, icon: L.divIcon({
    className: '', iconSize: null,
    html: `<span class="search-radius-label"><b>${count}</b> station${count === 1 ? '' : 's'} · within <b>${shownMi} mi</b></span>`
  }) });
  const circle = { lat, r: 0, rim, rings, mask, label };
  searchRadius = circle;

  const bounds = L.latLng(lat, lon).toBounds(r * SEARCH_FIT_BOX);
  const flying = fitSearchRadius(bounds, lat, lon);

  // Grow out from the point — at once when motion is reduced, or when the page is
  // in a background tab (no animation frames run there). While the map is still
  // flying, Leaflet scales the drawing mid-zoom, so the grow waits for it to land
  // (with a fallback in case the flight ends without a "moveend").
  const still = prefersReducedMotion.matches || document.hidden;
  const ease = t => 1 - Math.pow(1 - t, 3);
  let started = false;
  const startGrow = () => {
    if (started || searchRadius !== circle) return;
    started = true;
    mask.addTo(searchRadiusLayer).bringToBack();   // under the rings and rim
    const start = performance.now(), duration = still ? 0 : 900;
    (function grow(now) {
      if (searchRadius !== circle) return;     // a newer search replaced it
      const t = duration ? Math.min(1, (now - start) / duration) : 1;
      circle.r = r * ease(t);
      layoutSearchRadius();
      if (t < 1) { requestAnimationFrame(grow); return; }
      label.addTo(searchRadiusLayer);
      layoutSearchRadius();
    })(start);
  };
  if (flying && !still) {
    map.once('moveend', startGrow);
    // (Not while the page is hidden: the flight pauses then, and resumes — and
    // ends with "moveend" — once the page is shown again.)
    setTimeout(() => { if (!document.hidden) startGrow(); }, 2000);
  } else {
    startGrow();
  }

  // The alert loader looks at the circle's own box, not the wider fit box above:
  // that one's corners reach 1.5 radii out, into the dimmed area and margins.
  const area = L.latLng(lat, lon).toBounds(2 * r);
  return { west: area.getWest(), south: area.getSouth(), east: area.getEast(), north: area.getNorth() };
}

/**
 * Fit the circle (and the label and rings outside it) on screen. A map with no
 * size (laid out while hidden) can't be fitted — flyToBounds would divide by
 * zero — and one smaller than the padding (a landscape phone with its keyboard
 * up) would get a nonsense zoom, so either is simply centred at a typical zoom.
 * @returns {boolean} true when the map is now flying (animating) to the circle
 */
function fitSearchRadius(bounds, lat, lon) {
  const size = map.getSize();
  if (size.x <= SEARCH_FIT_PAD_X || size.y <= SEARCH_FIT_PAD_Y) { map.setView([lat, lon], 8); return false; }
  // Room for the label above the circle and a margin elsewhere.
  const options = { paddingTopLeft: [SEARCH_FIT_EDGE, SEARCH_FIT_TOP],
                    paddingBottomRight: [SEARCH_FIT_EDGE, SEARCH_FIT_EDGE], maxZoom: SEARCH_FIT_MAX_ZOOM };
  // Reduced motion: no animation at all (a same-zoom fit would still glide).
  if (prefersReducedMotion.matches) { map.fitBounds(bounds, { ...options, animate: false }); return false; }
  map.flyToBounds(bounds, { ...options, duration: 1.2 });
  return true;
}

/**
 * Lay the circle out for the current zoom: the outside rings a fixed number of
 * SCREEN pixels beyond the rim (so they look the same at every zoom), the circle
 * cut out of the dimming, and the label above the top of the rim.
 */
function layoutSearchRadius() {
  const c = searchRadius;
  if (!c) return;
  const metresPerPixel = 40075016.686 * Math.cos(c.lat * Math.PI / 180) / (256 * Math.pow(2, map.getZoom()));
  c.rim.setRadius(c.r);
  c.rings.forEach(g => g.layer.setRadius(c.r ? c.r + g.px * metresPerPixel : 0));

  // The hole follows Leaflet's own drawing of the rim (an ellipse on screen), so
  // the edge of the dimming lines up exactly with the line.
  const p = c.rim._point, rx = c.rim._radius, ry = c.rim._radiusY || rx;
  if (!c.r || !p || !rx) { c.mask.setLatLngs([SEARCH_MASK_OUTER]); return; }
  const hole = [];
  for (let i = 0; i < 128; i++) {
    const a = (i / 128) * 2 * Math.PI;
    hole.push(map.layerPointToLatLng(L.point(p.x + rx * Math.cos(a), p.y + ry * Math.sin(a))));
  }
  c.mask.setLatLngs([SEARCH_MASK_OUTER, hole]);
  c.label.setLatLng(map.layerPointToLatLng(L.point(p.x, p.y - ry)));
}
map.on('zoomend', layoutSearchRadius);

/** Remove the circle (clearStations runs this when a new search starts). */
function clearSearchRadius() {
  searchRadius = null;
  searchRadiusLayer.clearLayers();
}

/* ─────────────────────────────────────────────────────────────────────────────
   14. POST-GEOCODE PIPELINE
   ─────────────────────────────────────────────────────────────────────────────
   All geocoding paths (ZIP, address, coords, geolocation, dropped pin) converge
   here.  Fetches the nearest stations, plots them, and resets popup state.
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Pan the map to (lat, lon), fetch nearby NOAA stations, and plot them.
 * Resets any open popup and active marker.
 *
 * @param {number} lat
 * @param {number} lon
 * @param {number} gen - the search generation allocated by the caller
 * @returns {Promise<boolean>} true once stations are plotted; false when a newer
 *          area replaced this one (failures throw)
 */
async function loadStationsAt(lat, lon, gen) {
  // Every caller allocates its search generation before its first await and
  // passes it in; the status bar and overlay belong to the newest search. The
  // map itself belongs to the newest AREA (see areaGeneration).
  const area = ++areaGeneration;

  // Drop any alerts from the previous area so a stale banner isn't shown for the
  // new location while its stations and alerts are being fetched.
  clearAlerts();

  // Invalidate the old station panel immediately. Its request must not repaint
  // while the new location is still waiting on the station feed.
  popupPanel.style.display = 'none';
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  stationOpenGeneration++;
  activeStationId = null;
  if (activeMarkerEl) { activeMarkerEl.classList.remove('active'); activeMarkerEl = null; }
  // Remove the old area's markers now too: the map is about to fly away, so they
  // must not linger (or stay clickable and open a stale panel) during the fetch,
  // nor be left behind next to the new location if the station fetch fails.
  clearStations();

  setStatus('loading', 'FETCHING STATIONS…');
  overlayText.textContent = 'Fetching weather stations…';
  // Zoom 8 is about the size of a typical search circle; once the stations are
  // in, the map fits the actual circle (plotStations → drawSearchRadius).
  moveMapTo(lat, lon, 8);

  let data;
  areaLoading = { status: 'FETCHING STATIONS…', overlay: 'Fetching weather stations…' };
  try {
    data = await fetchStations(lat, lon);
  } catch (err) {
    if (area === areaGeneration) areaLoading = null;
    // This area's own failure. Its caller reports it only while its search is
    // the newest; if a newer search has meanwhile failed before reaching the map,
    // this is still the area on screen, so explain why it stayed empty here.
    if (gen !== searchGeneration && area === areaGeneration && mayUpdateSearchUi(gen)) {
      reportSearchError(err.message || 'Something went wrong');
    }
    throw err;
  }
  if (area !== areaGeneration) return false;     // a newer area replaced this one
  areaLoading = null;
  const radiusBox = plotStations(data, lat, lon);

  // A newer search still running owns the status bar and overlay; leave them.
  if (mayUpdateSearchUi(gen)) {
    settledSearch = searchGeneration;
    setStatus('ok', stationCountLabel());
    hideOverlay();
  }

  // Fetch and display any active dangerous-weather alerts for this area, then keep
  // them refreshed on a timer.  Fire-and-forget: alerts are supplementary and must
  // never delay or block the station map. A stale result is discarded internally.
  // Nearby warning polygons are picked from the area the circle covers.
  loadAlertsForArea(lat, lon, radiusBox);
  return true;
}

/* ─────────────────────────────────────────────────────────────────────────────
   14B. DANGEROUS-WEATHER ALERTS  (NWS watches / warnings / advisories)
   ─────────────────────────────────────────────────────────────────────────────
   Alerts are area-based, not station-based: the NWS issues them for polygons or
   county/forecast zones, never for individual observation stations.  So they are
   anchored to the searched point and its search circle's area, displayed three ways:

     • Tier 1 — a banner listing alerts affecting the point plus nearby inline
       polygons inside that area, colour-coded and ranked by
       severity (renderAlertBanner).
     • Tier 2 — each alert's geographic footprint drawn on the map as a coloured
       polygon with a label and detail popup (renderAlertAreas).
     • Tier 3 — a pulsing red ring on any station marker that falls inside an
       active warning POLYGON, since storm-based warnings can cover only part of
       a city and so apply to some stations but not others (flagStationsInAlerts).
   ───────────────────────────────────────────────────────────────────────────── */

/** Coordinates of the most recent search — the location the alerts belong to. */
let currentLat  = null;
let currentLon  = null;
/* Map area used to pick nearby regional polygons. Fixed when the area loads, so
   later window resizes can't add or drop alerts (which would reset the banner). */
let currentViewport = null;
/** setInterval handle for the alert refresh loop, or null when no loop is active. */
let alertsTimer = null;
/** Cached banner element (lives above the script, so it always resolves). */
const alertBanner = document.getElementById('alert-banner');

/* ── Alert AREA overlay state (map polygons) ──────────────────────────────────
   alertAreaGroup holds every alert polygon currently drawn on the map.
   alertAreaSeq guards late, asynchronous zone-geometry draws so a result from an
   earlier render can never paint onto a newer one.
   zoneGeomCache memoises the separate NWS zone-geometry lookups used to outline
   zone-only alerts that arrive without an inline polygon. */
const alertAreaGroup = L.layerGroup().addTo(map);
const alertAreaLayers = [];          // rendered layers plus metadata used for deterministic stacking
// A single alert may contain several rendered paths. Map each SVG element to its
// owning GeoJSON layer so every piece of that logical alert shares toggle state.
const alertAreaOwners = new WeakMap();
let activeAlertAreaOwner = null;
// A partial zone lookup is retried even when the NWS alert ids have not changed.
let alertAreasNeedRetry = false;
let   alertAreaSeq   = 0;
const zoneGeomCache  = new Map();   // zone URL → in-flight/resolved geometry Promise
const ZONE_GEOM_CACHE_LIMIT = 200;
const ZONE_FETCH_CONCURRENCY = 6;
const zoneFetchQueue = [];
let zoneFetchActive = 0;

/**
 * The element of the alert popup that is open right now, or null. Tracked via
 * popupopen/popupclose rather than a DOM query: Leaflet leaves a closed popup in
 * the page for its 200 ms fade-out, which a query would still report as open.
 * @returns {HTMLElement|null}
 */
function openAlertPopupElement() {
  // A live-alert area's popup (14C) follows the same click-away and Escape rules.
  return activeAlertAreaOwner?.getPopup?.()?.getElement?.() ||
         (livePopup?.isOpen() ? livePopup.getElement() : null);
}

/**
 * Apply the alert-popup click contract before Leaflet handles the click:
 * - the active area toggles closed and consumes the event;
 * - a different area continues to Leaflet so it replaces and repositions the popup;
 * - every other outside click closes the popup normally.
 */
function handleAlertPopupClickAway(event) {
  // Browsers fire a click when a mouse drag (map pan) ends; Leaflet ignores it,
  // and so must we, or panning the map would close the popup. Leaflet's "moved"
  // flag only resets on the next press ON the map, so also require that this
  // click's press started there, and never skip keyboard clicks (detail 0).
  if (event.detail && pressStartedInMap && map.dragging?.moved()) return;
  const popup = openAlertPopupElement();
  if (!popup) return;
  const target = event.target;
  if (popup.contains(target)) return;

  const clickedAlertArea = target?.closest?.('.wx-alert-area');
  const clickedAlertOwner = clickedAlertArea ? alertAreaOwners.get(clickedAlertArea) : null;
  if (clickedAlertArea && clickedAlertOwner !== activeAlertAreaOwner) {
    return; // Leaflet closes the previous popup and opens this area's at the click.
  }

  // A click on the live-alert canvas (14C) that closes its popup: remember it, so
  // if it landed on that same alert its own click handler, which runs next, leaves
  // the popup closed (a toggle, like the areas above) instead of reopening it.
  if (livePopup?.isOpen()) liveClosingClick = { event, capId: livePopupCapId };
  map.closePopup();
  if (clickedAlertArea) event.stopPropagation();
}

/** Close an alert popup on Escape even when keyboard focus is outside the map. */
function handleAlertPopupEscape(event) {
  if (event.defaultPrevented) return;   // already used (e.g. it closed the station panel)
  if (event.key === 'Escape' && openAlertPopupElement()) {
    map.closePopup();
    event.preventDefault();   // consumed: other Escape handlers (pin mode) skip it
  }
}

/**
 * Before an alert area's popup opens (capture phase, so ahead of Leaflet), widen
 * its auto-pan padding so the popup also clears the alert banner (top) and an
 * open station panel (desktop: right; phone sheet: bottom). Leaflet only knows
 * the map's own edges, and both of those float above its popup layer.
 */
function prepareAlertPopupPan(event) {
  const area = event.target?.closest?.('.wx-alert-area');
  const popup = area ? alertAreaOwners.get(area)?.getPopup?.() : null;
  if (!popup) return;
  fitAlertPopup(popup.options, event.clientX, event.clientY);
}

/**
 * Size an alert popup for a click at (clientX, clientY) and set its auto-pan
 * padding so it clears the alert banner and an open station panel (shared by the
 * searched area's popups and the live-alert popups, 14C).
 * @param {Object} options - the popup's options (changed in place)
 */
function fitAlertPopup(options, clientX, clientY) {
  const mapBox = document.getElementById('map').getBoundingClientRect();

  // Fit the popup to narrow phones: the content (up to 320px) plus its margins,
  // the wrapper and the 44px × must stay inside the map, or the × is off-screen.
  const width = Math.max(160, Math.min(320, mapBox.width - 104));
  options.maxWidth = width;
  // The popup opens centred above the tap point; these bound its likely footprint
  // (height: the 360px content cap plus margins, frame, tip and offset).
  const halfWidth = width / 2 + 40, height = 440;

  // Never ask for more than half the map, or the popup would have nowhere to go.
  const clampY = v => Math.max(16, Math.min(v, mapBox.height / 2));
  const clampX = v => Math.max(16, Math.min(v, mapBox.width / 2));
  let top = 16, right = 16, bottom = 16;
  if (popupPanel.style.display === 'block') {
    const panel = popupPanel.getBoundingClientRect();
    if (getComputedStyle(popupPanel).position === 'fixed') {   // phone bottom sheet
      bottom = clampY(mapBox.bottom - panel.top + 8);
    } else if (clientY - height < panel.bottom) {         // desktop side panel
      right = clampX(mapBox.right - panel.left + 8);
    }
  }
  if (alertBanner.classList.contains('visible')) {
    const banner = alertBanner.getBoundingClientRect();
    // Only when the popup could reach the banner sideways (on desktop the banner
    // is a 330px column), so a click elsewhere doesn't pan the map for nothing.
    // Where it ends up counts: a popup sticking out on the right is pushed left
    // by Leaflet's own auto-pan, possibly into the banner's column.
    const popupLeft = Math.min(clientX - halfWidth, mapBox.right - right - 2 * halfWidth);
    if (popupLeft < banner.right) top = clampY(banner.bottom - mapBox.top + 8);
  }
  options.autoPanPaddingTopLeft = [16, top];
  options.autoPanPaddingBottomRight = [right, bottom];
  // Leave room for the popup's own frame and tip in what remains, so on short
  // screens its content scrolls instead of being cut off at the map's edge.
  options.maxHeight = Math.max(120, mapBox.height - top - bottom - 60);
}

document.addEventListener('click', prepareAlertPopupPan, { capture: true });
/** Whether the most recent pointer press started on the map (see the click-away guard). */
let pressStartedInMap = false;
document.addEventListener('pointerdown', e => {
  pressStartedInMap = map.getContainer().contains(e.target);
}, { capture: true });
document.addEventListener('click', handleAlertPopupClickAway, { capture: true });
document.addEventListener('keydown', handleAlertPopupEscape);

/* Signature of the alert set currently on screen. The 2-minute refresh loop
   compares against this and skips re-rendering when nothing has changed — so the
   user's banner state (collapsed/expanded, which card is open) and any open map
   area popup survive the tick instead of being reset every two minutes. */
let lastAlertSignature = null;
/** The alert set currently drawn — used to drop lapsed alerts during a feed outage. */
let shownAlerts = [];
/* Identity of the area load whose alerts may still be drawn. clearAlerts() (a new
   area replacing the stations on screen) and every new load replace it. */
let alertLoadToken = null;

/**
 * Build a stable signature of an alert set from its ids. The NWS assigns a fresh
 * id whenever an alert is issued, updated, or replaced, so a matching id set means
 * the displayed alerts are genuinely unchanged.
 * @param   {Object[]} features
 * @returns {string}
 */
function alertsSignature(features) {
  return (features || [])
    .map(f => f.id || f.properties?.id || `${f.properties?.event}@${f.properties?.expires}`)
    .sort()
    .join('|');
}

/**
 * Classify an alert into one of four visual severity buckets used for colour and
 * sort order.  Driven by the NWS `event` name first (so the two life-threatening
 * warnings always stand out) then the `severity` rating.
 *
 * @param   {Object} props - alert Feature `properties`
 * @returns {'crit'|'warn'|'watch'|'info'}
 */
function alertClass(props) {
  const event = (props.event || '').toLowerCase();
  const sev   = props.severity || '';
  // Life-threatening, act-now products get the loudest (red) treatment.
  if (event.includes('tornado warning') || event.includes('flash flood warning')) return 'crit';
  if (event.includes('warning')) return 'warn';
  // Watches mean "conditions are favourable, be prepared" → amber. Checked before
  // the severity fallback because the NWS rates e.g. Tornado Watch "Extreme" —
  // otherwise a watch would outrank (and recolour like) an issued warning.
  if (event.includes('watch')) return 'watch';
  // Any other Extreme/Severe-rated product → warning level (orange).
  if (sev === 'Extreme' || sev === 'Severe') return 'warn';
  // Advisories, special statements, everything else → informational (yellow).
  return 'info';
}

/* Sort keys: class first (crit→info), then NWS severity, urgency, certainty, and expiry. */
const ALERT_CLASS_RANK = { crit: 0, warn: 1, watch: 2, info: 3 };
const ALERT_SEV_WEIGHT = { Extreme: 0, Severe: 1, Moderate: 2, Minor: 3, Unknown: 4 };
const ALERT_URGENCY_WEIGHT = { Immediate: 0, Expected: 1, Future: 2, Past: 3, Unknown: 4 };
const ALERT_CERTAINTY_WEIGHT = { Observed: 0, Likely: 1, Possible: 2, Unlikely: 3, Unknown: 4 };

/** Compare two alert property objects from most to least dangerous. */
function compareAlertDanger(a, b) {
  const classA = ALERT_CLASS_RANK[alertClass(a)] ?? 9;
  const classB = ALERT_CLASS_RANK[alertClass(b)] ?? 9;
  if (classA !== classB) return classA - classB;

  const severityA = ALERT_SEV_WEIGHT[a.severity] ?? 9;
  const severityB = ALERT_SEV_WEIGHT[b.severity] ?? 9;
  if (severityA !== severityB) return severityA - severityB;

  const urgencyA = ALERT_URGENCY_WEIGHT[a.urgency] ?? 9;
  const urgencyB = ALERT_URGENCY_WEIGHT[b.urgency] ?? 9;
  if (urgencyA !== urgencyB) return urgencyA - urgencyB;

  const certaintyA = ALERT_CERTAINTY_WEIGHT[a.certainty] ?? 9;
  const certaintyB = ALERT_CERTAINTY_WEIGHT[b.certainty] ?? 9;
  return certaintyA - certaintyB;
}

/**
 * Order alerts most-dangerous-first so the banner leads with what matters.
 * @param   {Object[]} features
 * @returns {Object[]} a sorted copy (input is not mutated)
 */
function sortAlerts(features) {
  return features.slice().sort((a, b) => {
    const pa = a.properties || {}, pb = b.properties || {};
    const dangerOrder = compareAlertDanger(pa, pb);
    if (dangerOrder !== 0) return dangerOrder;
    // Tie-break on when the hazard itself ends (`ends`); `expires` is only when
    // this copy of the message lapses, often hours earlier for long events.
    return new Date(pa.ends || pa.expires || 0) - new Date(pb.ends || pb.expires || 0);
  });
}

/**
 * Escape a string for safe interpolation into innerHTML.  Alert descriptions are
 * long free-text fields from an external feed, so they are always escaped.
 * @param   {*} s
 * @returns {string}
 */
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/**
 * Re-flow NWS alert text for display.  NWS products are hard-wrapped at about
 * 69 characters, so a single newline is only a line wrap in the middle of a
 * sentence and becomes a space.  Blank lines are real paragraph breaks and are
 * kept, as is the line break in front of a "* " or "- " bullet item.  A paragraph
 * that is only "&&" (the NWS end-of-section marker) is dropped.
 * @param   {string} text - raw `description` or `instruction` from the feed
 * @returns {string} text with paragraphs separated by one blank line
 */
function unwrapAlertText(text) {
  return String(text || '')
    .replace(/\r\n?/g, '\n')                          // normalise Windows/old-Mac line endings
    .split(/\n[ \t]*\n+/)                             // split into paragraphs at blank lines
    .map(para => para.trim().replace(/\n(?![ \t]*[*-] )[ \t]*/g, ' '))   // join wrapped lines
    .filter(para => para && para !== '&&')            // drop NWS "&&" section-end markers
    .join('\n\n');
}

/**
 * Tier 1 — render the alert banner from a list of alert Features.
 * Hides the banner entirely when there are no active alerts.
 * @param {Object[]} features - GeoJSON alert Features from fetchAlerts()
 */
function renderAlertBanner(features) {
  const sorted = sortAlerts(features || []);

  // No active alerts → clear and hide the banner, then bail.
  if (sorted.length === 0) {
    alertBanner.className = '';
    alertBanner.innerHTML = '';
    return;
  }

  const top      = sorted[0].properties || {};
  const topClass = alertClass(top);
  const plural   = sorted.length === 1 ? '' : 's';

  // Collapsible summary chip: alert count + the single most severe event name.
  const summary = `
    <button class="alert-summary alert-${topClass}" type="button"
            data-role="toggle" aria-expanded="true">
      <span class="alert-summary-icon" aria-hidden="true">⚠️</span>
      <span class="alert-summary-text">${sorted.length} alert${plural} · ${escapeHtml(top.event || 'Weather alert')}</span>
      <span class="alert-summary-caret" aria-hidden="true">▾</span>
    </button>`;

  // One card per alert; the body (headline + description + safety instruction) is
  // collapsed until the card header is clicked, to keep the banner compact.
  const cards = sorted.map(f => {
    const p       = f.properties || {};
    const cls     = alertClass(p);
    // Show when the hazard ends (see alertEndText). A future start is shown too,
    // so an upcoming alert doesn't read as already in force.
    const startsLater = p.onset && Date.parse(p.onset) > Date.now();
    const expires = [startsLater && `from ${formatWhen(p.onset)}`, alertEndText(p)]
      .filter(Boolean).map(s => `<span class="alert-when">${escapeHtml(s)}</span>`).join(' ');
    // Unwrap each part separately so the NWS hard line wraps don't split sentences.
    const detail  = [p.description, p.instruction].map(unwrapAlertText).filter(Boolean).join('\n\n');
    return `
      <div class="alert-card alert-${cls}">
        <button class="alert-card-head" type="button" data-role="card" aria-expanded="false">
          <span class="alert-event">${escapeHtml(p.event || 'Weather alert')}</span>
          <span class="alert-expires">${expires}</span>
        </button>
        <div class="alert-card-body">
          ${p.headline ? `<p class="alert-headline">${escapeHtml(p.headline)}</p>` : ''}
          <p class="alert-desc">${escapeHtml(detail)}</p>
        </div>
      </div>`;
  }).join('');

  // Rebuilding replaces every button; if keyboard focus was inside the banner,
  // put it back on the summary chip instead of dropping it to the page start.
  const hadFocus = alertBanner.contains(document.activeElement);

  // Start expanded so alerts are visible on arrival; the user can collapse them.
  alertBanner.className = 'visible expanded';
  alertBanner.innerHTML = summary + `<div class="alert-list">${cards}</div>`;
  if (hadFocus) alertBanner.querySelector('[data-role="toggle"]')?.focus();
}

/* Click delegation: toggle the whole banner, or expand an individual card. */
alertBanner.addEventListener('click', e => {
  const toggle = e.target.closest('[data-role="toggle"]');
  if (toggle) {
    const expanded = alertBanner.classList.toggle('expanded');
    toggle.setAttribute('aria-expanded', String(expanded));
    return;
  }
  const head = e.target.closest('[data-role="card"]');
  if (head) {
    const open = head.closest('.alert-card').classList.toggle('open');
    head.setAttribute('aria-expanded', String(open));
  }
});

/**
 * Standard ray-casting point-in-polygon test.
 * @param   {number}     lng   - test point longitude
 * @param   {number}     lat   - test point latitude
 * @param   {number[][]} ring  - polygon outer ring as [[lng,lat], …]
 * @returns {boolean} true if the point lies inside the ring
 */
function pointInPolygon(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersects = ((yi > lat) !== (yj > lat)) &&
                       (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersects) inside = !inside;
  }
  return inside;
}

/**
 * Extract complete polygons from an alert geometry. Each polygon is an array whose
 * first ring is the outer boundary and remaining rings are excluded holes.
 * @param   {Object} feature
 * @returns {number[][][][]} array of polygons
 */
function alertPolygons(feature) {
  const geom = feature && feature.geometry;
  if (!geom) return [];
  if (geom.type === 'Polygon')      return [geom.coordinates];
  if (geom.type === 'MultiPolygon') return geom.coordinates;
  return [];
}

/** Test a point against one GeoJSON polygon, excluding any interior holes. */
function pointInAlertPolygon(lng, lat, rings) {
  if (!rings?.length || !pointInPolygon(lng, lat, rings[0])) return false;
  return !rings.slice(1).some(hole => pointInPolygon(lng, lat, hole));
}

/**
 * Tier 3 — flag every station marker that falls inside an active warning polygon.
 * Stations inside a danger polygon get the pulsing red .alerted ring; all others
 * are cleared.  Zone-only alerts (no polygon) are intentionally ignored here —
 * they apply area-wide and are conveyed by the banner alone.
 * @param {Object[]} features
 */
function flagStationsInAlerts(features) {
  const polygons = [];
  (features || []).forEach(f => {
    // A red danger ring means an issued warning, not a watch or advisory polygon.
    const event = (f.properties?.event || '').toLowerCase();
    if (!event.includes('warning')) return;
    alertPolygons(f).forEach(polygon => polygons.push(polygon));
  });

  stationRecords.forEach(rec => {
    const inside = polygons.some(rings => pointInAlertPolygon(rec.lng, rec.lat, rings));
    rec.el.classList.toggle('alerted', inside);
    // The red ring is visual only; put the same fact in the marker's accessible
    // name (aria-label on Leaflet's focusable box) and its hover tooltip (title).
    const title = rec.el.dataset.label + (inside ? ' — inside an active warning area' : '');
    rec.el.title = title;
    const box = rec.el.closest('.leaflet-marker-icon');
    if (box) { box.title = title; box.setAttribute('aria-label', title); }
  });
}

/* ─────────────────────────────────────────────────────────────────────────────
   ALERT AREA OVERLAY  (draw each alert's footprint on the map)
   ─────────────────────────────────────────────────────────────────────────────
   The NWS alerts feed is GeoJSON: storm-based warnings (tornado, severe
   thunderstorm, flash-flood…) carry an inline Polygon/MultiPolygon footprint,
   while many zone-based products (winter storm, heat, wind…) arrive with
   geometry:null and instead list affectedZones URLs whose own GeoJSON holds the
   county/forecast-zone outline. We draw both — inline geometry immediately, zone
   geometry after a best-effort lookup. Each area gets a hashed distinct colour, an
   always-on event label, and a click/tap popup with severity and the time window.
   ───────────────────────────────────────────────────────────────────────────── */

/** Deterministic 0–359 hue from any string, so each alert keeps a stable, distinct colour. */
function alertHue(seed) {
  let h = 0;
  const s = String(seed || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h % 360;
}

/**
 * Approximate a GeoJSON footprint's area in coordinate-space units. All compared
 * alerts occupy the same local map, so this is sufficient for relative stacking;
 * holes are subtracted and GeometryCollections cover resolved zone-only products.
 */
function alertGeometryArea(geometry) {
  if (!geometry) return 0;

  function ringArea(ring) {
    if (!Array.isArray(ring) || ring.length < 3) return 0;
    let twiceArea = 0;
    for (let i = 0; i < ring.length; i++) {
      const current = ring[i];
      const next = ring[(i + 1) % ring.length];
      twiceArea += current[0] * next[1] - next[0] * current[1];
    }
    return Math.abs(twiceArea) / 2;
  }

  if (geometry.type === 'Polygon') {
    const [outer = [], ...holes] = geometry.coordinates || [];
    return Math.max(0, ringArea(outer) - holes.reduce((sum, ring) => sum + ringArea(ring), 0));
  }
  if (geometry.type === 'MultiPolygon') {
    return (geometry.coordinates || []).reduce((sum, coordinates) =>
      sum + alertGeometryArea({ type: 'Polygon', coordinates }), 0);
  }
  if (geometry.type === 'GeometryCollection') {
    return (geometry.geometries || []).reduce((sum, part) => sum + alertGeometryArea(part), 0);
  }
  return 0;
}

/* Areas are compared inside a sort that re-runs after every layer is added, and a
   multi-county watch can hold a huge number of vertices — so compute each
   geometry's area once. Weak keys let replaced geometries be garbage-collected. */
const alertAreaSizes = new WeakMap();
function alertAreaSize(geometry) {
  if (!geometry) return 0;
  if (!alertAreaSizes.has(geometry)) alertAreaSizes.set(geometry, alertGeometryArea(geometry));
  return alertAreaSizes.get(geometry);
}

/**
 * Sort bottom-to-top by footprint size so a smaller, more specific alert remains
 * clickable above a broad watch or advisory. Equal-area layers use danger priority
 * so the most urgent alert owns an otherwise indistinguishable overlap.
 */
function compareAlertAreaStack(a, b) {
  const areaOrder = alertAreaSize(b.geometry) - alertAreaSize(a.geometry);
  if (areaOrder !== 0) return areaOrder;

  const dangerOrder = compareAlertDanger(a.props, b.props);
  if (dangerOrder !== 0) return -dangerOrder;

  // Zone geometries resolve asynchronously. A content-derived tie-breaker keeps
  // equal-risk layers in one order instead of letting network timing choose.
  const keyA = `${a.props.event || ''}|${a.props.expires || ''}|${a.props.areaDesc || ''}`;
  const keyB = `${b.props.event || ''}|${b.props.expires || ''}|${b.props.areaDesc || ''}`;
  return keyA < keyB ? -1 : keyA > keyB ? 1 : 0;
}

/** Reapply SVG order after every synchronous or delayed zone-layer addition. */
function restackAlertAreaLayers() {
  alertAreaLayers.sort(compareAlertAreaStack);
  alertAreaLayers.forEach(entry => entry.layer.bringToFront());
}

/* Short, readable map labels for the common NWS events (key is lower-cased event). */
const ALERT_SHORT_LABELS = {
  'tornado warning': 'TORNADO',          'tornado watch': 'TORNADO WATCH',
  'severe thunderstorm warning': 'SEVERE T-STORM', 'severe thunderstorm watch': 'T-STORM WATCH',
  'flash flood warning': 'FLASH FLOOD',  'flash flood watch': 'FLASH FLOOD WATCH',
  'flood warning': 'FLOOD',              'flood advisory': 'FLOOD ADVISORY',
  'winter storm warning': 'WINTER STORM','winter storm watch': 'WINTER STORM WATCH',
  'winter weather advisory': 'WINTER WX','ice storm warning': 'ICE STORM',
  'blizzard warning': 'BLIZZARD',        'high wind warning': 'HIGH WIND',
  'wind advisory': 'WIND',               'extreme heat warning': 'EXTREME HEAT',
  'heat advisory': 'HEAT',               'hurricane warning': 'HURRICANE',
  'hurricane watch': 'HURRICANE WATCH',  'tropical storm warning': 'TROPICAL STORM',
  'storm surge warning': 'STORM SURGE',  'red flag warning': 'FIRE WEATHER',
  'dense fog advisory': 'DENSE FOG',     'special weather statement': 'WX STATEMENT',
  'extreme cold warning': 'EXTREME COLD',
};

/** Map a full NWS event name to a short label (falls back to a trimmed upper-case event). */
function shortAlertLabel(event) {
  const e   = (event || 'Alert').trim();
  const hit = ALERT_SHORT_LABELS[e.toLowerCase()];
  if (hit) return hit;
  const up = e.toUpperCase();
  return up.length > 22 ? up.slice(0, 21) + '…' : up;
}

/**
 * How long an alert lasts, for display ("until …"). `ends` is when the hazard
 * ends. Without it, a warning/watch/advisory runs "until further notice" (e.g. a
 * river flood) — its `expires` is only when this copy of the message lapses. A
 * short statement without `ends` simply lasts until its `expires`.
 */
function alertEndText(props) {
  if (props.ends) return `until ${formatWhen(props.ends)}`;
  if (/(warning|watch|advisory)$/i.test(String(props.event || '').trim())) return 'until further notice';
  return props.expires ? `until ${formatWhen(props.expires)}` : '';
}

/** Format an alert timestamp as a compact date+time, e.g. "Jun 2, 3:45 PM CDT". */
function formatWhen(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString('en-US', {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
  });
}

/** Build the rich popup HTML shown when an alert area is clicked or tapped. */
function alertAreaPopupHtml(props, color) {
  const event = escapeHtml(props.event || 'Weather alert');
  // Severity / urgency / certainty give a quick read on how serious + imminent it is.
  const meta  = [props.severity, props.urgency, props.certainty]
    .filter(v => v && v !== 'Unknown').map(escapeHtml).join(' · ');
  // The real hazard window: onset → ends (see alertEndText for alerts without `ends`).
  const start = formatWhen(props.onset || props.effective || props.sent);
  // The arrow already means "until", so drop that word ("→ further notice").
  const end   = alertEndText(props).replace(/^until /, '') || '—';
  const head  = props.headline ? `<div class="wx-alert-pop-head">${escapeHtml(props.headline)}</div>` : '';
  const area  = props.areaDesc ? `<div class="wx-alert-pop-area">${escapeHtml(props.areaDesc)}</div>` : '';
  return `
    <span class="wx-alert-pop-event" style="color:${color}">${event}</span>
    ${meta ? `<div class="wx-alert-pop-meta">${meta}</div>` : ''}
    <div class="wx-alert-pop-when">In effect:<br><b>${start}</b> &rarr; <b>${end}</b></div>
    ${head}${area}`;
}

/** Draw one alert geometry (Polygon/MultiPolygon) with label and click popup. */
function addAlertGeometryToMap(geom, props, hue, label) {
  // Comma-separated hsl() — Leaflet applies this as an SVG fill/stroke attribute,
  // where the space-separated CSS Color 4 form isn't reliably parsed on older Safari.
  const color = `hsl(${hue}, 85%, 62%)`;
  // Text is lighter: at 62% the blue hues fall to ~3:1 contrast on the dark popup;
  // 72% keeps every hue above 4.5:1 there (and well readable on the label chip).
  const textColor = `hsl(${hue}, 85%, 72%)`;
  // L.geoJSON understands Polygon, MultiPolygon, and interior holes directly.
  const layer = L.geoJSON(geom, {
    style: {
      color, weight: 2, opacity: 0.95, fillColor: color, fillOpacity: 0.18,
      className: 'wx-alert-area'
    }
  });

  // Leaflet's bindPopup supplies the click/tap listener; keeping that single
  // built-in listener avoids duplicate opens. autoPan nudges the map just enough
  // that a popup opened near an edge isn't clipped (title and × button) on phones.
  layer.bindPopup(alertAreaPopupHtml(props, textColor), {
    className: 'wx-alert-popup', autoPan: true, autoPanPadding: [16, 16], maxWidth: 320
  });

  alertAreaGroup.addLayer(layer);

  // GeometryCollections add an intermediate FeatureGroup, so descend until each
  // public Path element can be mapped to the parent layer representing one alert.
  // Track the largest child as the single label host; binding on the FeatureGroup
  // would make Leaflet duplicate the permanent label onto every county/zone path.
  let labelLayer = null;
  let labelLayerArea = -1;
  function registerAreaPath(areaLayer) {
    if (typeof areaLayer.eachLayer === 'function') {
      areaLayer.eachLayer(registerAreaPath);
      return;
    }

    const areaElement = areaLayer.getElement?.();
    if (!areaElement) return;
    alertAreaOwners.set(areaElement, layer);

    const bounds = areaLayer.getBounds?.();
    const southWest = bounds?.getSouthWest?.();
    const northEast = bounds?.getNorthEast?.();
    const boundsArea = southWest && northEast
      ? Math.abs((northEast.lng - southWest.lng) * (northEast.lat - southWest.lat))
      : 0;
    if (!labelLayer || boundsArea > labelLayerArea) {
      labelLayer = areaLayer;
      labelLayerArea = boundsArea;
    }

    areaLayer.on('popupopen', () => { activeAlertAreaOwner = layer; });
    areaLayer.on('popupclose', () => {
      if (activeAlertAreaOwner === layer) activeAlertAreaOwner = null;
    });
  }
  layer.eachLayer(registerAreaPath);

  // The chip is non-interactive so pointer events reach the selected polygon.
  labelLayer?.bindTooltip(`<span style="color:${textColor}">${escapeHtml(label)}</span>`, {
    permanent: true, direction: 'center', className: 'alert-area-label', interactive: false
  });

  alertAreaLayers.push({ layer, props, geometry: geom });
  restackAlertAreaLayers();
}

/** Start queued zone requests while preserving one global concurrency ceiling. */
function drainZoneFetchQueue() {
  while (zoneFetchActive < ZONE_FETCH_CONCURRENCY && zoneFetchQueue.length) {
    const task = zoneFetchQueue.shift();
    zoneFetchActive++;
    task.run().finally(() => {
      zoneFetchActive--;
      drainZoneFetchQueue();
    });
  }
}

/**
 * Best-effort fetch of one NWS zone's GeoJSON geometry (memoised, never rejects).
 * Returns undefined for retryable failures and null when the zone permanently has
 * no usable geometry, allowing refreshes to retry only requests that may recover.
 */
function fetchZoneGeometry(url) {
  // affectedZones is external feed data. Reject unexpected origins before they
  // can make the browser contact an attacker-controlled or local-network host.
  if (!isTrustedNwsApiUrl(url, '/zones/')) return Promise.resolve(null);
  if (zoneGeomCache.has(url)) return zoneGeomCache.get(url);

  let resolveRequest;
  const request = new Promise(resolve => { resolveRequest = resolve; });

  // Cache the Promise itself so concurrent alerts sharing a zone share one request.
  setBoundedCache(zoneGeomCache, url, request, ZONE_GEOM_CACHE_LIMIT);
  // Settle the shared request. Only transient failures (undefined) are evicted, so
  // a later render asks again; permanent absence (null) and real outlines stay
  // cached so refreshes don't refetch them and rebuild every alert layer.
  function settle(geom) {
    if (geom === undefined && zoneGeomCache.get(url) === request) zoneGeomCache.delete(url);
    resolveRequest(geom);
  }

  // Newer alert renders go to the front, so a large stale area cannot delay the
  // current location behind all of its not-yet-started zone requests.
  zoneFetchQueue.unshift({ run: async () => {
    let geom;
    try {
      const { response: res, data } = await fetchJsonWithTimeout(url);
      if (res.ok) {
        geom = data?.geometry || null;
      } else if (res.status !== 408 && res.status !== 425 &&
                 res.status !== 429 && res.status < 500) {
        // Retrying a permanent client error (most commonly an expired zone URL)
        // on every alert tick only churns layers and can close an open popup.
        geom = null;
      }
    } catch {
      // Zone outlines are supplementary; the alert banner remains usable without one.
    }
    settle(geom);
  },
  // Dropped before it started because a new area replaced the old one (see
  // clearAlerts): resolve as a transient miss so nothing stale gets cached.
  cancel: () => settle(undefined) });
  drainZoneFetchQueue();
  return request;
}

/** Remove every alert polygon from the map (and invalidate any in-flight zone draws). */
function clearAlertAreas() {
  alertAreaSeq++;            // any pending zone-geometry draw now sees a stale seq
  activeAlertAreaOwner = null;
  alertAreaLayers.length = 0;
  alertAreaGroup.clearLayers();
}

/**
 * Draw the footprint of every active alert. Inline geometry is drawn immediately;
 * zone-only alerts have their outline fetched and drawn afterwards (best effort,
 * guarded so a slow fetch can't paint onto a newer render).
 * @param {Object[]} features - GeoJSON alert Features from fetchAlerts()
 */
function renderAlertAreas(features) {
  clearAlertAreas();
  alertAreasNeedRetry = false;
  const seq = alertAreaSeq;
  (features || []).forEach(f => {
    // One malformed geometry must not stop every later alert from being drawn.
    try {
      drawAlertArea(f, seq);
    } catch (error) {
      console.error('[WX.MAP] Skipped an alert area that could not be drawn:', error);
    }
  });
}

/** Draw one alert's footprint (inline polygon now, zone outlines when they arrive). */
function drawAlertArea(f, seq) {
  const p     = f.properties || {};
  // Hash the stable alert id (fall back to event) so colours persist across refreshes.
  const hue   = alertHue(f.id || p.id || p.event);
  const label = shortAlertLabel(p.event);

  if (f.geometry) {
    addAlertGeometryToMap(f.geometry, p, hue, label);   // storm-based: inline polygon
    return;
  }
  // Zone-only product: resolve every affected zone's outline, then draw them as a
  // SINGLE layer (one GeometryCollection) so the alert gets just one label and one
  // popup — not one per county. Guarded so a slow lookup can't paint a stale render.
  const zones = Array.isArray(p.affectedZones) ? p.affectedZones : [];
  if (!zones.length) return;
  Promise.all(zones.map(fetchZoneGeometry)).then(geoms => {
    if (seq !== alertAreaSeq) return;                     // superseded by a newer render
    const parts = geoms.filter(Boolean);
    if (geoms.some(geom => geom === undefined)) alertAreasNeedRetry = true;
    if (!parts.length) return;                            // no outlines resolved — skip
    addAlertGeometryToMap({ type: 'GeometryCollection', geometries: parts }, p, hue, label);
  }).catch(error => {
    if (seq !== alertAreaSeq) return;
    // Keep the banner usable and retry this supplementary map layer next tick.
    alertAreasNeedRetry = true;
    console.error('[WX.MAP] Alert zone rendering failed:', error);
  });
}

/** Clear the banner, map areas, station flags, and refresh loop (e.g. when a new search starts). */
function clearAlerts() {
  if (alertsTimer) { clearInterval(alertsTimer); alertsTimer = null; }
  alertBanner.className = '';
  alertBanner.innerHTML = '';
  clearAlertAreas();
  // Queued (not yet started) zone lookups for the old area are now useless —
  // drop them instead of spending the NWS rate limit on outlines nobody will see.
  zoneFetchQueue.splice(0).forEach(task => task.cancel());
  currentLat = currentLon = null; // invalidate any refresh already awaiting the network
  currentViewport = null;
  alertLoadToken = null;          // …and any first load still awaiting it
  lastAlertSignature = null;   // next render is for a new area — always draw it
  shownAlerts = [];
  stationRecords.forEach(rec => rec.el.classList.remove('alerted'));
}

/** Draw an alert set everywhere (banner, station rings, map areas) and remember it. */
function showAlerts(alerts) {
  renderAlertBanner(alerts);
  flagStationsInAlerts(alerts);
  renderAlertAreas(alerts);
  // Commit only after synchronous rendering succeeds. If malformed data throws,
  // the next timer tick must be allowed to try this payload again.
  lastAlertSignature = alertsSignature(alerts);
  shownAlerts = alerts;
}

/**
 * Fetch the alerts for a freshly loaded area, render them, flag stations, and
 * start the periodic refresh loop.
 *
 * A result is dropped only when a newer area has replaced this one (a newer load,
 * or clearAlerts() when new stations are fetched). It is deliberately NOT tied to
 * the search generation: a later search that fails before loading stations (bad
 * ZIP, unknown address) leaves this area on screen, so it must keep its alerts.
 * @param {number} lat
 * @param {number} lon
 * @param {Object} [viewport] - map area whose nearby warning polygons count (the
 *        search circle's box); defaults to the view centred here at zoom 10
 */
async function loadAlertsForArea(lat, lon, viewport) {
  const token = {};
  alertLoadToken = token;
  currentLat = lat;
  currentLon = lon;
  currentViewport = viewport || alertViewportBounds(lat, lon);
  if (alertsTimer) { clearInterval(alertsTimer); alertsTimer = null; }

  try {
    const alerts = await fetchAlerts(lat, lon, currentViewport);
    if (token !== alertLoadToken) return;   // a newer area replaced this one

    // alerts === null means the feed was unreachable on this first load — leave the
    // (already-cleared) banner and map empty and let the refresh loop retry shortly.
    if (alerts) showAlerts(alerts);
  } catch (error) {
    if (token !== alertLoadToken) return;
    // Alerts are supplementary; log unexpected schema/rendering faults and keep
    // the station search usable while the refresh timer gets another chance.
    console.error('[WX.MAP] Initial alert rendering failed:', error);
  }

  // Keep alerts current while this location stays loaded. The cache TTL gates the
  // real network calls, so re-running on this interval is cheap.
  alertsTimer = setInterval(refreshAlerts, ALERTS_REFRESH_MS);
}

/** True when an alert refresh tick was skipped because the page was hidden. */
let alertsRefreshMissed = false;

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !alertsRefreshMissed) return;
  alertsRefreshMissed = false;
  refreshAlerts();
});

/** Re-fetch and re-render alerts for the current location (refresh-loop tick). */
async function refreshAlerts() {
  try {
    if (currentLat == null) return;
    // Like the station panel: no polling for a screen nobody can see. The
    // visibilitychange handler above catches up as soon as it is visible again.
    if (document.hidden) { alertsRefreshMissed = true; return; }
    // Capture the location for this tick. If the user searches elsewhere while the
    // fetch is in flight, currentLat/currentLon change and we discard this result so
    // it can't overwrite the newer area's alerts.
    const lat = currentLat, lon = currentLon;
    const alerts = await fetchAlerts(lat, lon, currentViewport);
    if (lat !== currentLat || lon !== currentLon) return;
    if (alerts === null) {
      // Transient feed failure — keep the current display and retry next tick, but
      // drop any alert whose own end time has passed, so a long outage can never
      // leave a lapsed warning on screen.
      const now = Date.now();
      const unexpired = shownAlerts.filter(feature => isAlertUnexpired(feature, now));
      if (unexpired.length !== shownAlerts.length) showAlerts(unexpired);
      return;
    }

    // Preserve the user's banner/popup state when possible. An incomplete zone draw
    // is the exception: retry only the map areas while leaving the banner untouched —
    // but not while an area popup is open, since redrawing would close it under the
    // user. The next tick retries.
    if (alertsSignature(alerts) === lastAlertSignature) {
      if (alertAreasNeedRetry && !activeAlertAreaOwner) renderAlertAreas(alerts);
      return;
    }
    showAlerts(alerts);
  } catch (error) {
    // setInterval does not observe rejected Promises, so contain and report faults.
    console.error('[WX.MAP] Alert refresh failed:', error);
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
   14C. LIVE ALERTS  (every watch / warning / advisory in the visible map)
   ─────────────────────────────────────────────────────────────────────────────
   A toggle above the zoom buttons. While on, the map shows every active NWS
   alert area inside the current view and keeps adding the ones that come into
   view as the user pans or zooms.

   Source: NOAA's watch/warning/advisory map service, which answers "every alert
   area in this box" in ONE request — already split into counties/zones and
   simplified to the zoom level (the whole country is ~600 KB). The NWS API would
   need a separate download per county/zone outline (20–40 MB nationwide).

   While live alerts are on, the searched area's own alert polygons (14B) are
   hidden so nothing is drawn twice; the alert banner and the red station rings
   still describe the searched place.
   ───────────────────────────────────────────────────────────────────────────── */
const LIVE_ALERTS_URL = 'https://mapservices.weather.noaa.gov/eventdriven/rest/services/WWA/watch_warn_adv/MapServer/1/query';

/*
 * The NWS hazard-map colours (weather.gov legend) for the common products, so a
 * colour means what forecasters intend. Anything else gets a stable hashed colour.
 */
const LIVE_ALERT_COLORS = {
  'Tornado Warning': '#FF0000', 'Tornado Watch': '#FFFF00',
  'Severe Thunderstorm Warning': '#FFA500', 'Severe Thunderstorm Watch': '#DB7093',
  'Flash Flood Warning': '#8B0000', 'Flash Flood Watch': '#2E8B57',
  'Flood Warning': '#00FF00', 'Flood Watch': '#2E8B57', 'Flood Advisory': '#00FF7F', 'Flood Statement': '#00FF00',
  'Coastal Flood Warning': '#228B22', 'Coastal Flood Watch': '#66CDAA', 'Coastal Flood Advisory': '#7CFC00',
  'Coastal Flood Statement': '#6B8E23',
  'Hurricane Warning': '#DC143C', 'Hurricane Watch': '#FF00FF',
  'Tropical Storm Warning': '#B22222', 'Tropical Storm Watch': '#F08080', 'Storm Surge Warning': '#B524F7',
  'Winter Storm Warning': '#FF69B4', 'Winter Storm Watch': '#4682B4', 'Winter Weather Advisory': '#7B68EE',
  'Blizzard Warning': '#FF4500', 'Ice Storm Warning': '#8B008B',
  'Extreme Heat Warning': '#C71585', 'Extreme Heat Watch': '#800000', 'Heat Advisory': '#FF7F50',
  'Extreme Cold Warning': '#0000FF', 'Extreme Cold Watch': '#5F9EA0', 'Cold Weather Advisory': '#AFEEEE',
  'Freeze Warning': '#483D8B', 'Freeze Watch': '#00FFFF', 'Frost Advisory': '#6495ED',
  'High Wind Warning': '#DAA520', 'High Wind Watch': '#B8860B', 'Wind Advisory': '#D2B48C', 'Lake Wind Advisory': '#D2B48C',
  'Red Flag Warning': '#FF1493', 'Fire Weather Watch': '#FFDEAD',
  'Dense Fog Advisory': '#708090', 'Special Weather Statement': '#FFE4B5', 'Air Quality Alert': '#808080',
  'Small Craft Advisory': '#D8BFD8', 'Gale Warning': '#DDA0DD', 'Storm Warning': '#9400D3',
  'Hazardous Seas Warning': '#D8BFD8', 'Marine Weather Statement': '#FFDAB9',
  'Rip Current Statement': '#40E0D0', 'Beach Hazards Statement': '#40E0D0', 'High Surf Advisory': '#BA55D3'
};
/** Colour of an alert type on the map (the NWS colour, or a stable hashed one). */
function liveAlertColor(event) {
  // Own keys only: a type named like a built-in ("constructor") must not match.
  return Object.hasOwn(LIVE_ALERT_COLORS, event) ? LIVE_ALERT_COLORS[event] : `hsl(${alertHue(event)}, 70%, 60%)`;
}
/**
 * A readable text colour for an alert type on the dark popup: the NWS colour
 * mixed halfway with white, so dark reds and blues (#8B0000, #0000FF) stay legible.
 */
function liveAlertTextColor(event) {
  const hex = Object.hasOwn(LIVE_ALERT_COLORS, event) && LIVE_ALERT_COLORS[event];
  if (!hex) return `hsl(${alertHue(event)}, 85%, 72%)`;
  const mix = i => Math.round((parseInt(hex.slice(i, i + 2), 16) + 255) / 2);
  return `rgb(${mix(1)}, ${mix(3)}, ${mix(5)})`;
}
// Drawing order: statements and advisories underneath, warnings on top.
const LIVE_SIG_RANK = { S: 0, Y: 1, A: 2, W: 3 };

// Between the searched area's polygons (overlay pane, 400) and the search circle
// (410): one canvas draws hundreds of areas far faster than SVG.
map.createPane('liveAlerts').style.zIndex = 405;
const liveAlertsRenderer = L.canvas({ pane: 'liveAlerts', padding: 0.3 });
const liveAlertsLayer = L.layerGroup().addTo(map);

let liveAlertsOn = false;
/*
 * Drawn county/zone pieces: { layer, props, bounds }. NOAA renumbers its records
 * every few minutes, so pieces are never matched by id: each answer simply
 * replaces whatever was drawn inside the box it covers.
 */
const livePieces = new Set();
const liveHiddenEvents = new Set();  // alert types switched off in the colour key
let liveAlertsSeq = 0;               // newest view request
let liveAppliedSeq = 0;              // newest request whose answer is drawn; older answers are dropped
let liveViewPending = false;         // the map moved and that view's answer isn't in yet
let liveMoveTimer = 0, liveRefreshTimer = 0, liveRetryTimer = 0;
let liveRefreshMissed = false;
/** 'loading' until the first answer, then 'ok' or 'error' (never "0 alerts" by mistake). */
let liveState = 'off';
let liveFailureShown = false;        // one toast per run of failures, not one per pan
let liveTruncatedShown = false;      // …and one per stretch of over-full answers
let livePopup = null;                // the live-alert popup, while one is open
let livePopupCapId = null;           // …and the alert it shows
let liveClosingClick = null;         // the click that last closed it (see handleAlertPopupClickAway)

/** Simplification allowed for a zoom level, in degrees: about one screen pixel. */
function liveAlertTolerance(zoom) {
  return 360 / (256 * Math.pow(2, zoom));
}

/**
 * Whether an alert has ended: its hazard end (`ends`) when it has one — the
 * message's own `expiration` comes much sooner for long hazards (a river flood,
 * a multi-day gale) whose messages are simply re-issued. A warning, watch or
 * advisory with no hazard end lasts "until further notice" (as its popup says):
 * it stays until the service stops listing it, even if a follow-up is late.
 */
function liveAlertEnded(props, now) {
  if (props.ends) return Date.parse(props.ends) < now;
  if (/(warning|watch|advisory)$/i.test(props.prod_type || '')) return false;
  return Date.parse(props.expiration) < now;
}

/** A map-service text field, or undefined when empty (the service sends " " for none). */
function liveField(value) {
  const v = typeof value === 'string' ? value.trim() : value;
  return v || undefined;
}

/**
 * The boxes to ask the map service for, for a view [west, east] in map longitudes.
 * The service only knows longitudes from -180 to 180, but the map view can cross
 * the date line (Alaska with the western Aleutians and the Bering Sea) or sit on
 * another copy of the world after a long pan. So the view is split at the date
 * line into at most two boxes, each with the `shift` (a multiple of 360°) that
 * places the box itself on the copy of the world on screen (its shapes are
 * placed by placeGeometry).
 *
 * @returns {{west:number, south:number, east:number, north:number, shift:number}[]}
 */
function liveQueryBoxes(west, south, east, north) {
  south = Math.max(-85, south);
  north = Math.min(85, north);
  if (east - west >= 360) return [{ west: -180, south, east: 180, north, shift: 0 }];
  // Bring the view's west edge into -180…180; `base` is the copy of the world it was on.
  const base = 360 * Math.floor((west + 180) / 360);
  const w = west - base, e = east - base;
  if (e <= 180) return [{ west: w, south, east: e, north, shift: base }];
  return [
    { west: w, south, east: 180, north, shift: base },
    { west: -180, south, east: e - 360, north, shift: base + 360 }
  ];
}

/**
 * A copy of a GeoJSON geometry placed on the copy of the world around `nearLon`.
 * The service gives longitudes in -180…180, so an outline that crosses the date
 * line jumps from +179 to -179 mid-ring (drawn as a band around the whole world).
 * Each ring is first made continuous (no jump over 180° between neighbours), then
 * each polygon is moved by whole turns of 360° so its outer ring's middle lies
 * nearest `nearLon` — its holes move with it, so they always stay inside.
 */
function placeGeometry(geometry, nearLon) {
  if (geometry.type === 'GeometryCollection') {
    return { ...geometry, geometries: geometry.geometries.map(g => placeGeometry(g, nearLon)) };
  }
  const isRing = a => Array.isArray(a) && typeof a[0]?.[0] === 'number';
  const continuous = ring => {
    let prev = null;
    return ring.map(([lon, ...rest]) => {
      if (prev !== null) lon += 360 * Math.round((prev - lon) / 360);
      prev = lon;
      return [lon, ...rest];
    });
  };
  // A polygon: its outer ring, then any holes (a lone ring is placed by itself).
  const placePolygon = rings => {
    const joined = rings.map(continuous);
    const outer = joined[0];
    const mid = outer.reduce((sum, c) => sum + c[0], 0) / outer.length;
    const turn = outer.length ? 360 * Math.round((nearLon - mid) / 360) : 0;
    return turn ? joined.map(r => r.map(([lon, ...rest]) => [lon + turn, ...rest])) : joined;
  };
  const walk = a => (isRing(a) ? placePolygon([a])[0] : isRing(a[0]) ? placePolygon(a) : a.map(walk));
  return { ...geometry, coordinates: geometry.type === 'Point' ? geometry.coordinates : walk(geometry.coordinates) };
}

/** Load every alert piece inside the current view (padded a little) and draw them. */
async function loadLiveAlerts(confirmingEmpty = false) {
  if (!liveAlertsOn) return;
  const seq = ++liveAlertsSeq;
  clearTimeout(liveRetryTimer);
  const b = map.getBounds().pad(0.15);
  const boxes = liveQueryBoxes(b.getWest(), b.getSouth(), b.getEast(), b.getNorth());
  // Each box as it sits on the map (shifted onto the copy of the world on screen).
  // A whole-world answer replaces every piece, on every copy: its shapes are placed
  // around the map's centre, often outside -180…180, where a -180…180 box would
  // never clear them and each reload would stack another set on top.
  const queried = boxes.length === 1 && boxes[0].east - boxes[0].west >= 360
    ? [L.latLngBounds([-90, -1e6], [90, 1e6])]
    : boxes.map(q => L.latLngBounds([q.south, q.west + q.shift], [q.north, q.east + q.shift]));
  // The shapes go next to the view that was ASKED for (not wherever the map has
  // flown by the time the answer arrives), so they land inside the boxes above.
  const nearLon = (b.getWest() + b.getEast()) / 2;
  const tolerance = liveAlertTolerance(map.getZoom()).toFixed(6);
  const urlFor = q => `${LIVE_ALERTS_URL}?${new URLSearchParams({
    where: '1=1', geometry: `${q.west},${q.south},${q.east},${q.north}`, geometryType: 'esriGeometryEnvelope',
    inSR: '4326', spatialRel: 'esriSpatialRelIntersects', outSR: '4326', returnGeometry: 'true',
    outFields: 'prod_type,sig,onset,ends,expiration,issuance,url,cap_id',
    maxAllowableOffset: tolerance, f: 'geojson'
  })}`;
  try {
    const answers = await Promise.all(boxes.map(q => fetchJsonWithTimeout(urlFor(q))));
    // Switched off, or a newer answer is already drawn. An older view's answer that
    // beats the newer one is still drawn (it only replaces its own box), so a user
    // who keeps nudging the map sees alerts arrive instead of none at all.
    if (seq <= liveAppliedSeq || !liveAlertsOn) return;
    const newest = seq === liveAlertsSeq;
    answers.forEach(({ response, data }) => {
      if (!response.ok || !Array.isArray(data?.features)) throw new Error(`HTTP ${response.status}`);
    });
    // A zone split at the date line touches both boxes, so both answers list it:
    // keep one copy (by alert and outline — NOAA's record ids get renumbered).
    const seen = new Set();
    const unique = answers.flatMap(({ data }) => data.features).filter(f => {
      if (answers.length < 2) return true;
      const key = `${f?.properties?.cap_id}|${JSON.stringify(f?.geometry)}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    // Every piece placed on the copy of the world on screen (and made continuous
    // where it crosses the date line).
    const features = unique.map(f => (f?.geometry ? { ...f, geometry: placeGeometry(f.geometry, nearLon) } : f));
    // NOAA briefly answers "nothing" while it renumbers its records. An empty
    // answer that would clear areas already drawn here is checked again in 5 s
    // before it is believed.
    // (An older view's doubtful empty answer is simply skipped: the newer one follows.)
    if (!features.length && confirmingEmpty !== true &&
        [...livePieces].some(piece => queried.some(q => q.intersects(piece.bounds)))) {
      if (newest) liveRetryTimer = setTimeout(() => loadLiveAlerts(true), 5000);
      return;
    }
    liveAppliedSeq = seq;
    if (newest) liveViewPending = false;
    replaceLivePieces(features, queried, nearLon);
    // The service stops at 4,000 pieces; say so rather than silently showing part.
    const truncated = answers.some(({ data }) =>
      Boolean(data.exceededTransferLimit || data.properties?.exceededTransferLimit));
    if (truncated && !liveTruncatedShown) showToast('Too many alert areas to show at this zoom — zoom in to see them all');
    liveTruncatedShown = truncated;
    liveState = 'ok';
    liveFailureShown = false;
  } catch (error) {
    if (seq !== liveAlertsSeq || !liveAlertsOn) return;
    liveState = 'error';
    if (!liveFailureShown) showToast('Live alerts couldn\'t load — retrying');
    liveFailureShown = true;
    // Don't wait for a pan or the 2-min tick — but, like that tick, wait while the
    // page is hidden (it catches up when shown) instead of retrying in the background.
    liveRetryTimer = setTimeout(refreshLiveAlerts, 30_000);
  }
  renderLiveLegend();
}

/**
 * Make the drawn pieces match an answer: every piece inside the queried box(es) is
 * replaced by the answer's pieces (so ended, cancelled and renumbered alerts can
 * never linger or be mistaken for others); pieces elsewhere stay, except any
 * whose alert has ended or that sit on another copy of the world.
 * @param {Object[]} features
 * @param {L.LatLngBounds[]} queried - the box(es) the answer covers
 * @param {number} nearLon - the middle of the view asked for
 */
function replaceLivePieces(features, queried, nearLon) {
  const now = Date.now();
  // Over a full turn away: left on another copy of the world by a long pan, never
  // on screen again until asked for anew — kept, they'd only cost time and memory.
  const farAway = piece => Math.abs(piece.bounds.getCenter().lng - nearLon) > 360;
  for (const piece of livePieces) {
    if (queried.some(q => q.intersects(piece.bounds)) || farAway(piece) || liveAlertEnded(piece.props, now)) {
      liveAlertsLayer.removeLayer(piece.layer);
      livePieces.delete(piece);
    }
  }
  features.forEach(f => {
    if (!f?.geometry) return;
    const p = f.properties || {};
    const props = {
      prod_type: liveField(p.prod_type) || 'Weather alert', sig: liveField(p.sig),
      onset: liveField(p.onset), ends: liveField(p.ends), expiration: liveField(p.expiration),
      issuance: liveField(p.issuance), url: liveField(p.url), cap_id: liveField(p.cap_id)
    };
    if (liveAlertEnded(props, now)) return;     // already over: not drawn at all
    const color = liveAlertColor(props.prod_type);
    const layer = L.geoJSON(f.geometry, {
      renderer: liveAlertsRenderer,
      style: { color, weight: 1.2, opacity: 0.95, fillColor: color, fillOpacity: 0.28 }
    });
    // An empty outline has no bounds; kept, it would break every later box test.
    const bounds = layer.getBounds();
    if (!bounds.isValid()) return;
    layer.on('click', e => {
      // Pin mode: the tap places the pin (the map's own click handler), no popup.
      if (tapModeActive) return;
      // This very click just closed this alert's own popup: leave it closed.
      if (liveClosingClick?.event === e.originalEvent && liveClosingClick.capId === props.cap_id) return;
      openLiveAlertPopup(props, e.latlng, e.originalEvent);
    });
    layer.on('mouseover', () => highlightLiveAlert(props.cap_id, true));
    layer.on('mouseout',  () => highlightLiveAlert(props.cap_id, false));
    livePieces.add({ layer, props, bounds });
    if (!liveHiddenEvents.has(props.prod_type)) liveAlertsLayer.addLayer(layer);
  });
  restackLivePieces();
}

/**
 * Warnings on top of watches, watches on top of advisories and statements —
 * across answers too, and after a type is shown again from the colour key.
 */
function restackLivePieces() {
  [...livePieces]
    .sort((a, b) => (LIVE_SIG_RANK[a.props.sig] ?? 0) - (LIVE_SIG_RANK[b.props.sig] ?? 0))
    .forEach(piece => { if (liveAlertsLayer.hasLayer(piece.layer)) piece.layer.bringToFront(); });
}

/** Light up every piece of one alert (a watch can cover dozens of counties). */
function highlightLiveAlert(capId, on) {
  if (!capId) return;
  for (const piece of livePieces) {
    if (piece.props.cap_id === capId) piece.layer.setStyle({ weight: on ? 2.5 : 1.2, fillOpacity: on ? 0.5 : 0.28 });
  }
}

/** Distinct alerts (not county pieces) inside the current view, per alert type. */
function liveAlertsInView() {
  const view = map.getBounds();
  const byEvent = new Map();   // event → { sig, ids: Set(cap_id) }
  for (const piece of livePieces) {
    if (!view.intersects(piece.bounds)) continue;
    const ev = piece.props.prod_type;
    if (!byEvent.has(ev)) byEvent.set(ev, { sig: piece.props.sig, ids: new Set() });
    byEvent.get(ev).ids.add(piece.props.cap_id || piece);
  }
  return byEvent;
}

/**
 * Rebuild the colour key and the button's count, most serious types first.
 * While loading or after a failure it says so — never a misleading "0".
 * A keyboard user on a row keeps focus on the same alert type.
 */
function renderLiveLegend() {
  const hadFocus = liveLegend.contains(document.activeElement);
  const focusedEvent = hadFocus ? document.activeElement.dataset.event : null;
  const rows = [...liveAlertsInView().entries()].sort((a, b) =>
    (LIVE_SIG_RANK[b[1].sig] ?? 0) - (LIVE_SIG_RANK[a[1].sig] ?? 0) || b[1].ids.size - a[1].ids.size);
  const total = rows.reduce((n, [, v]) => n + v.ids.size, 0);
  // While the view's own answer is on its way the count would leave out what just
  // came into view: show "…" then too (the rows already known stay listed).
  liveAlertsCount.textContent = !liveAlertsOn ? '' : liveState === 'loading' ? '· …'
    : liveState === 'error' ? '· !' : liveViewPending ? '· …' : `· ${total}`;
  liveAlertsBtn.title = liveState === 'error'
    ? 'Live alerts couldn\'t be loaded — retrying'
    : 'Show every watch, warning and advisory in the map view';

  liveLegend.replaceChildren();
  const note = text => {
    const li = document.createElement('li');
    li.className = 'live-legend-empty';
    li.textContent = text;
    liveLegend.appendChild(li);
  };
  if (liveState === 'loading') note('Loading alerts…');
  else if (liveState === 'error') note('Couldn\'t load live alerts — retrying…');
  else if (!rows.length) note(liveViewPending ? 'Loading alerts…' : 'No active alerts in this view.');
  if (liveState !== 'loading') rows.forEach(([event, { ids }]) => {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.event = event;
    button.setAttribute('aria-pressed', String(!liveHiddenEvents.has(event)));
    button.innerHTML = `<span class="live-legend-swatch" style="background:${liveAlertColor(event)}"></span>` +
      `<span class="live-legend-name">${escapeHtml(event)}</span><span class="live-legend-count">${ids.size}</span>`;
    button.addEventListener('click', () => toggleLiveAlertType(event, button));
    li.appendChild(button);
    liveLegend.appendChild(li);
    if (event === focusedEvent) button.focus();
  });
  // The focused row's alert type left the view: keep keyboard focus close by, on
  // the KEY button, rather than letting it fall back to the top of the page.
  if (hadFocus && !liveLegend.contains(document.activeElement)) liveLegendBtn.focus();
}

/** Hide or show every area of one alert type (a colour-key row). */
function toggleLiveAlertType(event, button) {
  const hide = !liveHiddenEvents.has(event);
  if (hide) liveHiddenEvents.add(event); else liveHiddenEvents.delete(event);
  button.setAttribute('aria-pressed', String(!hide));
  for (const piece of livePieces) {
    if (piece.props.prod_type !== event) continue;
    if (hide) liveAlertsLayer.removeLayer(piece.layer); else liveAlertsLayer.addLayer(piece.layer);
  }
  if (!hide) restackLivePieces();
}

/**
 * Open an area's popup: what the map service knows at once, then the alert's
 * full NWS record (headline, severity, areas) in the same layout as the
 * searched area's own alert popups, placed clear of the banner and panel.
 */
function openLiveAlertPopup(props, latlng, clickEvent) {
  const color = liveAlertTextColor(props.prod_type);
  const basic = { event: props.prod_type, onset: props.onset || props.issuance, ends: props.ends,
                  expires: props.expiration };
  const options = { className: 'wx-alert-popup', autoPan: true };
  fitAlertPopup(options, clickEvent.clientX, clickEvent.clientY);
  const popup = L.popup(options).setLatLng(latlng).setContent(alertAreaPopupHtml(basic, color));
  livePopup = popup;
  livePopupCapId = props.cap_id;
  popup.on('remove', () => { if (livePopup === popup) livePopup = null; });
  popup.openOn(map);

  if (!isTrustedNwsApiUrl(props.url, '/alerts/')) return;   // only follow NWS's own links
  fetchJsonWithTimeout(props.url).then(({ response, data }) => {
    if (livePopup !== popup || !response.ok || !data?.properties) return;
    popup.setContent(alertAreaPopupHtml(data.properties, color));
  }).catch(() => { /* the basic popup stays */ });
}

/** Turn live alerts on or off. */
function setLiveAlerts(on) {
  liveAlertsOn = on;
  liveAlertsBtn.setAttribute('aria-pressed', String(on));
  liveLegendBtn.hidden = !on;
  clearInterval(liveRefreshTimer);
  clearTimeout(liveMoveTimer);
  clearTimeout(liveRetryTimer);
  liveRefreshMissed = false;
  liveViewPending = false;
  if (livePopup) map.closePopup(livePopup);
  // The searched area's own polygons would be drawn twice: hide them with a CSS
  // class (not by removing their layer), so their labels, popups and stacking
  // stay intact for when live alerts are switched off again.
  map.getContainer().classList.toggle('live-alerts-on', on);
  if (on) {
    if (activeAlertAreaOwner) map.closePopup();
    liveState = 'loading';
    liveFailureShown = false;
    loadLiveAlerts();
    liveRefreshTimer = setInterval(refreshLiveAlerts, ALERTS_REFRESH_MS);
  } else {
    liveAlertsSeq++;                 // ignore any answer still on its way
    liveAppliedSeq = liveAlertsSeq;
    liveAlertsLayer.clearLayers();
    livePieces.clear();
    liveState = 'off';
    setLiveLegendOpen(false);
    // The canvas covers the whole map: take it away, or it would keep catching
    // clicks meant for the searched area's polygons below it.
    if (map.hasLayer(liveAlertsRenderer)) map.removeLayer(liveAlertsRenderer);
  }
  renderLiveLegend();
}

/** The 2-minute refresh tick: skipped while the page is hidden, caught up on return. */
function refreshLiveAlerts() {
  if (!liveAlertsOn) return;
  if (document.hidden) { liveRefreshMissed = true; return; }
  loadLiveAlerts();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !liveRefreshMissed) return;
  liveRefreshMissed = false;
  refreshLiveAlerts();
});

// Moving the map loads what came into view — one request per pause, not per frame.
map.on('moveend', () => {
  if (!liveAlertsOn) return;
  liveViewPending = true;          // what came into view isn't counted until its answer is in
  renderLiveLegend();
  clearTimeout(liveMoveTimer);
  liveMoveTimer = setTimeout(() => loadLiveAlerts(), 350);
});

/* The control: [colour key] above [LIVE ALERTS · n] [KEY], above the zoom buttons. */
const LiveAlertsControl = L.Control.extend({
  options: { position: 'bottomleft' },
  onAdd() {
    const box = L.DomUtil.create('div', 'leaflet-control live-alerts-ctl');
    box.innerHTML = `
      <ul id="live-legend" hidden aria-label="Alert types in view"></ul>
      <div class="live-alerts-row">
        <button type="button" id="live-alerts-btn" aria-pressed="false"
                title="Show every watch, warning and advisory in the map view">
          <span class="lamp" aria-hidden="true"></span>LIVE ALERTS <span id="live-alerts-count"></span>
        </button>
        <button type="button" id="live-legend-btn" aria-expanded="false" aria-controls="live-legend" hidden>KEY</button>
      </div>`;
    // Clicks, double-clicks and scrolling here must not reach the map.
    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.disableScrollPropagation(box);
    return box;
  }
});
new LiveAlertsControl().addTo(map);
const liveAlertsBtn   = document.getElementById('live-alerts-btn');
const liveAlertsCount = document.getElementById('live-alerts-count');
const liveLegendBtn   = document.getElementById('live-legend-btn');
const liveLegend      = document.getElementById('live-legend');

/** Show or fold away the colour key. */
function setLiveLegendOpen(open) {
  liveLegend.hidden = !open;
  liveLegendBtn.setAttribute('aria-expanded', String(open));
}
liveAlertsBtn.addEventListener('click', () => setLiveAlerts(!liveAlertsOn));
liveLegendBtn.addEventListener('click', () => setLiveLegendOpen(liveLegend.hidden));

/* ─────────────────────────────────────────────────────────────────────────────
   15. URL QUERY-STRING HELPERS
   ─────────────────────────────────────────────────────────────────────────────
   The app encodes the current search into the URL query string so results can
   be bookmarked and shared.  history.replaceState() updates the address bar
   without triggering a page reload.

   Supported parameters:
     ?lat=…&long=…  → coordinate search
     ?zip=…         → ZIP code search
     ?addr=…        → address search
     ?station=…     → direct station lookup
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Serialise the current search input into the page URL.
 * URLSearchParams performs the required percent-encoding itself. Passing raw
 * values avoids non-standard double encoding and keeps shared URLs interoperable.
 *
 * @param {'coords'|'zip'|'address'} type  - Input type from detectInputType() (never 'badzip')
 * @param {string}                   raw   - Raw search string
 */
function pushQueryParam(type, raw) {
  const params = new URLSearchParams();
  if (type === 'coords') {
    const { lat, lon } = parseCoords(raw);
    // 6 decimals (~0.1 m) via Number(): String(1e-7) would write "1e-7", which the
    // ?lat/?long link reader rejects as invalid coordinates.
    params.set('lat',  String(Number(lat.toFixed(6))));
    params.set('long', String(Number(lon.toFixed(6))));
  } else if (type === 'zip') {
    params.set('zip',  normalizeSearchText(raw));
  } else {
    params.set('addr', raw.trim());
  }
  window.history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
}

/* ─────────────────────────────────────────────────────────────────────────────
   16. MAIN SEARCH DISPATCHER
   ─────────────────────────────────────────────────────────────────────────────
   Reads the search input, classifies it, updates the URL, then dispatches to
   the appropriate geocoding path.
   ───────────────────────────────────────────────────────────────────────────── */

/**
 * Primary entry point for user-initiated searches.
 * Called when the FIND button is clicked or Enter is pressed in the input.
 */
async function doSearch() {
  const raw = zipInput.value.trim();
  if (!raw) {
    showToast('Please enter a ZIP, coordinates, or address');
    return;
  }

  // A typed search replaces an armed tap/click-to-place, so a later map click
  // (e.g. to close a popup) can't unexpectedly drop a pin over the new results.
  setTapMode(false);

  // Allocate the generation before any geocoding await. Otherwise an older slow
  // address/ZIP lookup can resolve after a newer search and overwrite its intent.
  const gen = ++searchGeneration;
  const type = detectInputType(raw);

  try {
    let place;
    if (type === 'coords') {
      setStatus('loading', 'LOCATING…');
      showOverlay('Parsing coordinates…');
      place = parseCoords(raw);
      const { lat, lon } = place;
      if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180)
        throw new Error('Invalid coordinates — use lat (-90…90), lon (-180…180)');

    } else if (type === 'zip') {
      setStatus('loading', 'LOCATING…');
      showOverlay('Geocoding ZIP code…');
      place = await zipToCoords(normalizeSearchText(raw));   // "(78201)" → "78201"

    } else if (type === 'badzip') {
      // Also catches malformed coordinates ("29.42-98.49").
      throw new Error('Not a valid ZIP code or coordinates — e.g. 78201 or 29.42, -98.49');

    } else {
